<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>DACC</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#f4f7fb;
  color:#172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

body{
  min-height:100vh;
}

button,
select,
textarea{
  font:inherit;
}

button{
  border:0;
}

.app{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:20px 16px 60px;
}

.header{
  padding:8px 4px 22px;
}

.logo{
  font-size:28px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.subtitle{
  margin-top:8px;
  color:#8b96aa;
  font-size:14px;
}

.card{
  background:#fff;
  border:1px solid #dde4ef;
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:
    0 6px 24px rgba(31,45,72,.035);
}

.cardTitle{
  margin:0 0 18px;
  font-size:21px;
  font-weight:850;
  letter-spacing:-.5px;
}

.settingsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field label{
  display:block;
  margin:0 0 7px;
  color:#7b879b;
  font-size:13px;
  font-weight:700;
}

.field select{
  width:100%;
  height:48px;
  padding:0 12px;
  border:1px solid #dce3ee;
  border-radius:14px;
  background:#f8faff;
  color:#172033;
  outline:none;
}

.upload{
  position:relative;
  min-height:160px;
  border:2px dashed #d5deed;
  border-radius:20px;
  background:#f8faff;
  overflow:hidden;
}

.upload input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  z-index:4;
}

.uploadPlaceholder{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.plus{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#edf2ff;
  color:#5271ea;
  font-size:40px;
  font-weight:300;
  line-height:1;
  margin-bottom:12px;
}

.uploadTitle{
  font-size:17px;
  font-weight:850;
}

.uploadSub{
  margin-top:7px;
  color:#9aa5b7;
  font-size:13px;
}

.preview{
  display:none;
  width:100%;
  max-height:430px;
  object-fit:contain;
  background:#f3f5f9;
}

.preview.show{
  display:block;
}

.preview.show + .uploadPlaceholder{
  display:none;
}

.photoLabel{
  display:inline-flex;
  margin:0 0 12px;
  padding:7px 10px;
  border-radius:10px;
  background:#edf2ff;
  color:#5271ea;
  font-size:12px;
  font-weight:850;
}

.analyzeButton,
.reportButton,
.copyButton{
  width:100%;
  min-height:58px;
  border-radius:18px;
  background:#5271ea;
  color:#fff;
  font-size:18px;
  font-weight:850;
}

.analyzeButton{
  margin-top:18px;
}

button:disabled{
  background:#c7d0e1;
  color:#fff;
}

.progressBox{
  display:none;
  margin-top:16px;
  padding:16px;
  border-radius:16px;
  background:#f5f7fb;
}

.progressBox.show{
  display:block;
}

.statusText{
  color:#718099;
  font-size:13px;
  margin-bottom:10px;
}

.progressTrack{
  height:8px;
  background:#e2e7f0;
  border-radius:999px;
  overflow:hidden;
}

.progressBar{
  width:0%;
  height:100%;
  background:#5271ea;
  border-radius:999px;
  transition:width .2s ease;
}

.hidden{
  display:none !important;
}

.analysisHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.analysisHeader .cardTitle{
  margin:0;
}

.count{
  color:#5271ea;
  font-size:17px;
  font-weight:850;
}

.statusCard{
  padding:16px;
  margin-bottom:12px;
  border-radius:17px;
  background:#eefaf4;
  color:#188657;
  font-size:13px;
  line-height:1.7;
  word-break:keep-all;
}

.warning{
  padding:16px;
  margin:14px 0;
  border-radius:17px;
  background:#fff5e5;
  color:#a86a08;
  font-size:13px;
  line-height:1.6;
}

.emptyResult{
  padding:24px 5px;
  color:#96a1b3;
  text-align:center;
  font-size:14px;
}

.result{
  display:grid;
  grid-template-columns:36px 1fr auto;
  gap:10px;
  align-items:center;
  padding:15px 2px;
  border-bottom:1px solid #e7ebf2;
}

.check{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#e9f8f0;
  color:#16875a;
  font-size:15px;
  font-weight:900;
}

.result .main{
  font-size:15px;
  font-weight:850;
}

.result .sub{
  margin-top:4px;
  color:#7f8b9e;
  font-size:13px;
}

.badge{
  padding:6px 8px;
  border-radius:9px;
  background:#edf2ff;
  color:#5271ea;
  font-size:11px;
  font-weight:850;
}

.specialBox{
  margin-top:14px;
  padding:14px 16px;
  border-radius:16px;
  background:#f3f6fb;
  color:#5e6c82;
  font-size:13px;
  line-height:1.6;
}

.excludedButton{
  width:100%;
  min-height:58px;
  margin-top:18px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-radius:17px;
  background:#f1f4f8;
  color:#647087;
  font-size:17px;
  font-weight:850;
}

.excludedList{
  margin-top:10px;
  border-radius:16px;
  background:#f8fafc;
  overflow:hidden;
}

.excludedItem{
  padding:14px 16px;
  border-bottom:1px solid #e4e9f1;
  color:#7a879c;
  font-size:13px;
  line-height:1.55;
}

.excludedItem:last-child{
  border-bottom:0;
}

.excludedItem b{
  color:#647087;
}

.reportButton{
  margin-top:18px;
}

.report{
  width:100%;
  min-height:440px;
  resize:vertical;
  padding:18px;
  border:1px solid #dce3ed;
  border-radius:18px;
  background:#fbfcfe;
  color:#111;
  font-size:15px;
  line-height:1.85;
  outline:none;
}

.copyButton{
  margin-top:14px;
}

.debug{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f6f8fb;
  color:#8994a6;
  font-size:11px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-all;
}

@media(max-width:520px){
  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .card{
    padding:18px;
    border-radius:22px;
  }

  .settingsGrid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="subtitle">문자보고 작성 · 생산전용</div>
  </header>


  <section class="card">

    <h2 class="cardTitle">근무 정보</h2>

    <div class="settingsGrid">

        <select id="workType">

      </div>


      <div class="field">
        <label for="rank">직급</label>

        <select id="rank">
          <option value="사원">사원</option>
          <option value="주임">주임</option>
          <option value="대리">대리</option>
          <option value="과장">과장</option>
        </select>
      </div>

    </div>

  </section>


  <section class="card">

      순찰일지
    </h2>

    <div class="upload">

      <input
        id="patrolInput"
        type="file"

      >

      <img
        id="patrolPreview"
        class="preview"
        alt=""
      >

      <div class="uploadPlaceholder">

        <div class="plus">+</div>

        <div class="uploadTitle">
          순찰일지 사진 추가
        </div>

        <div class="uploadSub">
          온도 · 상태 · 비고 판독
        </div>

      </div>

    </div>

  </section>


  <section class="card">

    <div class="photoLabel">사진 2</div>

    <h2 class="cardTitle">
      교대 업무일지
    </h2>

    <div class="upload">

      <input
        id="numberInput"
        type="file"
        accept="image/*"
      >

      <img
        id="numberPreview"
        class="preview"
        alt=""
      >

      <div class="uploadPlaceholder">

        <div class="plus">+</div>

        <div class="uploadTitle">
          교대 업무일지 사진 추가
        </div>

        <div class="uploadSub">
          장비 행 · 26-xxx · 가동 판독
        </div>

      </div>

    </div>


    <button
      id="analyze"
      class="analyzeButton"
      disabled
    >
      두 사진 분석하기
    </button>


    <div
      id="progressBox"
      class="progressBox"
    >

      <div
        id="statusText"
        class="statusText"
      >
        준비
      </div>

      <div class="progressTrack">

        <div
          id="progressBar"
          class="progressBar"
        ></div>

      </div>

    </div>

  </section>


  <section
    id="resultCard"
    class="card hidden"
  >

    <div class="analysisHeader">

      <h2 class="cardTitle">
        분석 결과
      </h2>

      <div
        id="count"
        class="count"

        0개 표시
      </div>

    </div>


    <div

      class="statusCard hidden"
    ></div>


    <div
      id="numberStatus"
      class="statusCard hidden"
    ></div>


    <div
      id="fatalWarning"
      class="warning hidden"
    ></div>


    <div id="results"></div>


    <div

      class="specialBox hidden"
    ></div>


    <button

    >

      <span id="excludedCount">
        제외항목 0개

    <div

    <div

      최종 문자보고

    <textarea

    <button

      class="copyButton"

</div>


<script>

/* =========================================================
   DACC PART 1
   기본 설정 / UI / 사진 입력 / 고정 장비 구조
========================================================= */


const $ =
id =>
document.getElementById(id);


/* =========================================================
   상태
========================================================= */

let patrolImage = null;

let numberImage = null;

let analysisResult = null;

let worker = null;

let cvReady = false;

let cvPromise = null;


/* =========================================================
   ★ 사진2 고정 장비 순서

   장비명 OCR을 하지 않는다.

   원본 교대업무일지의 실제 행 순서로
   장비를 확정한다.
========================================================= */

/* =========================================================

const NUMBER_REQUIRED = [

/* =========================================================
   일반 문자보고 장비

   TG1은 별도 규칙이라 제외.
   드라이챔버도 별도 출력.
========================================================= */

const REPORT_ORDER = [

  "TG2",
  "TG3",
  "TG4",
  "TG5",
  "TG6",
  "TG7",

  "CF1",
  "CF2",

  "HIP3",

  "SMI",

  "CF분위기로"

];


/* =========================================================
   드라이챔버
========================================================= */

const DRY_EQUIPMENT = [

  "드라이챔버",
  "신형드라이챔버"

];


/* =========================================================
   소각기

   순찰일지에서만 온도 읽음.
   최종 문자보고에서 별도 출력.
========================================================= */

const INCINERATOR_EQUIPMENT = [

  "1동소각기",
  "3동소각기"

];


/* =========================================================
   ★ 순찰일지 고정 35행

   사용자가 제공한 순찰일지 양식 기준.

   TG1은 순찰일지에 없음.

   null 행은 문자보고 판독 대상이 아닌 행.
========================================================= */

const PATROL_ROW_MAP = {

  1:"TG2",
  2:"TG3",
  3:"TG4",
  4:"TG5",
  5:"TG6",
  6:"TG7",

  7:"GF1",
  8:"GF3",
  9:"GF4",
  10:"GF5",

  11:"SMI",

  12:"CF1",
  13:"CF2",
  14:"CF3",
  15:"CF4",
  16:"CF5",
  17:"CF6",

  18:"CF분위기로",

  19:"드라이챔버",

  20:null,
  21:null,
  22:null,
  23:null,
  24:null,

  25:"신형드라이챔버",

  26:"1동소각기",
  27:"3동소각기",

  28:"HIP1",
  29:"HIP2",
  30:"HIP3",

  31:null,
  32:null,
  33:null,
  34:null,
  35:null

};


/* =========================================================
   텍스트 정리
========================================================= */

function clean(value){

  return String(
    value ?? ""
  )
  .replace(/\r/g,"")
  .replace(/[ \t]+/g," ")
  .replace(/\n+/g," ")
  .trim();
}


function compact(value){

  return clean(value)
  .replace(/\s+/g,"")
  .toUpperCase();
}


/* =========================================================
   숫자 OCR용 정리

   OCR에서 자주 헷갈리는 문자만 제한적으로 보정.
========================================================= */

function normalizeNumberOCR(value){

  return String(
    value ?? ""
  )
  .toUpperCase()

  .replace(/[‐-‒–—―_~.·]/g,"-")

  .replace(/[Oo]/g,"0")

  .replace(/[Il|!]/g,"1")

  .replace(/\s+/g,"")

  .replace(
    /[^0-9#-]/g,
    ""
  );
}


/* =========================================================
   장비번호 파싱

   정상 번호는 반드시 26-숫자 형식.

   추측하지 않는다.
========================================================= */

function parseEquipmentNumber(value){

  const text =
    normalizeNumberOCR(
      value
    );


  let match =
    text.match(
      /#?26-(\d{1,3})/
    );


  if(match){

    return "#26-" + match[1];

  }


  /*
    하이픈만 OCR이 놓친 경우.

    26 뒤 1~3자리 숫자가 명확한 경우에만 허용.
  */

  match =
    text.match(
      /#?26(\d{1,3})$/
    );


  if(match){

    return "#26-" + match[1];

  }


  return "";
}


/* =========================================================
   가동 판독

   번호와 별도로 판단.
========================================================= */

function parseRunning(value){

  const text =
    String(
      value ?? ""
    )
    .replace(/\s+/g,"");


  if(
    text.includes("가동")
  ){
    return true;
  }


  /*
    OCR이 '가' 하나만 놓친 경우의 보조 판정.

    이 값 하나만으로 최종 확정하지 않는다.
  */

  if(
    text === "동" ||
    text.endsWith("동")
  ){
    return true;
  }


  return false;
}


/* =========================================================
   진행상태
========================================================= */

function setStatus(
  text,
  percent
){

  $("progressBox")
    .classList
    .add("show");


  $("statusText").textContent =
    text;


  const safe =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );


  $("progressBar").style.width =
    safe + "%";
}


/* =========================================================
   분석 초기화
========================================================= */

function resetAnalysis(){

  analysisResult =
    null;


  $("resultCard")
    .classList
    .add("hidden");


  $("reportCard")
    .classList
    .add("hidden");


  $("results").innerHTML =
    "";


  $("excluded").innerHTML =
    "";


  $("excluded")
    .classList
    .add("hidden");


  $("arrow").textContent =
    "▼";


  $("patrolStatus")
    .classList
    .add("hidden");


  $("numberStatus")
    .classList
    .add("hidden");


  $("fatalWarning")
    .classList
    .add("hidden");


  $("tg1Area")
    .classList
    .add("hidden");


  $("debug")
    .classList
    .add("hidden");


  $("debug").textContent =
    "";


  $("makeReport").disabled =
    true;


  $("count").textContent =
    "0개 표시";
}


/* =========================================================
   분석 버튼
========================================================= */

function updateAnalyzeButton(){

  $("analyze").disabled =
    !(
      patrolImage &&
      numberImage
    );
}


/* =========================================================
   사진 미리보기
========================================================= */

function showPreview(
  file,
  element
){

  if(!file){
    return;
  }


  const url =
    URL.createObjectURL(
      file
    );


  element.onload =
  () => {

    URL.revokeObjectURL(
      url
    );

  };


  element.src =
    url;


  element.classList
    .add("show");
}


/* =========================================================
   사진 1
========================================================= */

$("patrolInput")
.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0];


    if(!file){
      return;
    }


    patrolImage =
      file;


    showPreview(
      file,
      $("patrolPreview")
    );


    resetAnalysis();

    updateAnalyzeButton();

  }
);


/* =========================================================
   사진 2
========================================================= */

$("numberInput")
.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0];


    if(!file){
      return;
    }


    numberImage =
      file;


    showPreview(
      file,
      $("numberPreview")
    );


    resetAnalysis();

    updateAnalyzeButton();

  }
);


/* =========================================================
   File → Canvas

   iPhone 고해상도 사진을 그대로 OpenCV에 넣으면
   메모리를 너무 많이 사용하므로 최대 변을 제한한다.

   비율은 유지.
========================================================= */

async function fileToCanvas(
  file,
  maxSide = 2600
){

  const bitmap =
    await createImageBitmap(
      file
    );


  const originalWidth =
    bitmap.width;

  const originalHeight =
    bitmap.height;


  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        originalWidth,
        originalHeight
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        originalWidth *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        originalHeight *
        scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );


  if(
    typeof bitmap.close ===
    "function"
  ){
    bitmap.close();
  }


  return canvas;
}


/* =========================================================
   Canvas Crop

   좌표가 사진 밖으로 나가도 안전하게 제한.
========================================================= */

function cropCanvas(
  source,
  x,
  y,
  width,
  height
){

  const sx =
    Math.max(
      0,
      Math.round(x)
    );


  const sy =
    Math.max(
      0,
      Math.round(y)
    );


  const sw =
    Math.max(
      1,
      Math.min(
        source.width - sx,
        Math.round(width)
      )
    );


  const sh =
    Math.max(
      1,
      Math.min(
        source.height - sy,
        Math.round(height)
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    sw;

  canvas.height =
    sh;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    sw,
    sh
  );


  ctx.drawImage(
    source,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    sw,
    sh
  );


  return canvas;
}

function enlargeForOCR(
  source,
  scale = 3
){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        source.width *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        source.height *
        scale
      )
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.imageSmoothingEnabled =
    true;


  ctx.drawImage(
    source,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas;
}

/* =========================================================
   OpenCV 로드
========================================================= */

function loadOpenCV(){

  if(
    window.cv &&
    typeof window.cv.Mat === "function"
  ){
    cvReady = true;
    return Promise.resolve();
  }

  if(cvPromise){
    return cvPromise;
  }

  cvPromise =
    new Promise(
      (resolve,reject) => {

        const script =
          document.createElement(
            "script"
          );

        script.async = true;

        script.src =
          "https://docs.opencv.org/4.x/opencv.js";

        document.head.appendChild(
          script
        );

        const started =
          Date.now();


        const timer =
          setInterval(
            () => {

              if(
                window.cv &&
                typeof window.cv.Mat ===
                "function"
              ){

                clearInterval(
                  timer
                );

                cvReady = true;

                resolve();

                return;
              }


              if(
                Date.now() -
                started >
                30000
              ){

                clearInterval(
                  timer
                );

                reject(
                  new Error(
                    "OpenCV 로딩 실패"
                  )
                );
              }

            },
            100
          );
      }
    );


  return cvPromise;
}

/* =========================================================
   거리
========================================================= */

function pointDistance(
  a,
  b
){

  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );
}


/* =========================================================
   사각형 점 정렬
========================================================= */

function orderQuad(points){

  const sums =
    [...points].sort(
      (a,b) =>
        (a.x + a.y) -
        (b.x + b.y)
    );


  const tl =
    sums[0];


  const br =
    sums[
      sums.length - 1
    ];


  const remain =
    points.filter(
      p =>
        p !== tl &&
        p !== br
    );


  let tr;
  let bl;


  if(
    remain[0].x >
    remain[1].x
  ){

    tr = remain[0];
    bl = remain[1];

  }else{

    tr = remain[1];
    bl = remain[0];

  }


  return {
    tl,
    tr,
    br,
    bl
  };
}


/* =========================================================
   문서 외곽 사각형 찾기
========================================================= */

function detectDocumentQuad(
  canvas
){

  const src =
    cv.imread(
      canvas
    );


  const gray =
    new cv.Mat();


  const blur =
    new cv.Mat();


  const edge =
    new cv.Mat();


  const contours =
    new cv.MatVector();


  const hierarchy =
    new cv.Mat();


  let best = null;

  let bestArea = 0;


  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.GaussianBlur(
      gray,
      blur,
      new cv.Size(
        5,
        5
      ),
      0
    );


    cv.Canny(
      blur,
      edge,
      45,
      140
    );


    cv.findContours(
      edge,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );


    const fullArea =
      canvas.width *
      canvas.height;


    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);


      const perimeter =
        cv.arcLength(
          contour,
          true
        );


      const approx =
        new cv.Mat();


      try{

        cv.approxPolyDP(
          contour,
          approx,
          perimeter * .02,
          true
        );


        if(
          approx.rows !== 4
        ){
          continue;
        }


        const area =
          Math.abs(
            cv.contourArea(
              approx
            )
          );


        if(
          area <
          fullArea * .25
        ){
          continue;
        }


        if(
          area <=
          bestArea
        ){
          continue;
        }


        const points = [];


        for(
          let p = 0;
          p < 4;
          p++
        ){

          const ptr =
            approx.intPtr(
              p,
              0
            );


          points.push({
            x:ptr[0],
            y:ptr[1]
          });
        }


        best =
          orderQuad(
            points
          );


        bestArea =
          area;

      }finally{

        approx.delete();

        contour.delete();

      }
    }


  }finally{

    src.delete();

    gray.delete();

    blur.delete();

    edge.delete();

    contours.delete();

    hierarchy.delete();

  }


  return best;
}


/* =========================================================
   원근 보정
========================================================= */

function warpDocument(
  canvas,
  quad
){

  const top =
    pointDistance(
      quad.tl,
      quad.tr
    );


  const bottom =
    pointDistance(
      quad.bl,
      quad.br
    );


  const left =
    pointDistance(
      quad.tl,
      quad.bl
    );


  const right =
    pointDistance(
      quad.tr,
      quad.br
    );


  let width =
    Math.round(
      Math.max(
        top,
        bottom
      )
    );


  let height =
    Math.round(
      Math.max(
        left,
        right
      )
    );


  const maxSide =
    2500;


  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        width,
        height
      )
    );


  width =
    Math.max(
      100,
      Math.round(
        width * scale
      )
    );


  height =
    Math.max(
      100,
      Math.round(
        height * scale
      )
    );


  const src =
    cv.imread(
      canvas
    );


  const dst =
    new cv.Mat();


  const from =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        quad.tl.x,
        quad.tl.y,

        quad.tr.x,
        quad.tr.y,

        quad.br.x,
        quad.br.y,

        quad.bl.x,
        quad.bl.y
      ]
    );


  const to =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        0,
        0,

        width - 1,
        0,

        width - 1,
        height - 1,

        0,
        height - 1
      ]
    );


  const transform =
    cv.getPerspectiveTransform(
      from,
      to
    );


  try{

    cv.warpPerspective(
      src,
      dst,
      transform,
      new cv.Size(
        width,
        height
      ),
      cv.INTER_LINEAR,
      cv.BORDER_CONSTANT,
      new cv.Scalar(
        255,
        255,
        255,
        255
      )
    );


    const output =
      document.createElement(
        "canvas"
      );


    output.width =
      width;


    output.height =
      height;


    cv.imshow(
      output,
      dst
    );


    return output;


  }finally{

    src.delete();

    dst.delete();

    from.delete();

    to.delete();

    transform.delete();

  }
}


/* =========================================================
   자동 문서보정

   외곽을 못 잡으면 원본 사용.
========================================================= */

async function autoCorrectDocument(
  canvas
){

  await loadOpenCV();


  const quad =
    detectDocumentQuad(
      canvas
    );


  if(!quad){

    return {
      canvas,
      corrected:false
    };
  }


  const corrected =
    warpDocument(
      canvas,
      quad
    );


  return {
    canvas:corrected,
    corrected:true
  };
}


/* =========================================================
   공통 이진화
========================================================= */

function createBinary(
  canvas
){

  const src =
    cv.imread(
      canvas
    );


  const gray =
    new cv.Mat();


  const binary =
    new cv.Mat();


  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,
      11
    );


    return binary.clone();


  }finally{

    src.delete();

    gray.delete();

    binary.delete();

  }
}


/* =========================================================
   가로선 검출
========================================================= */

function detectHorizontalLines(
  canvas
){

  const binary =
    createBinary(
      canvas
    );


  const horizontal =
    new cv.Mat();


  const kernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        Math.max(
          20,
          Math.round(
            canvas.width * .12
          )
        ),
        1
      )
    );


  const contours =
    new cv.MatVector();


  const hierarchy =
    new cv.Mat();


  const lines = [];


  try{

    cv.morphologyEx(
      binary,
      horizontal,
      cv.MORPH_OPEN,
      kernel
    );


    cv.findContours(
      horizontal,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );


    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);


      try{

        const rect =
          cv.boundingRect(
            contour
          );


        if(
          rect.width <
          canvas.width * .18
        ){
          continue;
        }


        lines.push(
          rect.y +
          rect.height / 2
        );


      }finally{

        contour.delete();

      }
    }


  }finally{

    binary.delete();

    horizontal.delete();

    kernel.delete();

    contours.delete();

    hierarchy.delete();

  }


  lines.sort(
    (a,b) =>
      a - b
  );


  const merged = [];


  for(
    const y
    of lines
  ){

    const last =
      merged[
        merged.length - 1
      ];


    if(
      last === undefined ||
      y - last > 5
    ){

      merged.push(
        Math.round(y)
      );

    }else{

      merged[
        merged.length - 1
      ] =
        Math.round(
          (
            last +
            y
          ) / 2
        );
    }
  }


  return merged;
}

/* =========================================================
   중앙값
========================================================= */

function median(values){

  if(
    !values.length
  ){
    return 0;
  }


  const sorted =
    [...values].sort(
      (a,b) =>
        a - b
    );


  const middle =
    Math.floor(
      sorted.length / 2
    );


  if(
    sorted.length % 2
  ){
    return sorted[
      middle
    ];
  }


  return (
    sorted[
      middle - 1
    ]
    +
    sorted[
      middle
    ]
  ) / 2;
}


/* =========================================================
   사진2 장비 표 영역 찾기

   핵심:
   전체 페이지의 모든 줄을 그대로 24행으로 쓰지 않는다.

   NUMBER_ROW_ORDER의 장비행들은
   거의 일정한 높이로 연속되어 있다.

   연속된 가로선 구간 중
   24개 장비행에 가장 잘 맞는 구간을 찾는다.
========================================================= */

function findNumberTableGrid(
  horizontalLines,
  imageHeight
){

  const requiredRows =
    NUMBER_ROW_ORDER.length;


  if(
    horizontalLines.length <
    requiredRows + 1
  ){

    return null;
  }


  const lines =
    [...horizontalLines]
    .sort(
      (a,b) =>
        a - b
    );


  let best = null;


  for(
    let start = 0;
    start <=
    lines.length -
    (
      requiredRows + 1
    );
    start++
  ){

    const candidate =
      lines.slice(
        start,
        start +
        requiredRows +
        1
      );


    const gaps = [];


    let valid =
      true;


    for(
      let i = 1;
      i < candidate.length;
      i++
    ){

      const gap =
        candidate[i] -
        candidate[i - 1];


      if(
        gap < 8 ||
        gap >
        imageHeight * .08
      ){

        valid = false;
        break;
      }


      gaps.push(
        gap
      );
    }


    if(!valid){
      continue;
    }


    const med =
      median(
        gaps
      );


    if(
      med <= 0
    ){
      continue;
    }


    let error = 0;


    for(
      const gap
      of gaps
    ){

      error +=
        Math.abs(
          gap -
          med
        ) /
        med;
    }


    /*
      장비표는 페이지 최상단이 아니라
      상단 제목/헤더 아래에 존재.

      너무 아래쪽 후보도 약간 감점.
    */

    const topRatio =
      candidate[0] /
      imageHeight;


    if(
      topRatio < .08
    ){
      error += 5;
    }


    if(
      topRatio > .55
    ){
      error += 5;
    }


    if(
      !best ||
      error <
      best.error
    ){

      best = {

        boundaries:
          candidate,

        rowHeight:
          med,

        error,

        startY:
          candidate[0],

        endY:
          candidate[
            candidate.length - 1
          ]

      };
    }
  }


  return best;
}


/* =========================================================
   사진2 가동여부 열 찾기

   원본 구조:
   장비명 | 가동여부 | 제품명/사업코드 | 주간/야간

   가동여부는 장비명 바로 오른쪽의 좁은 열.

   세로선이 충분하면 실제 선을 사용.
   실패 시 원본 양식 비율 fallback.
========================================================= */

function findNumberStatusColumn(
  canvas,
  verticalLines
){

  const width =
    canvas.width;


  const lines =
    [...verticalLines]
    .filter(
      x =>
        x > width * .02 &&
        x < width * .98
    )
    .sort(
      (a,b) =>
        a - b
    );


  /*
    원본 양식 기준 예상 위치:
    가동여부 칸 ≈ 전체 폭 14% ~ 25%
  */

  const expectedLeft =
    width * .14;


  const expectedRight =
    width * .255;


  let left = null;

  let right = null;

  let leftDistance =
    Infinity;

  let rightDistance =
    Infinity;


  for(
    const x
    of lines
  ){

    const dl =
      Math.abs(
        x -
        expectedLeft
      );


    if(
      dl <
      leftDistance
    ){

      leftDistance =
        dl;

      left =
        x;
    }


    const dr =
      Math.abs(
        x -
        expectedRight
      );


    if(
      dr <
      rightDistance
    ){

      rightDistance =
        dr;

      right =
        x;
    }
  }


  const tolerance =
    width * .08;


  if(
    left === null ||
    right === null ||
    leftDistance >
    tolerance ||
    rightDistance >
    tolerance ||
    right <= left ||
    right - left <
    width * .045
  ){

    left =
      expectedLeft;

    right =
      expectedRight;
  }


  return {

    left,

    right,

    width:
      right - left

  };
}


/* =========================================================
   사진2 한 행 Crop
========================================================= */

function cropNumberStatusRow(
  canvas,
  grid,
  column,
  index
){

  const top =
    grid.boundaries[
      index
    ];


  const bottom =
    grid.boundaries[
      index + 1
    ];


  const rowHeight =
    bottom - top;


  const padX =
    Math.max(
      1,
      column.width * .04
    );


  const padY =
    Math.max(
      1,
      rowHeight * .06
    );


  return cropCanvas(

    canvas,

    column.left +
    padX,

    top +
    padY,

    column.width -
    padX * 2,

    rowHeight -
    padY * 2

  );
}


/* =========================================================
   Canvas → 회색 원본
========================================================= */

function makeGrayVariant(
  source,
  scale = 4
){

  const src =
    cv.imread(
      source
    );


  const gray =
    new cv.Mat();


  const resized =
    new cv.Mat();


  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.resize(
      gray,
      resized,
      new cv.Size(
        Math.max(
          1,
          Math.round(
            source.width *
            scale
          )
        ),
        Math.max(
          1,
          Math.round(
            source.height *
            scale
          )
        )
      ),
      0,
      0,
      cv.INTER_CUBIC
    );


    const output =
      document.createElement(
        "canvas"
      );


    output.width =
      resized.cols;


    output.height =
      resized.rows;


    cv.imshow(
      output,
      resized
    );


    return output;


  }finally{

    src.delete();

    gray.delete();

    resized.delete();

  }
}

/* =========================================================
   ★ 번호 다중 판독

   1. 회색 확대
   2. OTSU
   3. Adaptive

   첫 성공에서 바로 끝내지 않고
   전부 읽은 뒤 유효한 26-xxx 후보를 비교.

   동일 번호가 여러 전처리에서 나오면 우선.
========================================================= */

async function recognizeEquipmentNumberMulti(
  source
){

  const numberPart =
    cropNumberPart(
      source
    );


  const variants = [

    {
      name:"gray",
      canvas:
        makeGrayVariant(
          numberPart,
          4
        )
    },

    {
      name:"otsu",
      canvas:
        makeOtsuVariant(
          numberPart,
          4
        )
    },

    {
      name:"adaptive",
      canvas:
        makeAdaptiveVariant(
          numberPart,
          4
        )
    }

  ];


  const attempts = [];


  for(
    const variant
    of variants
  ){

    const result =
      await recognizeNumberOnce(
        variant.canvas
      );


    const number =
      parseEquipmentNumber(
        result.text
      );


    attempts.push({

      mode:
        variant.name,

      text:
        result.text,

      confidence:
        result.confidence,

      number

    });
  }


  const votes = {};


  for(
    const attempt
    of attempts
  ){

    if(
      !attempt.number
    ){
      continue;
    }


    if(
      !votes[
        attempt.number
      ]
    ){

      votes[
        attempt.number
      ] = {

        number:
          attempt.number,

        count:0,

        bestConfidence:0

      };
    }


    votes[
      attempt.number
    ].count++;


    votes[
      attempt.number
    ].bestConfidence =
      Math.max(

        votes[
          attempt.number
        ].bestConfidence,

        attempt.confidence

      );
  }


  const candidates =
    Object.values(
      votes
    )
    .sort(
      (a,b) => {

        if(
          b.count !==
          a.count
        ){

          return (
            b.count -
            a.count
          );
        }


        return (
          b.bestConfidence -
          a.bestConfidence
        );
      }
    );


  if(
    candidates.length === 0
  ){

    return {

      number:"",

      success:false,

      attempts

    };
  }


  return {

    number:
      candidates[0].number,

    success:true,

    votes:
      candidates[0].count,

    confidence:
      candidates[0].bestConfidence,

    attempts

  };
}


/* =========================================================
   가동 OCR
========================================================= */

async function recognizeRunning(
  source
){

  const runningPart =
    cropRunningPart(
      source
    );


  const variants = [

    makeGrayVariant(
      runningPart,
      4
    ),

    makeOtsuVariant(
      runningPart,
      4
    )

  ];


  const ocrWorker =
    await getWorker();


  const attempts = [];


  for(
    const variant
    of variants
  ){

    const result =
      await ocrWorker.recognize(
        variant,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE
        }
      );


    const text =
      clean(
        result.data?.text ||
        ""
      );


    const running =
      parseRunning(
        text
      );


    attempts.push({
      text,
      running
    });


    if(running){

      return {

        running:true,

        text,

        attempts

      };
    }
  }


  return {

    running:false,

    text:
      attempts
      .map(
        item =>
          item.text
      )
      .join(" / "),

    attempts

  };
}


/* =========================================================
   셀 잉크 확인

   번호도 없고 가동도 없는 완전 빈 행을 구분.
========================================================= */

function inspectInk(
  source
){

  const src =
    cv.imread(
      source
    );


  const gray =
    new cv.Mat();


  const binary =
    new cv.Mat();


  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.threshold(
      gray,
      binary,
      190,
      255,
      cv.THRESH_BINARY_INV
    );


    const count =
      cv.countNonZero(
        binary
      );


    const total =
      binary.rows *
      binary.cols;


    return (
      total > 0
      ?
      count / total
      :
      0
    );


  }finally{

    src.delete();

    gray.delete();

    binary.delete();

  }
}


/* =========================================================
   사진2 한 장비 행 판독
========================================================= */

async function readNumberRow(
  source,
  equipment
){

  const ink =
    inspectInk(
      source
    );


  /*
    완전히 빈 칸이면 OCR 낭비 방지.
  */

  if(
    ink < .008
  ){

    return {

      equipment,

      blank:true,

      number:"",

      running:false,

      numberSuccess:false,

      ink,

      numberAttempts:[],

      runningAttempts:[]

    };
  }


  /*
    드라이챔버 2종은 번호 자체가 없는 양식.
    가동만 확인.
  */

  if(
    DRY_EQUIPMENT.includes(
      equipment
    )
  ){

    const runningResult =
      await recognizeRunning(
        source
      );


    return {

      equipment,

      blank:false,

      number:"",

      running:
        runningResult.running,

      numberSuccess:true,

      ink,

      numberAttempts:[],

      runningAttempts:
        runningResult.attempts

    };
  }


  /*
    일반장비:
    번호 / 가동 각각 독립 판독.
  */

  const numberResult =
    await recognizeEquipmentNumberMulti(
      source
    );


  const runningResult =
    await recognizeRunning(
      source
    );


  return {

    equipment,

    blank:false,

    number:
      numberResult.number,

    numberSuccess:
      numberResult.success,

    numberVotes:
      numberResult.votes || 0,

    numberConfidence:
      numberResult.confidence || 0,

    running:
      runningResult.running,

    ink,

    numberAttempts:
      numberResult.attempts,

    runningAttempts:
      runningResult.attempts

  };
}

/* =========================================================
   순찰일지용 35행 찾기

   사진1은 정확히 35개 장비/점검행 기준.

   36개의 경계선을 찾는다.
========================================================= */

function findPatrol35Grid(
  horizontalLines,
  imageHeight
){

  const rowCount =
    35;


  if(
    horizontalLines.length <
    20
  ){
    return null;
  }


  const lines =
    [...horizontalLines]
    .sort(
      (a,b) =>
        a - b
    );


  const gaps = [];


  for(
    let i = 1;
    i < lines.length;
    i++
  ){

    const gap =
      lines[i] -
      lines[i - 1];


    if(
      gap >= 8 &&
      gap <=
      imageHeight * .055
    ){

      gaps.push(
        gap
      );
    }
  }


  if(
    gaps.length < 10
  ){
    return null;
  }


  const sortedGaps =
    [...gaps].sort(
      (a,b) =>
        a - b
    );


  /*
    큰 헤더 셀 간격을 배제하기 위해
    작은 70%를 사용.
  */

  const usable =
    sortedGaps.slice(
      0,
      Math.max(
        8,
        Math.ceil(
          sortedGaps.length *
          .70
        )
      )
    );


  const rowHeight =
    median(
      usable
    );


  if(
    rowHeight < 8
  ){
    return null;
  }


  const tolerance =
    Math.max(
      5,
      rowHeight * .42
    );


  let best = null;


  for(
    const startLine
    of lines
  ){

    const estimatedEnd =
      startLine +
      rowHeight *
      rowCount;


    if(
      estimatedEnd >
      imageHeight +
      rowHeight
    ){
      continue;
    }


    const boundaries = [];

    let matches = 0;

    let error = 0;


    for(
      let i = 0;
      i <= rowCount;
      i++
    ){

      const expected =
        startLine +
        rowHeight *
        i;


      let nearest =
        null;

      let nearestDistance =
        Infinity;


      for(
        const line
        of lines
      ){

        const distance =
          Math.abs(
            line -
            expected
          );


        if(
          distance <
          nearestDistance
        ){

          nearestDistance =
            distance;

          nearest =
            line;
        }
      }


      if(
        nearest !== null &&
        nearestDistance <=
        tolerance
      ){

        boundaries.push(
          nearest
        );

        matches++;

        error +=
          nearestDistance;

      }else{

        boundaries.push(
          expected
        );
      }
    }


    const score =
      matches * 100 -
      error;


    if(
      !best ||
      score >
      best.score
    ){

      best = {

        boundaries,

        matches,

        rowHeight,

        score,

        startY:
          boundaries[0],

        endY:
          boundaries[
            boundaries.length - 1
          ]

      };
    }
  }


  /*
    최소 절반 이상 실제 표선과 일치해야 함.
  */

  if(
    !best ||
    best.matches < 18
  ){
    return null;
  }


  /*
    중복 경계 보정
  */

  for(
    let i = 1;
    i <
    best.boundaries.length;
    i++
  ){

    if(
      best.boundaries[i] <=
      best.boundaries[
        i - 1
      ] + 3
    ){

      best.boundaries[i] =
        best.boundaries[
          i - 1
        ] +
        best.rowHeight;
    }
  }


  return best;
}


/* =========================================================
   순찰일지 열 구조

   실제 순찰일지:
   장비명 / 판넬전원 / 가동대기 / 온도체크 /
   공정가스 / 가스유량 / 제품명 / 승온냉각 / 비고

   세로선을 우선 사용하고
   부족하면 양식 비율 fallback.
========================================================= */

function buildPatrolColumns(
  canvas,
  verticalLines
){

  const width =
    canvas.width;


  const lines =
    [...verticalLines]
    .filter(
      x =>
        x > width * .02 &&
        x < width * .995
    )
    .sort(
      (a,b) =>
        a - b
    );


  /*
    사용자가 제공한 실제 순찰일지 기준
    대략적인 열 경계 비율.
  */

  const expected = {

    temperature:[
      .40,
      .50
    ],

    state:[
      .76,
      .86
    ],

    remark:[
      .86,
      .985
    ]

  };


  function nearest(
    ratio
  ){

    const target =
      width *
      ratio;


    let result =
      target;

    let distance =
      Infinity;


    for(
      const x
      of lines
    ){

      const d =
        Math.abs(
          x -
          target
        );


      if(
        d <
        distance
      ){

        distance = d;

        result = x;
      }
    }


    if(
      distance >
      width * .065
    ){

      return target;
    }


    return result;
  }


  function makeColumn(
    ratios
  ){

    let left =
      nearest(
        ratios[0]
      );


    let right =
      nearest(
        ratios[1]
      );


    if(
      right <= left ||
      right - left <
      width * .025
    ){

      left =
        width *
        ratios[0];


      right =
        width *
        ratios[1];
    }


    return {
      left,
      right
    };
  }


  return {

    temperature:
      makeColumn(
        expected.temperature
      ),

    state:
      makeColumn(
        expected.state
      ),

    remark:
      makeColumn(
        expected.remark
      ),

    detectedLines:
      lines.length

  };
}


/* =========================================================
   순찰일지 셀 Crop
========================================================= */

function cropPatrolCell(
  canvas,
  grid,
  rowNumber,
  column
){

  const index =
    rowNumber - 1;


  const top =
    grid.boundaries[
      index
    ];


  const bottom =
    grid.boundaries[
      index + 1
    ];


  const rowHeight =
    bottom - top;


  const width =
    column.right -
    column.left;


  const padX =
    Math.max(
      1,
      width * .05
    );


  const padY =
    Math.max(
      1,
      rowHeight * .08
    );


  return cropCanvas(

    canvas,

    column.left +
    padX,

    top +
    padY,

    width -
    padX * 2,

    rowHeight -
    padY * 2

  );
}


/* =========================================================
   온도 OCR

   손글씨이므로 숫자만 허용.
   회색 + OTSU 두 번 시도.
========================================================= */

async function recognizeTemperature(
  source
){

  const ink =
    inspectInk(
      source
    );


  if(
    ink < .007
  ){

    return {

      temperature:null,

      blank:true,

      attempts:[]

    };
  }


  const variants = [

    makeGrayVariant(
      source,
      4
    ),

    makeOtsuVariant(
      source,
      4
    )

  ];


  const ocrWorker =
    await getWorker();


  const attempts = [];


  for(
    const variant
    of variants
  ){

    const result =
      await ocrWorker.recognize(
        variant,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE,

          tessedit_char_whitelist:
            "0123456789"
        }
      );


    const text =
      String(
        result.data?.text ||
        ""
      );


    const matches =
      text.match(
        /\d{1,4}/g
      );


    let temperature =
      null;


    if(matches){

      for(
        const match
        of matches
      ){

        const number =
          Number(
            match
          );


        if(
          Number.isFinite(
            number
          ) &&
          number >= 10 &&
          number <= 1800
        ){

          temperature =
            number;

          break;
        }
      }
    }


    attempts.push({
      text:
        clean(text),

      temperature
    });


    if(
      temperature !== null
    ){

      return {

        temperature,

        blank:false,

        attempts

      };
    }
  }


  return {

    temperature:null,

    blank:false,

    attempts

  };
}


/* =========================================================
   순찰일지 상태 OCR
========================================================= */

function parsePatrolState(
  value
){

  const text =
    String(
      value || ""
    )
    .replace(/\s+/g,"");


  if(
    text.includes("승온")
  ){
    return "승온중";
  }


  if(
    text.includes("유지")
  ){
    return "유지중";
  }


  if(
    text.includes("냉각")
  ){
    return "냉각중";
  }


  return "";
}


async function recognizePatrolState(
  source
){

  const ink =
    inspectInk(
      source
    );


  if(
    ink < .008
  ){

    return {

      state:"",

      blank:true,

      text:""

    };
  }


  const variant =
    makeGrayVariant(
      source,
      4
    );


  const ocrWorker =
    await getWorker();


  const result =
    await ocrWorker.recognize(
      variant,
      {
        tessedit_pageseg_mode:
          Tesseract.PSM.SINGLE_LINE
      }
    );


  const text =
    clean(
      result.data?.text ||
      ""
    );


  return {

    state:
      parsePatrolState(
        text
      ),

    blank:false,

    text

  };
}


/* =========================================================
   비고 OCR
========================================================= */

function parsePatrolRemark(
  value
){

  const text =
    String(
      value || ""
    )
    .replace(/\s+/g,"");


  return {

    cooling:
      text.includes(
        "냉각"
      ),

    unload:
      text.includes(
        "언로딩대기"
      )
      ||
      (
        text.includes(
          "언로딩"
        ) &&
        text.includes(
          "대기"
        )
      )

  };
}


async function recognizePatrolRemark(
  source
){

  const ink =
    inspectInk(
      source
    );


  if(
    ink < .008
  ){

    return {

      blank:true,

      text:"",

      cooling:false,

      unload:false

    };
  }


  const variant =
    makeGrayVariant(
      source,
      3.5
    );


  const ocrWorker =
    await getWorker();


  const result =
    await ocrWorker.recognize(
      variant,
      {
        tessedit_pageseg_mode:
          Tesseract.PSM.SINGLE_LINE
      }
    );


  const text =
    clean(
      result.data?.text ||
      ""
    );


  const parsed =
    parsePatrolRemark(
      text
    );


  return {

    blank:false,

    text,

    ...parsed

  };
}


/* =========================================================
   순찰일지 한 행
========================================================= */

async function readPatrolRow(
  canvas,
  grid,
  columns,
  rowNumber,
  equipment
){

  const temperatureCell =
    cropPatrolCell(
      canvas,
      grid,
      rowNumber,
      columns.temperature
    );


  const stateCell =
    cropPatrolCell(
      canvas,
      grid,
      rowNumber,
      columns.state
    );


  const remarkCell =
    cropPatrolCell(
      canvas,
      grid,
      rowNumber,
      columns.remark
    );


  const temperature =
    await recognizeTemperature(
      temperatureCell
    );


  const state =
    await recognizePatrolState(
      stateCell
    );


  const remark =
    await recognizePatrolRemark(
      remarkCell
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature:
      temperature.temperature,

    state:
      state.state,

    unload:
      remark.unload,

    remarkCooling:
      remark.cooling,

    blank:{

      temperature:
        temperature.blank,

      state:
        state.blank,

      remark:
        remark.blank

    },

    raw:{

      temperature:
        temperature.attempts,

      state:
        state.text,

      remark:
        remark.text

    }

  };
}


/* =========================================================
   온도 전용 행

   드라이챔버 / 신형드라이챔버 / 소각기
========================================================= */

async function readPatrolTemperatureOnly(
  canvas,
  grid,
  columns,
  rowNumber,
  equipment
){

  const cell =
    cropPatrolCell(
      canvas,
      grid,
      rowNumber,
      columns.temperature
    );


  const result =
    await recognizeTemperature(
      cell
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature:
      result.temperature,

    blank:
      result.blank,

    raw:
      result.attempts

  };
}

   사진1 전체 분석
========================================================= */

async function analyzePatrol(
  file
){

  setStatus(
    "순찰일지 준비중...",
    8
  );


  const original =
    await fileToCanvas(
      file,
      2600
    );


  setStatus(
    "순찰일지 자동보정중...",
    11
  );


  const correction =
    await autoCorrectDocument(
      original
    );


  const canvas =
    correction.canvas;


  setStatus(
    "순찰일지 35행 찾는 중...",
    14
  );


  const horizontal =
    detectHorizontalLines(
      canvas
    );


  const vertical =
    detectVerticalLines(
      canvas
    );


  const grid =
    findPatrol35Grid(
      horizontal,
      canvas.height
    );


  if(!grid){

    throw new Error(
      "순찰일지 35행 표를 찾지 못했습니다. " +
      `가로선 ${horizontal.length}개 감지`
    );
  }


  const columns =
    buildPatrolColumns(
      canvas,
      vertical
    );


  const items = {};

  const dry = [];

  const incinerators = [];


  const readable =
    Object.entries(
      PATROL_ROW_MAP
    )
    .filter(
      ([,equipment]) =>
        equipment !== null
    );


  let temperatureCount = 0;

  let stateCount = 0;

  let processed = 0;


  for(
    const [
      rowText,
      equipment
    ]
    of readable
  ){

    processed++;


    const rowNumber =
      Number(
        rowText
      );


    setStatus(

      `순찰일지 ${equipment} 확인중...`,

      16 +
      Math.round(
        (
          processed /
          readable.length
        ) *
        31
      )

    );


    if(
      DRY_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await readPatrolTemperatureOnly(
          canvas,
          grid,
          columns,
          rowNumber,
          equipment
        );


      if(
        item.temperature !==
        null
      ){
        temperatureCount++;
      }


      dry.push(
        item
      );


      continue;
    }


    if(
      INCINERATOR_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await readPatrolTemperatureOnly(
          canvas,
          grid,
          columns,
          rowNumber,
          equipment
        );


      if(
        item.temperature !==
        null
      ){
        temperatureCount++;
      }


      incinerators.push(
        item
      );


      continue;
    }


    const item =
      await readPatrolRow(
        canvas,
        grid,
        columns,
        rowNumber,
        equipment
      );


    if(
      item.temperature !==
      null
    ){
      temperatureCount++;
    }


    if(
      item.state
    ){
      stateCount++;
    }


    items[
      equipment
    ] =
      item;
  }


  return {

    corrected:
      correction.corrected,

    horizontalCount:
      horizontal.length,

    verticalCount:
      columns.detectedLines,

    matchedRows:
      grid.matches,

    totalRows:
      35,

    temperatureCount,

    stateCount,

    items,

    dry,

    incinerators,

    debug:{

      gridStart:
        Math.round(
          grid.startY
        ),

      gridEnd:
        Math.round(
          grid.endY
        ),

      rowHeight:
        Number(
          grid.rowHeight
          .toFixed(1)
        ),

      temperatureColumn:[
        Math.round(
          columns.temperature.left
        ),
        Math.round(
          columns.temperature.right
        )
      ],

      stateColumn:[
        Math.round(
          columns.state.left
        ),
        Math.round(
          columns.state.right
        )
      ],

      remarkColumn:[
        Math.round(
          columns.remark.left
        ),
        Math.round(
          columns.remark.right
        )
      ]

    }

  };
}

/* =========================================================
   일반장비 제외 판정

   최종 포함 조건:

   사진2
   - 장비 행 확인
   - 번호 존재
   - 가동 확인

   사진1
   - 온도 존재
   - 승온중 / 유지중 / 냉각중 존재

   제외:
   - 비고 냉각
   - 비고 언로딩대기
   - 100도 이하 + 냉각중
========================================================= */

function getExcludeReason(
  equipment,
  patrol,
  number
){

  if(!number){
    return "교대 업무일지 데이터 없음";
  }


  /*
    사진2의 해당 칸이 비어 있음
  */

  if(number.blank){
    return "가동번호 없음";
  }


  /*
    일반 장비는 번호 필수

    번호 OCR 실패와
    실제 빈 칸을 구분한다.
  */

  if(
    requiresNumber(
      equipment
    ) &&
    !number.number
  ){

    return "번호 인식 실패";
  }


  /*
    번호가 있어도 가동 확인이 안 되면 제외
  */

  if(
    !number.running
  ){
    return "가동 확인 안 됨";
  }


  /*
    순찰일지
  */

  if(!patrol){
    return "순찰일지 데이터 없음";
  }


  /*
    비고란 언로딩대기 최우선 제외
  */

  if(
    patrol.unload
  ){
    return "언로딩대기";
  }


  /*
    비고란 냉각이면 제외

    장비번호표에 번호 + 가동이 있어도 제외.
  */

  if(
    patrol.remarkCooling
  ){
    return "비고 냉각";
  }


  /*
    온도
  */

  if(
    patrol.temperature === null
  ){

    if(
      patrol.blank?.temperature
    ){
      return "온도 미작성";
    }

    return "온도 인식 실패";
  }


  /*
    상태
  */

  if(
    !patrol.state
  ){

    if(
      patrol.blank?.state
    ){
      return "상태 미작성";
    }

    return "상태 인식 실패";
  }


  /*
    사용자 확정 규칙

    100도 이하 + 냉각중은 제외.
  */

  if(
    patrol.temperature <= 100 &&
    patrol.state === "냉각중"
  ){
    return "100도 이하 냉각";
  }


  return "";
}


/* =========================================================
   사진1 + 사진2 교차검증
========================================================= */

function mergeAnalysis(
  patrol,
  number
){

  const included = [];

  const excluded = [];


  /*
    일반장비

    TG1 제외.
  */

  for(
    const equipment
    of REPORT_ORDER
  ){

    const patrolItem =
      patrol.items[
        equipment
      ] || null;


    const numberItem =
      number.items[
        equipment
      ] || null;


    const reason =
      getExcludeReason(
        equipment,
        patrolItem,
        numberItem
      );


    if(reason){

      excluded.push({

        equipment,

        reason,

        patrol:
          patrolItem,

        number:
          numberItem

      });

      continue;
    }


    included.push({

      equipment,

      number:
        numberItem.number,

      temperature:
        patrolItem.temperature,

      state:
        patrolItem.state

    });
  }


  /*
    TG1

    순찰일지에는 없음.

    사진2에서
    번호 + 가동이 둘 다 확인된 경우에만 출력.

    온도/상태 없음.

    일반 장비 목록 맨 아래에 붙인다.
  */

  let tg1 = null;


  const tg1Number =
    number.items[
      "TG1"
    ];


  if(
    tg1Number &&
    tg1Number.number &&
    tg1Number.running
  ){

    tg1 = {

      equipment:"TG1",

      number:
        tg1Number.number

    };
  }


  /*
    드라이챔버

    번호는 사용하지 않는다.

    순찰일지 온도 존재 +
    사진2 가동 확인일 때만 출력.
  */

  const dry = [];


  for(
    const patrolDry
    of patrol.dry
  ){

    const numberDry =
      number.items[
        patrolDry.equipment
      ];


    if(
      patrolDry.temperature === null
    ){
      continue;
    }


    if(
      !numberDry ||
      !numberDry.running
    ){
      continue;
    }


    dry.push({

      equipment:
        patrolDry.equipment,

      temperature:
        patrolDry.temperature

    });
  }


  /*
    소각기

    사진2와 무관.

    순찰일지에서 온도 읽힌 경우만
    별도 출력.
  */

  const incinerators =
    patrol.incinerators
    .filter(
      item =>
        item.temperature !== null
    )
    .map(
      item => ({
        equipment:
          item.equipment,

        temperature:
          item.temperature
      })
    );


  return {

    included,

    excluded,

    tg1,

    dry,

    incinerators

  };
}


/* =========================================================
   분석 신뢰성 검사

   주의:
   일부 번호 OCR 실패 때문에
   전체 보고서를 막지는 않는다.

   실패한 장비만 제외.

   대신 표 자체를 잘못 찾은 경우에는
   보고서 생성을 막는다.
========================================================= */

function validateAnalysis(
  patrol,
  number
){

  const problems = [];


  /*
    순찰일지 35행 중
    실제 표선 매칭이 너무 적으면 위험.
  */

  if(
    patrol.matchedRows < 18
  ){

    problems.push(
      `순찰일지 행 인식 부족 (${patrol.matchedRows}/36 경계)`
    );
  }


  /*
    사진2는 24행 고정.

    행 그리드가 만들어졌다면 rowCount=24.
  */

  if(
    number.rowCount !==
    NUMBER_ROW_ORDER.length
  ){

    problems.push(
      `교대 업무일지 행 인식 오류 (${number.rowCount}/${NUMBER_ROW_ORDER.length})`
    );
  }


  /*
    원본 사진에서 가동장비가 있는데
    번호도 가동도 하나도 못 읽었다면
    열 위치 자체가 틀렸을 가능성이 높다.
  */

  if(
    number.numberCount === 0 &&
    number.runningCount === 0
  ){

    problems.push(
      "교대 업무일지 가동여부 열 인식 실패"
    );
  }


  /*
    사진1에서 온도와 상태를
    모두 0개 읽었다면 열 위치 오류 가능성이 큼.
  */

  if(
    patrol.temperatureCount === 0 &&
    patrol.stateCount === 0
  ){

    problems.push(
      "순찰일지 온도·상태 열 인식 실패"
    );
  }


  return {

    valid:
      problems.length === 0,

    problems

  };
}

function buildDebugText(
  patrol,
  number
){

  const lines = [];


  lines.push(
    "[순찰일지]"
  );


  lines.push(
    JSON.stringify(
      patrol.debug,
      null,
      2
    )
  );


  lines.push("");


  lines.push(
    "[교대 업무일지]"
  );


  lines.push(
    JSON.stringify(
      number.debug,
      null,
      2
    )
  );


  lines.push("");


  lines.push(
    "[장비번호 판독]"
  );


  for(
    const equipment
    of NUMBER_ROW_ORDER
  ){

    const item =
      number.items[
        equipment
      ];


    if(!item){
      continue;
    }


    lines.push(
      `${equipment} | ` +
      `번호=${item.number || "-"} | ` +
      `가동=${item.running ? "O" : "X"} | ` +
      `빈칸=${item.blank ? "O" : "X"}`
    );
  }


  return lines.join(
    "\n"
  );
}

function renderAnalysis(

){

    사진1 상태
  */

  $("patrolStatus")

    ` · 상태 ${patrol.stateCount}`;


  /*
    사진2 상태

    장비명 OCR 개수는 더 이상 없음.
  */

  $("numberStatus")
    .classList
    .remove(
      "hidden"
    );


  $("numberStatus").textContent =

    "사진 2 · " +

    (
      number.corrected
      ?
      "자동보정 ✓"
      :
      "원본 사용"
    )

    +

    ` · 고정행 ${number.rowCount}`

    +

    ` · 번호 ${number.numberCount}`

    +

    ` · 가동 ${number.runningCount}`

    +

    (
      number.numberFailCount > 0
      ?
      ` · 번호인식실패 ${number.numberFailCount}`
      :
      ""
    );


  /*
    치명적 인식 실패
  */

  if(
    validation.valid
  ){

    $("fatalWarning")
      .classList
      .add(
        "hidden"
      );


    $("makeReport").disabled =
      false;

  }else{

    $("fatalWarning")
      .classList
      .remove(
        "hidden"
      );


    $("fatalWarning").textContent =
      "인식 결과 확인 필요 · " +
      validation.problems.join(
        " / "
      );


    $("makeReport").disabled =
      true;
  }


  /*
    일반장비
  */

  for(
    const item
    of merged.included
  ){

    $("results")
      .appendChild(
        makeResultElement(
          item
        )
      );
  }


  /*
    포함 0개
  */

  if(
    merged.included.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "emptyResult";


    empty.textContent =
      "자동 확정된 일반 장비가 없습니다.";


    $("results")
      .appendChild(
        empty
      );
  }


  /*
    TG1
  */

  if(
    merged.tg1
  ){

    $("tg1Area")
      .classList
      .remove(
        "hidden"
      );


    $("tg1Area").textContent =
      `${displayNumber(
        merged.tg1.number
      )} TG1 · 번호/가동 확인`;

  }else{

    $("tg1Area")
      .classList
      .add(
        "hidden"
      );
  }


  /*
    제외항목
  */

  $("excludedCount").textContent =
    `제외항목 ${merged.excluded.length}개`;


  $("excluded").innerHTML =
    "";


  for(
    const item
    of merged.excluded
  ){

    $("excluded")
      .appendChild(
        makeExcludedElement(
          item
        )
      );
  }


  /*
    최종 표시 개수

    일반장비 + TG1
  */

  const visibleCount =
    merged.included.length +
    (
      merged.tg1
      ?
      1
      :
      0
    );


  $("count").textContent =
    `${visibleCount}개 표시`;


  /*
    디버그는 평소 숨김.

    validation 실패일 때만 보여줌.
  */

  $("debug").textContent =
    buildDebugText(
      patrol,
      number
    );


  if(
    validation.valid
  ){

    $("debug")
      .classList
      .add(
        "hidden"
      );

  }else{

    $("debug")
      .classList
      .remove(
        "hidden"
      );
  }


  $("resultCard")
    .classList
    .remove(
      "hidden"
    );


  $("resultCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}

    );

      mergeAnalysis(

      );

/* =========================================================
   날짜
========================================================= */

function getToday(){

  const now =
    new Date();


  const weekdays = [
    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"
  ];


  return {

    month:
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      ),

    day:
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      ),

    weekday:
      weekdays[
        now.getDay()
      ]

  };
}


/* =========================================================
   근무명
========================================================= */

function getWorkName(){

  const type =
    getWorkType();


  if(
    type ===
    "weekday"
  ){
    return "주간";
  }


  if(
    type ===
    "holiday"
  ){
    return "휴일주간";
  }


  return "야간";
}


/* =========================================================
   일반장비 보고 한 줄

   예:
   26-33 TG2 572도 유지중
========================================================= */

function makeEquipmentLine(
  item
){

  return (
    displayNumber(
      item.number
    )
    +
    " "
    +
    item.equipment
    +
    " "
    +
    item.temperature
    +
    "도 "
    +
    item.state
  );
}


/* =========================================================
   최종 문자보고

   순서:

   일반장비
   TG1
   드라이챔버
   소각기

   TG1은 온도/상태 없음.
========================================================= */

function buildReport(){

  if(
    !analysisResult ||
    !analysisResult.validation.valid
  ){
    return "";
  }


  const merged =
    analysisResult.merged;


  const today =
    getToday();


  const lines = [];


  /*
    헤더
  */

  lines.push(
    `${today.month}월 ${today.day}일 (${today.weekday}) ${getWorkName()}근무자`
  );


  lines.push(
    `${getRank()}입니다.`
  );


  lines.push("");


  lines.push(
    "문자보고 작성 생산전용"
  );


  lines.push("");


  /*
    일반장비
  */

  for(
    const equipment
    of REPORT_ORDER
  ){

    const item =
      merged.included.find(
        value =>
          value.equipment ===
          equipment
      );


    if(!item){
      continue;
    }


    lines.push(
      makeEquipmentLine(
        item
      )
    );
  }


  /*
    TG1

    일반장비 맨 아래.
  */

  if(
    merged.tg1
  ){

    lines.push(
      `${displayNumber(
        merged.tg1.number
      )} TG1`
    );
  }


  /*
    드라이챔버

    번호 없음.
  */

  if(
    merged.dry.length
  ){

    lines.push("");


    for(
      const item
      of merged.dry
    ){

      lines.push(
        `${item.equipment} ${item.temperature}도`
      );
    }
  }


  /*
    소각기

    별도 출력.
    온도만.
  */

  if(
    merged.incinerators.length
  ){

    lines.push("");


    lines.push(
      "-TG소각기-"
    );


    const order = [
      "1동소각기",
      "3동소각기"
    ];


    const sorted =
      [...merged.incinerators]
      .sort(
        (a,b) =>
          order.indexOf(
            a.equipment
          )
          -
          order.indexOf(
            b.equipment
          )
      );


    for(
      const item
      of sorted
    ){

      const name =
        item.equipment ===
        "1동소각기"
        ?
        "1동"
        :
        "3동";


      lines.push(
        `${name} ${item.temperature}도`
      );
    }
  }


  return lines.join(
    "\n"
  );
}


/* =========================================================
   보고서 생성
========================================================= */

$("makeReport").onclick =
() => {

  if(
    !analysisResult
  ){

    alert(
      "먼저 두 사진을 분석해주세요."
    );

    return;
  }


  if(
    !analysisResult.validation.valid
  ){

    alert(
      "사진 인식 결과 확인이 필요합니다."
    );

    return;
  }


  const report =
    buildReport();


  if(!report){

    alert(
      "문자보고를 생성할 수 없습니다."
    );

  }


  $("report").value =

    .classList
    .remove(
      "hidden"
    );


  $("reportCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
};


/* =========================================================
   iPhone 복사 fallback
========================================================= */

function fallbackCopy(){

  const textarea =
    $("report");


  textarea.focus();


  textarea.select();


  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  return document.execCommand(
    "copy"
  );
}


/* =========================================================
   복사 완료 표시
========================================================= */

function showCopied(){

  const button =
    $("copy");


  button.textContent =
    "복사 완료 ✓";


  setTimeout(
    () => {

      button.textContent =
        "전체 복사";

    },
    1300
  );
}


/* =========================================================
   전체 복사
========================================================= */

$("copy").onclick =
async () => {

  const text =
    $("report").value;


  if(!text){
    return;
  }


  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard
        .writeText(
          text
        );


      showCopied();

      return;
    }


    if(
      fallbackCopy()
    ){

      showCopied();

      return;
    }


    throw new Error(
      "clipboard unavailable"
    );


  }catch(error){

    try{

      if(
        fallbackCopy()
      ){

        showCopied();

        return;
      }

    }catch(copyError){

      console.warn(
        copyError
      );
    }


    alert(
      "자동 복사가 차단됐습니다. 문자보고 내용을 길게 눌러 복사해주세요."
    );
  }
};
