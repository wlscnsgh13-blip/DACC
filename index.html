<script>

/* ==========================================
   DACC V2
   기본 상태
========================================== */

const $ =
id =>
document.getElementById(id);


let cvLoaded = false;

let workType = "weekday";

let rank = "사원";

let patrolFile = null;

let numberFile = null;

let OCRWorker = null;

let finalItems = [];

let excludedItems = [];

let tg1Detected = null;


/* ==========================================
   OpenCV 준비
========================================== */

function opencvReady(){

if(typeof cv === "undefined"){
return;
}

if(cv.Mat){

cvLoaded = true;

}else{

cv.onRuntimeInitialized =
() => {

cvLoaded = true;

};

}

}


/* ==========================================
   근무 종류
========================================== */

document
.querySelectorAll("[data-type]")
.forEach(button => {

button.onclick = () => {

workType =
button.dataset.type;

document
.querySelectorAll("[data-type]")
.forEach(item => {

item.classList.toggle(
"active",
item === button
);

});

};

});


/* ==========================================
   직급
========================================== */

document
.querySelectorAll("[data-rank]")
.forEach(button => {

button.onclick = () => {

rank =
button.dataset.rank;

document
.querySelectorAll("[data-rank]")
.forEach(item => {

item.classList.toggle(
"active",
item === button
);

});

};

});


/* ==========================================
   사진 입력
========================================== */

$("patrolInput").onchange =
event => {

const file =
event.target.files?.[0];

if(!file){
return;
}

patrolFile = file;

renderPreview(
"patrolPreview",
file,
"순찰일지",
() => {

patrolFile = null;

$("patrolPreview").innerHTML = "";

updateAnalyzeButton();

}
);

updateAnalyzeButton();

};


$("numberInput").onchange =
event => {

const file =
event.target.files?.[0];

if(!file){
return;
}

numberFile = file;

renderPreview(
"numberPreview",
file,
"장비번호",
() => {

numberFile = null;

$("numberPreview").innerHTML = "";

updateAnalyzeButton();

}
);

updateAnalyzeButton();

};


function updateAnalyzeButton(){

$("analyzeBtn").disabled =
!(
patrolFile &&
numberFile
);

}


function renderPreview(
targetId,
file,
label,
removeCallback
){

const target =
$(targetId);

target.innerHTML = "";


const url =
URL.createObjectURL(file);


const box =
document.createElement("div");

box.className =
"preview";


const image =
document.createElement("img");

image.src = url;


const tag =
document.createElement("span");

tag.className =
"previewTag";

tag.textContent =
label;


const remove =
document.createElement("button");

remove.className =
"remove";

remove.textContent =
"×";


remove.onclick =
() => {

URL.revokeObjectURL(url);

removeCallback();

};


box.appendChild(image);

box.appendChild(tag);

box.appendChild(remove);

target.appendChild(box);

}


/* ==========================================
   장비 구조

   주의:
   20~24 / 31~35 등을 삭제하지 않는다.
   35행 좌표는 항상 유지한다.
========================================== */

const COMMON_ROWS = {

1:"TG2",
2:"TG3",
3:"TG4",
4:"TG5",
5:"TG6",
6:"TG7",

7:"GF1",
8:"GF3",
9:"GF4",
10:"GF5",

11:"SMI",

12:"CF1",
13:"CF2",
14:"CF3",
15:"CF4",
16:"CF5",
17:"CF6",

18:"CF분위기로",

26:"1동소각기",
27:"3동소각기",

28:"HIP1",
29:"HIP2",
30:"HIP3"

};


/*
평일주간

19 = 구형
25 = 신형

20~24 사용안함
31~35 사용안함
*/

const WEEKDAY_ROWS = {

...COMMON_ROWS,

19:"구형드라이챔버",

25:"신형드라이챔버"

};


/*
휴일주간 / 야간

19 = 구형
20 = 신형

21~25 사용안함
31~35 사용안함
*/

const NIGHT_ROWS = {

...COMMON_ROWS,

19:"구형드라이챔버",

20:"신형드라이챔버"

};


function getPatrolRows(){

if(
workType === "weekday"
){

return WEEKDAY_ROWS;

}

return NIGHT_ROWS;

}


/* ==========================================
   사진2 장비번호 순서

   위에서부터 고정된 인쇄 장비명.
   번호 자체는 절대 고정하지 않는다.
========================================== */

const NUMBER_ROWS = [

"TG1",

"TG2",
"TG3",
"TG4",
"TG5",
"TG6",
"TG7",

"CF1",
"CF2",
"CF3",
"CF4",
"CF5",
"CF6",

"GF1",
"GF3",
"GF4",
"GF5",

"HIP1",
"HIP2",
"HIP3",

"SMI",

"CF분위기로",

"구형드라이챔버",
"신형드라이챔버"

];


/* ==========================================
   보고서 출력 순서

   TG1은 별도 처리 후 맨 아래.
========================================== */

const REPORT_ORDER = [

"CF1",
"CF2",
"CF3",
"CF4",
"CF5",
"CF6",

"GF1",
"GF3",
"GF4",
"GF5",

"TG2",
"TG3",
"TG4",
"TG5",
"TG6",
"TG7",

"SMI",

"CF분위기로",

"HIP1",
"HIP2",
"HIP3"

];


/* ==========================================
   상태 후보
========================================== */

const NORMAL_STATES = [

"승온",
"유지",
"냉각"

];


const HIP_STATES = [

"승온",
"유지",
"가압",
"냉각"

];


/* ==========================================
   이미지 로드
========================================== */

function loadImage(file){

return new Promise(
(resolve,reject) => {

const image =
new Image();

const url =
URL.createObjectURL(file);

image.onload =
() => {

resolve({
image,
url
});

};

image.onerror =
reject;

image.src =
url;

}
);

}


/* ==========================================
   진행상태
========================================== */

function setStatus(
text,
percent
){

$("statusBox")
.classList
.remove("hidden");


$("statusText")
.textContent =
text;


if(
typeof percent === "number"
){

$("progressBar")
.style.width =
Math.max(
0,
Math.min(
100,
percent
)
) + "%";

}

}


/* ==========================================
   OCR Worker
========================================== */

async function getWorker(){

if(OCRWorker){

return OCRWorker;

}


setStatus(
"OCR 엔진 준비중...",
5
);


OCRWorker =
await Tesseract.createWorker(

"kor+eng",

1,

{

logger:
message => {

if(
message.progress != null &&
message.status
){

const progress =
Math.round(
message.progress * 100
);

$("statusText")
.textContent =
`${message.status} ${progress}%`;

}

}

}
);


return OCRWorker;

}


/* ==========================================
   문자열 정리
========================================== */

function cleanText(text){

return String(
text || ""
)

.replace(
/[\r\n]+/g,
" "
)

.replace(
/[|]/g,
"I"
)

.replace(
/[‐-–—]/g,
"-"
)

.replace(
/\s+/g,
" "
)

.trim();

}


function compactText(text){

return cleanText(text)
.replace(/\s/g,"");

}


/* ==========================================
   Levenshtein 거리

   상태 OCR이 조금 틀려도
   승온 / 유지 / 냉각 / 가압 중
   가장 가까운 단어 선택
========================================== */

function levenshtein(
a,
b
){

a =
String(a || "");

b =
String(b || "");


const matrix =
Array.from(
{
length:
b.length + 1
},
() =>
Array(
a.length + 1
).fill(0)
);


for(
let i = 0;
i <= b.length;
i++
){

matrix[i][0] = i;

}


for(
let j = 0;
j <= a.length;
j++
){

matrix[0][j] = j;

}


for(
let i = 1;
i <= b.length;
i++
){

for(
let j = 1;
j <= a.length;
j++
){

const cost =
b[i - 1] ===
a[j - 1]
?
0
:
1;


matrix[i][j] =
Math.min(

matrix[i - 1][j] + 1,

matrix[i][j - 1] + 1,

matrix[i - 1][j - 1] + cost

);

}

}


return matrix[b.length][a.length];

}


function closestState(
raw,
equipment
){

const text =
compactText(raw);


if(!text){

return {
state:"",
confidence:0
};

}


let candidates =
NORMAL_STATES;


if(
/^HIP[123]$/.test(
equipment
)
){

candidates =
HIP_STATES;

}


/*
정확한 단어가 포함되어 있으면
즉시 확정
*/

for(
const candidate
of candidates
){

if(
text.includes(candidate)
){

return {

state:
candidate + "중",

confidence:
1

};

}

}


/*
OCR 결과의 한글 조각들과
허용 후보를 비교
*/

const fragments =
text.match(
/[가-힣]{1,5}/g
) || [];


let best = null;


for(
const fragment
of fragments
){

for(
const candidate
of candidates
){

const distance =
levenshtein(
fragment,
candidate
);


const score =
1 -
distance /
Math.max(
fragment.length,
candidate.length
);


if(
!best ||
score > best.score
){

best = {

candidate,
score

};

}

}

}


if(
best &&
best.score >= .45
){

return {

state:
best.candidate + "중",

confidence:
best.score

};

}


return {

state:"",
confidence:0

};

}


/* ==========================================
   장비번호 추출
========================================== */

function extractEquipmentNumber(
raw
){

let text =
cleanText(raw);


/*
OCR에서 #, -, 공백 등이
깨지는 경우를 허용
*/

let match =
text.match(
/#?\s*26\s*[-~_.]?\s*(\d{1,3})/
);


if(match){

return (
"#26-" +
match[1]
);

}


/*
예: 26149 형태로 붙어버린 경우
*/

match =
text.match(
/\b26(\d{2,3})\b/
);


if(match){

return (
"#26-" +
match[1]
);

}


return "";

}


/* ==========================================
   온도 추출

   온도 셀만 잘라낸 뒤 사용하므로
   0~2000 숫자만 허용
========================================== */

function extractTemperature(
raw
){

const text =
cleanText(raw)

.replace(
/[Oo]/g,
"0"
)

.replace(
/[lI|]/g,
"1"
);


const matches =
[
...text.matchAll(
/\d{1,4}/g
)
];


for(
const match
of matches
){

const value =
Number(
match[0]
);


if(
Number.isFinite(value) &&
value >= 0 &&
value <= 2000
){

return value;

}

}


return null;

}


/* ==========================================
   비고 제외 판독
========================================== */

function isUnloadWaiting(
raw
){

const text =
compactText(raw);


return (

text.includes(
"언로딩대기"
)

||

(
text.includes("언로딩") &&
text.includes("대기")
)

);

}
  /* ==========================================
   Canvas에 이미지 로드

   너무 큰 아이폰 사진은
   브라우저 메모리를 많이 사용하므로
   분석용 최대 크기로 축소
========================================== */

function imageToCanvas(
image,
canvas,
maxSide = 1800
){

const originalWidth =
image.naturalWidth ||
image.width;

const originalHeight =
image.naturalHeight ||
image.height;


const scale =
Math.min(
1,
maxSide /
Math.max(
originalWidth,
originalHeight
)
);


const width =
Math.round(
originalWidth * scale
);

const height =
Math.round(
originalHeight * scale
);


canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.clearRect(
0,
0,
width,
height
);


ctx.drawImage(
image,
0,
0,
width,
height
);


return {

width,
height,
scale

};

}


/* ==========================================
   OpenCV Mat → Canvas
========================================== */

function matToCanvas(
mat,
canvas
){

canvas.width =
mat.cols;

canvas.height =
mat.rows;

cv.imshow(
canvas,
mat
);

}


/* ==========================================
   네 점 순서 정렬

   반환 순서:
   좌상 / 우상 / 우하 / 좌하
========================================== */

function orderPoints(
points
){

const pts =
points.map(
point => ({
x:point.x,
y:point.y
})
);


const sums =
pts.map(
point =>
point.x + point.y
);


const diffs =
pts.map(
point =>
point.y - point.x
);


const topLeft =
pts[
sums.indexOf(
Math.min(...sums)
)
];


const bottomRight =
pts[
sums.indexOf(
Math.max(...sums)
)
];


const topRight =
pts[
diffs.indexOf(
Math.min(...diffs)
)
];


const bottomLeft =
pts[
diffs.indexOf(
Math.max(...diffs)
)
];


return [

topLeft,
topRight,
bottomRight,
bottomLeft

];

}


/* ==========================================
   윤곽선에서 4개 점 추출
========================================== */

function contourPoints(
approx
){

const points = [];


for(
let i = 0;
i < approx.rows;
i++
){

const x =
approx.intPtr(
i,
0
)[0];


const y =
approx.intPtr(
i,
0
)[1];


points.push({
x,
y
});

}


return points;

}


/* ==========================================
   순찰일지 장비표 검출

   사진 전체 종이가 아니라
   1~35 장비 행이 들어있는
   큰 표 영역을 우선 탐색한다.

   실패하면 안전하게
   하단 영역을 사용하고
   결과를 "확인 필요"로 처리할 수 있게 한다.
========================================== */

function detectPatrolTable(
sourceCanvas
){

if(!cvLoaded){

return {

canvas:
sourceCanvas,

detected:false

};

}


let src = null;
let gray = null;
let blur = null;
let edges = null;
let contours = null;
let hierarchy = null;

let bestApprox = null;

let bestArea = 0;


try{

src =
cv.imread(
sourceCanvas
);


gray =
new cv.Mat();


cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);


blur =
new cv.Mat();


cv.GaussianBlur(
gray,
blur,
new cv.Size(
5,
5
),
0
);


edges =
new cv.Mat();


cv.Canny(
blur,
edges,
45,
130
);


const kernel =
cv.getStructuringElement(
cv.MORPH_RECT,
new cv.Size(
5,
5
)
);


cv.morphologyEx(
edges,
edges,
cv.MORPH_CLOSE,
kernel
);


kernel.delete();


contours =
new cv.MatVector();


hierarchy =
new cv.Mat();


cv.findContours(
edges,
contours,
hierarchy,
cv.RETR_LIST,
cv.CHAIN_APPROX_SIMPLE
);


const imageArea =
src.cols *
src.rows;


for(
let i = 0;
i < contours.size();
i++
){

const contour =
contours.get(i);


const area =
cv.contourArea(
contour
);


if(
area <
imageArea * .12
){

contour.delete();

continue;

}


if(
area >
imageArea * .95
){

contour.delete();

continue;

}


const perimeter =
cv.arcLength(
contour,
true
);


const approx =
new cv.Mat();


cv.approxPolyDP(
contour,
approx,
perimeter * .02,
true
);


if(
approx.rows === 4 &&
area > bestArea
){

if(bestApprox){

bestApprox.delete();

}


bestApprox =
approx.clone();

bestArea =
area;

}


approx.delete();

contour.delete();

}


if(!bestApprox){

throw new Error(
"TABLE_NOT_FOUND"
);

}


const ordered =
orderPoints(
contourPoints(
bestApprox
)
);


const [
tl,
tr,
br,
bl
] = ordered;


const widthTop =
Math.hypot(
tr.x - tl.x,
tr.y - tl.y
);


const widthBottom =
Math.hypot(
br.x - bl.x,
br.y - bl.y
);


const heightLeft =
Math.hypot(
bl.x - tl.x,
bl.y - tl.y
);


const heightRight =
Math.hypot(
br.x - tr.x,
br.y - tr.y
);


const targetWidth =
Math.max(
900,
Math.round(
Math.max(
widthTop,
widthBottom
)
)
);


const targetHeight =
Math.max(
1200,
Math.round(
Math.max(
heightLeft,
heightRight
)
)
);


const srcTri =
cv.matFromArray(
4,
1,
cv.CV_32FC2,
[
tl.x,tl.y,
tr.x,tr.y,
br.x,br.y,
bl.x,bl.y
]
);


const dstTri =
cv.matFromArray(
4,
1,
cv.CV_32FC2,
[
0,0,
targetWidth - 1,0,
targetWidth - 1,targetHeight - 1,
0,targetHeight - 1
]
);


const transform =
cv.getPerspectiveTransform(
srcTri,
dstTri
);


const warped =
new cv.Mat();


cv.warpPerspective(
src,
warped,
transform,
new cv.Size(
targetWidth,
targetHeight
),
cv.INTER_LINEAR,
cv.BORDER_REPLICATE
);


const canvas =
document.createElement(
"canvas"
);


matToCanvas(
warped,
canvas
);


srcTri.delete();
dstTri.delete();
transform.delete();
warped.delete();


return {

canvas,
detected:true

};


}catch(error){

console.warn(
"순찰일지 표 자동 검출 실패",
error
);


/*
자동 검출 실패 시
사진 전체에서 장비표가 존재하는
하단 약 68%를 임시 사용한다.

이 경우 OCR 결과를 그대로 확정하지 않고
낮은 신뢰도로 취급한다.
*/

const fallback =
document.createElement(
"canvas"
);


const width =
sourceCanvas.width;


const startY =
Math.round(
sourceCanvas.height * .31
);


const height =
sourceCanvas.height -
startY;


fallback.width =
width;

fallback.height =
height;


fallback
.getContext(
"2d"
)
.drawImage(

sourceCanvas,

0,
startY,
width,
height,

0,
0,
width,
height

);


return {

canvas:
fallback,

detected:false

};


}finally{

if(bestApprox){
bestApprox.delete();
}

if(src){
src.delete();
}

if(gray){
gray.delete();
}

if(blur){
blur.delete();
}

if(edges){
edges.delete();
}

if(contours){
contours.delete();
}

if(hierarchy){
hierarchy.delete();
}

}

}


/* ==========================================
   표 내부 가로선 탐색

   35행을 단순 균등분할하기 전에
   실제 가로선 위치를 찾아 사용한다.
========================================== */

function detectHorizontalLines(
canvas
){

if(!cvLoaded){

return [];

}


let src = null;
let gray = null;
let binary = null;
let horizontal = null;


try{

src =
cv.imread(
canvas
);


gray =
new cv.Mat();


cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);


binary =
new cv.Mat();


cv.adaptiveThreshold(
gray,
binary,
255,
cv.ADAPTIVE_THRESH_MEAN_C,
cv.THRESH_BINARY_INV,
21,
10
);


horizontal =
binary.clone();


const horizontalSize =
Math.max(
20,
Math.floor(
horizontal.cols / 12
)
);


const kernel =
cv.getStructuringElement(
cv.MORPH_RECT,
new cv.Size(
horizontalSize,
1
)
);


cv.erode(
horizontal,
horizontal,
kernel
);


cv.dilate(
horizontal,
horizontal,
kernel
);


kernel.delete();


const lines = [];


/*
각 y좌표에서 흰 픽셀 비율 계산
*/

for(
let y = 0;
y < horizontal.rows;
y++
){

let count = 0;


for(
let x = 0;
x < horizontal.cols;
x += 4
){

if(
horizontal.ucharPtr(
y,
x
)[0] > 0
){

count++;

}

}


const ratio =
count /
Math.ceil(
horizontal.cols / 4
);


if(
ratio > .34
){

lines.push(y);

}

}


/*
두꺼운 선이 여러 y로 잡히므로
서로 가까운 값은 하나로 병합
*/

const merged = [];


for(
const y
of lines
){

const last =
merged[
merged.length - 1
];


if(
last == null ||
y - last > 5
){

merged.push(y);

}else{

merged[
merged.length - 1
] =
Math.round(
(last + y) / 2
);

}

}


return merged;


}catch(error){

console.warn(
"가로선 탐색 실패",
error
);

return [];


}finally{

if(src){
src.delete();
}

if(gray){
gray.delete();
}

if(binary){
binary.delete();
}

if(horizontal){
horizontal.delete();
}

}

}


/* ==========================================
   실제 35행 경계 계산

   가로선이 충분히 검출되면 사용.
   아니면 35행 균등분할.

   사용안함 행도 여기서 절대 삭제하지 않는다.
========================================== */

function build35Rows(
tableCanvas
){

const detectedLines =
detectHorizontalLines(
tableCanvas
);


/*
장비표에는 최소 36개의 행 경계가 필요.
가로선이 너무 많을 경우
간격이 일정한 36개를 골라낸다.
*/

if(
detectedLines.length >= 36
){

let best = null;


/*
연속 36개 선 조합 중
행 간격 편차가 가장 작은 구간 선택
*/

for(
let start = 0;
start <=
detectedLines.length - 36;
start++
){

const candidate =
detectedLines.slice(
start,
start + 36
);


const gaps = [];


for(
let i = 1;
i < candidate.length;
i++
){

gaps.push(
candidate[i] -
candidate[i - 1]
);

}


const mean =
gaps.reduce(
(a,b) => a + b,
0
) /
gaps.length;


const variance =
gaps.reduce(
(sum,value) =>
sum +
Math.pow(
value - mean,
2
),
0
) /
gaps.length;


const coverage =
candidate[35] -
candidate[0];


const score =
variance -
coverage * .0005;


if(
!best ||
score < best.score
){

best = {

lines:
candidate,

score

};

}

}


if(best){

const rows = [];


for(
let i = 0;
i < 35;
i++
){

rows.push({

row:
i + 1,

top:
best.lines[i],

bottom:
best.lines[i + 1]

});

}


return {

rows,
lineDetected:true

};

}

}


/*
Fallback:
현재 보정된 표 전체 높이를
35행으로 균등 분할
*/

const rows = [];


const rowHeight =
tableCanvas.height /
35;


for(
let i = 0;
i < 35;
i++
){

rows.push({

row:
i + 1,

top:
Math.round(
i * rowHeight
),

bottom:
Math.round(
(i + 1) *
rowHeight
)

});

}


return {

rows,
lineDetected:false

};

}


/* ==========================================
   Canvas 영역 자르기
========================================== */

function cropCanvasByRatio(
source,
x1,
y1,
x2,
y2
){

x1 =
Math.max(
0,
Math.min(
1,
x1
)
);


x2 =
Math.max(
0,
Math.min(
1,
x2
)
);


y1 =
Math.max(
0,
Math.min(
1,
y1
)
);


y2 =
Math.max(
0,
Math.min(
1,
y2
)
);


const sx =
Math.round(
source.width * x1
);


const sy =
Math.round(
source.height * y1
);


const sw =
Math.max(
1,
Math.round(
source.width *
(x2 - x1)
)
);


const sh =
Math.max(
1,
Math.round(
source.height *
(y2 - y1)
)
);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
sw;

canvas.height =
sh;


canvas
.getContext(
"2d",
{
willReadFrequently:true
}
)
.drawImage(

source,

sx,
sy,
sw,
sh,

0,
0,
sw,
sh

);


return canvas;

}


/* ==========================================
   특정 행 + 열 비율 자르기
========================================== */

function cropRowCell(
tableCanvas,
rowInfo,
x1,
x2,
padding = .08
){

const height =
rowInfo.bottom -
rowInfo.top;


const top =
Math.max(
0,
rowInfo.top +
height * padding
);


const bottom =
Math.min(
tableCanvas.height,
rowInfo.bottom -
height * padding
);


const x =
Math.round(
tableCanvas.width *
x1
);


const width =
Math.max(
1,
Math.round(
tableCanvas.width *
(x2 - x1)
)
);


const y =
Math.round(top);


const cropHeight =
Math.max(
1,
Math.round(
bottom - top
)
);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
width;

canvas.height =
cropHeight;


canvas
.getContext(
"2d",
{
willReadFrequently:true
}
)
.drawImage(

tableCanvas,

x,
y,
width,
cropHeight,

0,
0,
width,
cropHeight

);


return canvas;

}


/* ==========================================
   OCR용 이미지 전처리

   작은 손글씨를 3배 확대하고
   흑백 대비를 강화한다.
========================================== */

function preprocessForOCR(
sourceCanvas,
mode = "text"
){

const scale = 3;


const enlarged =
document.createElement(
"canvas"
);


enlarged.width =
Math.max(
1,
sourceCanvas.width *
scale
);


enlarged.height =
Math.max(
1,
sourceCanvas.height *
scale
);


const enlargedCtx =
enlarged.getContext(
"2d",
{
willReadFrequently:true
}
);


enlargedCtx.imageSmoothingEnabled =
false;


enlargedCtx.drawImage(

sourceCanvas,

0,
0,
sourceCanvas.width,
sourceCanvas.height,

0,
0,
enlarged.width,
enlarged.height

);


if(!cvLoaded){

return enlarged;

}


let src = null;
let gray = null;
let binary = null;


try{

src =
cv.imread(
enlarged
);


gray =
new cv.Mat();


cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);


binary =
new cv.Mat();


if(
mode === "number"
){

cv.threshold(
gray,
binary,
0,
255,
cv.THRESH_BINARY +
cv.THRESH_OTSU
);

}else{

cv.adaptiveThreshold(
gray,
binary,
255,
cv.ADAPTIVE_THRESH_GAUSSIAN_C,
cv.THRESH_BINARY,
31,
12
);

}


const output =
document.createElement(
"canvas"
);


matToCanvas(
binary,
output
);


return output;


}catch(error){

console.warn(
"OCR 전처리 실패",
error
);

return enlarged;


}finally{

if(src){
src.delete();
}

if(gray){
gray.delete();
}

if(binary){
binary.delete();
}

}

}


/* ==========================================
   Canvas OCR
========================================== */

async function recognizeCanvas(
canvas,
mode = "text"
){

const worker =
await getWorker();


const processed =
preprocessForOCR(
canvas,
mode
);


const options = {};


/*
한 셀 안의 한 줄/단어를 읽는 데
적합한 PSM 사용
*/

options.tessedit_pageseg_mode =
Tesseract.PSM.SINGLE_LINE;


if(
mode === "number"
){

options.tessedit_char_whitelist =
"0123456789#-";

}


const result =
await worker.recognize(
processed,
options
);


return {

text:
cleanText(
result.data.text
),

confidence:
Number(
result.data.confidence || 0
)

};

}


/* ==========================================
   순찰일지 열 위치

   사진을 표로 보정한 뒤의 비율.

   장비명은 행 확인용.
   온도 / 상태 / 비고만 실제 보고에 사용.

   이 값은 실제 테스트 사진에서
   미세 조정할 수 있도록 한곳에 모아둔다.
========================================== */

const PATROL_COLUMNS = {

equipment:[
.055,
.185
],

temperature:[
.335,
.435
],

state:[
.735,
.855
],

remark:[
.850,
.995
]

};


/* ==========================================
   행 장비명 OCR 보조 확인

   위치 고정이 기본이고,
   인쇄 장비명 OCR은 행이 크게 틀어진 경우를
   감지하는 보조수단으로만 사용.
========================================== */

function normalizeEquipmentName(
raw
){

const text =
compactText(raw)
.toUpperCase();


let match =
text.match(
/TG([2-7])/
);


if(match){

return (
"TG" +
match[1]
);

}


match =
text.match(
/GF(1|3|4|5)/
);


if(match){

return (
"GF" +
match[1]
);

}


match =
text.match(
/CF([1-6])/
);


if(match){

return (
"CF" +
match[1]
);

}


match =
text.match(
/HIP[-]?([123])/
);


if(match){

return (
"HIP" +
match[1]
);

}


if(
text.includes(
"SMI"
)
){

return "SMI";

}


if(
raw.includes(
"분위기"
)
){

return "CF분위기로";

}


return "";

}


/* ==========================================
   순찰일지 한 행 분석
========================================== */

async function analyzePatrolRow(
tableCanvas,
rowInfo,
equipment,
tableReliable
){

const tempCell =
cropRowCell(

tableCanvas,
rowInfo,

PATROL_COLUMNS.temperature[0],
PATROL_COLUMNS.temperature[1]

);


const stateCell =
cropRowCell(

tableCanvas,
rowInfo,

PATROL_COLUMNS.state[0],
PATROL_COLUMNS.state[1]

);


const remarkCell =
cropRowCell(

tableCanvas,
rowInfo,

PATROL_COLUMNS.remark[0],
PATROL_COLUMNS.remark[1]

);


const tempOCR =
await recognizeCanvas(
tempCell,
"number"
);


const temperature =
extractTemperature(
tempOCR.text
);


let state = "";

let stateConfidence = 0;


/*
드라이챔버 / 소각기는
상태가 필요 없다.
*/

const temperatureOnly =

equipment ===
"구형드라이챔버"

||

equipment ===
"신형드라이챔버"

||

equipment ===
"1동소각기"

||

equipment ===
"3동소각기";


let stateOCR = {
text:"",
confidence:100
};


if(!temperatureOnly){

stateOCR =
await recognizeCanvas(
stateCell,
"text"
);


const stateResult =
closestState(
stateOCR.text,
equipment
);


state =
stateResult.state;

stateConfidence =
stateResult.confidence;

}


const remarkOCR =
await recognizeCanvas(
remarkCell,
"text"
);


const unloadWaiting =
isUnloadWaiting(
remarkOCR.text
);


/*
확인 필요 판정

드라이챔버/소각기는
온도만 확인.

일반 장비는
온도 + 상태가 모두 있어야 함.
*/

let check = false;


if(
temperature === null
){

check = true;

}


if(
!temperatureOnly &&
!state
){

check = true;

}


if(!tableReliable){

check = true;

}


return {

equipment,

temperature,

state,

remark:
remarkOCR.text,

unloadWaiting,

check,

ocr:{

temperature:
tempOCR.text,

state:
stateOCR.text,

remark:
remarkOCR.text,

stateConfidence

}

};

}

async function analyzePatrol(

){

15
);


const tableResult =
detectPatrolTable(
source
);


const rowResult =
build35Rows(
tableResult.canvas
);


const tableReliable =
tableResult.detected &&
rowResult.lineDetected;


const rows =
rowResult.rows;


const mapping =
getPatrolRows();


const output = {};


const targetRows =
Object.keys(
mapping
)

.map(Number)

.sort(

);


let completed = 0;


for(
const rowNumber
of targetRows
){

];

const percent =

] =

tableDetected:

linesDetected:
rowResult.lineDetected

};

}


/* ==========================================
   사진2 장비번호표 전처리

   사진2는 세로 목록이고
   장비 순서가 위에서부터 고정.

   먼저 실제 내용이 있는 영역을 찾고
   24개 장비 행으로 나눈다.
========================================== */

function prepareNumberSheet(
sourceCanvas
){

/*
사진 가장자리 여백 제거.

실제 테스트 후 필요하면
이 네 값만 조정하면 된다.
*/

const cropped =
cropCanvasByRatio(

sourceCanvas,

.04,
.06,

.96,
.96

);


return cropped;

}


/* ==========================================
   사진2 행 계산

   우선 가로선 검출.
   충분하지 않으면 24등분.
========================================== */

function buildNumberRows(
canvas
){

const lines =
detectHorizontalLines(
canvas
);


if(
lines.length >=
NUMBER_ROWS.length + 1
){

let best = null;


const needed =
NUMBER_ROWS.length + 1;


for(
let start = 0;
start <=
lines.length - needed;
start++
){

const candidate =
lines.slice(
start,
start + needed
);


const gaps = [];


for(
let i = 1;
i < candidate.length;
i++
){

gaps.push(
candidate[i] -
candidate[i - 1]
);

}


const mean =
gaps.reduce(
(a,b) => a + b,
0
) /
gaps.length;


const variance =
gaps.reduce(
(sum,value) =>
sum +
Math.pow(
value - mean,
2
),
0
) /
gaps.length;


if(
!best ||
variance < best.variance
){

best = {

lines:
candidate,

variance

};

}

}


if(best){

return NUMBER_ROWS.map(
(_,index) => ({

row:
index + 1,

top:
best.lines[index],

bottom:
best.lines[index + 1]

})
);

}

}


/*
Fallback
*/

const rowHeight =
canvas.height /
NUMBER_ROWS.length;


return NUMBER_ROWS.map(
(_,index) => ({

row:
index + 1,

top:
Math.round(
index *
rowHeight
),

bottom:
Math.round(
(index + 1) *
rowHeight
)

})
);

}


/* ==========================================
   사진2 열

   왼쪽 = 장비명
   가운데 = 26-xxx 번호
   오른쪽 = 가동 여부

   번호는 매번 OCR.
   절대 고정값 사용하지 않는다.
========================================== */

const NUMBER_COLUMNS = {

equipment:[
0,
.35
],

number:[
.30,
.72
],

running:[
.67,
1
]

};


/* ==========================================
   가동 여부 판정
========================================== */

function isRunningText(
raw
){

const text =
compactText(raw);


if(!text){

return false;

}


/*
"가동" 직접 인식
*/

if(
text.includes(
"가동"
)
){

return true;

}


/*
번호가 있는데 가동 글씨 OCR이
약간 깨진 경우를 위한 제한적 보정.
*/

const korean =
text.match(
/[가-힣]{1,4}/g
) || [];


for(
const fragment
of korean
){

const distance =
levenshtein(
fragment,
"가동"
);


if(
distance <= 1
){

return true;

}

}


return false;

}


/* ==========================================
   사진2 한 행 분석
========================================== */

async function analyzeNumberRow(
sheetCanvas,
rowInfo,
equipment
){

const numberCell =
cropRowCell(

sheetCanvas,
rowInfo,

NUMBER_COLUMNS.number[0],
NUMBER_COLUMNS.number[1],

.05

);


const runningCell =
cropRowCell(

sheetCanvas,
rowInfo,

NUMBER_COLUMNS.running[0],
NUMBER_COLUMNS.running[1],

.05

);


const numberOCR =
await recognizeCanvas(
numberCell,
"number"
);


const number =
extractEquipmentNumber(
numberOCR.text
);


const runningOCR =
await recognizeCanvas(
runningCell,
"text"
);


const running =
isRunningText(
runningOCR.text
);


return {

equipment,

number,

running,

ocr:{

number:
numberOCR.text,

running:
runningOCR.text

}

};

}

   사진2 전체 분석

async function analyzeNumberSheet(

/* ==========================================
   일반 장비 제외 판정

   확정 규칙:

   번호 없음 → 제외
   가동 아님 → 제외
   온도 없음 → 제외
   상태 없음 → 제외

   100도 이하 + 냉각 → 제외

   비고 언로딩대기 → 제외

   HIP 냉각 → 제외
========================================== */

function exclusionReason(
patrol,
number
){

if(!number){

return "장비번호 확인 안 됨";

}


if(!number.number){

return "장비번호 없음";

}


if(!number.running){

return "가동 확인 안 됨";

}


if(!patrol){

return "순찰일지 값 없음";

}


if(
patrol.temperature === null
){

return "온도 없음";

}


if(
!patrol.state
){

return "상태 없음";

}


if(
patrol.unloadWaiting
){

return "언로딩대기";

}


if(
/^HIP[123]$/.test(
patrol.equipment
) &&
patrol.state ===
"냉각중"
){

return "HIP 냉각";

}


if(
patrol.temperature <= 100 &&
patrol.state ===
"냉각중"
){

return "100도 이하 냉각";

}


return "";

}


/* ==========================================
   두 사진 결과 합치기
========================================== */

function mergeResults(
patrolResult,
numberResult
){

const included = [];

const excluded = [];


for(
const equipment
of REPORT_ORDER
){

const patrol =
patrolResult.items[
equipment
];


const number =
numberResult[
equipment
];


const reason =
exclusionReason(
patrol,
number
);


if(reason){

excluded.push({

equipment,

reason,

patrol:
patrol || null,

number:
number || null

});

continue;

}


/*
자동으로 확정하기 애매한 OCR은
최종 보고서에 넣지 않고
확인 필요로 표시한다.
*/

if(
patrol.check
){

excluded.push({

equipment,

reason:
"확인 필요",

patrol,

number

});

continue;

}


included.push({

equipment,

number:
number.number,

temperature:
patrol.temperature,

state:
patrol.state

});

}


/* ==========================================
   TG1

   순찰일지에는 아직 없음.

   사진2에서
   번호 있음 + 가동이면
   번호와 장비명만 표시.
========================================== */

const tg1 =
numberResult[
"TG1"
];


let tg1Item = null;


if(
tg1 &&
tg1.number &&
tg1.running
){

tg1Item = {

equipment:
"TG1",

number:
tg1.number

};

}


/* ==========================================
   드라이챔버

   번호 없음.
   상태 없음.
   온도가 실제로 읽힌 경우만 사용.
========================================== */

const dry = [];


for(
const equipment
of [
"구형드라이챔버",
"신형드라이챔버"
]
){

const item =
patrolResult.items[
equipment
];


if(
item &&
item.temperature !== null
){

dry.push({

equipment,

temperature:
item.temperature,

check:
item.check

});

}

}


/* ==========================================
   소각기

   26 / 27행에서 온도만 읽음.
========================================== */

const incinerators = [];


for(
const equipment
of [
"1동소각기",
"3동소각기"
]
){

const item =
patrolResult.items[
equipment
];


if(
item &&
item.temperature !== null
){

incinerators.push({

equipment,

temperature:
item.temperature,

check:
item.check

});

}

}


return {

included,

excluded,

tg1:
tg1Item,

dry,

incinerators

};

}

/* ==========================================
   보고서 생성 버튼
========================================== */

$("reportBtn")
.onclick =
() => {

const report =
buildReport();


$("report")
.value =
report;


$("reportCard")
.classList
.remove(
"hidden"
);


$("reportCard")
.scrollIntoView({

behavior:"smooth",
block:"start"

});

};


/* ==========================================
   전체 복사
========================================== */

$("copyBtn")
.onclick =
async () => {

const text =
$("report").value;


if(!text){

return;

}


try{

await navigator.clipboard.writeText(
text
);


const old =
$("copyBtn")
.textContent;


$("copyBtn")
.textContent =
"복사 완료";


setTimeout(
() => {

$("copyBtn")
.textContent =
old;

},
1200
);


}catch(error){

/*
iOS Safari에서 Clipboard API가
차단되는 경우를 위한 fallback
*/

$("report").focus();

$("report").select();


try{

document.execCommand(
"copy"
);


$("copyBtn")
.textContent =
"복사 완료";


setTimeout(
() => {

$("copyBtn")
.textContent =
"전체 복사";

},
1200
);


}catch(copyError){

alert(
"자동 복사가 차단되었습니다. 보고서 내용을 길게 눌러 복사해주세요."
);

}

}

};


/* ==========================================
   페이지 종료 시 OCR Worker 정리
========================================== */

window.addEventListener(
"pagehide",
async () => {

if(OCRWorker){

try{

await OCRWorker.terminate();

}catch(error){

console.warn(error);

}

OCRWorker = null;

}

}
);
