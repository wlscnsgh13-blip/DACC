/* =========================================================
   TG1 판정

   사진1에는 TG1 없음.

   사진2:
   번호 + 가동만 사용.

   OCR 실패 = 확인필요
   명확한 비가동 = 제외
========================================================= */

function daccProcessTG1(
  numberResult
) {

  const item =
    numberResult
      .items?.TG1;


  if (!item) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "교대 업무일지 확인 필요"
    );
  }


  if (
    !item.number ||
    item.numberAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "번호 확인 필요",

      {
        number:
          item.number || "",

        rawNumber:
          item
      }
    );
  }


  if (
    item.runningAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "가동 여부 판독 충돌",

      {
        number:
          item.number,

        rawNumber:
          item
      }
    );
  }


  if (
    item.running ===
    null ||
    item.running ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "가동 여부 확인 필요",

      {
        number:
          item.number,

        rawNumber:
          item
      }
    );
  }


  if (
    item.running ===
    false
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      "TG1",

      "비가동",

      {
        number:
          item.number
      }
    );
  }


  return daccDecision(

    DACC_STATUS.CONFIRMED,

    "TG1",

    "",

    {
      number:
        item.number
    }
  );
}


/* =========================================================
   CF분위기로

   사진1 18행
   사진2 22행

   번호 + 가동 + 온도 + 상태

   OCR 실패는 확인필요.
========================================================= */

function daccProcessCFFurnace(
  patrolResult,
  numberResult
) {

  const patrol =
    patrolResult
      .items?.[
        "CF분위기로"
      ];


  const number =
    numberResult
      .items?.[
        "CF분위기로"
      ];


  return daccJudgeGeneral(

    "CF분위기로",

    patrol,

    number
  );
}


/* =========================================================
   드라이챔버 판정

   드라이챔버 / 신형드라이챔버

   사진2:
   가동 여부

   사진1:
   온도

   번호 사용하지 않음.
========================================================= */

function daccProcessDry(
  equipment,
  patrolResult,
  numberResult
) {

  const patrol =
    patrolResult
      .items?.[
        equipment
      ];


  const number =
    numberResult
      .items?.[
        equipment
      ];


  if (!number) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "교대 업무일지 확인 필요"
    );
  }


  if (
    number.runningAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 판독 충돌"
    );
  }


  if (
    number.running ===
    null ||
    number.running ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 확인 필요"
    );
  }


  if (
    number.running ===
    false
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비가동"
    );
  }


  if (!patrol) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "순찰일지 확인 필요"
    );
  }


  if (
    patrol.temperatureAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 판독 충돌"
    );
  }


  if (
    patrol.temperature ===
    null ||
    patrol.temperature ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 확인 필요"
    );
  }


  return daccDecision(

    DACC_STATUS.CONFIRMED,

    equipment,

    "",

    {
      temperature:
        patrol.temperature
    }
  );
}


/* =========================================================
   소각기 판정

   사진1 전용.
   온도만 사용.
========================================================= */

function daccProcessIncinerator(
  equipment,
  patrolResult
) {

  const item =
    patrolResult
      .items?.[
        equipment
      ];


  if (!item) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "순찰일지 확인 필요"
    );
  }


  if (
    item.temperatureAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 판독 충돌"
    );
  }


  if (
    item.temperature ===
    null ||
    item.temperature ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 확인 필요"
    );
  }


  return daccDecision(

    DACC_STATUS.CONFIRMED,

    equipment,

    "",

    {
      temperature:
        item.temperature
    }
  );
}



/* =========================================================
   장비명 기준 사진1 ↔ 사진2 매핑 조회

   중요:
   두 사진의 같은 배열 index를 직접 연결하지 않는다.
   반드시 EQUIPMENT_MAP의 실제 행번호를 기준으로 찾는다.
========================================================= */

function daccGetMappedPair(
  equipment,
  patrolResult,
  numberResult
) {

  const map =
    EQUIPMENT_MAP?.[equipment] || null;


  if (!map) {

    return {
      equipment,
      patrol: null,
      number: null,
      patrolRow: null,
      numberRow: null
    };
  }


  /*
    items가 정상 생성되어 있으면 장비명으로 우선 조회.
    혹시 items가 없더라도 실제 행번호로 안전하게 fallback.
  */

  const patrol =
    patrolResult?.items?.[equipment]
    ??
    patrolResult?.rows?.[
      map.patrolRow - 1
    ]
    ??
    null;


  const number =
    numberResult?.items?.[equipment]
    ??
    numberResult?.rows?.[
      map.numberRow - 1
    ]
    ??
    null;


  return {
    equipment,
    patrol,
    number,
    patrolRow: map.patrolRow,
    numberRow: map.numberRow
  };
}


/* =========================================================
   전체 결과 병합

   confirmed = 자동 확정
   review    = 확인 필요
   excluded  = 실제 제외
========================================================= */

function daccMergeAll(
  patrolResult,
  numberResult
) {

  const confirmed = [];
  const review = [];
  const excluded = [];


  /*
    일반 장비

    CF분위기로는 별도 처리.
  */

  for (
    const equipment
    of REPORT_ORDER
  ) {

    const pair =
      daccGetMappedPair(

        equipment,

        patrolResult,

        numberResult
      );


    const decision =
      daccJudgeGeneral(

        equipment,

        pair.patrol,

        pair.number
      );


    decision.patrolRow =
      pair.patrolRow;


    decision.numberRow =
      pair.numberRow;


    if (
      decision.status ===
      DACC_STATUS.CONFIRMED
    ) {

      confirmed.push(
        decision
      );

    } else if (
      decision.status ===
      DACC_STATUS.REVIEW
    ) {

      review.push(
        decision
      );

    } else {

      excluded.push(
        decision
      );
    }
  }


  /*
    CF분위기로
  */

  const cfFurnace =
    daccProcessCFFurnace(

      patrolResult,

      numberResult
    );


  if (
    cfFurnace.status ===
    DACC_STATUS.CONFIRMED
  ) {

    confirmed.push(
      cfFurnace
    );

  } else if (
    cfFurnace.status ===
    DACC_STATUS.REVIEW
  ) {

    review.push(
      cfFurnace
    );

  } else {

    excluded.push(
      cfFurnace
    );
  }


  /*
    TG1
  */

  const tg1 =
    daccProcessTG1(
      numberResult
    );


  /*
    드라이챔버
  */

  const dry = {

    confirmed:[],

    review:[],

    excluded:[]
  };


  for (
    const equipment
    of [
      "드라이챔버",
      "신형드라이챔버"
    ]
  ) {

    const decision =
      daccProcessDry(

        equipment,

        patrolResult,

        numberResult
      );


    if (
      decision.status ===
      DACC_STATUS.CONFIRMED
    ) {

      dry.confirmed.push(
        decision
      );

    } else if (
      decision.status ===
      DACC_STATUS.REVIEW
    ) {

      dry.review.push(
        decision
      );

    } else {

      dry.excluded.push(
        decision
      );
    }
  }


  /*
    소각기
  */

  const incinerators = {

    confirmed:[],

    review:[],

    excluded:[]
  };


  for (
    const equipment
    of INCINERATOR_EQUIPMENT
  ) {

    const decision =
      daccProcessIncinerator(

        equipment,

        patrolResult
      );


    if (
      decision.status ===
      DACC_STATUS.CONFIRMED
    ) {

      incinerators
        .confirmed
        .push(
          decision
        );

    } else if (
      decision.status ===
      DACC_STATUS.REVIEW
    ) {

      incinerators
        .review
        .push(
          decision
        );

    } else {

      incinerators
        .excluded
        .push(
          decision
        );
    }
  }


  return {

    confirmed,

    review,

    excluded,

    tg1,

    dry,

    incinerators
  };
}


/* =========================================================
   번호 표시

   #26-14 → 26-14
========================================================= */

function daccDisplayNumber(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /^#/,
    ""
  );
}


/* =========================================================
   확정 결과 카드
========================================================= */

function daccCreateConfirmedRow(
  item
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "result";


  const check =
    document.createElement(
      "div"
    );


  check.className =
    "check";


  check.textContent =
    "✓";


  const content =
    document.createElement(
      "div"
    );


  const main =
    document.createElement(
      "div"
    );


  main.className =
    "main";


  const number =
    item.number
    ?
    daccDisplayNumber(
      item.number
    ) + " "
    :
    "";


  main.textContent =
    number +
    item.equipment;


  const sub =
    document.createElement(
      "div"
    );


  sub.className =
    "sub";


  const details = [];


  if (
    item.temperature !==
    undefined &&
    item.temperature !==
    null
  ) {

    details.push(
      item.temperature +
      "도"
    );
  }


  if (item.state) {

    details.push(
      item.state
    );
  }


  if (
    !details.length
  ) {

    details.push(
      "가동 확인"
    );
  }


  sub.textContent =
    details.join(
      " · "
    );


  content.appendChild(
    main
  );


  content.appendChild(
    sub
  );


  const badge =
    document.createElement(
      "div"
    );


  badge.className =
    "badge";


  badge.textContent =
    "확정";


  div.appendChild(
    check
  );


  div.appendChild(
    content
  );


  div.appendChild(
    badge
  );


  return div;
}


/* =========================================================
   확인필요 / 제외 카드
========================================================= */

function daccCreateIssueRow(
  item,
  type
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "excludedItem";


  const title =
    document.createElement(
      "b"
    );


  const number =
    item.number
    ?
    daccDisplayNumber(
      item.number
    ) + " "
    :
    "";


  title.textContent =
    number +
    (
      item.equipment ||
      "알 수 없음"
    );


  const reason =
    document.createElement(
      "div"
    );


  reason.textContent =
    (
      type ===
      "review"
      ?
      "→ 확인 필요 · "
      :
      "→ 제외 · "
    )
    +
    (
      item.reason ||
      ""
    );


  div.appendChild(
    title
  );


  div.appendChild(
    reason
  );


  return div;
}


/* =========================================================
   사진2 판독 개수
========================================================= */

function daccCountNumberResult(
  numberResult
) {

  let numberCount = 0;

  let runningCount = 0;

  let runningUnknown = 0;


  for (
    const item
    of Object.values(
      numberResult.items ||
      {}
    )
  ) {

    if (
      item.number
    ) {

      numberCount++;
    }


    if (
      item.running ===
      true
    ) {

      runningCount++;
    }


    if (
      item.running ===
      null ||
      item.running ===
      undefined
    ) {

      runningUnknown++;
    }
  }


  return {

    numberCount,

    runningCount,

    runningUnknown
  };
}


/* =========================================================
   사진1 판독 개수
========================================================= */

function daccCountPatrolResult(
  patrolResult
) {

  let temperatureCount = 0;

  let stateCount = 0;


  for (
    const item
    of Object.values(
      patrolResult.items ||
      {}
    )
  ) {

    if (
      item.temperature !==
      null &&
      item.temperature !==
      undefined
    ) {

      temperatureCount++;
    }


    if (
      item.state
    ) {

      stateCount++;
    }
  }


  return {

    temperatureCount,

    stateCount
  };
}


/* =========================================================
   전체 사진 구조 검증

   여기서는 OCR 개별 실패로
   전체 분석을 막지 않는다.

   표 구조 자체가 무너진 경우만 fatal.
========================================================= */

function daccValidate(
  patrolResult,
  numberResult
) {

  const problems = [];


  const patrolCount =
    daccCountPatrolResult(
      patrolResult
    );


  const numberCount =
    daccCountNumberResult(
      numberResult
    );


  /*
    표 매칭률 검사.
  */

  if (
    patrolResult.matchRatio <
    0.45
  ) {

    problems.push(
      "순찰일지 표 위치 확인 필요"
    );
  }


  if (
    numberResult.matchRatio <
    0.45
  ) {

    problems.push(
      "교대 업무일지 표 위치 확인 필요"
    );
  }


  /*
    사진1에서 필요한 값이
    전부 0이면 Crop 자체가 틀린 것.
  */

  if (
    patrolCount.temperatureCount ===
    0 &&
    patrolCount.stateCount ===
    0
  ) {

    problems.push(
      "순찰일지 셀 위치 인식 실패"
    );
  }


  /*
    사진2 번호와 가동이
    둘 다 하나도 안 잡힌 경우.
  */

  if (
    numberCount.numberCount ===
    0 &&
    numberCount.runningCount ===
    0
  ) {

    problems.push(
      "교대 업무일지 가동여부 열 인식 실패"
    );
  }


  return {

    valid:
      problems.length ===
      0,

    problems,

    patrolCount,

    numberCount
  };
}


/* =========================================================
   결과 화면
========================================================= */

function daccRenderResult(
  patrolResult,
  numberResult,
  merged,
  validation
) {

  const resultCard =
    daccEl(
      "resultCard"
    );


  const results =
    daccEl(
      "results"
    );


  const excluded =
    daccEl(
      "excluded"
    );


  if (results) {

    results.innerHTML =
      "";
  }


  if (excluded) {

    excluded.innerHTML =
      "";
  }


  /*
    사진1 상태
  */

  const patrolStatus =
    daccEl(
      "patrolStatus"
    );


  if (patrolStatus) {

    patrolStatus
      .classList
      .remove(
        "hidden"
      );


    patrolStatus.textContent =
      `사진 1 · 고정행 35 · ` +
      `온도 ${validation.patrolCount.temperatureCount} · ` +
      `상태 ${validation.patrolCount.stateCount}`;
  }


  /*
    사진2 상태
  */

  const numberStatus =
    daccEl(
      "numberStatus"
    );


  if (numberStatus) {

    numberStatus
      .classList
      .remove(
        "hidden"
      );


    numberStatus.textContent =
      `사진 2 · 고정행 24 · ` +
      `번호 ${validation.numberCount.numberCount} · ` +
      `가동 ${validation.numberCount.runningCount}`;
  }


  /*
    확정 일반장비
  */

  if (results) {

    for (
      const item
      of merged.confirmed
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          item
        )
      );
    }


    /*
      TG1 확정
    */

    if (
      merged.tg1.status ===
      DACC_STATUS.CONFIRMED
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          merged.tg1
        )
      );
    }


    /*
      드라이챔버 확정
    */

    for (
      const item
      of merged.dry.confirmed
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          item
        )
      );
    }


    /*
      소각기 확정
    */

    for (
      const item
      of merged
        .incinerators
        .confirmed
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          item
        )
      );
    }


    const totalConfirmed =
      merged.confirmed.length
      +
      (
        merged.tg1.status ===
        DACC_STATUS.CONFIRMED
        ?
        1
        :
        0
      )
      +
      merged.dry
        .confirmed
        .length
      +
      merged.incinerators
        .confirmed
        .length;


    if (
      totalConfirmed ===
      0
    ) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "emptyResult";


      empty.textContent =
        "자동 확정된 장비가 없습니다.";


      results.appendChild(
        empty
      );
    }
  }


  /*
    확인필요 전체
  */

  const allReview = [

    ...merged.review,

    ...merged.dry.review,

    ...merged.incinerators.review

  ];


  if (
    merged.tg1.status ===
    DACC_STATUS.REVIEW
  ) {

    allReview.push(
      merged.tg1
    );
  }


  /*
    실제 제외 전체
  */

  const allExcluded = [

    ...merged.excluded,

    ...merged.dry.excluded,

    ...merged.incinerators.excluded

  ];


  if (
    merged.tg1.status ===
    DACC_STATUS.EXCLUDED
  ) {

    allExcluded.push(
      merged.tg1
    );
  }


  /*
    기존 제외 영역 하나에
    확인필요 + 실제 제외 표시.
  */

  if (excluded) {

    for (
      const item
      of allReview
    ) {

      excluded.appendChild(
        daccCreateIssueRow(
          item,
          "review"
        )
      );
    }


    for (
      const item
      of allExcluded
    ) {

      excluded.appendChild(
        daccCreateIssueRow(
          item,
          "excluded"
        )
      );
    }
  }


  /*
    제외/확인필요 개수
  */

  const excludedCount =
    daccEl(
      "excludedCount"
    );


  if (excludedCount) {

    excludedCount.textContent =
      `확인필요 ${allReview.length} · 제외 ${allExcluded.length}`;
  }


  /*
    표시 개수

function daccSortedConfirmed(
  items
) {

  const order = [

    ...REPORT_ORDER,

    "CF분위기로"

  ];


  return [...items]
    .sort(
      (a,b) => {

        const ai =
          order.indexOf(
            a.equipment
          );


        const bi =
          order.indexOf(
            b.equipment
          );


        return (
          ai -
          bi
        );
      }
    );
}

========================================================= */

function daccBuildReport() {

  if (
    !daccFinalResult ||
    !daccFinalResult
      .validation
      .valid
  ) {

    return "";
  }


  const merged =
    daccFinalResult
      .merged;


  const today =
    daccToday();


  const lines = [];


  /*
    헤더
  */

  lines.push(
    `${today.month}월 ${today.day}일 (${today.weekday}) ${daccWorkName()}근무자`
  );


  lines.push(
    `${daccRank()}입니다.`
  );


  lines.push("");


  /*
    일반장비
  */

  const normal =
    daccSortedConfirmed(
      merged.confirmed
    );


  for (
    const item
    of normal
  ) {

    lines.push(

      `${daccDisplayNumber(
        item.number
      )} ` +

      `${item.equipment} ` +

      `${item.temperature}도 ` +

      `${item.state}`
    );
  }


  /*
    TG1

    사진2 번호 + 가동 확정일 때만.
  */

  if (
    merged.tg1.status ===
    DACC_STATUS.CONFIRMED
  ) {

    lines.push(

      `${daccDisplayNumber(
        merged.tg1.number
      )} TG1`
    );
  }


  /*
    드라이챔버
  */

  if (
    merged.dry
      .confirmed
      .length
  ) {

    lines.push("");


    const dryOrder = [

      "드라이챔버",

      "신형드라이챔버"

    ];


    const sortedDry =
      [
        ...merged.dry
          .confirmed
      ]
      .sort(
        (a,b) =>

          dryOrder.indexOf(
            a.equipment
          )
          -
          dryOrder.indexOf(
            b.equipment
          )
      );


    for (
      const item
      of sortedDry
    ) {

      lines.push(

        `${item.equipment} ` +
        `${item.temperature}도`
      );
    }
  }


  /*
    TG 소각기
  */

  if (
    merged
      .incinerators
      .confirmed
      .length
  ) {

    lines.push("");


    lines.push(
      "-TG소각기-"
    );


    const order = [

      "소각기1동",

      "소각기3동"

    ];


    const sorted =
      [
        ...merged
          .incinerators
          .confirmed
      ]
      .sort(
        (a,b) =>

          order.indexOf(
            a.equipment
          )
          -
          order.indexOf(
            b.equipment
          )
      );


    for (
      const item
      of sorted
    ) {

      const name =
        item.equipment ===
        "소각기1동"
        ?
        "1동"
        :
        "3동";


      lines.push(

        `${name} ` +
        `${item.temperature}도`
      );
    }
  }


  return lines.join(
    "\n"
  );
}

function daccVisionImageDataURL(img){
  const maxSide=2200;
  const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
  const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
  const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const x=c.getContext("2d",{alpha:false});
  x.fillStyle="#fff"; x.fillRect(0,0,w,h);
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
  x.drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",0.94);
}

function daccExtractJSON(text){
  let t=String(text||"").trim();
  t=t.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0 && b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}

      if(parts.length<2) continue;
      const name=parts[0];
      const temperature=String(parts[1]||"").replace(/[^0-9]/g,"");
      const state=parts[2]||"확인필요";
      if(name) items.push({name,temperature,state});
    }

    if(!items.length){
      throw new Error("Vision 응답 형식을 읽지 못했습니다. 다시 한 번 눌러주세요.");
    }

    let ok=0;
    const lines=[];
    for(let i=0;i<DACC_VISION_TEST_NAMES.length;i++){
      const expected=DACC_VISION_TEST_TRUTH[i];
      const item=items.find(v=>String(v?.name||"").replace(/\s/g,"")===DACC_VISION_TEST_NAMES[i].replace(/\s/g,""))
        || items[i] || {};
      const got=String(item.temperature??"").replace(/[^0-9]/g,"");
      const pass=got===expected;
      if(pass) ok++;
      lines.push(`${pass?"OK":"FAIL"}  ${DACC_VISION_TEST_NAMES[i]}  정답 ${expected} → ${got||"(미인식)"}  / ${item.state||"확인필요"}`);
    }

    const pct=(ok/21*100).toFixed(1);
    status.textContent=
      `OpenRouter 무료 Vision 결과: ${ok}/21 (${pct}%)\n`+
      `사용 모델: ${data?.model||"openrouter/free"}\n\n`+
      lines.join("\n");

  }catch(e){
    status.textContent="무료 Vision 오류: "+(e?.message||String(e));
  }finally{
    btn.disabled=false;
  }
}

document.getElementById("visionTestBtn")?.addEventListener("click",runDaccFreeVisionTest);
</script>

</body>
</html>
