/* =========================================================
   문자열 정리
========================================================= */

function clean(
value
){

return String(
value ||
""
)

.replace(
/[‐-‒–—―]/g,
"-"
)

.replace(
/\s+/g,
" "
)

.trim();

}


function compact(
value
){

return clean(
value
)

.replace(
/\s/g,
""
)

.toUpperCase();

}


/* =========================================================
   이미지 로드 + 축소

   iPhone 메모리 보호
========================================================= */

async function fileToCanvas(
file,
maxSide = 2400
){

return new Promise(
(resolve,reject) => {

const image =
new Image();


const url =
URL.createObjectURL(
file
);


image.onload =
() => {

const scale =
Math.min(

1,

maxSide /
Math.max(
image.naturalWidth,
image.naturalHeight
)

);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
Math.round(
image.naturalWidth *
scale
);


canvas.height =
Math.round(
image.naturalHeight *
scale
);


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.drawImage(

image,

0,
0,

canvas.width,
canvas.height

);


URL.revokeObjectURL(
url
);


resolve(
canvas
);

};


image.onerror =
reject;


image.src =
url;

}
);

}


/* =========================================================
   OCR Worker
========================================================= */

async function getWorker(){

if(worker){
return worker;
}


setStatus(
"OCR 엔진 준비중...",
3
);


worker =
await Tesseract.createWorker(

"kor+eng",

1,

{

logger:
message => {

if(
message.status &&
Number.isFinite(
message.progress
)
){

const progress =
Math.round(
message.progress *
100
);


$("statusText")
.textContent =

`${message.status} ${progress}%`;

}

}

}

);


return worker;

}


/* =========================================================
   Canvas 자르기
========================================================= */

function cropCanvas(
source,
x,
y,
width,
height
){

x =
Math.max(
0,
Math.round(x)
);


y =
Math.max(
0,
Math.round(y)
);


width =
Math.max(

1,

Math.min(
source.width - x,
Math.round(width)
)

);


height =
Math.max(

1,

Math.min(
source.height - y,
Math.round(height)
)

);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
width;


canvas.height =
height;


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.drawImage(

source,

x,
y,
width,
height,

0,
0,
width,
height

);


return canvas;

}


/* =========================================================
   grayscale
========================================================= */

function grayscaleCanvas(
source
){

const canvas =
document.createElement(
"canvas"
);


canvas.width =
source.width;


canvas.height =
source.height;


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.drawImage(
source,
0,
0
);


const image =
ctx.getImageData(

0,
0,

canvas.width,
canvas.height

);


const data =
image.data;


for(
let i = 0;
i < data.length;
i += 4
){

const gray =
Math.round(

data[i] * .299 +

data[i + 1] * .587 +

data[i + 2] * .114

);


data[i] =
gray;


data[i + 1] =
gray;


data[i + 2] =
gray;

}


ctx.putImageData(
image,
0,
0
);


return canvas;

}


/* =========================================================
   ★ V4 핵심

   순찰일지의 가로선을 이미지 픽셀로 찾는다.

   OCR로 TG2/TG3를 읽어서
   행 위치를 찾지 않는다.
========================================================= */

function detectHorizontalLines(
source
){

const grayCanvas =
grayscaleCanvas(
source
);


const ctx =
grayCanvas.getContext(
"2d",
{
willReadFrequently:true
}
);


const width =
grayCanvas.width;


const height =
grayCanvas.height;


const image =
ctx.getImageData(
0,
0,
width,
height
);


const data =
image.data;


/*
종이 가장자리/글씨 영향을 줄이기 위해
중앙 영역 위주로 검사.
*/

const startX =
Math.floor(
width * .10
);


const endX =
Math.floor(
width * .90
);


const scanWidth =
endX -
startX;


const scores = [];


/*
각 Y 줄에서
어두운 픽셀 비율 계산
*/

for(
let y = 0;
y < height;
y++
){

let dark =
0;


for(
let x = startX;
x < endX;
x += 2
){

const index =
(
y * width +
x
) * 4;


const value =
data[index];


if(
value < 145
){

dark++;

}

}


const samples =
Math.ceil(
scanWidth /
2
);


scores.push(
dark /
samples
);

}


/*
긴 가로선 후보.

글씨는 한 행 전체를 가로지르지 않지만
표 선은 긴 영역에 걸쳐 존재.
*/

const raw = [];


for(
let y = 0;
y < scores.length;
y++
){

if(
scores[y] >= .34
){

raw.push(
y
);

}

}


/*
같은 선이 2~4px 두께일 수 있으므로
하나로 합친다.
*/

const merged = [];


for(
const y
of raw
){

const last =
merged[
merged.length - 1
];


if(
!last ||
y -
last.end >
4
){

merged.push({
start:y,
end:y
});

}else{

last.end =
y;

}

}


/*
선 중앙값
*/

const lines =
merged
.map(
item =>
Math.round(
(
item.start +
item.end
) /
2
)
);


/*
너무 가까운 잡음 제거
*/

const filtered = [];


for(
const y
of lines
){

const previous =
filtered[
filtered.length - 1
];


if(
previous === undefined ||
y - previous >= 7
){

filtered.push(
y
);

}

}


return {
lines:
filtered,

scores
};

}


/* =========================================================
   표 내부의 연속 36개 경계선 찾기

   35행이면
   위/아래 경계 포함 36개 선이 필요.

   행 간격이 가장 일정한 구간을 선택.
========================================================= */

function find35RowGrid(
lineData,
imageHeight
){

const lines =
lineData.lines;


if(
lines.length < 30
){

return null;

}


let best =
null;


/*
실제 사진에서는 일부 선을 놓칠 수 있으므로
정확히 36개만 고집하지 않고
연속적인 행 간격 패턴을 찾는다.
*/

for(
let start = 0;
start < lines.length - 10;
start++
){

for(
let end = start + 10;
end < lines.length;
end++
){

const segment =
lines.slice(
start,
end + 1
);


const span =
segment[
segment.length - 1
] -
segment[0];


if(
span <
imageHeight * .35
){

continue;

}


const gaps = [];


for(
let i = 1;
i < segment.length;
i++
){

gaps.push(
segment[i] -
segment[i - 1]
);

}


const sorted =
[
...gaps
]
.sort(
(a,b) =>
a - b
);


const median =
sorted[
Math.floor(
sorted.length /
2
)
];


if(
median < 8
){

continue;

}


const goodGaps =
gaps.filter(
gap =>
gap >
median * .55 &&
gap <
median * 1.55
);


const consistency =
goodGaps.length /
gaps.length;


/*
35행 장비표는
사진 아래쪽의 큰 표이므로
행 간격 일정성과 전체 높이를 같이 평가.
*/

const score =

consistency * 100 +

segment.length * 2 +

span /
imageHeight *
25;


if(
!best ||
score >
best.score
){

best = {
segment,
median,
score,
consistency
};

}

}

}


if(!best){
return null;
}


/*
찾은 선들의 첫/마지막을 이용해서
35개 행의 이상적인 경계를 다시 만든다.

중간 선 몇 개가 OCR/사진 때문에 안 잡혀도
35행 전체 위치를 복구.
*/

const top =
best.segment[0];


let estimatedGap =
best.median;


/*
35행 전체 높이 예상
*/

let bottom =
top +
estimatedGap *
35;


/*
사진 밖으로 나가면
현재 감지 구간 기준 재계산
*/

if(
bottom >
imageHeight
){

const available =
imageHeight -
top;


estimatedGap =
available /
35;


bottom =
imageHeight;

}


const boundaries = [];


for(
let i = 0;
i <= 35;
i++
){

boundaries.push(

top +
estimatedGap *
i

);

}


return {

top,

bottom,

rowHeight:
estimatedGap,

boundaries,

detectedLines:
best.segment.length,

consistency:
best.consistency

};

}


/* =========================================================
   특정 행 위치

   rowNumber = 1~35
========================================================= */

function getRowBounds(
grid,
rowNumber
){

const top =
grid.boundaries[
rowNumber - 1
];


const bottom =
grid.boundaries[
rowNumber
];


return {

top,

bottom,

height:
bottom -
top

};

}


/* =========================================================
   셀 OCR 전 확대
========================================================= */

function enlargeCanvas(
source,
scale = 3
){

const canvas =
document.createElement(
"canvas"
);


canvas.width =
Math.max(
1,
Math.round(
source.width *
scale
)
);


canvas.height =
Math.max(
1,
Math.round(
source.height *
scale
)
);


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.drawImage(

source,

0,
0,

canvas.width,
canvas.height

);


return canvas;

}


/* =========================================================
   셀 OCR
========================================================= */

async function recognizeCell(
canvas,
type = "text"
){

const enlarged =
enlargeCanvas(
canvas,
3
);


const w =
await getWorker();


const options = {

tessedit_pageseg_mode:
Tesseract.PSM.SINGLE_LINE

};


if(
type ===
"temperature"
){

options.tessedit_char_whitelist =
"0123456789OoIl|";

}


const result =
await w.recognize(
enlarged,
options
);


return clean(
result.data.text
);

}


/* =========================================================
   온도 추출
========================================================= */

function extractTemperature(
text
){

const value =
clean(
text
)

.replace(
/[Oo]/g,
"0"
)

.replace(
/[Il|]/g,
"1"
);


const matches =
value.match(
/\d{1,4}/g
) ||
[];


for(
const item
of matches
){

const number =
Number(
item
);


if(
Number.isFinite(
number
) &&
number >= 0 &&
number <= 2000
){

return number;

}

}


return null;

}


/* =========================================================
   상태 추출
========================================================= */

function extractState(
text,
equipment
){

const value =
compact(
text
);


if(
value.includes(
"승온"
)
){

return "승온중";

}


if(
value.includes(
"유지"
)
){

return "유지중";

}


if(
value.includes(
"냉각"
)
){

return "냉각중";

}


if(
equipment.startsWith(
"HIP"
) &&
value.includes(
"가압"
)
){

return "가압중";

}


return "";

}


/* =========================================================
   언로딩대기 판정
========================================================= */

function isUnloadWaiting(
text
){

const value =
compact(
text
);


return (

value.includes(
"언로딩대기"
)

||

(
value.includes(
"언로딩"
)

&&

value.includes(
"대기"
)
)

);

}

/* =========================================================
   순찰일지 열 위치

   표 전체 폭 기준 비율.
   사진 각도가 조금 달라도
   표 전체 폭에 비례해서 셀을 자른다.

   실제 테스트 후 이 3개 비율만
   미세조정 가능.
========================================================= */

const PATROL_COLUMNS = {

  temperature:{
    x0:.40,
    x1:.50
  },

  state:{
    x0:.76,
    x1:.88
  },

  remark:{
    x0:.87,
    x1:.995
  }

};


/* =========================================================
   순찰일지 표 좌우 범위

   가로선이 실제로 어디서 시작/끝나는지
   픽셀 스캔으로 추정한다.
========================================================= */

function detectTableHorizontalRange(
  canvas,
  grid
){

  const gray =
    grayscaleCanvas(
      canvas
    );


  const ctx =
    gray.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  const width =
    gray.width;


  const height =
    gray.height;


  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    image.data;


  /*
    장비표 중앙부 여러 Y를 검사해서
    세로선이 반복적으로 존재하는 X를 찾는다.
  */

  const top =
    Math.max(
      0,
      Math.round(
        grid.top
      )
    );


  const bottom =
    Math.min(
      height - 1,
      Math.round(
        grid.bottom
      )
    );


  const scores =
    new Array(
      width
    ).fill(
      0
    );


  let sampleCount =
    0;


  /*
    가로선 자체는 피하고
    각 행 중앙을 샘플링
  */

  for(
    let row = 1;
    row <= 35;
    row += 2
  ){

    const bounds =
      getRowBounds(
        grid,
        row
      );


    const centerY =
      Math.round(
        (
          bounds.top +
          bounds.bottom
        ) / 2
      );


    const y0 =
      Math.max(
        top,
        centerY - 2
      );


    const y1 =
      Math.min(
        bottom,
        centerY + 2
      );


    for(
      let x = 0;
      x < width;
      x++
    ){

      let dark =
        0;


      for(
        let y = y0;
        y <= y1;
        y++
      ){

        const index =
          (
            y * width +
            x
          ) * 4;


        if(
          data[index] <
          130
        ){

          dark++;
        }
      }


      if(
        dark >= 3
      ){

        scores[x]++;
      }
    }


    sampleCount++;
  }


  /*
    여러 행에서 반복되는 세로선 후보
  */

  const threshold =
    Math.max(
      3,
      Math.round(
        sampleCount *
        .30
      )
    );


  const candidates = [];


  for(
    let x = 0;
    x < width;
    x++
  ){

    if(
      scores[x] >=
      threshold
    ){

      candidates.push(
        x
      );
    }
  }


  /*
    두꺼운 선 합치기
  */

  const groups = [];


  for(
    const x
    of candidates
  ){

    const last =
      groups[
        groups.length - 1
      ];


    if(
      !last ||
      x -
      last.end >
      4
    ){

      groups.push({
        start:x,
        end:x
      });

    }else{

      last.end =
        x;
    }
  }


  const verticalLines =
    groups
    .map(
      group =>
        Math.round(
          (
            group.start +
            group.end
          ) / 2
        )
    );


  /*
    표 전체 좌우 끝 추정.

    너무 바깥쪽 노이즈는 제외.
  */

  const usable =
    verticalLines
    .filter(
      x =>
        x >
        width * .02 &&
        x <
        width * .98
    );


  if(
    usable.length >= 4
  ){

    return {
      left:
        usable[0],

      right:
        usable[
          usable.length - 1
        ],

      verticalLines:
        usable
    };
  }


  /*
    세로선 검출 실패 fallback
  */

  return {
    left:
      width * .04,

    right:
      width * .96,

    verticalLines:[]
  };
}


/* =========================================================
   열 비율 → 실제 X 좌표
========================================================= */

function getPatrolColumnRect(
  tableRange,
  column
){

  const width =
    tableRange.right -
    tableRange.left;


  return {

    x0:
      tableRange.left +
      width *
      column.x0,

    x1:
      tableRange.left +
      width *
      column.x1

  };
}


/* =========================================================
   특정 행 + 특정 열 자르기
========================================================= */

function cropPatrolCellV4(
  canvas,
  grid,
  rowNumber,
  tableRange,
  column
){

  const row =
    getRowBounds(
      grid,
      rowNumber
    );


  const rect =
    getPatrolColumnRect(
      tableRange,
      column
    );


  /*
    표 가로선이 OCR에 들어가지 않도록
    위/아래 약간 잘라낸다.
  */

  const padY =
    Math.max(
      1,
      row.height *
      .10
    );


  return cropCanvas(

    canvas,

    rect.x0,

    row.top +
    padY,

    rect.x1 -
    rect.x0,

    row.height -
    padY * 2

  );
}


/* =========================================================
   순찰일지 한 행 분석
========================================================= */

async function analyzePatrolRowV4(
  canvas,
  grid,
  tableRange,
  rowNumber,
  equipment
){

  /*
    온도
  */

  const temperatureCell =
    cropPatrolCellV4(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.temperature

    );


  const temperatureText =
    await recognizeCell(
      temperatureCell,
      "temperature"
    );


  const temperature =
    extractTemperature(
      temperatureText
    );


  /*
    상태
  */

  const stateCell =
    cropPatrolCellV4(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.state

    );


  const stateText =
    await recognizeCell(
      stateCell,
      "text"
    );


  const state =
    extractState(
      stateText,
      equipment
    );


  /*
    비고
  */

  const remarkCell =
    cropPatrolCellV4(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.remark

    );


  const remarkText =
    await recognizeCell(
      remarkCell,
      "text"
    );


  const unload =
    isUnloadWaiting(
      remarkText
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature,

    state,

    remark:
      remarkText,

    unload,

    raw:{
      temperature:
        temperatureText,

      state:
        stateText,

      remark:
        remarkText
    }

  };
}


/* =========================================================
   온도만 읽는 장비

   드라이챔버 / 소각기
========================================================= */

async function analyzeTemperatureOnlyV4(
  canvas,
  grid,
  tableRange,
  rowNumber,
  equipment
){

  const cell =
    cropPatrolCellV4(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.temperature

    );


  const text =
    await recognizeCell(
      cell,
      "temperature"
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature:
      extractTemperature(
        text
      ),

    raw:
      text

  };
}


/* =========================================================
   사진1 전체 분석

   ★ 장비명 OCR 없음
========================================================= */

async function analyzePatrolPhotoV4(
  file
){

  setStatus(
    "순찰일지 표 찾는 중...",
    8
  );


  const canvas =
    await fileToCanvas(
      file,
      2400
    );


  /*
    1. 가로선 찾기
  */

  const horizontal =
    detectHorizontalLines(
      canvas
    );


  setStatus(
    `순찰일지 가로선 ${horizontal.lines.length}개 감지`,
    13
  );


  /*
    2. 35행 표 복구
  */

  const grid =
    find35RowGrid(
      horizontal,
      canvas.height
    );


  if(!grid){

    return {
      fatal:true,

      reason:
        `순찰일지 35행 표를 찾지 못했습니다. 감지된 가로선: ${horizontal.lines.length}개`
    };
  }


  /*
    3. 표 좌우 범위
  */

  const tableRange =
    detectTableHorizontalRange(
      canvas,
      grid
    );


  const rows =
    getPatrolRows();


  const items = {};


  const dry = [];


  const incinerators = [];


  let temperatureRead =
    0;


  let stateRead =
    0;


  /*
    실제 사용하는 행만 OCR.

    null 행은 행 위치 계산에는 존재하지만
    OCR 호출은 하지 않는다.
  */

  const activeRows =
    Object
    .entries(
      rows
    )
    .filter(
      ([row,equipment]) =>
        !!equipment
    );


  let completed =
    0;


  for(
    const [
      rowText,
      equipment
    ]
    of activeRows
  ){

    const rowNumber =
      Number(
        rowText
      );


    completed++;


    setStatus(

      `순찰일지 ${rowNumber}행 확인중...`,

      15 +
      Math.round(
        completed /
        activeRows.length *
        40
      )

    );


    /*
      드라이챔버
      → 온도만
    */

    if(
      DRY_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await analyzeTemperatureOnlyV4(

          canvas,
          grid,
          tableRange,
          rowNumber,
          equipment

        );


      if(
        item.temperature !==
        null
      ){

        temperatureRead++;
      }


      dry.push(
        item
      );


      continue;
    }


    /*
      소각기
      → 온도만
    */

    if(
      INCINERATOR_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await analyzeTemperatureOnlyV4(

          canvas,
          grid,
          tableRange,
          rowNumber,
          equipment

        );


      if(
        item.temperature !==
        null
      ){

        temperatureRead++;
      }


      incinerators.push(
        item
      );


      continue;
    }


    /*
      일반 장비
    */

    const item =
      await analyzePatrolRowV4(

        canvas,
        grid,
        tableRange,
        rowNumber,
        equipment

      );


    if(
      item.temperature !==
      null
    ){

      temperatureRead++;
    }


    if(
      item.state
    ){

      stateRead++;
    }


    items[
      equipment
    ] =
      item;
  }


  return {

    fatal:false,

    canvasWidth:
      canvas.width,

    canvasHeight:
      canvas.height,

    detectedLines:
      horizontal.lines.length,

    gridLines:
      grid.detectedLines,

    rowHeight:
      grid.rowHeight,

    consistency:
      grid.consistency,

    verticalLines:
      tableRange.verticalLines.length,

    temperatureRead,

    stateRead,

    items,

    dry,

    incinerators

  };
}


/* =========================================================
   사진2 OCR
========================================================= */

async function recognizeNumberPhoto(
  file
){

  setStatus(
    "장비번호 사진 읽는 중...",
    58
  );


  const canvas =
    await fileToCanvas(
      file,
      2200
    );


  const w =
    await getWorker();


  const result =
    await w.recognize(

      canvas,

      {
        tessedit_pageseg_mode:
          Tesseract.PSM.AUTO
      }

    );


  const words =
    (
      result.data.words ||
      []
    )
    .map(
      word => ({

        text:
          clean(
            word.text
          ),

        x0:
          word.bbox.x0,

        y0:
          word.bbox.y0,

        x1:
          word.bbox.x1,

        y1:
          word.bbox.y1,

        cx:
          (
            word.bbox.x0 +
            word.bbox.x1
          ) / 2,

        cy:
          (
            word.bbox.y0 +
            word.bbox.y1
          ) / 2,

        height:
          word.bbox.y1 -
          word.bbox.y0,

        confidence:
          Number(
            word.confidence ||
            0
          )

      })
    )
    .filter(
      word =>
        !!word.text
    );


  return {

    canvas,

    text:
      clean(
        result.data.text
      ),

    words

  };
}


/* =========================================================
   사진2 장비명 정규화
========================================================= */

function normalizeNumberEquipment(
  raw
){

  const value =
    compact(
      raw
    );


  let match;


  match =
    value.match(
      /TG[-]?([1-7])/
    );


  if(match){

    return "TG" +
      match[1];
  }


  match =
    value.match(
      /GF[-]?(1|3|4|5)/
    );


  if(match){

    return "GF" +
      match[1];
  }


  match =
    value.match(
      /CF[-]?([1-6])/
    );


  if(match){

    return "CF" +
      match[1];
  }


  match =
    value.match(
      /HIP[-]?([123])/
    );


  if(match){

    return "HIP" +
      match[1];
  }


  if(
    value.includes(
      "SMI"
    )
  ){

    return "SMI";
  }


  if(
    value.includes(
      "CF"
    ) &&
    value.includes(
      "분위기"
    )
  ){

    return "CF분위기로";
  }


  return "";
}


/* =========================================================
   장비번호 #26-xxx 추출
========================================================= */

function extractEquipmentNumber(
  raw
){

  let value =
    clean(
      raw
    );


  /*
    OCR 보정
  */

  value =
    value
    .replace(
      /[Oo]/g,
      "0"
    )
    .replace(
      /[—–‐~_.]/g,
      "-"
    );


  /*
    26-45
    26 - 45
    #26-45
  */

  let match =
    value.match(
      /#?\s*26\s*-\s*(\d{1,3})/
    );


  if(match){

    return "#26-" +
      match[1];
  }


  /*
    2645 → 26-45
    26118 → 26-118
  */

  match =
    value.match(
      /(?:^|\D)26(\d{2,3})(?:\D|$)/
    );


  if(match){

    return "#26-" +
      match[1];
  }


  return "";
}


/* =========================================================
   사진2 가동 판정
========================================================= */

function hasRunningText(
  raw
){

  const value =
    compact(
      raw
    );


  return value.includes(
    "가동"
  );
}


/* =========================================================
   사진2 장비명 앵커 찾기
========================================================= */

function findNumberAnchors(
  ocr
){

  const anchors = [];


  for(
    const word
    of ocr.words
  ){

    const equipment =
      normalizeNumberEquipment(
        word.text
      );


    if(
      !equipment ||
      !NUMBER_EQUIPMENT.includes(
        equipment
      )
    ){

      continue;
    }


    anchors.push({

      equipment,

      x0:
        word.x0,

      x1:
        word.x1,

      y0:
        word.y0,

      y1:
        word.y1,

      cx:
        word.cx,

      cy:
        word.cy,

      height:
        word.height,

      confidence:
        word.confidence

    });
  }


  /*
    같은 장비가 중복 인식됐을 경우
    confidence 높은 것 사용.
  */

  const map = {};


  for(
    const anchor
    of anchors
  ){

    const previous =
      map[
        anchor.equipment
      ];


    if(
      !previous ||
      anchor.confidence >
      previous.confidence
    ){

      map[
        anchor.equipment
      ] =
        anchor;
    }
  }


  return map;
}


/* =========================================================
   장비명 기준 블록 만들기

   장비 순서가 바뀌어도
   OCR로 실제 Y 위치를 찾기 때문에 관계없음.
========================================================= */

function buildNumberBlocks(
  anchors,
  imageHeight
){

  const list =
    Object
    .values(
      anchors
    )
    .sort(
      (a,b) =>
        a.cy -
        b.cy
    );


  const blocks = {};


  for(
    let i = 0;
    i < list.length;
    i++
  ){

    const current =
      list[i];


    const previous =
      list[
        i - 1
      ];


    const next =
      list[
        i + 1
      ];


    let top;


    let bottom;


    if(previous){

      top =
        (
          previous.cy +
          current.cy
        ) / 2;

    }else{

      top =
        Math.max(
          0,
          current.y0 -
          current.height
        );
    }


    if(next){

      bottom =
        (
          current.cy +
          next.cy
        ) / 2;

    }else{

      bottom =
        Math.min(
          imageHeight,
          current.y1 +
          current.height *
          3
        );
    }


    blocks[
      current.equipment
    ] = {

      ...current,

      top,

      bottom

    };
  }


  return blocks;
}


/* =========================================================
   사진2 한 장비 블록 분석
========================================================= */

function analyzeNumberBlockV4(
  ocr,
  block
){

  const words =
    ocr.words
    .filter(
      word => {

        const insideY =
          word.cy >=
          block.top
          &&
          word.cy <
          block.bottom;


        /*
          장비명 오른쪽 영역.
          번호와 가동이 있는 부분.
        */

        const right =
          word.cx >
          block.x1;


        return (
          insideY &&
          right
        );
      }
    )
    .sort(
      (a,b) => {

        if(
          Math.abs(
            a.cy -
            b.cy
          ) <
          8
        ){

          return (
            a.x0 -
            b.x0
          );
        }


        return (
          a.cy -
          b.cy
        );
      }
    );


  const raw =
    words
    .map(
      word =>
        word.text
    )
    .join(
      " "
    );


  return {

    equipment:
      block.equipment,

    number:
      extractEquipmentNumber(
        raw
      ),

    running:
      hasRunningText(
        raw
      ),

    raw

  };
}


/* =========================================================
   사진2 전체 분석
========================================================= */

async function analyzeNumberPhotoV4(
  file
){

  const ocr =
    await recognizeNumberPhoto(
      file
    );


  setStatus(
    "장비번호 장비명 연결중...",
    72
  );


  const anchors =
    findNumberAnchors(
      ocr
    );


  const blocks =
    buildNumberBlocks(
      anchors,
      ocr.canvas.height
    );


  const items = {};


  for(
    const equipment
    of NUMBER_EQUIPMENT
  ){

    const block =
      blocks[
        equipment
      ];


    if(!block){

      items[
        equipment
      ] = {

        equipment,

        found:false,

        number:"",

        running:false,

        raw:""

      };


      continue;
    }


    const parsed =
      analyzeNumberBlockV4(
        ocr,
        block
      );


    items[
      equipment
    ] = {

      ...parsed,

      found:true

    };
  }


  const foundCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        item.found
    )
    .length;


  const numberCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        !!item.number
    )
    .length;


  const runningCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        item.number &&
        item.running
    )
    .length;


  return {

    items,

    foundCount,

    numberCount,

    runningCount,

    rawText:
      ocr.text

  };
}


/* =========================================================
   일반 장비 제외 판정

   확정 규칙:
   - 번호 있어야 함
   - 가동이어야 함
   - 온도 있어야 함
   - 승온/유지/냉각/HIP 가압 상태 있어야 함
   - 비고 언로딩대기 제외
   - 100도 이하 + 냉각 제외
   - HIP 냉각 제외
========================================================= */

function getExcludeReasonV4(
  equipment,
  patrol,
  number
){

  if(
    !number ||
    !number.found
  ){

    return "장비번호 사진에서 장비명 미인식";
  }


  if(
    !number.number
  ){

    return "장비번호 없음";
  }


  if(
    !number.running
  ){

    return "가동 확인 안 됨";
  }


  if(
    !patrol
  ){

    return "순찰일지 데이터 없음";
  }


  if(
    patrol.temperature ===
    null
  ){

    return "온도 인식 실패";
  }


  if(
    !patrol.state
  ){

    return "상태 인식 실패";
  }


  /*
    비고란:
    냉각 / 언로딩대기면 제외
  */

  if(
    patrol.unload
  ){

    return "언로딩대기";
  }


  /*
    HIP 냉각 제외
  */

  if(
    /^HIP[123]$/.test(
      equipment
    )
    &&
    patrol.state ===
    "냉각중"
  ){

    return "HIP 냉각";
  }


  /*
    일반 장비
    100도 이하 냉각 제외
  */

  if(
    patrol.temperature <=
    100
    &&
    patrol.state ===
    "냉각중"
  ){

    return "100도 이하 냉각";
  }


  return "";
}


/* =========================================================
   사진1 + 사진2 합치기
========================================================= */

function mergeV4(
  patrol,
  number
){

  const included = [];


  const excluded = [];


  for(
    const equipment
    of REPORT_ORDER
  ){

    const patrolItem =
      patrol.items[
        equipment
      ];


    const numberItem =
      number.items[
        equipment
      ];


    const reason =
      getExcludeReasonV4(

        equipment,

        patrolItem,

        numberItem

      );


    if(reason){

      excluded.push({

        equipment,

        reason,

        patrol:
          patrolItem,

        number:
          numberItem

      });


      continue;
    }


    included.push({

      equipment,

      number:
        numberItem.number,

      temperature:
        patrolItem.temperature,

      state:
        patrolItem.state

    });
  }


  /*
    TG1

    순찰일지에는 없음.
    사진2에서 번호 + 가동 확인 시
    번호 + TG1만 출력.
  */

  let tg1 =
    null;


  const tg1Number =
    number.items[
      "TG1"
    ];


  if(
    tg1Number &&
    tg1Number.found &&
    tg1Number.number &&
    tg1Number.running
  ){

    tg1 = {

      equipment:
        "TG1",

      number:
        tg1Number.number

    };
  }


  /*
    드라이챔버

    번호 사용 X.
    사진1에서 읽은 온도만.
  */

  const dry =
    patrol.dry
    .filter(
      item =>
        item.temperature !==
        null
    );


  /*
    소각기

    번호 사용 X.
    온도만 별도 출력.
  */

  const incinerators =
    patrol.incinerators
    .filter(
      item =>
        item.temperature !==
        null
    );


  return {

    included,

    excluded,

    tg1,

    dry,

    incinerators

  };
}


/* =========================================================
   분석 신뢰성 검증

   0개 결과를 정상 처리하지 않는다.
========================================================= */

function validateV4(
  patrol,
  number,
  merged
){

  const problems = [];


  /*
    표 자체
  */

  if(
    patrol.detectedLines <
    20
  ){

    problems.push(
      `순찰일지 표 선이 ${patrol.detectedLines}개만 감지됐습니다.`
    );
  }


  /*
    장비번호 사진 장비명
  */

  if(
    number.foundCount <
    4
  ){

    problems.push(
      `장비번호 사진에서 장비명을 ${number.foundCount}개만 찾았습니다.`
    );
  }


  /*
    사진2에 실제 가동 후보가 있는데
    최종 0개라면 실패
  */

  if(
    number.runningCount >
    0
    &&
    merged.included.length ===
    0
  ){

    problems.push(
      `가동 장비 ${number.runningCount}개를 찾았지만 순찰일지 값과 매칭되지 않았습니다.`
    );
  }


  /*
    순찰일지 온도를 하나도 못 읽은 경우
  */

  if(
    patrol.temperatureRead ===
    0
  ){

    problems.push(
      "순찰일지에서 온도를 하나도 읽지 못했습니다."
    );
  }


  return {

    valid:
      problems.length ===
      0,

    problems

  };
}

){

/* =========================================================
   분석 결과 표시
========================================================= */

function renderV4(
  patrol,
  number,
  merged,
  validation
){

  $("results").innerHTML =
    "";


  /*
    사진1 상태
  */

  $("patrolStatus")
  .classList
  .remove(
    "hidden"
  );


  $("patrolStatus")
  .innerHTML =

    `<b>사진 1 · 순찰일지</b><br>` +

    `표 감지 ✓ · ` +

    `가로선 ${patrol.detectedLines}개 · ` +

    `온도 ${patrol.temperatureRead}개 · ` +

    `상태 ${patrol.stateRead}개`;


  /*
    사진2 상태
  */

  $("numberStatus")
  .classList
  .remove(
    "hidden"
  );


  $("numberStatus")
  .innerHTML =

    `<b>사진 2 · 장비번호</b><br>` +

    `장비명 ${number.foundCount}개 · ` +

    `번호 ${number.numberCount}개 · ` +

    `가동 ${number.runningCount}개`;


  /*
    최종 검증
  */

  if(
    validation.valid
  ){

    $("fatalWarning")
    .classList
    .add(
      "hidden"
    );


    $("makeReport")
    .disabled =
      false;

  }else{

    $("fatalWarning")
    .classList
    .remove(
      "hidden"
    );


    $("fatalWarning")
    .innerHTML =

      "<b>인식 결과 확인 필요</b><br>" +

      validation.problems
      .join(
        "<br>"
      );


    $("makeReport")
    .disabled =
      true;
  }


  /*
    포함 장비
  */

  for(
    const item
    of merged.included
  ){

    $("results")
    .appendChild(
      createResultRow(
        item
      )
    );
  }


  if(
    merged.included.length ===
    0
  ){

    $("results")
    .innerHTML =

      `<div style="
        padding:22px 4px;
        text-align:center;
        color:#8d96a8;
        font-size:13px
      ">
        자동 확정된 일반 장비가 없습니다.
      </div>`;
  }


  /*
    TG1
  */

  if(
    merged.tg1
  ){

    $("tg1Area")
    .classList
    .remove(
      "hidden"
    );


    $("tg1Area")
    .innerHTML =

      `<b>${merged.tg1.number} TG1</b><br>` +
      `TG1은 순찰일지에 없어 번호와 장비명만 표시됩니다.`;

  }else{

    $("tg1Area")
    .classList
    .add(
      "hidden"
    );
  }


  /*
    제외
  */

  $("excludedCount")
  .textContent =

    `제외항목 ${merged.excluded.length}개`;


  $("excluded")
  .innerHTML =
    "";


  for(
    const item
    of merged.excluded
  ){

    const div =
      document.createElement(
        "div"
      );


    const numberText =
      item.number?.number ||
      "번호 없음";


    const temperature =
      item.patrol?.temperature;


    const state =
      item.patrol?.state ||
      "";


    let detail =
      "";


    if(
      temperature !== null &&
      temperature !== undefined
    ){

      detail +=
        `${temperature}도 `;
    }


    if(state){

      detail +=
        state;
    }


    div.innerHTML =

      `<b>${numberText} ${item.equipment}</b>` +

      (
        detail
        ?
        `<br>${detail}`
        :
        ""
      ) +

      `<br>→ ${item.reason}`;


    $("excluded")
    .appendChild(
      div
    );
  }


  $("count")
  .textContent =

    `${merged.included.length}개 표시`;


  $("resultCard")
  .classList
  .remove(
    "hidden"
  );


  $("resultCard")
  .scrollIntoView({

    behavior:
      "smooth",

    block:
      "start"

  });

}

){

    number ||

  )

    ""
  );

function makeEquipmentLineV4(

){

    displayNumberV4(

    )

    + " " +

    item.equipment

    + " " +

    item.temperature

    + "도 " +

    item.state

  );

}


/* =========================================================
   드라이챔버 표시명
========================================================= */

function dryDisplayNameV4(
  equipment
){

  if(
    equipment ===
    "구형드라이챔버"
  ){

    return "구형 드라이챔버";

  }


  if(
    equipment ===
    "신형드라이챔버"
  ){

    return "신형 드라이챔버";

  }


  return equipment;

}


/* =========================================================
   소각기 표시명
========================================================= */

function incineratorDisplayNameV4(
  equipment
){

  if(
    equipment ===
    "1동소각기"
  ){

    return "1동";

  }


  if(
    equipment ===
    "3동소각기"
  ){

    return "3동";

  }


  return equipment;

}


/* =========================================================
   TG1 출력

   순찰일지에는 아직 없으므로

   장비번호 + TG1

   이것만 출력.
========================================================= */

function makeTG1LineV4(
  tg1
){

  if(!tg1){

    return "";

  }


  return (

    displayNumberV4(
      tg1.number
    )

    + " TG1"

  );

}


/* =========================================================
   최종 보고서 생성

   중요:
   OCR에서 확정되지 않은 장비는
   임의로 만들어 넣지 않는다.
========================================================= */

function buildFinalReportV4(){

  if(
    !analysisResult
  ){

    return "";

  }


  if(
    !analysisResult.validation.valid
  ){

    return "";

  }


  const merged =
    analysisResult.merged;


  const today =
    getTodayV4();


  const workName =
    getWorkNameV4();


  const lines = [];


/* ---------------------------------------------------------
   상단
--------------------------------------------------------- */

  lines.push(

    `${today.month}월 ${today.day}일 (${today.weekday}) ${workName}근무자`

  );


  lines.push(

    `${rank}입니다.`

  );


  lines.push("");


/* ---------------------------------------------------------
   장비가동현황
--------------------------------------------------------- */

  lines.push(
    '"장비가동현황"'
  );


  const sorted =
    sortReportItemsV4(
      merged.included
    );


  for(
    const item
    of sorted
  ){

    lines.push(

      makeEquipmentLineV4(
        item
      )

    );

  }


/* ---------------------------------------------------------
   TG1

   요청대로 일반 장비들보다 맨 아래.

   단, 드라이챔버/소각기 별도영역 전.
--------------------------------------------------------- */

  if(
    merged.tg1
  ){

    lines.push(

      makeTG1LineV4(
        merged.tg1
      )

    );

  }


/* ---------------------------------------------------------
   드라이챔버

   번호 없음.
   상태 없음.
   사진에서 읽은 온도만 출력.

   온도 인식 실패 장비는 mergeV4에서 이미 제외.
--------------------------------------------------------- */

  if(
    merged.dry &&
    merged.dry.length >
    0
  ){

    lines.push("");


    for(
      const item
      of merged.dry
    ){

      lines.push(

        `${dryDisplayNameV4(
          item.equipment
        )} ${item.temperature}도`

      );

    }

  }


/* ---------------------------------------------------------
   소각기 별도 출력

   1동 / 3동
   번호 없음.
   상태 없음.
   온도만.
--------------------------------------------------------- */

  if(
    merged.incinerators &&
    merged.incinerators.length >
    0
  ){

    lines.push("");

    lines.push(
      "-TG소각기-"
    );


    for(
      const item
      of merged.incinerators
    ){

      lines.push(

        `${incineratorDisplayNameV4(
          item.equipment
        )} ${item.temperature}도`

      );

    }

  }


  return lines.join(
    "\n"
  );

}


/* =========================================================
   보고서 생성 버튼
========================================================= */

$("makeReport")
.onclick =
() => {

  if(
    !analysisResult
  ){

    alert(
      "먼저 사진을 분석해주세요."
    );

    return;

  }


  if(
    !analysisResult.validation.valid
  ){

    alert(
      "사진 인식 결과에 오류가 있어 보고서를 생성할 수 없습니다."
    );

    return;

  }


  const report =
    buildFinalReportV4();


  if(
    !report
  ){

    alert(
      "보고서를 생성할 수 없습니다."
    );

    return;

  }


  $("report").value =
    report;


  $("reportCard")
  .classList
  .remove(
    "hidden"
  );


  $("reportCard")
  .scrollIntoView({

    behavior:
      "smooth",

    block:
      "start"

  });

};


/* =========================================================
   전체 복사
========================================================= */

$("copy")
.onclick =
async () => {

  const text =
    $("report").value;


  if(!text){

    return;

  }


  const button =
    $("copy");


  try{

    await navigator
    .clipboard
    .writeText(
      text
    );


    button.textContent =
      "복사 완료 ✓";


    setTimeout(
      () => {

        button.textContent =
          "전체 복사";

      },
      1200
    );


  }catch(error){


    /*
      iPhone Safari fallback
    */

    const textarea =
      $("report");


    textarea.focus();


    textarea.select();


    textarea.setSelectionRange(
      0,
      textarea.value.length
    );


    try{

      document.execCommand(
        "copy"
      );


      button.textContent =
        "복사 완료 ✓";


      setTimeout(
        () => {

          button.textContent =
            "전체 복사";

        },
        1200
      );


    }catch(copyError){

      alert(
        "자동 복사가 차단됐습니다. 보고서 내용을 길게 눌러 복사해주세요."
      );

    }

  }

};


/* =========================================================
   페이지 종료 시 OCR Worker 종료
========================================================= */

window.addEventListener(
  "pagehide",
  async () => {

    if(!worker){

      return;

    }


    try{

      await worker.terminate();

    }catch(error){

      console.warn(
        error
      );

    }


    worker =
      null;

  }
);


/* =========================================================
   초기 상태
========================================================= */

updateAnalyzeButton();


console.log(
  "DACC V4 READY"
);

</script>
