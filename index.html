/* =========================================================
   OpenCV 자동 로딩

   별도 설치/가입/API KEY 없음
========================================================= */

function loadOpenCV(){

  if(cvReady){
    return Promise.resolve();
  }

  return new Promise((resolve,reject) => {

    if(cvLoading){

      const timer = setInterval(() => {

        if(cvReady){
          clearInterval(timer);
          resolve();
        }

      },100);

      setTimeout(() => {
        clearInterval(timer);

        if(!cvReady){
          reject(
            new Error("OpenCV 로딩 시간 초과")
          );
        }

      },20000);

      return;
    }


    cvLoading = true;

    const script =
      document.createElement("script");

    script.async = true;

    script.src =
      "https://docs.opencv.org/4.x/opencv.js";


    script.onload = () => {

      const wait = () => {

        if(
          window.cv &&
          typeof cv.Mat === "function"
        ){

          cvReady = true;
          cvLoading = false;

          resolve();
          return;
        }

        setTimeout(wait,100);
      };

      wait();
    };


    script.onerror = () => {

      cvLoading = false;

      reject(
        new Error("OpenCV.js를 불러오지 못했습니다.")
      );
    };


    document.head.appendChild(
      script
    );

  });
}

function clean(value){

  return String(value || "")
    .replace(/[‐-‒–—―]/g,"-")
    .replace(/\s+/g," ")
    .trim();
}


function compact(value){

  return clean(value)
    .replace(/\s/g,"")
    .toUpperCase();

/* =========================================================
   사진 → Canvas
========================================================= */

async function fileToCanvas(
  file,
  maxSide = 2400
){

  return new Promise(
    (resolve,reject) => {

      const image =
        new Image();

      const url =
        URL.createObjectURL(file);

      image.onload = () => {

        const scale =
          Math.min(
            1,
            maxSide /
            Math.max(
              image.naturalWidth,
              image.naturalHeight
            )
          );

        const canvas =
          document.createElement("canvas");

        canvas.width =
          Math.round(
            image.naturalWidth *
            scale
          );

        canvas.height =
          Math.round(
            image.naturalHeight *
            scale
          );

        const ctx =
          canvas.getContext(
            "2d",
            {willReadFrequently:true}
          );

        ctx.drawImage(
          image,
          0,0,
          canvas.width,
          canvas.height
        );

        URL.revokeObjectURL(url);

        resolve(canvas);
      };

      image.onerror = reject;

      image.src = url;
    }
  );
}


/* =========================================================
   ★ OpenCV 문서/표 외곽 사각형 찾기
========================================================= */

function findDocumentQuad(
  canvas
){

  const src =
    cv.imread(canvas);

  const gray =
    new cv.Mat();

  const blur =
    new cv.Mat();

  const edges =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();


  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.GaussianBlur(
      gray,
      blur,
      new cv.Size(5,5),
      0,
      0,
      cv.BORDER_DEFAULT
    );


    cv.Canny(
      blur,
      edges,
      45,
      140
    );


    /*
      끊긴 표 선 연결
    */

    const kernel =
      cv.getStructuringElement(
        cv.MORPH_RECT,
        new cv.Size(5,5)
      );


    cv.morphologyEx(
      edges,
      edges,
      cv.MORPH_CLOSE,
      kernel
    );


    kernel.delete();


    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );


    const imageArea =
      canvas.width *
      canvas.height;


    let best = null;


    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);


      const perimeter =
        cv.arcLength(
          contour,
          true
        );


      const approx =
        new cv.Mat();


      cv.approxPolyDP(
        contour,
        approx,
        perimeter * .02,
        true
      );


      const area =
        Math.abs(
          cv.contourArea(
            approx
          )
        );


      if(
        approx.rows === 4 &&
        area >
        imageArea * .18
      ){

        if(
          !best ||
          area > best.area
        ){

          if(best){
            best.approx.delete();
          }

          best = {
            area,
            approx
          };

        }else{

          approx.delete();
        }

      }else{

        approx.delete();
      }


      contour.delete();
    }


    if(!best){
      return null;
    }


    const points = [];


    for(
      let i = 0;
      i < 4;
      i++
    ){

      points.push({

        x:
          best.approx
          .intPtr(i,0)[0],

        y:
          best.approx
          .intPtr(i,0)[1]

      });
    }


    best.approx.delete();


    return orderQuadPoints(
      points
    );


  }finally{

    src.delete();
    gray.delete();
    blur.delete();
    edges.delete();
    contours.delete();
    hierarchy.delete();

  }

}


/* =========================================================
   꼭짓점 순서

   TL / TR / BR / BL
========================================================= */

function orderQuadPoints(
  points
){

  const sums =
    points.map(
      p => p.x + p.y
    );


  const diffs =
    points.map(
      p => p.x - p.y
    );


  const tl =
    points[
      sums.indexOf(
        Math.min(...sums)
      )
    ];


  const br =
    points[
      sums.indexOf(
        Math.max(...sums)
      )
    ];


  const tr =
    points[
      diffs.indexOf(
        Math.max(...diffs)
      )
    ];


  const bl =
    points[
      diffs.indexOf(
        Math.min(...diffs)
      )
    ];


  return {
    tl,
    tr,
    br,
    bl
  };
}


/* =========================================================
   거리
========================================================= */

function pointDistance(
  a,
  b
){

  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );
}


/* =========================================================
   ★ 자동 원근 보정
========================================================= */

function perspectiveCorrect(
  canvas,
  quad
){

  const topWidth =
    pointDistance(
      quad.tl,
      quad.tr
    );


  const bottomWidth =
    pointDistance(
      quad.bl,
      quad.br
    );


  const leftHeight =
    pointDistance(
      quad.tl,
      quad.bl
    );


  const rightHeight =
    pointDistance(
      quad.tr,
      quad.br
    );


  let targetWidth =
    Math.round(
      Math.max(
        topWidth,
        bottomWidth
      )
    );


  let targetHeight =
    Math.round(
      Math.max(
        leftHeight,
        rightHeight
      )
    );


  /*
    iPhone 메모리 보호
  */

  const maxSide = 2200;


  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        targetWidth,
        targetHeight
      )
    );


  targetWidth =
    Math.max(
      100,
      Math.round(
        targetWidth *
        scale
      )
    );


  targetHeight =
    Math.max(
      100,
      Math.round(
        targetHeight *
        scale
      )
    );


  const src =
    cv.imread(canvas);


  const dst =
    new cv.Mat();


  const sourcePoints =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        quad.tl.x,
        quad.tl.y,

        quad.tr.x,
        quad.tr.y,

        quad.br.x,
        quad.br.y,

        quad.bl.x,
        quad.bl.y
      ]
    );


  const destinationPoints =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        0,0,

        targetWidth - 1,
        0,

        targetWidth - 1,
        targetHeight - 1,

        0,
        targetHeight - 1
      ]
    );


  const matrix =
    cv.getPerspectiveTransform(
      sourcePoints,
      destinationPoints
    );


  cv.warpPerspective(
    src,
    dst,
    matrix,
    new cv.Size(
      targetWidth,
      targetHeight
    ),
    cv.INTER_LINEAR,
    cv.BORDER_CONSTANT,
    new cv.Scalar(
      255,
      255,
      255,
      255
    )
  );


  const output =
    document.createElement(
      "canvas"
    );


  output.width =
    targetWidth;

  output.height =
    targetHeight;


  cv.imshow(
    output,
    dst
  );


  src.delete();
  dst.delete();
  sourcePoints.delete();
  destinationPoints.delete();
  matrix.delete();


  return output;
}


/* =========================================================
   ★ 사진 자동 보정 전체 과정

   사각형 발견:
   → 원근 보정

   사각형 못 찾음:
   → 원본을 그대로 쓰되
     실패 여부를 결과에 표시
========================================================= */

async function autoCorrectPhoto(
  canvas
){

  await loadOpenCV();


  const quad =
    findDocumentQuad(
      canvas
    );


  if(!quad){

    return {
      canvas,
      corrected:false,
      reason:"외곽 사각형 미검출"
    };
  }


  const corrected =
    perspectiveCorrect(
      canvas,
      quad
    );


  return {
    canvas:corrected,
    corrected:true,
    reason:"자동 원근 보정 완료"
  };
}


/* =========================================================
   OCR Worker
========================================================= */

async function getWorker(){

  if(worker){
    return worker;
  }


  setStatus(
    "OCR 엔진 준비중...",
    3
  );


  worker =
    await Tesseract.createWorker(
      "kor+eng",
      1,
      {
        logger:m => {

          if(
            m.status &&
            Number.isFinite(
              m.progress
            )
          ){

            $("statusText")
            .textContent =
              `${m.status} ${Math.round(m.progress*100)}%`;
          }
        }
      }
    );


  return worker;
}


/* =========================================================
   Canvas Crop
========================================================= */

function cropCanvas(
  source,
  x,
  y,
  width,
  height
){

  x =
    Math.max(
      0,
      Math.round(x)
    );


  y =
    Math.max(
      0,
      Math.round(y)
    );


  width =
    Math.max(
      1,
      Math.min(
        source.width - x,
        Math.round(width)
      )
    );


  height =
    Math.max(
      1,
      Math.min(
        source.height - y,
        Math.round(height)
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width = width;
  canvas.height = height;


  canvas
  .getContext(
    "2d",
    {willReadFrequently:true}
  )
  .drawImage(
    source,
    x,y,width,height,
    0,0,width,height
  );


  return canvas;
}


/* =========================================================
   흑백
========================================================= */

function grayscaleCanvas(
  source
){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    source.width;

  canvas.height =
    source.height;


  const ctx =
    canvas.getContext(
      "2d",
      {willReadFrequently:true}
    );


  ctx.drawImage(
    source,
    0,
    0
  );


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const data =
    image.data;


  for(
    let i = 0;
    i < data.length;
    i += 4
  ){

    const gray =
      Math.round(
        data[i] * .299 +
        data[i+1] * .587 +
        data[i+2] * .114
      );


    data[i] = gray;
    data[i+1] = gray;
    data[i+2] = gray;
  }


  ctx.putImageData(
    image,
    0,
    0
  );


  return canvas;
}


/* =========================================================
   가로선 검출

   원근 보정된 사진 기준
========================================================= */

function detectHorizontalLines(
  source
){

  const gray =
    grayscaleCanvas(
      source
    );


  const ctx =
    gray.getContext(
      "2d",
      {willReadFrequently:true}
    );


  const width =
    gray.width;


  const height =
    gray.height;


  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    image.data;


  const startX =
    Math.floor(
      width * .05
    );


  const endX =
    Math.floor(
      width * .95
    );


  const samples =
    Math.ceil(
      (
        endX -
        startX
      ) / 2
    );


  const scores = [];


  for(
    let y = 0;
    y < height;
    y++
  ){

    let dark = 0;


    for(
      let x = startX;
      x < endX;
      x += 2
    ){

      const index =
        (
          y * width +
          x
        ) * 4;


      if(
        data[index] <
        155
      ){

        dark++;
      }
    }


    scores.push(
      dark /
      samples
    );
  }


  const raw = [];


  /*
    원근 보정 후라
    V4보다 약간 완화 가능
  */

  for(
    let y = 0;
    y < height;
    y++
  ){

    if(
      scores[y] >= .23
    ){

      raw.push(y);
    }
  }


  const groups = [];


  for(
    const y
    of raw
  ){

    const last =
      groups[
        groups.length - 1
      ];


    if(
      !last ||
      y - last.end > 5
    ){

      groups.push({
        start:y,
        end:y
      });

    }else{

      last.end = y;
    }
  }


  const lines =
    groups
    .map(
      group =>
        Math.round(
          (
            group.start +
            group.end
          ) / 2
        )
    );


  return {
    lines,
    scores
  };
}


/* =========================================================
   35행 Grid 찾기

   36개 경계선을 전부 검출하지 못해도
   반복되는 행 간격을 이용해 복원
========================================================= */

function find35RowGrid(
  lineData,
  imageHeight
){

  const lines =
    lineData.lines;


  if(
    lines.length < 12
  ){

    return null;
  }


  /*
    인접선 간격
  */

  const gaps = [];


  for(
    let i = 1;
    i < lines.length;
    i++
  ){

    const gap =
      lines[i] -
      lines[i-1];


    if(
      gap >= 7 &&
      gap <=
      imageHeight * .08
    ){

      gaps.push(gap);
    }
  }


  if(
    gaps.length < 6
  ){

    return null;
  }


  /*
    가장 흔한 행 높이 탐색
  */

  const buckets = {};


  for(
    const gap
    of gaps
  ){

    const key =
      Math.round(
        gap / 2
      ) * 2;


    buckets[key] =
      (
        buckets[key] ||
        0
      ) + 1;
  }


  const rowHeight =
    Number(
      Object.keys(
        buckets
      )
      .sort(
        (a,b) =>
          buckets[b] -
          buckets[a]
      )[0]
    );


  if(
    !Number.isFinite(
      rowHeight
    ) ||
    rowHeight < 7
  ){

    return null;
  }


  /*
    각 선을 35행 표의 시작 후보로 놓고
    이후 예상 선과 실제 선이 얼마나 일치하는지 검사
  */

  let best = null;


  for(
    const top
    of lines
  ){

    let matches = 0;


    for(
      let row = 0;
      row <= 35;
      row++
    ){

      const expected =
        top +
        rowHeight *
        row;


      if(
        expected >
        imageHeight
      ){
        break;
      }


      const nearest =
        lines.some(
          y =>
            Math.abs(
              y -
              expected
            ) <=
            Math.max(
              4,
              rowHeight *
              .25
            )
        );


      if(nearest){
        matches++;
      }
    }


    if(
      !best ||
      matches >
      best.matches
    ){

      best = {
        top,
        matches
      };
    }
  }


  if(
    !best ||
    best.matches < 8
  ){

    return null;
  }


  let top =
    best.top;


  /*
    35행이 이미지 안에 들어오도록 보정
  */

  if(
    top +
    rowHeight * 35 >
    imageHeight
  ){

    top =
      Math.max(
        0,
        imageHeight -
        rowHeight * 35
      );
  }


  const boundaries = [];


  for(
    let i = 0;
    i <= 35;
    i++
  ){

    boundaries.push(
      top +
      rowHeight *
      i
    );
  }


  return {

    top,

    bottom:
      top +
      rowHeight *
      35,

    rowHeight,

    boundaries,

    detectedLines:
      lines.length,

    matchedLines:
      best.matches

  };
}


/* =========================================================
   행 Bounds
========================================================= */

function getRowBounds(
  grid,
  rowNumber
){

  const top =
    grid.boundaries[
      rowNumber - 1
    ];


  const bottom =
    grid.boundaries[
      rowNumber
    ];


  return {
    top,
    bottom,
    height:
      bottom - top
  };
}

   보정된 표 전체 폭 기준
========================================================= */

const PATROL_COLUMNS = {

  temperature:{
    x0:.40,
    x1:.51
  },

  state:{
    x0:.74,
    x1:.87
  },

  remark:{
    x0:.87,
    x1:.995
  }

};


/* =========================================================
   표 좌우 범위
========================================================= */

function getTableRangeV41(
  canvas
){

  return {
    left:
      canvas.width * .025,

    right:
      canvas.width * .985
  };

}


/* =========================================================
   순찰일지 셀 자르기
========================================================= */

function cropPatrolCellV41(
  canvas,
  grid,
  rowNumber,
  tableRange,
  column
){

  const row =
    getRowBounds(
      grid,
      rowNumber
    );


  const tableWidth =
    tableRange.right -
    tableRange.left;


  const x0 =
    tableRange.left +
    tableWidth *
    column.x0;


  const x1 =
    tableRange.left +
    tableWidth *
    column.x1;


  /*
    표 선 자체를 최대한 제외
  */

  const padY =
    Math.max(
      2,
      row.height * .16
    );


  const padX =
    Math.max(
      2,
      (
        x1 -
        x0
      ) * .04
    );


  return cropCanvas(

    canvas,

    x0 +
    padX,

    row.top +
    padY,

    (
      x1 -
      x0
    ) -
    padX * 2,

    row.height -
    padY * 2

  );

}


/* =========================================================
   ★ 셀 실제 필기량 측정

   단순 OCR 결과가 아니라
   이미지 픽셀 자체를 확인.

   빈 종이에 인쇄선/노이즈만 있으면
   EMPTY 처리.
========================================================= */

function measureCellInkV41(
  canvas
){

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const data =
    image.data;


  let dark =
    0;


  let strongDark =
    0;


  let total =
    0;


  /*
    가장자리 표 선 제외
  */

  const marginX =
    Math.max(
      1,
      Math.floor(
        canvas.width *
        .06
      )
    );


  const marginY =
    Math.max(
      1,
      Math.floor(
        canvas.height *
        .10
      )
    );


  for(
    let y = marginY;
    y <
    canvas.height -
    marginY;
    y++
  ){

    for(
      let x = marginX;
      x <
      canvas.width -
      marginX;
      x++
    ){

      const index =
        (
          y *
          canvas.width +
          x
        ) * 4;


      const gray =

        data[index] *
        .299 +

        data[index + 1] *
        .587 +

        data[index + 2] *
        .114;


      if(
        gray <
        180
      ){

        dark++;
      }


      if(
        gray <
        115
      ){

        strongDark++;
      }


      total++;
    }
  }


  return {

    darkRatio:
      total
      ?
      dark /
      total
      :
      0,

    strongDarkRatio:
      total
      ?
      strongDark /
      total
      :
      0

  };

}


/* =========================================================
   ★ 빈 셀 판정

   빈칸이면 OCR 자체를 안 돌림.
========================================================= */

function isBlankCellV41(
  canvas,
  type
){

  const ink =
    measureCellInkV41(
      canvas
    );


  /*
    온도 숫자는 필기량이 작을 수 있어서
    상태/비고보다 조금 느슨하게.
  */

  if(
    type ===
    "temperature"
  ){

    return (

      ink.darkRatio <
      .010

      &&

      ink.strongDarkRatio <
      .003

    );

  }


  return (

    ink.darkRatio <
    .014

    &&

    ink.strongDarkRatio <
    .004

  );

}


/* =========================================================
   OCR 확대
========================================================= */

function enlargeCanvasV41(
  source,
  scale = 3
){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        source.width *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        source.height *
        scale
      )
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(

    source,

    0,
    0,

    canvas.width,
    canvas.height

  );


  return canvas;

}


/* =========================================================
   OCR
========================================================= */

async function recognizeCellV41(
  canvas,
  type
){

  if(
    isBlankCellV41(
      canvas,
      type
    )
  ){

    return {
      blank:true,
      text:""
    };

  }


  const enlarged =
    enlargeCanvasV41(
      canvas,
      3
    );


  const w =
    await getWorker();


  const options = {

    tessedit_pageseg_mode:
      Tesseract.PSM.SINGLE_LINE

  };


  if(
    type ===
    "temperature"
  ){

    options.tessedit_char_whitelist =
      "0123456789OoIl|";

  }


  const result =
    await w.recognize(
      enlarged,
      options
    );


  return {

    blank:false,

    text:
      clean(
        result.data.text
      )

  };

}


/* =========================================================
   온도 추출

   말도 안 되는 숫자는 폐기.
========================================================= */

function extractTemperatureV41(
  text
){

  const value =
    clean(
      text
    )
    .replace(
      /[Oo]/g,
      "0"
    )
    .replace(
      /[Il|]/g,
      "1"
    );


  const matches =
    value.match(
      /\d{1,4}/g
    ) || [];


  for(
    const item
    of matches
  ){

    const number =
      Number(
        item
      );


    if(
      Number.isFinite(
        number
      )
      &&
      number >= 0
      &&
      number <= 1800
    ){

      return number;

    }

  }


  return null;

}


/* =========================================================
   상태 추출
========================================================= */

function extractStateV41(
  text,
  equipment
){

  const value =
    compact(
      text
    );


  if(
    value.includes(
      "승온"
    )
  ){

    return "승온중";

  }


  if(
    value.includes(
      "유지"
    )
  ){

    return "유지중";

  }


  if(
    value.includes(
      "냉각"
    )
  ){

    return "냉각중";

  }


  if(
    /^HIP[123]$/.test(
      equipment
    )
    &&
    value.includes(
      "가압"
    )
  ){

    return "가압중";

  }


  return "";

}


/* =========================================================
   비고 제외 판정

   냉각 / 언로딩대기
========================================================= */

function checkRemarkV41(
  text
){

  const value =
    compact(
      text
    );


  const unload =

    value.includes(
      "언로딩대기"
    )

    ||

    (
      value.includes(
        "언로딩"
      )
      &&
      value.includes(
        "대기"
      )
    );


  const cooling =

    value ===
    "냉각"

    ||

    value.includes(
      "냉각/"
    )

    ||

    value.includes(
      "/냉각"
    );


  return {
    unload,
    cooling
  };

}


/* =========================================================
   순찰일지 일반 장비 한 행
========================================================= */

async function analyzePatrolRowV41(
  canvas,
  grid,
  tableRange,
  rowNumber,
  equipment
){

  /*
    온도
  */

  const temperatureCell =
    cropPatrolCellV41(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.temperature

    );


  const temperatureOCR =
    await recognizeCellV41(
      temperatureCell,
      "temperature"
    );


  const temperature =

    temperatureOCR.blank
    ?
    null
    :
    extractTemperatureV41(
      temperatureOCR.text
    );


  /*
    상태
  */

  const stateCell =
    cropPatrolCellV41(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.state

    );


  const stateOCR =
    await recognizeCellV41(
      stateCell,
      "state"
    );


  const state =

    stateOCR.blank
    ?
    ""
    :
    extractStateV41(
      stateOCR.text,
      equipment
    );


  /*
    비고
  */

  const remarkCell =
    cropPatrolCellV41(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.remark

    );


  const remarkOCR =
    await recognizeCellV41(
      remarkCell,
      "remark"
    );


  const remarkCheck =

    remarkOCR.blank
    ?
    {
      unload:false,
      cooling:false
    }
    :
    checkRemarkV41(
      remarkOCR.text
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature,

    state,

    unload:
      remarkCheck.unload,

    remarkCooling:
      remarkCheck.cooling,

    blank:{
      temperature:
        temperatureOCR.blank,

      state:
        stateOCR.blank,

      remark:
        remarkOCR.blank
    },

    raw:{
      temperature:
        temperatureOCR.text,

      state:
        stateOCR.text,

      remark:
        remarkOCR.text
    }

  };

}


/* =========================================================
   온도 전용 행

   드라이챔버 / 소각기
========================================================= */

async function analyzeTemperatureOnlyV41(
  canvas,
  grid,
  tableRange,
  rowNumber,
  equipment
){

  const cell =
    cropPatrolCellV41(

      canvas,
      grid,
      rowNumber,
      tableRange,
      PATROL_COLUMNS.temperature

    );


  const ocr =
    await recognizeCellV41(
      cell,
      "temperature"
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature:
      ocr.blank
      ?
      null
      :
      extractTemperatureV41(
        ocr.text
      ),

    blank:
      ocr.blank,

    raw:
      ocr.text

  };

}


/* =========================================================
   ★ 사진1 전체 분석

   원본
   ↓
   OpenCV 자동보정
   ↓
   35행
   ↓
   빈칸 검사
   ↓
   OCR
========================================================= */

async function analyzePatrolPhotoV41(
  file
){

  setStatus(
    "순찰일지 사진 준비중...",
    5
  );


  const original =
    await fileToCanvas(
      file,
      2400
    );


  setStatus(
    "순찰일지 자동 보정중...",
    9
  );


  const correction =
    await autoCorrectPhoto(
      original
    );


  const canvas =
    correction.canvas;


  setStatus(
    correction.corrected
    ?
    "사진 원근 보정 완료 · 표 찾는 중..."
    :
    "외곽 미검출 · 원본에서 표 찾는 중...",
    13
  );


  const horizontal =
    detectHorizontalLines(
      canvas
    );


  const grid =
    find35RowGrid(
      horizontal,
      canvas.height
    );


  if(!grid){

    return {

      fatal:true,

      reason:
        `35행 표를 찾지 못했습니다. 가로선 ${horizontal.lines.length}개 감지.`,

      corrected:
        correction.corrected

    };

  }


  const tableRange =
    getTableRangeV41(
      canvas
    );


  const rows =
    getPatrolRows();


  const items = {};


  const dry = [];


  const incinerators = [];


  let temperatureRead =
    0;


  let stateRead =
    0;


  let blankTemperature =
    0;


  const activeRows =
    Object
    .entries(
      rows
    )
    .filter(
      ([row,equipment]) =>
        !!equipment
    );


  let completed =
    0;


  for(
    const [
      rowText,
      equipment
    ]
    of activeRows
  ){

    const rowNumber =
      Number(
        rowText
      );


    completed++;


    setStatus(

      `순찰일지 ${rowNumber}행 판독중...`,

      16 +
      Math.round(
        completed /
        activeRows.length *
        38
      )

    );


    /*
      드라이챔버
    */

    if(
      DRY_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await analyzeTemperatureOnlyV41(

          canvas,
          grid,
          tableRange,
          rowNumber,
          equipment

        );


      if(
        item.temperature !==
        null
      ){

        temperatureRead++;

      }else if(
        item.blank
      ){

        blankTemperature++;

      }


      dry.push(
        item
      );


      continue;

    }


    /*
      소각기
    */

    if(
      INCINERATOR_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await analyzeTemperatureOnlyV41(

          canvas,
          grid,
          tableRange,
          rowNumber,
          equipment

        );


      if(
        item.temperature !==
        null
      ){

        temperatureRead++;

      }else if(
        item.blank
      ){

        blankTemperature++;

      }


      incinerators.push(
        item
      );


      continue;

    }


    /*
      일반 장비
    */

    const item =
      await analyzePatrolRowV41(

        canvas,
        grid,
        tableRange,
        rowNumber,
        equipment

      );


    if(
      item.temperature !==
      null
    ){

      temperatureRead++;

    }else if(
      item.blank.temperature
    ){

      blankTemperature++;

    }


    if(
      item.state
    ){

      stateRead++;

    }


    items[
      equipment
    ] =
      item;

  }


  return {

    fatal:false,

    corrected:
      correction.corrected,

    correctionReason:
      correction.reason,

    detectedLines:
      horizontal.lines.length,

    matchedLines:
      grid.matchedLines,

    rowHeight:
      grid.rowHeight,

    temperatureRead,

    stateRead,

    blankTemperature,

    items,

    dry,

    incinerators

  };

}


/* =========================================================
   사진2 전체 OCR

   사진2 역시 자동 보정.
========================================================= */

async function recognizeNumberPhotoV41(
  file
){

  setStatus(
    "장비번호 사진 자동 보정중...",
    57
  );


  const original =
    await fileToCanvas(
      file,
      2200
    );


  const correction =
    await autoCorrectPhoto(
      original
    );


  const canvas =
    correction.canvas;


  setStatus(
    "장비번호 전체 구조 읽는 중...",
    61
  );


  const w =
    await getWorker();


  const result =
    await w.recognize(

      canvas,

      {
        tessedit_pageseg_mode:
          Tesseract.PSM.AUTO
      }

    );


  const words =
    (
      result.data.words ||
      []
    )
    .map(
      word => ({

        text:
          clean(
            word.text
          ),

        x0:
          word.bbox.x0,

        y0:
          word.bbox.y0,

        x1:
          word.bbox.x1,

        y1:
          word.bbox.y1,

        cx:
          (
            word.bbox.x0 +
            word.bbox.x1
          ) / 2,

        cy:
          (
            word.bbox.y0 +
            word.bbox.y1
          ) / 2,

        confidence:
          Number(
            word.confidence ||
            0
          )

      })
    )
    .filter(
      word =>
        !!word.text
    );


  return {

    canvas,

    corrected:
      correction.corrected,

    text:
      clean(
        result.data.text
      ),

    words

  };

}


/* =========================================================
   사진2 장비명 정규화
========================================================= */

function normalizeEquipmentV41(
  raw
){

  const value =
    compact(
      raw
    );


  let match;


  match =
    value.match(
      /TG[-]?([1-7])/
    );


  if(match){

    return "TG" +
      match[1];

  }


  match =
    value.match(
      /GF[-]?(1|3|4|5)/
    );


  if(match){

    return "GF" +
      match[1];

  }


  match =
    value.match(
      /CF[-]?([1-6])/
    );


  if(match){

    return "CF" +
      match[1];

  }


  match =
    value.match(
      /HIP[-]?([123])/
    );


  if(match){

    return "HIP" +
      match[1];

  }


  if(
    value.includes(
      "SMI"
    )
  ){

    return "SMI";

  }


  if(
    value.includes(
      "CF"
    )
    &&
    value.includes(
      "분위기"
    )
  ){

    return "CF분위기로";

  }


  return "";

}


/* =========================================================
   사진2 장비 앵커
========================================================= */

function findEquipmentAnchorsV41(
  ocr
){

  const map = {};


  for(
    const word
    of ocr.words
  ){

    const equipment =
      normalizeEquipmentV41(
        word.text
      );


    if(
      !equipment ||
      !NUMBER_EQUIPMENT.includes(
        equipment
      )
    ){

      continue;

    }


    const old =
      map[
        equipment
      ];


    if(
      !old ||
      word.confidence >
      old.confidence
    ){

      map[
        equipment
      ] = {

        equipment,

        ...word

      };

    }

  }


  return map;

}


/* =========================================================
   사진2 장비별 세로 영역
========================================================= */

function makeEquipmentBlocksV41(
  anchors,
  height
){

  const list =
    Object
    .values(
      anchors
    )
    .sort(
      (a,b) =>
        a.cy -
        b.cy
    );


  const blocks = {};


  for(
    let i = 0;
    i < list.length;
    i++
  ){

    const item =
      list[i];


    const previous =
      list[
        i - 1
      ];


    const next =
      list[
        i + 1
      ];


    const top =
      previous
      ?
      (
        previous.cy +
        item.cy
      ) / 2
      :
      Math.max(
        0,
        item.y0 -
        (
          item.y1 -
          item.y0
        )
      );


    const bottom =
      next
      ?
      (
        item.cy +
        next.cy
      ) / 2
      :
      Math.min(
        height,
        item.y1 +
        (
          item.y1 -
          item.y0
        ) * 3
      );


    blocks[
      item.equipment
    ] = {

      ...item,
      top,
      bottom

    };

  }


  return blocks;

}


/* =========================================================
   장비번호 추출
========================================================= */

function extractEquipmentNumberV41(
  raw
){

  let value =
    clean(
      raw
    )
    .replace(
      /[Oo]/g,
      "0"
    )
    .replace(
      /[—–‐~_.]/g,
      "-"
    );


  let match =
    value.match(
      /#?\s*26\s*-\s*(\d{1,3})/
    );


  if(match){

    return "#26-" +
      match[1];

  }


  match =
    value.match(
      /(?:^|\D)26(\d{2,3})(?:\D|$)/
    );


  if(match){

    return "#26-" +
      match[1];

  }


  return "";

}


/* =========================================================
   ★ 사진2 장비 행 직접 Crop

   전체 OCR에서 '가동'을 찾는 것만으로 끝내지 않고
   해당 장비 행 자체를 잘라서 한 번 더 읽는다.
========================================================= */

function cropNumberEquipmentRowV41(
  canvas,
  block
){

  const height =
    Math.max(
      10,
      block.bottom -
      block.top
    );


  /*
    장비명 오른쪽부터 사진 끝까지.
    번호 + 가동 셀이 포함됨.
  */

  const x =
    Math.max(
      0,
      block.x1 -
      canvas.width *
      .01
    );


  return cropCanvas(

    canvas,

    x,

    block.top,

    canvas.width -
    x,

    height

  );

}


/* =========================================================
   사진2 행 OCR
========================================================= */

async function recognizeNumberRowV41(
  canvas
){

  const enlarged =
    enlargeCanvasV41(
      canvas,
      2.5
    );


  const w =
    await getWorker();


  const result =
    await w.recognize(

      enlarged,

      {
        tessedit_pageseg_mode:
          Tesseract.PSM.SINGLE_BLOCK
      }

    );


  return clean(
    result.data.text
  );

}


/* =========================================================
   ★ 가동 판정 보정

   OCR 흔한 오인식도 일부 허용.
========================================================= */

function isRunningV41(
  text
){

  const value =
    compact(
      text
    );


  if(
    value.includes(
      "가동"
    )
  ){

    return true;

  }


  /*
    '가동'의 '가' 일부가 깨져
    '동'만 살아남는 경우.
    단, 한 글자 '동'만 보고 무조건 판단하지 않고
    번호가 있는 행에서만 PART 아래 로직에서 사용.
  */

  if(
    /(?:기|7|ㄱ)?동/.test(
      value
    )
  ){

    return true;

  }


  return false;

}


/* =========================================================
   사진2 전체 분석
========================================================= */

async function analyzeNumberPhotoV41(
  file
){

  const ocr =
    await recognizeNumberPhotoV41(
      file
    );


  const anchors =
    findEquipmentAnchorsV41(
      ocr
    );


  const blocks =
    makeEquipmentBlocksV41(

      anchors,

      ocr.canvas.height

    );


  const items = {};


  let processed =
    0;


  const equipmentList =
    Object.keys(
      blocks
    );


  for(
    const equipment
    of equipmentList
  ){

    processed++;


    setStatus(

      `장비번호 ${equipment} 확인중...`,

      65 +
      Math.round(
        processed /
        Math.max(
          1,
          equipmentList.length
        ) *
        20
      )

    );


    const block =
      blocks[
        equipment
      ];


    /*
      먼저 전체 OCR word를 같은 행에서 합침
    */

    const rowWords =
      ocr.words
      .filter(
        word =>
          word.cy >=
          block.top
          &&
          word.cy <
          block.bottom
      )
      .sort(
        (a,b) =>
          a.x0 -
          b.x0
      )
      .map(
        word =>
          word.text
      )
      .join(
        " "
      );


    /*
      행 자체를 다시 OCR
    */

    const rowCanvas =
      cropNumberEquipmentRowV41(

        ocr.canvas,

        block

      );


    const directText =
      await recognizeNumberRowV41(
        rowCanvas
      );


    const combined =
      clean(
        rowWords +
        " " +
        directText
      );


    const number =
      extractEquipmentNumberV41(
        combined
      );


    /*
      번호가 있는 행에서만
      가동 판정을 사용
    */

    const running =
      !!number &&
      isRunningV41(
        combined
      );


    items[
      equipment
    ] = {

      equipment,

      found:true,

      number,

      running,

      raw:
        combined

    };

  }


  /*
    못 찾은 장비도 명시
  */

  for(
    const equipment
    of NUMBER_EQUIPMENT
  ){

    if(
      !items[
        equipment
      ]
    ){

      items[
        equipment
      ] = {

        equipment,

        found:false,

        number:"",

        running:false,

        raw:""

      };

    }

  }


  const foundCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        item.found
    )
    .length;


  const numberCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        !!item.number
    )
    .length;


  const runningCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        !!item.number &&
        item.running
    )
    .length;


  return {

    corrected:
      ocr.corrected,

    items,

    foundCount,

    numberCount,

    runningCount

  };

}


/* =========================================================
   제외 규칙
========================================================= */

function getExcludeReasonV41(
  equipment,
  patrol,
  number
){

  if(
    !number ||
    !number.found
  ){

    return "장비번호 사진에서 장비명 미인식";

  }


  if(
    !number.number
  ){

    return "장비번호 없음";

  }


  if(
    !number.running
  ){

    return "가동 확인 안 됨";

  }


  if(!patrol){

    return "순찰일지 데이터 없음";

  }


  if(
    patrol.temperature ===
    null
  ){

    return patrol.blank?.temperature
      ?
      "순찰일지 온도 빈칸"
      :
      "온도 인식 실패";

  }


  if(
    !patrol.state
  ){

    return patrol.blank?.state
      ?
      "순찰일지 상태 빈칸"
      :
      "상태 인식 실패";

  }


  /*
    비고 냉각 / 언로딩대기
  */

  if(
    patrol.unload
  ){

    return "언로딩대기";

  }


  if(
    patrol.remarkCooling
  ){

    return "비고 냉각";

  }


  /*
    HIP 냉각 제외
  */

  if(
    /^HIP[123]$/.test(
      equipment
    )
    &&
    patrol.state ===
    "냉각중"
  ){

    return "HIP 냉각";

  }


  /*
    100도 이하 냉각 제외
  */

  if(
    patrol.temperature <=
    100
    &&
    patrol.state ===
    "냉각중"
  ){

    return "100도 이하 냉각";

  }


  return "";

}


/* =========================================================
   두 사진 합치기
========================================================= */

function mergeV41(
  patrol,
  number
){

  const included = [];


  const excluded = [];


  for(
    const equipment
    of REPORT_ORDER
  ){

    const patrolItem =
      patrol.items[
        equipment
      ];


    const numberItem =
      number.items[
        equipment
      ];


    const reason =
      getExcludeReasonV41(

        equipment,

        patrolItem,

        numberItem

      );


    if(reason){

      excluded.push({

        equipment,

        reason,

        patrol:
          patrolItem,

        number:
          numberItem

      });


      continue;

    }


    included.push({

      equipment,

      number:
        numberItem.number,

      temperature:
        patrolItem.temperature,

      state:
        patrolItem.state

    });

  }


  /*
    TG1:
    순찰일지에 없음.
    번호 + 가동이면 출력.
  */

  let tg1 = null;


  const tg1Number =
    number.items[
      "TG1"
    ];


  if(
    tg1Number &&
    tg1Number.number &&
    tg1Number.running
  ){

    tg1 = {

      equipment:"TG1",

      number:
        tg1Number.number

    };

  }


  /*
    드라이챔버:
    온도만
  */

  const dry =
    patrol.dry
    .filter(
      item =>
        item.temperature !==
        null
    );


  /*
    소각기:
    온도만
  */

  const incinerators =
    patrol.incinerators
    .filter(
      item =>
        item.temperature !==
        null
    );


  return {

    included,

    excluded,

    tg1,

    dry,

    incinerators

  };

}


/* =========================================================
   검증
========================================================= */

function validateV41(
  patrol,
  number,
  merged
){

  const problems = [];


  if(
    patrol.matchedLines <
    8
  ){

    problems.push(
      `순찰일지 표 일치선이 ${patrol.matchedLines}개뿐입니다.`
    );

  }


  if(
    number.foundCount <
    4
  ){

    problems.push(
      `장비번호 사진에서 장비명을 ${number.foundCount}개만 찾았습니다.`
    );

  }


  /*
    사진2에서 번호는 읽었는데
    가동이 하나도 없다면 경고.

    단, 사용자가 실제로 전부 미가동인 사진일 수도 있으므로
    분석 자체를 무조건 실패시키지는 않는다.
  */

  if(
    number.numberCount >
    0
    &&
    number.runningCount ===
    0
  ){

    problems.push(
      `장비번호 ${number.numberCount}개를 읽었지만 '가동'을 확인하지 못했습니다.`
    );

  }


  return {

    valid:
      problems.length ===
      0,

    problems

  };

}

  );

    .add(

    );

  /*

  */

  .textContent =

  .innerHTML = "";


  for(
    const item
    of merged.excluded
  ){

    const div =
      document.createElement(
        "div"
      );

      item.number?.number ||

    let detail = "";


    if(
      item.patrol?.temperature !==
      null
      &&
      item.patrol?.temperature !==
      undefined
    ){

      detail +=
        `${item.patrol.temperature}도 `;

    }


    if(
      item.patrol?.state
    ){

      detail +=
        item.patrol.state;

    }


    div.innerHTML =

      `<b>${numberText} ${item.equipment}</b>`

      +

      (
        detail
        ?
        `<br>${detail}`
        :
        ""
      )

      +

      `<br>→ ${item.reason}`;


    $("excluded")
    .appendChild(
      div
    );

  }


  $("count")
  .textContent =

    `${merged.included.length}개 표시`;


  $("resultCard")
  .classList
  .remove(
    "hidden"
  );


  $("resultCard")
  .scrollIntoView({

    behavior:"smooth",

    block:"start"

  });

}

$("analyze")

async () => {

  ){

    );

    /*

    */

      );

    ){

      throw new Error(

      );

    }


    /*

    */

      );

    );


    const merged =
      mergeV41(

      );

      );

    );

      number,
      merged,
      validation

    );


  }catch(error){

    console.error(
      error
    );


    analysisResult =
      null;


    $("resultCard")
    .classList
    .remove(
      "hidden"
    );


    $("fatalWarning")
    .classList
    .remove(
      "hidden"
    );

    .disabled =

    );

/* =========================================================
   날짜
========================================================= */

function getTodayV41(){

  const now =
    new Date();


  const weekdays = [
    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"
  ];


  return {

    month:
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      ),

    day:
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      ),

    weekday:
      weekdays[
        now.getDay()
      ]

  };

}


/* =========================================================
   근무명
========================================================= */

function getWorkNameV41(){

  if(
    workType ===
    "weekday"
  ){

    return "주간";

  }


  if(
    workType ===
    "holiday"
  ){

    return "휴일주간";

  }


  return "야간";

}


/* =========================================================
   번호 표시

   내부:
   #26-118

   보고서:
   26-118
========================================================= */

function displayNumberV41(
  number
){

  return String(
    number || ""
  )
  .replace(
    /^#/,
    ""
  );

}


/* =========================================================
   일반 장비 정렬

   사진2에서 장비 순서가 바뀌어 있어도
   최종 보고서는 우리가 정한 순서로 출력.
========================================================= */

function sortReportItemsV41(
  items
){

  return [
    ...items
  ]
  .sort(
    (a,b) => {

      const ai =
        REPORT_ORDER.indexOf(
          a.equipment
        );


      const bi =
        REPORT_ORDER.indexOf(
          b.equipment
        );


      return ai - bi;

    }
  );

}


/* =========================================================
   일반 장비 한 줄

   예:
   26-118 CF5 530도 유지중
========================================================= */

function makeEquipmentLineV41(
  item
){

  return (

    displayNumberV41(
      item.number
    )

    + " " +

    item.equipment

    + " " +

    item.temperature

    + "도 " +

    item.state

  );

}


/* =========================================================
   TG1

   순찰일지에는 없음.

   사진2에서
   번호 + 가동 확인된 경우만:

   26-xxx TG1
========================================================= */

function makeTG1LineV41(
  tg1
){

  if(!tg1){

    return "";

  }


  return (

    displayNumberV41(
      tg1.number
    )

    + " TG1"

  );

}


/* =========================================================
   드라이챔버 표시
========================================================= */

function dryDisplayNameV41(
  equipment
){

  if(
    equipment ===
    "구형드라이챔버"
  ){

    return "구형 드라이챔버";

  }


  if(
    equipment ===
    "신형드라이챔버"
  ){

    return "신형 드라이챔버";

  }


  return equipment;

}


/* =========================================================
   소각기 표시
========================================================= */

function incineratorDisplayNameV41(
  equipment
){

  if(
    equipment ===
    "1동소각기"
  ){

    return "1동";

  }


  if(
    equipment ===
    "3동소각기"
  ){

    return "3동";

  }


  return equipment;

}


/* =========================================================
   최종 보고서 생성
========================================================= */

function buildFinalReportV41(){

  if(
    !analysisResult
  ){

    return "";

  }


  if(
    !analysisResult.validation.valid
  ){

    return "";

  }


  const merged =
    analysisResult.merged;


  const today =
    getTodayV41();


  const workName =
    getWorkNameV41();


  const lines = [];


/* ---------------------------------------------------------
   보고자
--------------------------------------------------------- */

  lines.push(

    `${today.month}월 ${today.day}일 (${today.weekday}) ${workName}근무자`

  );


  lines.push(

    `${rank}입니다.`

  );


  lines.push("");


/* ---------------------------------------------------------
   장비가동현황
--------------------------------------------------------- */

  lines.push(
    '"장비가동현황"'
  );


  const sorted =
    sortReportItemsV41(
      merged.included
    );


  for(
    const item
    of sorted
  ){

    lines.push(

      makeEquipmentLineV41(
        item
      )

    );

  }


/* ---------------------------------------------------------
   TG1

   일반 장비 목록의 맨 마지막.

   순찰일지에는 없으므로
   온도/상태 붙이지 않음.
--------------------------------------------------------- */

  if(
    merged.tg1
  ){

    lines.push(

      makeTG1LineV41(
        merged.tg1
      )

    );

  }


/* ---------------------------------------------------------
   드라이챔버

   번호 없음
   상태 없음
   온도만 출력
--------------------------------------------------------- */

  if(
    merged.dry &&
    merged.dry.length >
    0
  ){

    lines.push("");


    for(
      const item
      of merged.dry
    ){

      lines.push(

        `${dryDisplayNameV41(
          item.equipment
        )} ${item.temperature}도`

      );

    }

  }


/* ---------------------------------------------------------
   소각기

   별도 출력
   번호 없음
   온도만 출력
--------------------------------------------------------- */

  if(
    merged.incinerators &&
    merged.incinerators.length >
    0
  ){

    lines.push("");

    lines.push(
      "-TG소각기-"
    );


    /*
      1동 → 3동 순서 고정
    */

    const incinerators =
      [
        ...merged.incinerators
      ]
      .sort(
        (a,b) => {

          const order = [
            "1동소각기",
            "3동소각기"
          ];


          return (

            order.indexOf(
              a.equipment
            )

            -

            order.indexOf(
              b.equipment
            )

          );

        }
      );


    for(
      const item
      of incinerators
    ){

      lines.push(

        `${incineratorDisplayNameV41(
          item.equipment
        )} ${item.temperature}도`

      );

    }

  }


  return lines.join(
    "\n"
  );

}


/* =========================================================
   보고서 생성
========================================================= */

$("makeReport")
.onclick =
() => {

  if(
    !analysisResult
  ){

    alert(
      "먼저 사진을 분석해주세요."
    );

    return;

  }


  if(
    !analysisResult.validation.valid
  ){

    alert(
      "인식 결과를 먼저 확인해주세요."
    );

    return;

  }


  const report =
    buildFinalReportV41();


  if(!report){

    alert(
      "보고서를 생성할 수 없습니다."
    );

    return;

  }


  $("report").value =
    report;


  $("reportCard")
  .classList
  .remove(
    "hidden"
  );


  $("reportCard")
  .scrollIntoView({

    behavior:
      "smooth",

    block:
      "start"

  });

};


/* =========================================================
   iPhone 복사 fallback
========================================================= */

function fallbackCopyV41(){

  const textarea =
    $("report");


  textarea.focus();


  textarea.select();


  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  return document.execCommand(
    "copy"
  );

}


/* =========================================================
   복사 버튼 문구
========================================================= */

function showCopiedV41(){

  const button =
    $("copy");


  button.textContent =
    "복사 완료 ✓";


  setTimeout(
    () => {

      button.textContent =
        "전체 복사";

    },
    1300
  );

}


/* =========================================================
   전체 복사
========================================================= */

$("copy")
.onclick =
async () => {

  const text =
    $("report").value;


  if(!text){

    return;

  }


  try{

    /*
      HTTPS + 지원 브라우저
    */

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator
      .clipboard
      .writeText(
        text
      );


      showCopiedV41();

      return;

    }


    /*
      구형 iPhone Safari
    */

    const success =
      fallbackCopyV41();


    if(success){

      showCopiedV41();

      return;

    }


    throw new Error(
      "clipboard unavailable"
    );


  }catch(error){

    try{

      const success =
        fallbackCopyV41();


      if(success){

        showCopiedV41();

        return;

      }

    }catch(copyError){

      console.warn(
        copyError
      );

    }


    alert(
      "자동 복사가 차단됐습니다. 보고서 내용을 길게 눌러 복사해주세요."
    );

  }

};
