<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>DACC</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#f5f7fb;color:#182033;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif
}
button,input,textarea{font:inherit}
.app{max-width:520px;margin:auto;padding:24px 16px 60px}
.logo{font-size:13px;font-weight:900;letter-spacing:2px;color:#5270e8}
h1{font-size:25px;margin:5px 0}
.desc{font-size:13px;color:#929bad;margin:0 0 20px}
.card{
  background:#fff;border:1px solid #e1e6ef;border-radius:20px;
  padding:17px;margin-bottom:15px;box-shadow:0 5px 22px rgba(25,35,60,.04)
}
.title{font-size:16px;font-weight:900}
.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rank{display:flex;gap:5px}
.rank button,.work button{
  border:1px solid #dde3ed;background:#fff;color:#7b8495;
  border-radius:10px;font-weight:900
}
.rank button{padding:7px 10px;font-size:12px}
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.work button{height:45px;font-size:12px}
button.active{
  background:#edf1ff!important;border-color:#6f88ef!important;color:#4966df!important
}
.upload{
  display:block;margin-top:11px;padding:22px 12px;text-align:center;
  border:1px dashed #d4dbe8;border-radius:15px;background:#f9faff
}
.plus{
  width:42px;height:42px;margin:auto auto 8px;border-radius:50%;
  display:grid;place-items:center;background:#edf1ff;color:#5270e8;font-size:26px
}
.upload b{font-size:14px}
.upload small{display:block;color:#9ba4b4;font-size:11px;margin-top:5px}
input[type=file]{display:none}
.preview{
  height:165px;position:relative;overflow:hidden;border-radius:14px;margin-top:10px;background:#eee
}
.preview img{width:100%;height:100%;object-fit:cover}
.preview span{
  position:absolute;left:9px;bottom:9px;padding:5px 8px;border-radius:7px;
  color:#fff;background:rgba(20,25,35,.8);font-size:11px
}
.preview button{
  position:absolute;right:9px;top:9px;width:30px;height:30px;border:0;
  border-radius:50%;background:rgba(20,25,35,.8);color:#fff
}
.primary{
  width:100%;height:53px;border:0;border-radius:14px;margin-top:14px;
  background:#5270e8;color:#fff;font-weight:900
}
.primary:disabled{background:#c7cedd}
.status{
  margin-top:12px;padding:12px;border-radius:12px;background:#f5f7fb;
  color:#68748a;font-size:12px
}
.track{height:7px;background:#e2e6ee;border-radius:10px;overflow:hidden;margin-top:8px}
.bar{height:100%;width:0;background:#5270e8;transition:.2s}
.hidden{display:none!important}

.result{
  display:grid;grid-template-columns:25px 1fr auto;gap:8px;
  align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4
}
.check{
  width:23px;height:23px;border-radius:50%;background:#e7f8ef;
  color:#1ea465;display:grid;place-items:center;font-size:12px;font-weight:900
}
.main{font-size:13px;font-weight:900}
.sub{font-size:11px;color:#8d96a8;margin-top:3px}
.badge{
  background:#f0f3f8;color:#6b7588;border-radius:7px;padding:5px 7px;
  font-size:10px;font-weight:900
}
.warning{
  margin-top:12px;padding:13px;border-radius:12px;background:#fff7e8;
  color:#9a6813;font-size:12px;line-height:1.5
}
.excludedBtn{
  width:100%;height:47px;border:0;border-radius:12px;margin-top:12px;
  padding:0 13px;background:#f1f3f7;color:#606a7d;font-weight:900;
  display:flex;justify-content:space-between;align-items:center
}
.excluded{margin-top:7px;background:#f8f9fb;border-radius:12px;overflow:hidden}
.excluded div{padding:11px 12px;border-bottom:1px solid #e6eaf0;font-size:12px;color:#727d90}
textarea{
  width:100%;min-height:500px;border:1px solid #dfe4ed;border-radius:14px;
  padding:15px;background:#fbfcfe;resize:vertical;font-size:13px;line-height:1.7
}
.debug{
  margin-top:12px;padding:10px;border-radius:10px;background:#111827;
  color:#dbe4f3;font-family:monospace;font-size:10px;white-space:pre-wrap;
  max-height:250px;overflow:auto
}
</style>
</head>

<body>
<main class="app">

<div class="logo">DACC</div>
<h1>장비 가동현황 작성</h1>
<p class="desc">사진 2장을 분석해 장비 현황 보고서를 작성합니다.</p>

<section class="card">

<div class="flex">
  <div class="title">근무 구분</div>

  <div class="rank">
    <button data-rank="대리">대리</button>
    <button data-rank="주임">주임</button>
    <button data-rank="사원" class="active">사원</button>
  </div>
</div>

<div class="work">
  <button data-work="weekday" class="active">평일주간</button>
  <button data-work="holiday">휴일주간</button>
  <button data-work="night">야간</button>
</div>

</section>

<section class="card">

<div class="title">사진 1 · 순찰일지</div>

<label class="upload" for="patrolFile">
  <div class="plus">+</div>
  <b>순찰일지 사진 추가</b>
  <small>장비명 · 온도 · 승온/유지/냉각/가압 · 비고 판독</small>
</label>

<input id="patrolFile" type="file" accept="image/*">
<div id="patrolPreview"></div>

<div class="title" style="margin-top:18px">사진 2 · 장비번호</div>

<label class="upload" for="numberFile">
  <div class="plus">+</div>
  <b>장비번호 사진 추가</b>
  <small>장비명 · 26-xxx · 가동 여부 판독</small>
</label>

<input id="numberFile" type="file" accept="image/*">
<div id="numberPreview"></div>

<button id="analyze" class="primary" disabled>두 사진 분석하기</button>

<div id="status" class="status hidden">
  <div id="statusText"></div>
  <div class="track"><div id="bar" class="bar"></div></div>
</div>

</section>

<section id="resultCard" class="card hidden">

<div class="flex">
  <div class="title">분석 결과</div>
  <div id="count" class="logo"></div>
</div>

<div id="fatalWarning" class="warning hidden"></div>

<div id="results"></div>

<div id="tg1Area" class="warning hidden"></div>

<button id="excludedBtn" class="excludedBtn">
  <span id="excludedCount">제외항목 0개</span>
  <span id="arrow">▼</span>
</button>

<div id="excluded" class="excluded hidden"></div>

<button id="makeReport" class="primary" disabled>보고서 생성</button>

</section>

<section id="reportCard" class="card hidden">
<div class="title" style="margin-bottom:12px">최종 보고서</div>
<textarea id="report"></textarea>
<button id="copy" class="primary">전체 복사</button>
</section>

</main>

<script>
/* =========================================================
   DACC V3
   장비명 앵커 기반 OCR
========================================================= */

const $ = id => document.getElementById(id);

let workType = "weekday";
let rank = "사원";

let patrolImage = null;
let numberImage = null;

let worker = null;

let analysisResult = null;


/* =========================================================
   확정 장비명
========================================================= */

const PATROL_EQUIPMENT = [
  "TG2","TG3","TG4","TG5","TG6","TG7",
  "GF1","GF3","GF4","GF5",
  "SMI",
  "CF1","CF2","CF3","CF4","CF5","CF6",
  "CF분위기로",
  "구형드라이챔버","신형드라이챔버",
  "1동소각기","3동소각기",
  "HIP1","HIP2","HIP3"
];

const NUMBER_EQUIPMENT = [
  "TG1",
  "TG2","TG3","TG4","TG5","TG6","TG7",
  "CF1","CF2","CF3","CF4","CF5","CF6",
  "GF1","GF3","GF4","GF5",
  "HIP1","HIP2","HIP3",
  "SMI",
  "CF분위기로",
  "구형드라이챔버",
  "신형드라이챔버"
];


/* =========================================================
   최종 일반 장비 출력 순서
========================================================= */

const REPORT_ORDER = [
  "TG2","TG3","TG4","TG5","TG6","TG7",
  "GF1","GF3","GF4","GF5",
  "SMI",
  "CF1","CF2","CF3","CF4","CF5","CF6",
  "CF분위기로",
  "HIP1","HIP2","HIP3"
];


/* =========================================================
   UI 선택
========================================================= */

document.querySelectorAll("[data-work]").forEach(btn => {
  btn.onclick = () => {
    workType = btn.dataset.work;

    document.querySelectorAll("[data-work]").forEach(x =>
      x.classList.toggle("active",x === btn)
    );
  };
});

document.querySelectorAll("[data-rank]").forEach(btn => {
  btn.onclick = () => {
    rank = btn.dataset.rank;

    document.querySelectorAll("[data-rank]").forEach(x =>
      x.classList.toggle("active",x === btn)
    );
  };
});


/* =========================================================
   사진
========================================================= */

$("patrolFile").onchange = e => {
  patrolImage = e.target.files?.[0] || null;

  showPreview(
    "patrolPreview",
    patrolImage,
    "순찰일지"
  );

  updateButton();
};

$("numberFile").onchange = e => {
  numberImage = e.target.files?.[0] || null;

  showPreview(
    "numberPreview",
    numberImage,
    "장비번호"
  );

  updateButton();
};

function updateButton(){
  $("analyze").disabled = !(patrolImage && numberImage);
}

function showPreview(id,file,label){

  const area = $(id);
  area.innerHTML = "";

  if(!file) return;

  const url = URL.createObjectURL(file);

  const box = document.createElement("div");
  box.className = "preview";

  const img = document.createElement("img");
  img.src = url;

  const tag = document.createElement("span");
  tag.textContent = label;

  box.appendChild(img);
  box.appendChild(tag);

  area.appendChild(box);
}


/* =========================================================
   진행률
========================================================= */

function status(text,percent){

  $("status").classList.remove("hidden");
  $("statusText").textContent = text;

  if(Number.isFinite(percent)){
    $("bar").style.width =
      Math.max(0,Math.min(100,percent)) + "%";
  }
}


/* =========================================================
   이미지 → Canvas

   아이폰 고해상도 사진 메모리 제한 대응
========================================================= */

async function fileToCanvas(file,maxSide = 2200){

  return new Promise((resolve,reject) => {

    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {

      const scale = Math.min(
        1,
        maxSide / Math.max(img.naturalWidth,img.naturalHeight)
      );

      const canvas = document.createElement("canvas");

      canvas.width =
        Math.round(img.naturalWidth * scale);

      canvas.height =
        Math.round(img.naturalHeight * scale);

      const ctx =
        canvas.getContext("2d",{willReadFrequently:true});

      ctx.drawImage(
        img,
        0,0,
        canvas.width,
        canvas.height
      );

      URL.revokeObjectURL(url);

      resolve(canvas);
    };

    img.onerror = reject;
    img.src = url;
  });
}


/* =========================================================
   OCR Worker
========================================================= */

async function getWorker(){

  if(worker) return worker;

  status("OCR 엔진 준비중...",4);

  worker = await Tesseract.createWorker(
    "kor+eng",
    1,
    {
      logger:m => {

        if(
          m.status &&
          Number.isFinite(m.progress)
        ){
          const p = Math.round(m.progress * 100);

          $("statusText").textContent =
            `${m.status} ${p}%`;
        }
      }
    }
  );

  return worker;
}


/* =========================================================
   전체 페이지 OCR

   핵심:
   단순 텍스트가 아니라
   words의 x/y 좌표까지 가져온다.
========================================================= */

async function fullOCR(canvas,label){

  const w = await getWorker();

  status(`${label} 전체 구조 읽는 중...`,10);

  const result =
    await w.recognize(
      canvas,
      {
        tessedit_pageseg_mode:
          Tesseract.PSM.AUTO
      }
    );

  const words =
    (result.data.words || [])
    .map(word => ({
      text:clean(word.text),

      x0:word.bbox.x0,
      y0:word.bbox.y0,
      x1:word.bbox.x1,
      y1:word.bbox.y1,

      cx:
        (word.bbox.x0 + word.bbox.x1) / 2,

      cy:
        (word.bbox.y0 + word.bbox.y1) / 2,

      width:
        word.bbox.x1 - word.bbox.x0,

      height:
        word.bbox.y1 - word.bbox.y0,

      confidence:
        Number(word.confidence || 0)
    }))
    .filter(word => word.text);

  return {
    text:clean(result.data.text),
    words,
    width:canvas.width,
    height:canvas.height
  };
}


/* =========================================================
   텍스트 정리
========================================================= */

function clean(value){

  return String(value || "")
    .replace(/[‐-‒–—―]/g,"-")
    .replace(/\s+/g," ")
    .trim();
}

function compact(value){
  return clean(value)
    .replace(/\s/g,"")
    .toUpperCase();
}


/* =========================================================
   장비명 표준화
========================================================= */

function normalizeEquipment(raw){

  const t = compact(raw);

  let m;

  m = t.match(/TG[-]?([1-7])/);
  if(m) return "TG" + m[1];

  m = t.match(/GF[-]?(1|3|4|5)/);
  if(m) return "GF" + m[1];

  m = t.match(/CF[-]?([1-6])/);
  if(m) return "CF" + m[1];

  m = t.match(/HIP[-]?([123])/);
  if(m) return "HIP" + m[1];

  if(t.includes("SMI"))
    return "SMI";

  if(
    t.includes("CF") &&
    (
      t.includes("분위기") ||
      t.includes("분위기로")
    )
  ){
    return "CF분위기로";
  }

  if(
    t.includes("구형") &&
    t.includes("드라이")
  ){
    return "구형드라이챔버";
  }

  if(
    t.includes("신형") &&
    t.includes("드라이")
  ){
    return "신형드라이챔버";
  }

  return "";
}


/* =========================================================
   OCR 장비명 보정

   순찰일지 인쇄명:
   TG2호기 등도 TG2로 정리
========================================================= */

function equipmentFromWord(word){

  if(!word) return "";

  return normalizeEquipment(
    word.text
      .replace(/호기/g,"")
  );
}


/* =========================================================
   장비명 앵커 찾기
========================================================= */

function findEquipmentAnchors(
  ocr,
  allowed
){

  const found = [];

  for(const word of ocr.words){

    const equipment =
      equipmentFromWord(word);

    if(
      equipment &&
      allowed.includes(equipment)
    ){

      found.push({
        equipment,
        x0:word.x0,
        x1:word.x1,
        y0:word.y0,
        y1:word.y1,
        cx:word.cx,
        cy:word.cy,
        confidence:word.confidence
      });
    }
  }

  /*
    같은 장비가 중복 인식되면
    신뢰도 높은 것 우선
  */

  const map = {};

  for(const item of found){

    if(
      !map[item.equipment] ||
      item.confidence >
      map[item.equipment].confidence
    ){
      map[item.equipment] = item;
    }
  }

  return map;
}


/* =========================================================
   같은 행의 단어 찾기

   장비명 중심 Y를 기준으로
   행 높이 범위 안에 있는 OCR word 수집
========================================================= */

function wordsOnSameRow(
  ocr,
  anchor,
  tolerance
){

  return ocr.words
    .filter(word =>
      Math.abs(word.cy - anchor.cy) <= tolerance
    )
    .sort((a,b) => a.x0 - b.x0);
}


/* =========================================================
   26-xxx 추출
========================================================= */

function extractNumber(text){

  let t = clean(text)
    .replace(/[Oo]/g,"0");

  let m =
    t.match(/#?\s*26\s*[-_.~]?\s*(\d{1,3})/);

  if(m)
    return "#26-" + m[1];

  /*
    2645 → 26-45
    26118 → 26-118
  */

  m = t.match(/\b26(\d{2,3})\b/);

  if(m)
    return "#26-" + m[1];

  return "";
}


/* =========================================================
   가동 판정
========================================================= */

function runningFromText(text){

  const t = compact(text);

  if(t.includes("가동"))
    return true;

  /*
    사진2에서 번호 자체가 있어도
    가동 글자가 없으면 가동으로 확정하지 않는다.
  */

  return false;
}


/* =========================================================
   상태 추출
========================================================= */

function extractState(text,equipment){

  const t = compact(text);

  if(t.includes("승온"))
    return "승온중";

  if(t.includes("유지"))
    return "유지중";

  if(
    /^HIP[123]$/.test(equipment) &&
    t.includes("가압")
  ){
    return "가압중";
  }

  if(t.includes("냉각"))
    return "냉각중";

  return "";
}


/* =========================================================
   온도 추출
========================================================= */

function extractTemperature(text){

  const t =
    clean(text)
    .replace(/[Oo]/g,"0")
    .replace(/[Il|]/g,"1");

  const nums =
    t.match(/\d{1,4}/g) || [];

  for(const raw of nums){

    const n = Number(raw);

    if(
      Number.isFinite(n) &&
      n >= 0 &&
      n <= 2000
    ){
      return n;
    }
  }

  return null;
}


/* =========================================================
   언로딩대기
========================================================= */

function unloadWaiting(text){

  const t =
    compact(text);

  return (
    t.includes("언로딩대기") ||
    (
      t.includes("언로딩") &&
      t.includes("대기")
    )
  );
}/* =========================================================
   DACC V3 - PART 2
   장비명 앵커 → 같은 행 값 매칭
========================================================= */


/* =========================================================
   여러 OCR word를 하나의 문자열로 합치기
========================================================= */

function joinWords(words){

  return words
    .sort((a,b) => a.x0 - b.x0)
    .map(word => word.text)
    .join(" ");
}


/* =========================================================
   행 높이 추정

   장비명 글자 높이를 기준으로
   같은 행 범위를 자동 계산한다.
========================================================= */

function getRowTolerance(anchor){

  return Math.max(
    16,
    anchor.height * 1.25
  );
}


/* =========================================================
   사진2:
   장비명 오른쪽에 있는 단어만 가져오기

   핵심:
   장비명 위치 기준으로 매칭하므로
   사진이 TG1부터 시작하지 않아도 됨.
========================================================= */

function rightWordsOnRow(
  ocr,
  anchor
){

  const tolerance =
    getRowTolerance(anchor);

  return ocr.words
    .filter(word => {

      const sameY =
        Math.abs(
          word.cy - anchor.cy
        ) <= tolerance;

      const rightSide =
        word.cx >
        anchor.cx;

      return sameY && rightSide;
    })
    .sort((a,b) => a.x0 - b.x0);
}


/* =========================================================
   사진2 한 장비 분석

   예:
   CF6 | 26-45
       | 가동

   "가동"이 번호보다 약간 아래쪽에 있어도
   같은 장비 블록으로 묶는다.
========================================================= */

function analyzeNumberAnchor(
  ocr,
  anchor
){

  /*
    번호/가동이 2줄 구조라
    장비명 높이보다 세로 범위를 넓게 사용
  */

  const verticalRange =
    Math.max(
      anchor.height * 2.8,
      34
    );


  const nearby =
    ocr.words
    .filter(word => {

      const rightSide =
        word.cx >
        anchor.cx;

      const sameBlock =
        Math.abs(
          word.cy - anchor.cy
        ) <= verticalRange;

      return (
        rightSide &&
        sameBlock
      );
    })
    .sort((a,b) => {

      if(
        Math.abs(a.cy - b.cy) < 10
      ){
        return a.x0 - b.x0;
      }

      return a.cy - b.cy;
    });


  const text =
    joinWords(
      [...nearby]
    );


  const number =
    extractNumber(text);


  const running =
    runningFromText(text);


  return {
    equipment:
      anchor.equipment,

    number,

    running,

    raw:text
  };
}


/* =========================================================
   다음 장비명까지의 Y 범위 계산

   사진2에서 "가동"이 장비명보다 아래에 있으므로
   다음 장비명과 섞이지 않도록 블록 경계를 만든다.
========================================================= */

function buildAnchorBlocks(
  anchors,
  imageHeight
){

  const list =
    Object.values(anchors)
    .sort((a,b) => a.cy - b.cy);


  const blocks = {};


  for(
    let i = 0;
    i < list.length;
    i++
  ){

    const current =
      list[i];

    const previous =
      list[i - 1];

    const next =
      list[i + 1];


    let top;

    let bottom;


    if(previous){

      top =
        (
          previous.cy +
          current.cy
        ) / 2;

    }else{

      top =
        Math.max(
          0,
          current.y0 -
          current.height
        );

    }


    if(next){

      bottom =
        (
          current.cy +
          next.cy
        ) / 2;

    }else{

      bottom =
        Math.min(
          imageHeight,
          current.y1 +
          current.height * 2.5
        );

    }


    blocks[
      current.equipment
    ] = {
      ...current,
      top,
      bottom
    };
  }


  return blocks;
}


/* =========================================================
   사진2 블록 기반 분석

   장비명 ~ 다음 장비명 사이에서
   번호 + 가동을 찾는다.

   이 방식이 PART1의 단순 같은행 방식보다
   사진2 양식에 더 적합하다.
========================================================= */

function analyzeNumberBlock(
  ocr,
  block
){

  const words =
    ocr.words
    .filter(word => {

      const insideY =
        word.cy >= block.top &&
        word.cy < block.bottom;

      /*
        장비명 자체보다 오른쪽에 있는 값만 사용
      */

      const rightSide =
        word.cx >
        block.x1;

      return (
        insideY &&
        rightSide
      );
    })
    .sort((a,b) => {

      if(
        Math.abs(
          a.cy - b.cy
        ) < 8
      ){
        return a.x0 - b.x0;
      }

      return a.cy - b.cy;
    });


  const raw =
    joinWords(
      [...words]
    );


  const number =
    extractNumber(raw);


  const running =
    runningFromText(raw);


  return {
    equipment:
      block.equipment,

    number,

    running,

    raw
  };
}


/* =========================================================
   사진2 전체 분석
========================================================= */

async function analyzeNumberPhoto(
  file
){

  status(
    "장비번호 사진 읽는 중...",
    10
  );


  const canvas =
    await fileToCanvas(
      file,
      2200
    );


  const ocr =
    await fullOCR(
      canvas,
      "장비번호"
    );


  status(
    "장비번호 장비명 찾는 중...",
    25
  );


  const anchors =
    findEquipmentAnchors(
      ocr,
      NUMBER_EQUIPMENT
    );


  const blocks =
    buildAnchorBlocks(
      anchors,
      ocr.height
    );


  const result = {};


  for(
    const equipment
    of NUMBER_EQUIPMENT
  ){

    const block =
      blocks[equipment];


    if(!block){

      result[equipment] = {
        equipment,
        number:"",
        running:false,
        found:false,
        raw:""
      };

      continue;
    }


    const parsed =
      analyzeNumberBlock(
        ocr,
        block
      );


    result[equipment] = {
      ...parsed,
      found:true
    };
  }


  return {
    result,
    anchors,
    anchorCount:
      Object.keys(
        anchors
      ).length,

    ocr
  };
}


/* =========================================================
   Canvas 영역 Crop
========================================================= */

function cropRect(
  source,
  x,
  y,
  width,
  height
){

  x =
    Math.max(
      0,
      Math.round(x)
    );

  y =
    Math.max(
      0,
      Math.round(y)
    );


  width =
    Math.max(
      1,
      Math.min(
        source.width - x,
        Math.round(width)
      )
    );


  height =
    Math.max(
      1,
      Math.min(
        source.height - y,
        Math.round(height)
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  canvas
    .getContext(
      "2d",
      {
        willReadFrequently:true
      }
    )
    .drawImage(

      source,

      x,
      y,
      width,
      height,

      0,
      0,
      width,
      height

    );


  return canvas;
}


/* =========================================================
   작은 셀 OCR

   순찰일지 손글씨는
   전체 페이지 OCR보다
   해당 셀만 크게 잘라 다시 OCR하는 게 유리함.
========================================================= */

async function cellOCR(
  canvas,
  type = "text"
){

  /*
    작은 손글씨 확대
  */

  const scale = 3;


  const big =
    document.createElement(
      "canvas"
    );


  big.width =
    canvas.width *
    scale;

  big.height =
    canvas.height *
    scale;


  const ctx =
    big.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.imageSmoothingEnabled =
    true;


  ctx.drawImage(

    canvas,

    0,
    0,

    big.width,
    big.height

  );


  const w =
    await getWorker();


  const options = {
    tessedit_pageseg_mode:
      Tesseract.PSM.SINGLE_LINE
  };


  if(
    type === "temperature"
  ){

    options.tessedit_char_whitelist =
      "0123456789OoIl|";
  }


  const result =
    await w.recognize(
      big,
      options
    );


  return {
    text:
      clean(
        result.data.text
      ),

    confidence:
      Number(
        result.data.confidence ||
        0
      )
  };
}


/* =========================================================
   순찰일지 장비명 앵커 보강

   Tesseract가
   TG2호기 → "TG2 호기"
   처럼 둘로 나누는 경우를 처리한다.
========================================================= */

function findPatrolAnchors(
  ocr
){

  const anchors =
    findEquipmentAnchors(
      ocr,
      PATROL_EQUIPMENT
    );


  /*
    CF분위기로 / 드라이챔버 / 소각기는
    한글 때문에 전체 OCR에서 놓칠 수 있음.

    이 장비들은 고정 행 구조를 보조적으로 사용.
    단, 일반 장비의 실제 매칭은 장비명 앵커 우선.
  */


  return anchors;
}


/* =========================================================
   순찰일지 표의 열 위치 추정

   장비명 앵커들의 X 위치를 기준으로
   장비명 열의 오른쪽 경계를 추정하고,
   실제 순찰일지 고정 열 비율을 적용한다.

   순찰일지 열:
   장비명
   판넬전원
   가동/대기
   온도
   공정가스
   가스유량
   제품명
   승온/냉각
   비고
========================================================= */

function estimatePatrolColumns(
  ocr,
  anchors
){

  const anchorList =
    Object.values(
      anchors
    );


  if(
    anchorList.length === 0
  ){

    return null;
  }


  /*
    장비명들의 평균 시작/끝 X
  */

  const avgX0 =
    anchorList.reduce(
      (sum,a) =>
        sum + a.x0,
      0
    ) /
    anchorList.length;


  const avgX1 =
    anchorList.reduce(
      (sum,a) =>
        sum + a.x1,
      0
    ) /
    anchorList.length;


  /*
    실제 양식에서 장비명 열이
    전체 표의 왼쪽 약 25~30% 정도.

    장비명 위치를 기준으로
    표 왼쪽을 역산한다.
  */

  const tableLeft =
    Math.max(
      0,
      avgX0 -
      ocr.width * .10
    );


  const tableRight =
    ocr.width *
    .94;


  const tableWidth =
    tableRight -
    tableLeft;


  /*
    순찰일지 실제 열 비율.

    온도계는 중간,
    승온/냉각은 우측,
    비고는 맨 우측.
  */

  return {

    tableLeft,
    tableRight,
    tableWidth,

    temperature:{
      x0:
        tableLeft +
        tableWidth * .43,

      x1:
        tableLeft +
        tableWidth * .53
    },

    state:{
      x0:
        tableLeft +
        tableWidth * .79,

      x1:
        tableLeft +
        tableWidth * .89
    },

    remark:{
      x0:
        tableLeft +
        tableWidth * .88,

      x1:
        tableRight
    }
  };
}


/* =========================================================
   순찰일지 장비 행 높이 계산

   주변 장비명 사이 간격으로
   해당 장비의 실제 행 높이를 추정.
========================================================= */

function patrolRowBounds(
  equipment,
  anchors,
  imageHeight
){

  const list =
    Object.values(
      anchors
    )
    .sort(
      (a,b) =>
        a.cy - b.cy
    );


  const index =
    list.findIndex(
      item =>
        item.equipment ===
        equipment
    );


  if(
    index === -1
  ){

    return null;
  }


  const current =
    list[index];


  const previous =
    list[index - 1];


  const next =
    list[index + 1];


  let top;

  let bottom;


  if(previous){

    top =
      (
        previous.cy +
        current.cy
      ) / 2;

  }else{

    top =
      Math.max(
        0,
        current.cy -
        current.height
      );

  }


  if(next){

    bottom =
      (
        current.cy +
        next.cy
      ) / 2;

  }else{

    bottom =
      Math.min(
        imageHeight,
        current.cy +
        current.height
      );

  }


  /*
    지나치게 큰 행 방지
  */

  const maxHeight =
    Math.max(
      current.height * 3,
      40
    );


  if(
    bottom - top >
    maxHeight
  ){

    top =
      current.cy -
      maxHeight / 2;

    bottom =
      current.cy +
      maxHeight / 2;
  }


  return {
    top:
      Math.max(
        0,
        top
      ),

    bottom:
      Math.min(
        imageHeight,
        bottom
      ),

    height:
      bottom - top
  };
}


/* =========================================================
   순찰일지 한 장비의 셀 자르기
========================================================= */

function cropPatrolCell(
  canvas,
  row,
  column
){

  const padY =
    row.height *
    .08;


  return cropRect(

    canvas,

    column.x0,

    row.top +
    padY,

    column.x1 -
    column.x0,

    row.height -
    padY * 2

  );
}


/* =========================================================
   순찰일지 일반 장비 분석
========================================================= */

async function analyzePatrolEquipment(

){

  const anchor =

    ];


  if(!anchor){

    return {

    };
  }

    };
  }


  const tempCanvas =
    cropPatrolCell(
      canvas,
      row,
      columns.temperature
    );


  const stateCanvas =
    cropPatrolCell(
      canvas,
      row,
      columns.state
    );


  const remarkCanvas =
    cropPatrolCell(
      canvas,
      row,
      columns.remark
    );


  const tempOCR =
    await cellOCR(
      tempCanvas,
      "temperature"
    );


  const stateOCR =
    await cellOCR(
      stateCanvas,
      "text"
    );


  const remarkOCR =
    await cellOCR(
      remarkCanvas,
      "text"
    );


  const temperature =
    extractTemperature(
      tempOCR.text
    );


  const state =
    extractState(
      stateOCR.text,
      equipment
    );


  const unload =
    unloadWaiting(
      remarkOCR.text
    );


  return {
    equipment,
    found:true,
    temperature,
    state,
    remark:
      remarkOCR.text,
    unload,

    valid:
      temperature !== null &&
      !!state,

    raw:{
      temperature:
        tempOCR.text,
      state:
        stateOCR.text,
      remark:
        remarkOCR.text
    }
  };
}


/* =========================================================
   특수 장비 행 번호

   일반 장비 앵커가 충분히 잡힌 경우에만
   35행 구조를 이용해 특수장비 위치를 추정한다.

   중요:
   35행 자체는 그대로 유지.
========================================================= */

const PATROL_ROW_NUMBER = {

  TG2:1,
  TG3:2,
  TG4:3,
  TG5:4,
  TG6:5,
  TG7:6,

  GF1:7,
  GF3:8,
  GF4:9,
  GF5:10,

  SMI:11,

  CF1:12,
  CF2:13,
  CF3:14,
  CF4:15,
  CF5:16,
  CF6:17,

  "CF분위기로":18,

  "1동소각기":26,
  "3동소각기":27,

  HIP1:28,
  HIP2:29,
  HIP3:30
};


/* =========================================================
   근무별 드라이챔버 행
========================================================= */

function dryRows(){

  if(
    workType ===
    "weekday"
  ){

    return {
      "구형드라이챔버":19,
      "신형드라이챔버":25
    };
  }


  return {
    "구형드라이챔버":19,
    "신형드라이챔버":20
  };
}


/* =========================================================
   35행 위치 모델 만들기

   여러 장비명 앵커의
   실제 Y와 알려진 행번호를 이용해

   y = a * row + b

   형태로 맞춘다.

   사진이 기울어져 있어도
   전체 페이지를 단순 35등분하는 것보다 안정적.
========================================================= */

function buildRowModel(
  anchors
){

  const samples = [];


  for(
    const [
      equipment,
      rowNumber
    ]
    of Object.entries(
      PATROL_ROW_NUMBER
    )
  ){

    const anchor =
      anchors[
        equipment
      ];


    if(anchor){

      samples.push({
        row:
          rowNumber,

        y:
          anchor.cy
      });
    }
  }


  if(
    samples.length < 5
  ){

    return null;
  }


  const n =
    samples.length;


  const sumX =
    samples.reduce(
      (s,p) =>
        s + p.row,
      0
    );


  const sumY =
    samples.reduce(
      (s,p) =>
        s + p.y,
      0
    );


  const sumXY =
    samples.reduce(
      (s,p) =>
        s + p.row * p.y,
      0
    );


  const sumXX =
    samples.reduce(
      (s,p) =>
        s + p.row * p.row,
      0
    );


  const denominator =
    n * sumXX -
    sumX * sumX;


  if(
    denominator === 0
  ){

    return null;
  }


  const a =
    (
      n * sumXY -
      sumX * sumY
    ) /
    denominator;


  const b =
    (
      sumY -
      a * sumX
    ) /
    n;


  /*
    한 행 높이
  */

  if(
    a < 8 ||
    a > 100
  ){

    return null;
  }


  return {
    a,
    b,
    samples:
      samples.length
  };
}


/* =========================================================
   행 모델로 특정 행 Crop
========================================================= */

function modelRowBounds(
  rowNumber,
  model,
  imageHeight
){

  const center =
    model.a *
    rowNumber +
    model.b;


  const height =
    Math.abs(
      model.a
    ) *
    .88;


  return {
    top:
      Math.max(
        0,
        center -
        height / 2
      ),

    bottom:
      Math.min(
        imageHeight,
        center +
        height / 2
      ),

    height
  };
}


/* =========================================================
   온도만 필요한 특수 장비

   - 구형/신형 드라이챔버
   - 1동/3동 소각기
========================================================= */

async function analyzeTemperatureOnly(
  canvas,
  equipment,
  rowNumber,
  model,
  columns
){

  if(!model){

    return {
      equipment,
      temperature:null,
      valid:false
    };
  }


  const row =
    modelRowBounds(
      rowNumber,
      model,
      canvas.height
    );


  const cell =
    cropPatrolCell(
      canvas,
      row,
      columns.temperature
    );


  const ocr =
    await cellOCR(
      cell,
      "temperature"
    );


  const temperature =
    extractTemperature(
      ocr.text
    );


  return {
    equipment,
    temperature,

    valid:
      temperature !== null,

    raw:
      ocr.text
  };
}


/* =========================================================
   순찰일지 전체 분석
========================================================= */

async function analyzePatrolPhoto(
  file
){

  status(
    "순찰일지 사진 읽는 중...",
    35
  );


  const canvas =
    await fileToCanvas(
      file,
      2400
    );


  const ocr =
    await fullOCR(
      canvas,
      "순찰일지"
    );


  status(
    "순찰일지 장비명 찾는 중...",
    45
  );


  const anchors =
    findPatrolAnchors(
      ocr
    );


  const columns =
    estimatePatrolColumns(
      ocr,
      anchors
    );


  if(!columns){

    return {
      fatal:true,
      reason:
        "순찰일지에서 장비명 위치를 찾지 못했습니다.",
      anchorCount:0,
      items:{},
      dry:[],
      incinerators:[]
    };
  }


  const rowModel =
    buildRowModel(
      anchors
    );


  const items = {};


  /*
    일반 장비만 장비명 앵커 기반으로 분석
  */

  const general =
    [
      "TG2","TG3","TG4",
      "TG5","TG6","TG7",

      "GF1","GF3","GF4","GF5",

      "SMI",

      "CF1","CF2","CF3",
      "CF4","CF5","CF6",

      "CF분위기로",

      "HIP1","HIP2","HIP3"
    ];


  let done = 0;


  for(
    const equipment
    of general
  ){

    status(
      `순찰일지 ${equipment} 확인중...`,
      48 +
      Math.round(
        done /
        general.length *
        27
      )
    );


    items[equipment] =
      await analyzePatrolEquipment(

        canvas,
        equipment,
        anchors,
        columns

      );


    done++;
  }


  /*
    드라이챔버
  */

  const dry = [];


  const dryMap =
    dryRows();


  for(
    const [
      equipment,
      rowNumber
    ]
    of Object.entries(
      dryMap
    )
  ){

    const item =
      await analyzeTemperatureOnly(

        canvas,
        equipment,
        rowNumber,
        rowModel,
        columns

      );


    if(item.valid){

      dry.push(item);

    }
  }


  /*
    소각기
  */

  const incinerators = [];


  for(
    const [
      equipment,
      rowNumber
    ]
    of [
      [
        "1동소각기",
        26
      ],
      [
        "3동소각기",
        27
      ]
    ]
  ){

    const item =
      await analyzeTemperatureOnly(

        canvas,
        equipment,
        rowNumber,
        rowModel,
        columns

      );


    if(item.valid){

      incinerators.push(
        item
      );

    }
  }


  return {
    fatal:false,
    anchorCount:
      Object.keys(
        anchors
      ).length,

    rowModel,

    items,
    dry,
    incinerators
  };
}


/* =========================================================
   일반 장비 최종 제외 규칙
========================================================= */

function getExclusionReason(
  equipment,
  patrol,
  number
){

  /*
    사진2 장비명 자체를 못 찾음
  */

  if(
    !number ||
    !number.found
  ){

    return "장비번호표 장비명 인식 실패";
  }


  /*
    번호 없음
  */

  if(
    !number.number
  ){

    return "장비번호 없음";
  }


  /*
    번호는 있어도 가동 글자 없음
  */

  if(
    !number.running
  ){

    return "가동 확인 안 됨";
  }


  /*
    사진1 장비명 못 찾음
  */

  if(
    !patrol ||
    !patrol.found
  ){

    return "순찰일지 장비명 인식 실패";
  }


  /*
    온도 없음
  */

  if(
    patrol.temperature ===
    null
  ){

    return "온도 인식 실패";
  }


  /*
    상태 없음
  */

  if(
    !patrol.state
  ){

    return "상태 인식 실패";
  }


  /*
    비고란 언로딩대기
    → 무조건 제외
  */

  if(
    patrol.unload
  ){

    return "언로딩대기";
  }


  /*
    HIP 냉각은
    온도 관계없이 제외
  */

  if(
    /^HIP[123]$/.test(
      equipment
    ) &&
    patrol.state ===
    "냉각중"
  ){

    return "HIP 냉각";
  }


  /*
    일반 장비
    100도 이하 + 냉각
    → 제외
  */

  if(
    patrol.temperature <= 100 &&
    patrol.state ===
    "냉각중"
  ){

    return "100도 이하 냉각";
  }


  return "";
}


/* =========================================================
   사진1 + 사진2 합치기
========================================================= */

function mergeAnalysis(
  patrolData,
  numberData
){

  const included = [];

  const excluded = [];


  for(
    const equipment
    of REPORT_ORDER
  ){

    const patrol =
      patrolData.items[
        equipment
      ];


    const number =
      numberData.result[
        equipment
      ];


    const reason =
      getExclusionReason(
        equipment,
        patrol,
        number
      );


    if(reason){

      excluded.push({
        equipment,
        reason,
        patrol,
        number
      });

      continue;
    }


    included.push({
      equipment,

      number:
        number.number,

      temperature:
        patrol.temperature,

      state:
        patrol.state
    });
  }


  /*
    TG1

    순찰일지에는 아직 없음.
    사진2에서 번호 + 가동이
    둘 다 확인된 경우에만
    번호 + TG1 표시.
  */

  let tg1 = null;


  const tg1Number =
    numberData.result[
      "TG1"
    ];


  if(
    tg1Number &&
    tg1Number.found &&
    tg1Number.number &&
    tg1Number.running
  ){

    tg1 = {
      equipment:"TG1",
      number:
        tg1Number.number
    };
  }


  return {
    included,
    excluded,
    tg1,

    dry:
      patrolData.dry,

    incinerators:
      patrolData.incinerators
  };
}


/* =========================================================
   성공 여부 검증

   이전처럼
   "0개 표시 + 21개 제외"인데
   보고서 생성되는 문제 방지.
========================================================= */

function validateAnalysis(
  patrolData,
  numberData,
  merged
){

  const problems = [];


  /*
    사진2에서 장비명을 거의 못 찾은 경우
  */

  if(
    numberData.anchorCount < 5
  ){

    problems.push(
      `장비번호 사진의 장비명을 ${numberData.anchorCount}개만 인식했습니다.`
    );
  }


  /*
    순찰일지 장비명
  */

  if(
    patrolData.anchorCount < 8
  ){

    problems.push(
      `순찰일지 장비명을 ${patrolData.anchorCount}개만 인식했습니다.`
    );
  }


  /*
    행 모델 실패
  */

  if(
    !patrolData.rowModel
  ){

    problems.push(
      "순찰일지 35행 위치 계산에 실패했습니다."
    );
  }


  /*
    일반 장비 0개인데
    번호표에서 실제 가동 장비가 존재하면
    정상 분석으로 보지 않는다.
  */

  const runningCount =
    Object.values(
      numberData.result
    )
    .filter(
      item =>
        item.number &&
        item.running
    )
    .length;


  if(
    runningCount > 0 &&
    merged.included.length === 0
  ){

    problems.push(
      `장비번호 사진에서 가동 장비 ${runningCount}개를 찾았지만 순찰일지와 매칭된 장비가 없습니다.`
    );
  }


  return {
    valid:
      problems.length === 0,

    problems,
    runningCount
  };
}


/* =========================================================
   분석 결과 화면
========================================================= */

function renderResults(
  merged,
  validation
){

  $("results").innerHTML = "";


  /*
    검증 실패
  */

  if(
    !validation.valid
  ){

    $("fatalWarning")
      .classList
      .remove(
        "hidden"
      );


    $("fatalWarning")
      .innerHTML =

      "<b>인식 결과를 확정할 수 없습니다.</b><br>" +

      validation.problems
      .join("<br>");


    $("makeReport")
      .disabled =
      true;

  }else{

    $("fatalWarning")
      .classList
      .add(
        "hidden"
      );


    $("makeReport")
      .disabled =
      false;
  }


  /*
    포함 장비
  */

  for(
    const item
    of merged.included
  ){

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "result";


    div.innerHTML = `
      <div class="check">✓</div>

      <div>
        <div class="main">
          ${item.number} ${item.equipment}
        </div>

        <div class="sub">
          ${item.temperature}도 · ${item.state}
        </div>
      </div>

      <div class="badge">
        표시
      </div>
    `;


    $("results")
      .appendChild(
        div
      );
  }


  if(
    merged.included.length === 0
  ){

    $("results")
      .innerHTML =

      '<div style="padding:24px 4px;text-align:center;color:#8d96a8;font-size:13px">' +
      '자동 확정된 일반 장비가 없습니다.' +
      '</div>';
  }


  /*
    TG1
  */

  if(
    merged.tg1
  ){

    $("tg1Area")
      .classList
      .remove(
        "hidden"
      );


    $("tg1Area")
      .innerHTML =

      `<b>${merged.tg1.number} TG1</b><br>` +
      `순찰일지에 아직 없는 장비라 번호와 장비명만 표시됩니다.`;

  }else{

    $("tg1Area")
      .classList
      .add(
        "hidden"
      );
  }


  /*
    제외 목록
  */

  $("excludedCount")
    .textContent =

    `제외항목 ${merged.excluded.length}개`;


  $("excluded")
    .innerHTML = "";


  for(
    const item
    of merged.excluded
  ){

    const div =
      document.createElement(
        "div"
      );


    const number =
      item.number?.number ||
      "번호 없음";


    const temperature =
      item.patrol?.temperature;


    const state =
      item.patrol?.state ||
      "";


    div.innerHTML =

      `<b>${number} ${item.equipment}</b><br>` +

      (
        temperature !== null &&
        temperature !== undefined
        ?
        `${temperature}도 ${state}<br>`
        :
        ""
      ) +

      `→ ${item.reason}`;


    $("excluded")
      .appendChild(
        div
      );
  }


  $("count")
    .textContent =

    `${merged.included.length}개 표시`;


  $("resultCard")
    .classList
    .remove(
      "hidden"
    );


  $("resultCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}

   제외항목 펼치기

/* =========================================================
   실제 분석 실행
========================================================= */

$("analyze")
.onclick =
async () => {

  if(
    !patrolImage ||
    !numberImage
  ){
    return;
  }


  $("analyze")
    .disabled =
    true;


  $("resultCard")
    .classList
    .add(
      "hidden"
    );


  $("reportCard")
    .classList
    .add(
      "hidden"
    );


  try{

    status(
      "분석 시작...",
      2
    );


    /*
      사진2 먼저.

      선명한 인쇄 장비명/번호로
      장비 가동 후보를 먼저 확보.
    */

    const numberData =
      await analyzeNumberPhoto(
        numberImage
      );


    status(
      `장비번호 장비명 ${numberData.anchorCount}개 확인`,
      32
    );


    /*
      순찰일지
    */

    const patrolData =
      await analyzePatrolPhoto(
        patrolImage
      );


    if(
      patrolData.fatal
    ){

      throw new Error(
        patrolData.reason
      );
    }


    status(
      "두 사진 장비명 대조중...",
      85
    );


    const merged =
      mergeAnalysis(
        patrolData,
        numberData
      );


    const validation =
      validateAnalysis(
        patrolData,
        numberData,
        merged
      );


    analysisResult = {
      patrolData,
      numberData,
      merged,
      validation
    };


    status(
      validation.valid
      ?
      "분석 완료"
      :
      "인식 확인 필요",
      100
    );


    renderResults(
      merged,
      validation
    );


  }catch(error){

    console.error(
      error
    );


    analysisResult =
      null;


    $("resultCard")
      .classList
      .remove(
        "hidden"
      );


    $("results")
      .innerHTML =
      "";


    $("fatalWarning")
      .classList
      .remove(
        "hidden"
      );


    $("fatalWarning")
      .textContent =

      "사진 분석에 실패했습니다: " +
      (
        error.message ||
        "알 수 없는 오류"
      );


    $("makeReport")
      .disabled =
      true;


    status(
      "분석 실패",
      0
    );

  }finally{

    $("analyze")
      .disabled =
      false;
  }
};

/* =========================================================
   오늘 날짜
========================================================= */

function getToday(){

  const now =
    new Date();


  const weekdays = [
    "일","월","화","수","목","금","토"
  ];


  return {
    year:
      now.getFullYear(),

    month:
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      ),

    day:
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      ),

    weekday:
      weekdays[
        now.getDay()
      ]
  };
}


/* =========================================================
   근무명
========================================================= */

function getWorkName(){

  if(
    workType === "weekday"
  ){
    return "주간";
  }


  if(
    workType === "holiday"
  ){
    return "휴일주간";
  }


  return "야간";
}


/* =========================================================
   일반 장비 정렬
========================================================= */

function sortEquipment(
  items
){

  return [
    ...items
  ].sort(
    (a,b) => {

      const ai =
        REPORT_ORDER.indexOf(
          a.equipment
        );


      const bi =
        REPORT_ORDER.indexOf(
          b.equipment
        );


      return ai - bi;
    }
  );
}


/* =========================================================
   일반 장비 출력 한 줄

   예:
   #26-45 CF6 632도 유지중
========================================================= */

function equipmentLine(
  item
){

  return (
    item.number +
    " " +
    item.equipment +
    " " +
    item.temperature +
    "도 " +
    item.state
  );
}


/* =========================================================
   드라이챔버 표시명
========================================================= */

function dryName(
  equipment
){

  if(
    equipment ===
    "구형드라이챔버"
  ){
    return "구형 드라이챔버";
  }


  if(
    equipment ===
    "신형드라이챔버"
  ){
    return "신형 드라이챔버";
  }


  return equipment;
}


/* =========================================================
   소각기 표시명
========================================================= */

function incineratorName(
  equipment
){

  if(
    equipment ===
    "1동소각기"
  ){
    return "1동";
  }


  if(
    equipment ===
    "3동소각기"
  ){
    return "3동";
  }


  return equipment;
}


/* =========================================================
   보고서 만들기
========================================================= */

function buildFinalReport(){

  if(
    !analysisResult ||
    !analysisResult.validation.valid
  ){

    return "";
  }


  const merged =
    analysisResult.merged;


  const today =
    getToday();


  const work =
    getWorkName();


  const lines = [];


/* ---------------------------------------------------------
   날짜 / 근무 / 직급

   직급은 사용자가 누른
   대리 / 주임 / 사원을 그대로 사용
--------------------------------------------------------- */

  lines.push(
    `${today.month}월 ${today.day}일 (${today.weekday})`
  );


  lines.push(
    `${work} / ${rank}`
  );


  lines.push("");


/* ---------------------------------------------------------
   장비 가동현황
--------------------------------------------------------- */

  lines.push(
    "장비가동현황"
  );


  lines.push("");


  const sorted =
    sortEquipment(
      merged.included
    );


  for(
    const item
    of sorted
  ){

    lines.push(
      equipmentLine(
        item
      )
    );
  }


/* ---------------------------------------------------------
   TG1

   순찰일지에 없음.
   사진2에서

   번호 있음
   + 가동 확인

   두 조건이 맞을 때만 출력.

   온도/상태 절대 붙이지 않음.
--------------------------------------------------------- */

  if(
    merged.tg1
  ){

    lines.push(
      `${merged.tg1.number} TG1`
    );
  }


/* ---------------------------------------------------------
   드라이챔버

   장비번호 없음.
   온도만 출력.

   구형 / 신형 구분.
--------------------------------------------------------- */

  if(
    merged.dry &&
    merged.dry.length > 0
  ){

    lines.push("");


    for(
      const item
      of merged.dry
    ){

      lines.push(
        `${dryName(
          item.equipment
        )} ${item.temperature}도`
      );
    }
  }


/* ---------------------------------------------------------
   TG 소각기

   일반 장비와 별도 출력.

   번호 X
   상태 X
   온도만.
--------------------------------------------------------- */

  if(
    merged.incinerators &&
    merged.incinerators.length > 0
  ){

    lines.push("");

    lines.push(
      "-TG소각기-"
    );


    for(
      const item
      of merged.incinerators
    ){

      lines.push(
        `${incineratorName(
          item.equipment
        )} ${item.temperature}도`
      );
    }
  }


  return lines.join(
    "\n"
  );
}


/* =========================================================
   보고서 생성 버튼
========================================================= */

$("makeReport")
.onclick = () => {

  if(
    !analysisResult
  ){
    return;
  }


  if(
    !analysisResult.validation.valid
  ){

    alert(
      "사진 인식 결과를 확정할 수 없어 보고서를 생성하지 않습니다."
    );

    return;
  }


  const text =
    buildFinalReport();


  if(!text){

    alert(
      "보고서에 표시할 장비가 없습니다."
    );

    return;
  }


  $("report").value =
    text;


  $("reportCard")
    .classList
    .remove(
      "hidden"
    );


  $("reportCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
};


/* =========================================================
   복사
========================================================= */

$("copy")
.onclick =
async () => {

  const text =
    $("report").value;


  if(!text){
    return;
  }


  const button =
    $("copy");


  try{

    await navigator
      .clipboard
      .writeText(
        text
      );


    button.textContent =
      "복사 완료 ✓";


    setTimeout(
      () => {

        button.textContent =
          "전체 복사";

      },
      1200
    );


  }catch(error){

    /*
      iPhone Safari fallback
    */

    const textarea =
      $("report");


    textarea.focus();

    textarea.select();


    try{

      document.execCommand(
        "copy"
      );


      button.textContent =
        "복사 완료 ✓";


      setTimeout(
        () => {

          button.textContent =
            "전체 복사";

        },
        1200
      );


    }catch(copyError){

      alert(
        "자동 복사가 차단되었습니다. 보고서 내용을 길게 눌러 복사해주세요."
      );
    }
  }
};
