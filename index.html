<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#f5f7fb">

<title>DACC</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#182033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:
    24px
    16px
    calc(60px + env(safe-area-inset-bottom));
}

.logo{
  color:#5270e8;
  font-size:13px;
  font-weight:900;
  letter-spacing:2px;
}

h1{
  margin:5px 0 20px;
  font-size:25px;
  line-height:1.25;
}

.card{
  margin-bottom:15px;
  padding:17px;
  background:#fff;
  border:1px solid #e1e6ef;
  border-radius:20px;
  box-shadow:0 5px 22px rgba(25,35,60,.04);
}

.title{
  font-size:16px;
  font-weight:900;
}

.flex{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.rank{
  display:flex;
  gap:5px;
}

.rank button,
.work button{
  border:1px solid #dde3ed;
  background:#fff;
  color:#7b8495;
  border-radius:10px;
  font-weight:900;
}

.rank button{
  padding:7px 10px;
  font-size:12px;
}

.work{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:14px;
}

.work button{
  height:45px;
  font-size:12px;
}

button.active{
  background:#edf1ff!important;
  border-color:#6f88ef!important;
  color:#4966df!important;
}

.upload{
  display:block;
  margin-top:11px;
  padding:22px 12px;
  text-align:center;
  border:1px dashed #d4dbe8;
  border-radius:15px;
  background:#f9faff;
  cursor:pointer;
}

.plus{
  width:42px;
  height:42px;
  margin:0 auto 8px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#edf1ff;
  color:#5270e8;
  font-size:26px;
}

.upload b{
  font-size:14px;
}

.upload small{
  display:block;
  margin-top:5px;
  color:#9ba4b4;
  font-size:11px;
}

input[type=file]{
  display:none;
}

.preview{
  height:165px;
  position:relative;
  overflow:hidden;
  margin-top:10px;
  border-radius:14px;
  background:#eee;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview span{
  position:absolute;
  left:9px;
  bottom:9px;
  padding:5px 8px;
  border-radius:7px;
  background:rgba(20,25,35,.8);
  color:#fff;
  font-size:11px;
}

.primary{
  width:100%;
  height:53px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:#5270e8;
  color:#fff;
  font-weight:900;
}

.primary:disabled{
  background:#c7cedd;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f5f7fb;
  color:#68748a;
  font-size:12px;
  line-height:1.5;
}

.track{
  height:7px;
  margin-top:8px;
  overflow:hidden;
  border-radius:10px;
  background:#e2e6ee;
}

.bar{
  width:0;
  height:100%;
  background:#5270e8;
  transition:.2s;
}

.hidden{
  display:none!important;
}

.result{
  display:grid;
  grid-template-columns:25px 1fr auto;
  gap:8px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #edf0f4;
}

.check{

  height:23px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#e7f8ef;
  color:#1ea465;
  font-size:12px;
  font-weight:900;
}

.main{

  font-weight:900;
}

.sub{
  margin-top:3px;
  color:#8d96a8;
  font-size:11px;
}

.badge{

  border-radius:7px;
  background:#f0f3f8;
  color:#6b7588;
  font-size:10px;
  font-weight:900;
}

.warning,

  padding:13px;
  border-radius:12px;
  font-size:12px;
  line-height:1.6;
}

.warning{
  background:#fff7e8;
  color:#9a6813;
}

.success{
  background:#eefaf3;
  color:#238454;
}

.excludedBtn{
  width:100%;
  height:47px;
  margin-top:12px;
  padding:0 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:0;
  border-radius:12px;
  background:#f1f3f7;
  color:#606a7d;

  font-size:12px;
}

textarea{

  min-height:500px;
  padding:15px;

  border-radius:14px;

  line-height:1.7;

/* =========================================================

function showPreview(
  id,
  file,
  label
){

  const area = $(id);

  area.innerHTML = "";

  if(!file){
    return;
  }

  const url =
    URL.createObjectURL(file);

  const box =
    document.createElement("div");

  box.className = "preview";

  const image =
    document.createElement("img");

  image.src = url;

  image.onload = () => {
    URL.revokeObjectURL(url);
  };

  const tag =
    document.createElement("span");

  tag.textContent = label;

  box.appendChild(image);
  box.appendChild(tag);
  area.appendChild(box);
}

/* =========================================================
   문자열 정리
========================================================= */

function clean(value){

  return String(
    value || ""
  )
  .replace(
    /[‐-‒–—―]/g,
    "-"
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();
}


function compact(value){

  return clean(value)
    .replace(/\s/g,"")
    .toUpperCase();
}


/* =========================================================
   이미지 → Canvas
========================================================= */

async function fileToCanvas(
  file,
  maxSide = 2400
){

  return new Promise(
    (resolve,reject) => {

      const image =
        new Image();

      const url =
        URL.createObjectURL(file);

      image.onload = () => {

        const scale =
          Math.min(
            1,
            maxSide /
            Math.max(
              image.naturalWidth,
              image.naturalHeight
            )
          );

        const canvas =
          document.createElement(
            "canvas"
          );

        canvas.width =
          Math.round(
            image.naturalWidth *
            scale
          );

        canvas.height =
          Math.round(
            image.naturalHeight *
            scale
          );

        const ctx =
          canvas.getContext(
            "2d",
            {
              willReadFrequently:true
            }
          );

        ctx.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        URL.revokeObjectURL(url);

        resolve(canvas);
      };

      image.onerror = error => {

        URL.revokeObjectURL(url);

        reject(error);
      };

      image.src = url;
    }
  );
}


/* =========================================================
   Canvas Crop
========================================================= */

function cropCanvas(
  source,
  x,
  y,
  width,
  height
){

  const safeX =
    Math.max(
      0,
      Math.round(x)
    );

  const safeY =
    Math.max(
      0,
      Math.round(y)
    );

  const safeWidth =
    Math.max(
      1,
      Math.min(
        source.width - safeX,
        Math.round(width)
      )
    );

  const safeHeight =
    Math.max(
      1,
      Math.min(
        source.height - safeY,
        Math.round(height)
      )
    );

  const output =
    document.createElement(
      "canvas"
    );

  output.width = safeWidth;
  output.height = safeHeight;

  const ctx =
    output.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );

  ctx.drawImage(
    source,

    safeX,
    safeY,
    safeWidth,
    safeHeight,

    0,
    0,
    safeWidth,
    safeHeight
  );

  return output;
}


/* =========================================================
   OCR 확대
========================================================= */

function enlargeForOCR(
  source,
  scale = 3
){

  const output =
    document.createElement(
      "canvas"
    );

  output.width =
    Math.round(
      source.width * scale
    );

  output.height =
    Math.round(
      source.height * scale
    );

  const ctx =
    output.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );

  ctx.imageSmoothingEnabled = true;

  ctx.drawImage(
    source,
    0,
    0,
    output.width,
    output.height
  );

  return output;
}

/* =========================================================
   OpenCV 로딩
========================================================= */

function loadOpenCV(){

  if(
    window.cv &&
    typeof window.cv.Mat === "function"
  ){
    cvReady = true;
    return Promise.resolve();
  }

  if(cvPromise){
    return cvPromise;
  }

  cvPromise = new Promise(
    (resolve,reject) => {

      const existing =
        document.querySelector(
          'script[data-dacc-opencv="1"]'
        );

      if(existing){

        const timer =
          setInterval(() => {

            if(
              window.cv &&
              typeof window.cv.Mat === "function"
            ){
              clearInterval(timer);
              cvReady = true;
              resolve();
            }

          },100);

        setTimeout(() => {
          clearInterval(timer);

          if(!cvReady){
            reject(
              new Error(
                "OpenCV 준비 시간 초과"
              )
            );
          }
        },30000);

        return;
      }

      const script =
        document.createElement(
          "script"
        );

      script.async = true;

      script.dataset.daccOpencv =
        "1";

      script.src =
        "https://docs.opencv.org/4.x/opencv.js";

      document.head.appendChild(
        script
      );

      const started =
        Date.now();

      const timer =
        setInterval(() => {

          if(
            window.cv &&
            typeof window.cv.Mat ===
            "function"
          ){

            clearInterval(timer);

            cvReady = true;

            resolve();

            return;
          }

          if(
            Date.now() -
            started >
            30000
          ){

            clearInterval(timer);

            reject(
              new Error(
                "OpenCV를 불러오지 못했습니다."
              )
            );
          }

        },100);
    }
  );

  return cvPromise;
}

function pointDistance(a,b){

  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );
}


/* =========================================================
   사각형 점 정렬
========================================================= */

function orderQuad(points){

  const sortedBySum =
    [...points].sort(
      (a,b) =>
        (a.x + a.y) -
        (b.x + b.y)
    );

  const tl =
    sortedBySum[0];

  const br =
    sortedBySum[
      sortedBySum.length - 1
    ];

  const remain =
    points.filter(
      point =>
        point !== tl &&
        point !== br
    );

  let tr;
  let bl;

  if(
    remain[0].x >
    remain[1].x
  ){
    tr = remain[0];
    bl = remain[1];
  }else{
    tr = remain[1];
    bl = remain[0];
  }

  return {
    tl,
    tr,
    br,
    bl
  };
}


/* =========================================================
   큰 사각형 찾기

   Mat 재대입 없음.
========================================================= */

function detectLargeQuad(canvas){

  const src =
    cv.imread(canvas);

  const gray =
    new cv.Mat();

  const blurred =
    new cv.Mat();

  const edges =
    new cv.Mat();

  const closed =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();

  const kernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(7,7)
    );

  let bestPoints =
    null;

  let bestArea =
    0;

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
      gray,
      blurred,
      new cv.Size(5,5),
      0,
      0,
      cv.BORDER_DEFAULT
    );

    cv.Canny(
      blurred,
      edges,
      40,
      130
    );

    cv.morphologyEx(
      edges,
      closed,
      cv.MORPH_CLOSE,
      kernel
    );

    cv.findContours(
      closed,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );

    const fullArea =
      canvas.width *
      canvas.height;

    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);

      const perimeter =
        cv.arcLength(
          contour,
          true
        );

      const approx =
        new cv.Mat();

      try{

        cv.approxPolyDP(
          contour,
          approx,
          perimeter * .02,
          true
        );

        if(
          approx.rows !== 4
        ){
          continue;
        }

        const area =
          Math.abs(
            cv.contourArea(
              approx
            )
          );

        if(
          area <
          fullArea * .15
        ){
          continue;
        }

        if(
          area <=
          bestArea
        ){
          continue;
        }

        const candidate = [];

        for(
          let p = 0;
          p < 4;
          p++
        ){

          const pointer =
            approx.intPtr(
              p,
              0
            );

          candidate.push({
            x:pointer[0],
            y:pointer[1]
          });
        }

        bestArea =
          area;

        bestPoints =
          candidate;

      }finally{

        approx.delete();
        contour.delete();

      }
    }

  }finally{

    kernel.delete();
    src.delete();
    gray.delete();
    blurred.delete();
    edges.delete();
    closed.delete();
    contours.delete();
    hierarchy.delete();

  }

  if(!bestPoints){
    return null;
  }

  return orderQuad(
    bestPoints
  );
}


/* =========================================================
   원근 보정
========================================================= */

function warpQuad(
  canvas,
  quad
){

  const topWidth =
    pointDistance(
      quad.tl,
      quad.tr
    );

  const bottomWidth =
    pointDistance(
      quad.bl,
      quad.br
    );

  const leftHeight =
    pointDistance(
      quad.tl,
      quad.bl
    );

  const rightHeight =
    pointDistance(
      quad.tr,
      quad.br
    );

  let width =
    Math.round(
      Math.max(
        topWidth,
        bottomWidth
      )
    );

  let height =
    Math.round(
      Math.max(
        leftHeight,
        rightHeight
      )
    );

  const maxSide =
    2300;

  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        width,
        height
      )
    );

  width =
    Math.max(
      100,
      Math.round(
        width * scale
      )
    );

  height =
    Math.max(
      100,
      Math.round(
        height * scale
      )
    );

  const src =
    cv.imread(canvas);

  const dst =
    new cv.Mat();

  const from =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        quad.tl.x,
        quad.tl.y,

        quad.tr.x,
        quad.tr.y,

        quad.br.x,
        quad.br.y,

        quad.bl.x,
        quad.bl.y
      ]
    );

  const to =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        0,
        0,

        width - 1,
        0,

        width - 1,
        height - 1,

        0,
        height - 1
      ]
    );

  const transform =
    cv.getPerspectiveTransform(
      from,
      to
    );

  try{

    cv.warpPerspective(
      src,
      dst,
      transform,
      new cv.Size(
        width,
        height
      ),
      cv.INTER_LINEAR,
      cv.BORDER_CONSTANT,
      new cv.Scalar(
        255,
        255,
        255,
        255
      )
    );

    const output =
      document.createElement(
        "canvas"
      );

    output.width =
      width;

    output.height =
      height;

    cv.imshow(
      output,
      dst
    );

    return output;

  }finally{

    src.delete();
    dst.delete();
    from.delete();
    to.delete();
    transform.delete();

  }
}


/* =========================================================
   자동 보정

   사각형 못 찾으면 원본 사용.
========================================================= */

async function correctImage(source){

  await loadOpenCV();

  const quad =
    detectLargeQuad(
      source
    );

  if(!quad){

    return {
      canvas:source,
      corrected:false
    };
  }

  const corrected =
    warpQuad(
      source,
      quad
    );

  return {
    canvas:corrected,
    corrected:true
  };
}


/* =========================================================
   공통 이진화
========================================================= */

function makeBinaryMat(canvas){

  const src =
    cv.imread(canvas);

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,
      13
    );

    return binary.clone();

  }finally{

    src.delete();
    gray.delete();
    binary.delete();

  }
}


/* =========================================================
   가로선 검출
========================================================= */

function detectHorizontalTableLines(
  canvas
){

  const binary =
    makeBinaryMat(canvas);

  const horizontal =
    new cv.Mat();

  const joined =
    new cv.Mat();

  const kernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        Math.max(
          25,
          Math.round(
            canvas.width * .12
          )
        ),
        1
      )
    );

  const joinKernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(9,3)
    );

  try{

    cv.morphologyEx(
      binary,
      horizontal,
      cv.MORPH_OPEN,
      kernel
    );

    cv.dilate(
      horizontal,
      joined,
      joinKernel
    );

    const candidates = [];

    for(
      let y = 0;
      y < joined.rows;
      y++
    ){

      let count = 0;

      for(
        let x = 0;
        x < joined.cols;
        x += 2
      ){

        if(
          joined.ucharPtr(
            y,
            x
          )[0] > 0
        ){
          count++;
        }
      }

      const sampleCount =
        Math.ceil(
          joined.cols / 2
        );

      if(
        sampleCount > 0 &&
        count / sampleCount >= .20
      ){
        candidates.push(y);
      }
    }

    const groups = [];

    for(
      const y
      of candidates
    ){

      const last =
        groups[
          groups.length - 1
        ];

      if(
        !last ||
        y - last.end > 5
      ){

        groups.push({
          start:y,
          end:y
        });

      }else{

        last.end = y;

      }
    }

    return groups.map(
      group =>
        Math.round(
          (
            group.start +
            group.end
          ) / 2
        )
    );

  }finally{

    binary.delete();
    horizontal.delete();
    joined.delete();
    kernel.delete();
    joinKernel.delete();

  }
}

/* =========================================================
   중앙값
========================================================= */

function median(values){

  if(!values.length){
    return 0;
  }

  const sorted =
    [...values].sort(
      (a,b) => a - b
    );

  const middle =
    Math.floor(
      sorted.length / 2
    );

  if(
    sorted.length % 2
  ){
    return sorted[middle];
  }

  return (
    sorted[middle - 1] +
    sorted[middle]
  ) / 2;
}


/* =========================================================
   35행 그리드 생성
========================================================= */

function build35RowGrid(
  lines,
  imageHeight
){

  if(
    lines.length < 15
  ){
    return null;
  }

  const filtered = [];

  for(
    const line
    of [...lines].sort(
      (a,b) => a - b
    )
  ){

    if(
      !filtered.length ||
      line -
      filtered[
        filtered.length - 1
      ] >= 6
    ){
      filtered.push(line);
    }
  }

  const gaps = [];

  for(
    let i = 1;
    i < filtered.length;
    i++
  ){

    const gap =
      filtered[i] -
      filtered[i - 1];

    if(
      gap >= 8 &&
      gap <=
      imageHeight * .06
    ){
      gaps.push(gap);
    }
  }

  if(
    gaps.length < 8
  ){
    return null;
  }

  const sortedGaps =
    [...gaps].sort(
      (a,b) => a - b
    );

  const usable =
    sortedGaps.slice(
      0,
      Math.max(
        5,
        Math.ceil(
          sortedGaps.length *
          .70
        )
      )
    );

  const rowHeight =
    median(usable);

  if(
    rowHeight < 8
  ){
    return null;
  }

  const tolerance =
    Math.max(
      4,
      rowHeight * .35
    );

  let bestScore =
    -Infinity;

  let bestMatched =
    0;

  let bestBoundaries =
    null;

  for(
    const start
    of filtered
  ){

    if(
      start +
      rowHeight * 35 >
      imageHeight +
      rowHeight
    ){
      continue;
    }

    let matched = 0;
    let error = 0;

    const boundaries = [];

    for(
      let i = 0;
      i <= 35;
      i++
    ){

      const expected =
        start +
        rowHeight * i;

      let nearest =
        expected;

      let nearestDistance =
        Infinity;

      for(
        const line
        of filtered
      ){

        const distance =
          Math.abs(
            line -
            expected
          );

        if(
          distance <
          nearestDistance
        ){

          nearestDistance =
            distance;

          nearest =
            line;
        }
      }

      if(
        nearestDistance <=
        tolerance
      ){

        boundaries.push(
          nearest
        );

        matched++;

        error +=
          nearestDistance;

      }else{

        boundaries.push(
          expected
        );

      }
    }

    const score =
      matched * 100 -
      error;

    if(
      score >
      bestScore
    ){

      bestScore =
        score;

      bestMatched =
        matched;

      bestBoundaries =
        boundaries;
    }
  }

  if(
    !bestBoundaries ||
    bestMatched < 18
  ){
    return null;
  }

  const finalBoundaries = [];

  for(
    let i = 0;
    i < bestBoundaries.length;
    i++
  ){

    let value =
      bestBoundaries[i];

    if(
      i > 0 &&
      value <=
      finalBoundaries[
        i - 1
      ] + 3
    ){

      value =
        finalBoundaries[
          i - 1
        ] +
        rowHeight;
    }

    finalBoundaries.push(
      value
    );
  }

  return {
    boundaries:
      finalBoundaries,

    rowHeight,

    matched:
      bestMatched,

    detected:
      filtered.length
  };
}


/* =========================================================
   행 위치
========================================================= */

function getGridRow(
  grid,
  rowNumber
){

  const top =
    grid.boundaries[
      rowNumber - 1
    ];

  const bottom =
    grid.boundaries[
      rowNumber
    ];

  return {
    top,
    bottom,
    height:
      bottom - top
  };
}


/* =========================================================
   세로선 정리
========================================================= */

function normalizeVerticalLines(
  lines,
  width
){

  const result = [];

  const sorted =
    [...lines]
    .filter(
      x =>
        x > width * .015 &&
        x < width * .995
    )
    .sort(
      (a,b) => a - b
    );

  for(
    const x
    of sorted
  ){

    if(
      !result.length ||
      x -
      result[
        result.length - 1
      ] >=
      Math.max(
        6,
        width * .008
      )
    ){
      result.push(x);
    }
  }

  return result;
}


/* =========================================================
   가까운 세로선
========================================================= */

function nearestVerticalLine(
  lines,
  target,
  maxDistance
){

  let best = null;
  let bestDistance = Infinity;

  for(
    const line
    of lines
  ){

    const distance =
      Math.abs(
        line -
        target
      );

    if(
      distance <
      bestDistance
    ){

      bestDistance =
        distance;

      best =
        line;
    }
  }

  if(
    bestDistance >
    maxDistance
  ){
    return null;
  }

  return best;
}


/* =========================================================
   순찰일지 열 위치
========================================================= */

function buildPatrolColumns(
  canvas,
  verticalLines
){

  const width =
    canvas.width;

  const lines =
    normalizeVerticalLines(
      verticalLines,
      width
    );

  const snapDistance =
    width * .09;

  function snap(ratio){

    const found =
      nearestVerticalLine(
        lines,
        width * ratio,
        snapDistance
      );

    if(
      found === null
    ){
      return width * ratio;
    }

    return found;
  }

  let temperatureLeft =
    snap(.39);

  let temperatureRight =
    snap(.51);

  let stateLeft =
    snap(.73);

  let stateRight =
    snap(.87);

  let remarkLeft =
    snap(.87);

  let remarkRight =
    snap(.985);


  if(
    temperatureRight -
    temperatureLeft <
    width * .025
  ){

    temperatureLeft =
      width * .39;

    temperatureRight =
      width * .51;
  }


  if(
    stateRight -
    stateLeft <
    width * .025
  ){

    stateLeft =
      width * .73;

    stateRight =
      width * .87;
  }


  if(
    remarkRight -
    remarkLeft <
    width * .025
  ){

    remarkLeft =
      width * .87;

    remarkRight =
      width * .985;
  }


  return {

    lines,

    temperature:{
      left:
        temperatureLeft,

      right:
        temperatureRight
    },

    state:{
      left:
        stateLeft,

      right:
        stateRight
    },

    remark:{
      left:
        remarkLeft,

      right:
        remarkRight
    }

  };
}


/* =========================================================
   셀 Crop
========================================================= */

function cropGridCell(
  canvas,
  grid,
  rowNumber,
  column
){

  const row =
    getGridRow(
      grid,
      rowNumber
    );

  const width =
    column.right -
    column.left;

  const padX =
    Math.max(
      2,
      width * .07
    );

  const padY =
    Math.max(
      2,
      row.height * .15
    );

  return cropCanvas(
    canvas,

    column.left +
    padX,

    row.top +
    padY,

    Math.max(
      1,
      width -
      padX * 2
    ),

    Math.max(
      1,
      row.height -
      padY * 2
    )
  );
}


/* =========================================================
   Safari-safe 셀 전처리

   ★ Mat 재대입 없음
   ★ 동일 Mat source/destination 사용 안 함
========================================================= */

function preprocessCell(
  source
){

  const src =
    cv.imread(source);

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const horizontal =
    new cv.Mat();

  const vertical =
    new cv.Mat();

  const allLines =
    new cv.Mat();

  const cleanBinary =
    new cv.Mat();

  const finalMat =
    new cv.Mat();

  const hKernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        Math.max(
          8,
          Math.round(
            source.width * .55
          )
        ),
        1
      )
    );

  const vKernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        1,
        Math.max(
          8,
          Math.round(
            source.height * .65
          )
        )
      )
    );

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      21,
      11
    );

    cv.morphologyEx(
      binary,
      horizontal,
      cv.MORPH_OPEN,
      hKernel
    );

    cv.morphologyEx(
      binary,
      vertical,
      cv.MORPH_OPEN,
      vKernel
    );

    cv.bitwise_or(
      horizontal,
      vertical,
      allLines
    );

    cv.subtract(
      binary,
      allLines,
      cleanBinary
    );

    cv.bitwise_not(
      cleanBinary,
      finalMat
    );

    const output =
      document.createElement(
        "canvas"
      );

    output.width =
      source.width;

    output.height =
      source.height;

    cv.imshow(
      output,
      finalMat
    );

    return output;

  }finally{

    src.delete();
    gray.delete();
    binary.delete();
    horizontal.delete();
    vertical.delete();
    allLines.delete();
    cleanBinary.delete();
    finalMat.delete();
    hKernel.delete();
    vKernel.delete();

  }
}


/* =========================================================
   셀 내용 존재 여부
========================================================= */

function inspectCellInk(source){

  const src =
    cv.imread(source);

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.threshold(
      gray,
      binary,
      190,
      255,
      cv.THRESH_BINARY_INV
    );

    const nonZero =
      cv.countNonZero(
        binary
      );

    const total =
      binary.rows *
      binary.cols;

    let usefulContours = 0;
    let largestArea = 0;

    cv.findContours(
      binary,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );

    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);

      try{

        const area =
          Math.abs(
            cv.contourArea(
              contour
            )
          );

        if(
          area >
          largestArea
        ){
          largestArea = area;
        }

        if(
          area >=
          Math.max(
            5,
            total * .0012
          )
        ){
          usefulContours++;
        }

      }finally{

        contour.delete();

      }
    }

    return {

      ratio:
        total > 0
        ?
        nonZero / total
        :
        0,

      usefulContours,

      largestArea,

      total

    };

  }finally{

    src.delete();
    gray.delete();
    binary.delete();
    contours.delete();
    hierarchy.delete();

  }
}


/* =========================================================
   빈 셀
========================================================= */

function isCellBlank(
  source,
  type
){

  const info =
    inspectCellInk(
      source
    );

  if(
    type ===
    "temperature"
  ){

    return (
      info.ratio < .007
      ||
      (
        info.usefulContours === 0 &&
        info.largestArea <
        info.total * .001
      )
    );
  }

  return (
    info.ratio < .010
    ||
    (
      info.usefulContours === 0 &&
      info.largestArea <
      info.total * .0015
    )
  );
}


/* =========================================================
   OCR Worker
========================================================= */

async function getWorker(){

  if(worker){
    return worker;
  }

  setStatus(
    "문자 인식 엔진 준비중...",
    4
  );

  worker =
    await Tesseract.createWorker(
      "kor+eng",
      1
    );

  return worker;
}


/* =========================================================
   셀 OCR
========================================================= */

async function recognizeCell(
  source,
  type
){

  const prepared =
    preprocessCell(
      source
    );

  if(
    isCellBlank(
      prepared,
      type
    )
  ){

    return {
      blank:true,
      text:""
    };
  }

  const enlarged =
    enlargeForOCR(
      prepared,
      3
    );

  const ocrWorker =
    await getWorker();

  const options = {
    tessedit_pageseg_mode:
      Tesseract.PSM.SINGLE_LINE
  };

  if(
    type ===
    "temperature"
  ){

    options.tessedit_char_whitelist =
      "0123456789";
  }

  const result =
    await ocrWorker.recognize(
      enlarged,
      options
    );

  return {

    blank:false,

    text:
      clean(
        result.data.text
      )

  };
}


/* =========================================================
   온도
========================================================= */

function parseTemperature(text){

  if(!text){
    return null;
  }

  const matches =
    String(text).match(
      /\d{1,4}/g
    );

  if(!matches){
    return null;
  }

  for(
    const value
    of matches
  ){

    const number =
      Number(value);

    /*
      0 / 1 등 표선 오인식 차단
    */

    if(
      Number.isFinite(number) &&
      number >= 10 &&
      number <= 1800
    ){
      return number;
    }
  }

  return null;
}


/* =========================================================
   상태
========================================================= */

function parseState(text){

  const value =
    compact(text);

  if(
    value.includes("승온")
  ){
    return "승온중";
  }

  if(
    value.includes("유지")
  ){
    return "유지중";
  }

  if(
    value.includes("냉각")
  ){
    return "냉각중";
  }

  if(
    value.includes("가압")
  ){
    return "가압중";
  }

  return "";
}


/* =========================================================
   비고
========================================================= */

function parseRemark(text){

  const value =
    compact(text);

  return {

    unload:
      value.includes(
        "언로딩대기"
      )
      ||
      (
        value.includes("언로딩") &&
        value.includes("대기")
      ),

    cooling:
      value.includes("냉각")

  };
}

async function preparePatrolTable(file){

    await fileToCanvas(

  );

      original
    );

  const canvas =
    correction.canvas;

  setStatus(
    "순찰일지 표선 찾는 중...",
    14
  );

  const horizontal =
    detectHorizontalTableLines(
      canvas
    );

  const vertical =
    detectVerticalTableLines(
      canvas
    );

  const grid =
    build35RowGrid(
      horizontal,
      canvas.height
    );

  ){

      `세로선 ${columns.lines.length}개 감지.`
    );

  return {

    canvas,

    corrected:
      correction.corrected,

    horizontalCount:
      horizontal.length,

    verticalCount:
      columns.lines.length,

    grid,

    columns

  };
}

async function readPatrolEquipmentRow(
  table,
  rowNumber,
  equipment
){

  const temperatureCell =
    cropGridCell(
      table.canvas,
      table.grid,
      rowNumber,
      table.columns.temperature
    );

  const stateCell =
    cropGridCell(
      table.canvas,
      table.grid,
      rowNumber,
      table.columns.state
    );

  const remarkCell =
    cropGridCell(
      table.canvas,
      table.grid,
      rowNumber,
      table.columns.remark
    );


  const temperatureOCR =
    await recognizeCell(
      temperatureCell,
      "temperature"
    );

  const stateOCR =
    await recognizeCell(
      stateCell,
      "state"
    );

  const remarkOCR =
    await recognizeCell(
      remarkCell,
      "remark"
    );


  const temperature =
    temperatureOCR.blank
    ?
    null
    :
    parseTemperature(
      temperatureOCR.text
    );


  const state =
    stateOCR.blank
    ?
    ""
    :
    parseState(
      stateOCR.text
    );


  const remark =
    remarkOCR.blank
    ?
    {
      unload:false,
      cooling:false
    }
    :
    parseRemark(
      remarkOCR.text
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature,

    state,

    unload:
      remark.unload,

    remarkCooling:
      remark.cooling,

    blank:{
      temperature:
        temperatureOCR.blank,

      state:
        stateOCR.blank,

      remark:
        remarkOCR.blank
    },

    raw:{
      temperature:
        temperatureOCR.text,

      state:
        stateOCR.text,

      remark:
        remarkOCR.text
    }

  };
}

/* =========================================================
   순찰일지 분석
========================================================= */

async function analyzePatrol(file){

  const table =
    await preparePatrolTable(
      file
    );

  const rowMap =
    getPatrolRows();

  const readable =
    Object.entries(
      rowMap
    )
    .filter(
      ([,equipment]) =>
        equipment !== null
    );

  const items = {};

  const dry = [];

  const incinerators = [];

  let temperatureCount = 0;
  let stateCount = 0;
  let processed = 0;


  for(
    const [
      rowText,
      equipment
    ]
    of readable
  ){

    const rowNumber =
      Number(rowText);

    processed++;

    setStatus(
      `순찰일지 ${rowNumber}행 확인중...`,
      18 +
      Math.round(
        (
          processed /
          readable.length
        ) * 37
      )
    );


    if(
      DRY_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await readTemperatureOnlyRow(
          table,
          rowNumber,
          equipment
        );

      if(
        item.temperature !== null
      ){
        temperatureCount++;
      }

      dry.push(item);

      continue;
    }


    if(
      INCINERATOR_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await readTemperatureOnlyRow(
          table,
          rowNumber,
          equipment
        );

      if(
        item.temperature !== null
      ){
        temperatureCount++;
      }

      incinerators.push(item);

      continue;
    }


    const item =
      await readPatrolEquipmentRow(
        table,
        rowNumber,
        equipment
      );

    if(
      item.temperature !== null
    ){
      temperatureCount++;
    }

    if(item.state){
      stateCount++;
    }

    items[equipment] =
      item;
  }


  return {

    corrected:
      table.corrected,

    horizontalCount:
      table.horizontalCount,

    verticalCount:
      table.verticalCount,

    matchedRows:
      table.grid.matched,

    temperatureCount,

    stateCount,

    items,

    dry,

    incinerators

  };
}

/* =========================================================
   장비명 정규화
========================================================= */

function normalizeEquipment(value){

  const text =
    compact(value);

  /*
    CF 분위기로를 일반 CF보다 먼저 검사
  */

  if(
    text.includes("CF") &&
    (
      text.includes("분위기") ||
      text.includes("분위기로")
    )
  ){
    return "CF분위기로";
  }


  let match =
    text.match(
      /TG[-]?([1-7])/
    );

  if(match){
    return "TG" + match[1];
  }


  match =
    text.match(
      /GF[-]?(1|3|4|5)/
    );

  if(match){
    return "GF" + match[1];
  }


  match =
    text.match(
      /CF[-]?([1-6])/
    );

  if(match){
    return "CF" + match[1];
  }


  match =
    text.match(
      /HIP[-]?([123])/
    );

  if(match){
    return "HIP" + match[1];
  }


  if(
    text.includes("SMI")
  ){
    return "SMI";
  }


  return "";
}


/* =========================================================
   장비번호 판독

   예:
   #26-118
   26-118
   26 118
   26118

   → #26-118
========================================================= */

function parseEquipmentNumber(value){

  const text =
    clean(value)
    .replace(/[Oo]/g,"0")
    .replace(/[Il|]/g,"1")
    .replace(
      /[‐-‒–—―_.~]/g,
      "-"
    );


  let match =
    text.match(
      /#?\s*26\s*[-\s]\s*(\d{1,3})/
    );


  if(match){

    return (
      "#26-" +
      match[1]
    );
  }


  match =
    text.match(
      /(?:^|\D)26(\d{1,3})(?:\D|$)/
    );


  if(match){

    return (
      "#26-" +
      match[1]
    );
  }


  return "";
}


/* =========================================================
   가동 판독
========================================================= */

function parseRunning(value){

  const text =
    compact(value);

  if(
    text.includes("가동")
  ){
    return true;
  }

  /*
    OCR이 '가'를 놓치고
    '동'만 읽은 경우 보조판정.

    최종적으로 번호가 존재할 때만
    이 값을 사용한다.
  */

  if(
    text.includes("동")
  ){
    return true;
  }

  return false;
}


/* =========================================================
   사진2 전체 OCR

   Tesseract v5에서 words가 없을 수 있으므로
   blocks/paragraphs/lines/words를 안전하게 수집.
========================================================= */

function collectOCRWords(data){

  const result = [];


  function pushWord(word){

    if(
      !word ||
      !word.text ||
      !word.bbox
    ){
      return;
    }

    result.push(word);
  }


  if(
    Array.isArray(data.words)
  ){

    for(
      const word
      of data.words
    ){
      pushWord(word);
    }
  }


  if(
    result.length === 0 &&
    Array.isArray(data.blocks)
  ){

    for(
      const block
      of data.blocks
    ){

      const paragraphs =
        block.paragraphs || [];

      for(
        const paragraph
        of paragraphs
      ){

        const lines =
          paragraph.lines || [];

        for(
          const line
          of lines
        ){

          const words =
            line.words || [];

          for(
            const word
            of words
          ){
            pushWord(word);
          }
        }
      }
    }
  }


  return result;
}


async function recognizeNumberSheet(canvas){

  const ocrWorker =
    await getWorker();

  const scale = 1.7;

  const enlarged =
    enlargeForOCR(
      canvas,
      scale
    );

  const result =
    await ocrWorker.recognize(
      enlarged,
      {
        tessedit_pageseg_mode:
          Tesseract.PSM.AUTO
      }
    );

  const rawWords =
    collectOCRWords(
      result.data || {}
    );

  const words =
    rawWords
    .map(word => {

      const box =
        word.bbox;

      return {

        text:
          clean(
            word.text
          ),

        confidence:
          Number(
            word.confidence || 0
          ),

        x0:
          box.x0 / scale,

        y0:
          box.y0 / scale,

        x1:
          box.x1 / scale,

        y1:
          box.y1 / scale,

        cx:
          (
            box.x0 +
            box.x1
          ) /
          2 /
          scale,

        cy:
          (
            box.y0 +
            box.y1
          ) /
          2 /
          scale

      };
    })
    .filter(
      word =>
        word.text
    );


  return {

    text:
      clean(
        result.data?.text || ""
      ),

    words

  };
}


/* =========================================================
   장비명 앵커
========================================================= */

function findNumberAnchors(words){

  const anchors = {};


  for(
    const word
    of words
  ){

    const equipment =
      normalizeEquipment(
        word.text
      );


    if(
      !equipment ||
      !NUMBER_EQUIPMENT.includes(
        equipment
      )
    ){
      continue;
    }


    const previous =
      anchors[equipment];


    if(
      !previous ||
      word.confidence >
      previous.confidence
    ){

      anchors[equipment] = {

        equipment,

        text:
          word.text,

        confidence:
          word.confidence,

        x0:
          word.x0,

        y0:
          word.y0,

        x1:
          word.x1,

        y1:
          word.y1,

        cx:
          word.cx,

        cy:
          word.cy

      };
    }
  }


  return anchors;
}


/* =========================================================
   사진2 실제 행 영역
========================================================= */

function makeNumberRowBands(
  horizontalLines,
  canvasHeight
){

  const lines =
    [...horizontalLines]
    .sort(
      (a,b) =>
        a - b
    );

  const bands = [];


  for(
    let i = 0;
    i < lines.length - 1;
    i++
  ){

    const top =
      lines[i];

    const bottom =
      lines[i + 1];

    const height =
      bottom - top;


    if(
      height < 10 ||
      height >
      canvasHeight * .15
    ){
      continue;
    }


    bands.push({

      top,

      bottom,

      height,

      cy:
        (
          top +
          bottom
        ) / 2

    });
  }


  return bands;
}


/* =========================================================
   앵커가 속한 행
========================================================= */

function findBandForAnchor(
  bands,
  anchor,
  canvasHeight
){

  for(
    const band
    of bands
  ){

    if(
      anchor.cy >= band.top &&
      anchor.cy <= band.bottom
    ){
      return band;
    }
  }


  let nearest = null;
  let nearestDistance = Infinity;


  for(
    const band
    of bands
  ){

    const distance =
      Math.abs(
        anchor.cy -
        band.cy
      );


    if(
      distance <
      nearestDistance
    ){

      nearestDistance =
        distance;

      nearest =
        band;
    }
  }


  if(
    nearest &&
    nearestDistance <
    canvasHeight * .04
  ){
    return nearest;
  }


  return null;
}


/* =========================================================
   사진2 행 Crop
========================================================= */

function cropNumberBand(
  canvas,
  band
){

  const padY =
    Math.max(
      2,
      band.height * .10
    );


  return cropCanvas(

    canvas,

    0,

    band.top + padY,

    canvas.width,

    Math.max(
      1,
      band.height -
      padY * 2
    )

  );
}


/* =========================================================
   사진2 행 OCR
========================================================= */

async function recognizeNumberBand(canvas){

  const enlarged =
    enlargeForOCR(
      canvas,
      2.5
    );

  const ocrWorker =
    await getWorker();


  const result =
    await ocrWorker.recognize(
      enlarged,
      {
        tessedit_pageseg_mode:
          Tesseract.PSM.SINGLE_LINE
      }
    );


  return clean(
    result.data?.text || ""
  );
}


/* =========================================================
   사진2 한 장비 판독
========================================================= */

async function readNumberEquipment(
  canvas,
  words,
  band,
  expectedEquipment
){

  const bandCanvas =
    cropNumberBand(
      canvas,
      band
    );


  const directText =
    await recognizeNumberBand(
      bandCanvas
    );


  const rowText =
    words
    .filter(
      word =>
        word.cy >= band.top &&
        word.cy <= band.bottom
    )
    .sort(
      (a,b) =>
        a.x0 - b.x0
    )
    .map(
      word =>
        word.text
    )
    .join(" ");


  const combined =
    clean(
      rowText +
      " " +
      directText
    );


  const number =
    parseEquipmentNumber(
      combined
    );


  const running =
    Boolean(number) &&
    parseRunning(
      combined
    );


  return {

    equipment:
      expectedEquipment,

    recognizedEquipment:
      normalizeEquipment(
        combined
      ),

    number,

    running,

    raw:
      combined

  };
}

/* =========================================================
   일반 장비 제외 규칙
========================================================= */

function getExcludeReason(
  equipment,
  patrol,
  number
){

  if(
    !number ||
    !number.found
  ){
    return "장비번호표 미인식";
  }


  /*
    번호 없는 장비는 가동 안 한 것으로 처리
  */

  if(
    !number.number
  ){
    return "장비번호 없음";
  }


  /*
    번호 + 가동 둘 다 필요
  */

  if(
    !number.running
  ){
    return "가동 확인 안 됨";
  }


  if(!patrol){
    return "순찰일지 데이터 없음";
  }


  /*
    비고 언로딩대기 우선 제외
  */

  if(
    patrol.unload
  ){
    return "언로딩대기";
  }


  /*
    비고 냉각도 제외
  */

  if(
    patrol.remarkCooling
  ){
    return "비고 냉각";
  }


  /*
    순찰일지에 온도 미작성
  */

  if(
    patrol.temperature === null
  ){

    if(
      patrol.blank?.temperature
    ){
      return "온도 미작성";
    }

    return "온도 인식 실패";
  }


  /*
    상태 미작성/인식실패
  */

  if(
    !patrol.state
  ){

    if(
      patrol.blank?.state
    ){
      return "상태 미작성";
    }

    return "상태 인식 실패";
  }


  /*
    100도 이하 냉각 제외
  */

  if(
    patrol.temperature <= 100 &&
    patrol.state === "냉각중"
  ){
    return "100도 이하 냉각";
  }


  return "";
}


/* =========================================================
   사진1 + 사진2 교차검증
========================================================= */

function mergeAnalysis(
  patrol,
  number
){

  const included = [];
  const excluded = [];


  for(
    const equipment
    of REPORT_ORDER
  ){

    const patrolItem =
      patrol.items[
        equipment
      ];

    const numberItem =
      number.items[
        equipment
      ];


    const reason =
      getExcludeReason(
        equipment,
        patrolItem,
        numberItem
      );


    if(reason){

      excluded.push({

        equipment,

        reason,

        patrol:
          patrolItem || null,

        number:
          numberItem || null

      });

      continue;
    }


    included.push({

      equipment,

      number:
        numberItem.number,

      temperature:
        patrolItem.temperature,

      state:
        patrolItem.state

    });
  }


  /*
    TG1

    순찰일지에는 없음.
    사진2 번호 + 가동만 확인.
    일반 장비 맨 아래에 출력.
  */

  let tg1 = null;

  const tg1Number =
    number.items["TG1"];


  if(
    tg1Number &&
    tg1Number.number &&
    tg1Number.running
  ){

    tg1 = {

      equipment:"TG1",

      number:
        tg1Number.number

    };
  }


  /*
    드라이챔버
    번호 없음
    실제 온도 인식된 것만 출력
  */

  const dry =
    patrol.dry.filter(
      item =>
        item.temperature !== null
    );


  /*
    소각기
    별도 출력
    온도만
  */

  const incinerators =
    patrol.incinerators.filter(
      item =>
        item.temperature !== null
    );


  return {

    included,

    excluded,

    tg1,

    dry,

    incinerators

  };
}


/* =========================================================
   전체 분석 유효성
========================================================= */

function validateAnalysis(
  patrol,
  number
){

  const problems = [];


  if(
    patrol.matchedRows < 18
  ){

    problems.push(
      `순찰일지 표 일치 부족 (${patrol.matchedRows}/36)`
    );
  }


  if(
    patrol.verticalCount < 4
  ){

    problems.push(
      `순찰일지 세로선 부족 (${patrol.verticalCount}개)`
    );
  }


  /*
    사진2 장비명을 거의 못 읽었다면
    잘못된 보고서를 생성하지 않음.
  */

  if(
    number.foundCount < 5
  ){

    problems.push(
      `장비번호표 장비명 인식 부족 (${number.foundCount}개)`
    );
  }


  if(
    number.numberCount > 0 &&
    number.runningCount === 0
  ){

    problems.push(
      `번호 ${number.numberCount}개 인식 / 가동 0개`
    );
  }


  return {

    valid:
      problems.length === 0,

    problems

  };
}


/* =========================================================
   번호 표시
========================================================= */

function displayNumber(number){

  return String(
    number || ""
  ).replace(
    /^#/,
    ""
  );
}


/* =========================================================
   결과 UI 한 줄
========================================================= */

function makeResultElement(item){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "result";


  const check =
    document.createElement(
      "div"
    );

  check.className =
    "check";

  check.textContent =
    "✓";


  const content =
    document.createElement(
      "div"
    );


  const main =
    document.createElement(
      "div"
    );

  main.className =
    "main";

  main.textContent =
    `${displayNumber(item.number)} ${item.equipment}`;


  const sub =
    document.createElement(
      "div"
    );

  sub.className =
    "sub";

  sub.textContent =
    `${item.temperature}도 · ${item.state}`;


  content.appendChild(
    main
  );

  content.appendChild(
    sub
  );


  const badge =
    document.createElement(
      "div"
    );

  badge.className =
    "badge";

  badge.textContent =
    "표시";


  div.appendChild(
    check
  );

  div.appendChild(
    content
  );

  div.appendChild(
    badge
  );


  return div;
}


/* =========================================================
   분석 결과 표시
========================================================= */

function renderAnalysis(
  patrol,
  number,
  merged,
  validation
){

  $("results").innerHTML =
    "";


  $("patrolStatus")
    .classList
    .remove("hidden");


  $("patrolStatus").textContent =

    "사진 1 · " +

    (
      patrol.corrected
      ?
      "자동보정 ✓"
      :
      "원본 사용"
    )

    +

    ` · 가로선 ${patrol.horizontalCount}`

    +

    ` · 세로선 ${patrol.verticalCount}`

    +

    ` · 표 일치 ${patrol.matchedRows}/36`

    +

    ` · 온도 ${patrol.temperatureCount}`

    +

    ` · 상태 ${patrol.stateCount}`;


  $("numberStatus")
    .classList
    .remove("hidden");


  $("numberStatus").textContent =

    "사진 2 · " +

    (
      number.corrected
      ?
      "자동보정 ✓"
      :
      "원본 사용"
    )

    +

    ` · 장비명 ${number.foundCount}`

    +

    ` · 번호 ${number.numberCount}`

    +

    ` · 가동 ${number.runningCount}`;


  if(
    validation.valid
  ){

    $("fatalWarning")
      .classList
      .add("hidden");

    $("makeReport").disabled =
      false;

  }else{

    $("fatalWarning")
      .classList
      .remove("hidden");

    $("fatalWarning").textContent =
      "인식 결과 확인 필요 · " +
      validation.problems.join(" / ");

    $("makeReport").disabled =
      true;
  }


  for(
    const item
    of merged.included
  ){

    $("results")
      .appendChild(
        makeResultElement(
          item
        )
      );
  }


  if(
    merged.included.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );

    empty.style.padding =
      "22px 4px";

    empty.style.textAlign =
      "center";

    empty.style.color =
      "#8d96a8";

    empty.style.fontSize =
      "13px";

    empty.textContent =
      "자동 확정된 일반 장비가 없습니다.";

    $("results")
      .appendChild(
        empty
      );
  }


  /*
    TG1
  */

  if(
    merged.tg1
  ){

    $("tg1Area")
      .classList
      .remove("hidden");

    $("tg1Area").textContent =
      `${displayNumber(merged.tg1.number)} TG1 · ` +
      "순찰일지 미등록 / 번호·가동 확인";

  }else{

    $("tg1Area")
      .classList
      .add("hidden");
  }


  /*
    제외 목록
  */

  $("excludedCount").textContent =
    `제외항목 ${merged.excluded.length}개`;

  $("excluded").innerHTML =
    "";


  for(
    const item
    of merged.excluded
  ){

    const div =
      document.createElement(
        "div"
      );


    const numberText =
      item.number?.number
      ?
      displayNumber(
        item.number.number
      )
      :
      "번호 없음";


    const line1 =
      document.createElement(
        "b"
      );

    line1.textContent =
      `${numberText} ${item.equipment}`;


    div.appendChild(
      line1
    );


    if(
      item.patrol &&
      (
        item.patrol.temperature !== null ||
        item.patrol.state
      )
    ){

      const patrolLine =
        document.createElement(
          "div"
        );

      patrolLine.style.padding =
        "3px 0 0";

      patrolLine.style.border =
        "0";


      const temp =
        item.patrol.temperature !== null
        ?
        `${item.patrol.temperature}도`
        :
        "";


      patrolLine.textContent =
        `${temp} ${item.patrol.state || ""}`.trim();


      div.appendChild(
        patrolLine
      );
    }


    const reason =
      document.createElement(
        "div"
      );

    reason.style.padding =
      "3px 0 0";

    reason.style.border =
      "0";

    reason.textContent =
      `→ ${item.reason}`;


    div.appendChild(
      reason
    );


    $("excluded")
      .appendChild(
        div
      );
  }


  $("count").textContent =
    `${merged.included.length}개 표시`;


  $("resultCard")
    .classList
    .remove("hidden");


  $("resultCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}

/* =========================================================
   분석 실행
========================================================= */

$("analyze").onclick =
async () => {

  if(
    !patrolImage ||
    !numberImage
  ){
    return;
  }


  $("analyze").disabled =
    true;


  resetAnalysis();


  try{

    setStatus(
      "DACC 분석 준비중...",
      2
    );


    await loadOpenCV();


    const patrol =
      await analyzePatrol(
        patrolImage
      );


    const number =
      await analyzeNumberPhoto(
        numberImage
      );


    setStatus(
      "두 사진 대조중...",
      91
    );


    const merged =
      mergeAnalysis(
        patrol,
        number
      );


    const validation =
      validateAnalysis(
        patrol,
        number
      );


    analysisResult = {

      patrol,

      number,

      merged,

      validation

    };


    setStatus(
      validation.valid
      ?
      "분석 완료"
      :
      "인식 결과 확인 필요",
      100
    );


    renderAnalysis(
      patrol,
      number,
      merged,
      validation
    );


  }catch(error){

    console.error(
      "DACC ANALYSIS ERROR",
      error
    );


    analysisResult =
      null;


    $("resultCard")
      .classList
      .remove("hidden");


    $("fatalWarning")
      .classList
      .remove("hidden");


    $("fatalWarning").textContent =
      "사진 분석 실패 · " +
      (
        error?.message ||
        String(error) ||
        "알 수 없는 오류"
      );


    $("makeReport").disabled =
      true;


    setStatus(
      "분석 실패",
      0
    );


  }finally{

    updateAnalyzeButton();

  }
};


/* =========================================================
   날짜
========================================================= */

function getToday(){

  const now =
    new Date();


  const weekdays = [
    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"
  ];


  return {

    month:
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      ),

    day:
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      ),

    weekday:
      weekdays[
        now.getDay()
      ]

  };
}


/* =========================================================
   근무명
========================================================= */

function getWorkName(){

  if(
    workType === "weekday"
  ){
    return "주간";
  }


  if(
    workType === "holiday"
  ){
    return "휴일주간";
  }


  return "야간";
}


/* =========================================================
   일반장비 보고 한 줄
========================================================= */

function makeEquipmentLine(item){

  return (
    displayNumber(
      item.number
    )
    +
    " "
    +
    item.equipment
    +
    " "
    +
    item.temperature
    +
    "도 "
    +
    item.state
  );
}


/* =========================================================
   최종 문자보고 생성

   TG1은 일반장비 맨 아래.
   드라이챔버 번호 없음.
   소각기 별도 출력.
========================================================= */

function buildReport(){

  if(
    !analysisResult ||
    !analysisResult.validation.valid
  ){
    return "";
  }


  const merged =
    analysisResult.merged;


  const today =
    getToday();


  const lines = [];


  lines.push(
    `${today.month}월 ${today.day}일 (${today.weekday}) ${getWorkName()}근무자`
  );


  lines.push(
    `${rank}입니다.`
  );


  lines.push("");


  /*
    사용자 요청 명칭
  */

  lines.push(
    '"문자보고 작성 생산전용"'
  );


  /*
    일반 장비
  */

  for(
    const equipment
    of REPORT_ORDER
  ){

    const item =
      merged.included.find(
        value =>
          value.equipment ===
          equipment
      );


    if(!item){
      continue;
    }


    lines.push(
      makeEquipmentLine(
        item
      )
    );
  }


  /*
    TG1 맨 아래
  */

  if(
    merged.tg1
  ){

    lines.push(
      `${displayNumber(
        merged.tg1.number
      )} TG1`
    );
  }


  /*
    드라이챔버
  */

  if(
    merged.dry.length
  ){

    lines.push("");


    for(
      const item
      of merged.dry
    ){

      lines.push(
        `${item.equipment} ${item.temperature}도`
      );
    }
  }


  /*
    소각기 별도
  */

  if(
    merged.incinerators.length
  ){

    lines.push("");

    lines.push(
      "-TG소각기-"
    );


    const order = [
      "1동소각기",
      "3동소각기"
    ];


    const sorted =
      [...merged.incinerators]
      .sort(
        (a,b) =>
          order.indexOf(
            a.equipment
          )
          -
          order.indexOf(
            b.equipment
          )
      );


    for(
      const item
      of sorted
    ){

      const name =
        item.equipment ===
        "1동소각기"
        ?
        "1동"
        :
        "3동";


      lines.push(
        `${name} ${item.temperature}도`
      );
    }
  }


  return lines.join("\n");
}


/* =========================================================
   보고서 버튼
========================================================= */

$("makeReport").onclick =
() => {

  if(
    !analysisResult
  ){

    alert(
      "먼저 두 사진을 분석해주세요."
    );

    return;
  }


  if(
    !analysisResult.validation.valid
  ){

    alert(

    );

  const report =

  if(!report){

      "문자보고를 생성할 수 없습니다."
    );

    return;
  }


  $("report").value =

  $("reportCard")
    .classList
    .remove("hidden");


  $("reportCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
};


/* =========================================================
   iPhone 복사 fallback
========================================================= */

function fallbackCopy(){

  const textarea =
    $("report");


  textarea.focus();

  textarea.select();

  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  return document.execCommand(
    "copy"
  );
}


/* =========================================================
   복사 완료
========================================================= */

function showCopied(){

  const button =
    $("copy");


  button.textContent =
    "복사 완료 ✓";


  setTimeout(
    () => {

      button.textContent =
        "전체 복사";

    },
    1300
  );
}


/* =========================================================
   전체 복사
========================================================= */

$("copy").onclick =
async () => {

  const text =
    $("report").value;


  if(!text){
    return;
  }


  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard
        .writeText(text);

      showCopied();

      return;
    }


    if(
      fallbackCopy()
    ){

      showCopied();

      return;
    }


    throw new Error(
      "clipboard unavailable"
    );


  }catch(error){

    try{

      if(
        fallbackCopy()
      ){

        showCopied();

        return;
      }

    }catch(copyError){

      console.warn(
        copyError
      );
    }


    alert(
      "자동 복사가 차단됐습니다. 문자보고 내용을 길게 눌러 복사해주세요."
    );
  }
};
