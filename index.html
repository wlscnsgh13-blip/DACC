<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#f4f6fa"
>

<title>DACC</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body {
  margin:0;
  background:#f4f6fa;
  color:#172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

button,
input,
textarea,
select {
  font:inherit;
}

button {
  -webkit-appearance:none;
  appearance:none;
}

.app {
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:
    20px
    16px
    calc(50px + env(safe-area-inset-bottom));
}

.brand {
  font-size:12px;
  font-weight:900;
  color:#4f6fe8;
  letter-spacing:1.5px;
}

.title {
  font-size:24px;
  font-weight:900;
  margin:4px 0;
}

.sub {
  font-size:13px;
  color:#8c96a9;
  margin-bottom:18px;
}

.card {
  background:#fff;
  border:1px solid #e5e9f2;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:
    0 5px 20px
    rgba(26,39,70,.04);
}

.cardTitle {
  font-size:15px;
  font-weight:900;
}

.headrow {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.fieldLabel {
  display:block;
  font-size:12px;
  font-weight:900;
  color:#69758a;
  margin-bottom:7px;
}

.select {
  width:100%;
  height:44px;
  border:1px solid #dfe4ee;
  background:#fff;
  border-radius:11px;
  padding:0 12px;
  color:#172033;
  font-weight:800;
  outline:none;
}

.select:focus {
  border-color:#7189ef;
}

.formGrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.uploadBox {
  margin-top:12px;
}

.upload {
  border:0;
  background:#f8faff;
  border-radius:16px;
  padding:20px 12px;
  text-align:center;
  display:block;
  cursor:pointer;
}

.plus {
  width:42px;
  height:42px;
  margin:0 auto 8px;
  border-radius:50%;
  background:#edf1ff;
  color:#4f6fe8;
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:500;
}

.upload b {
  font-size:15px;
}

.upload small {
  display:block;
  color:#9aa3b4;
  margin-top:4px;
  line-height:1.5;
}

.file {
  display:none;
}

.preview {
  margin-top:10px;
  height:150px;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:#eef1f6;
}

.preview img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.previewTag {
  position:absolute;
  left:8px;
  bottom:8px;
  background:rgba(20,25,35,.75);
  color:#fff;
  border-radius:7px;
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
}

.removePhoto {
  position:absolute;
  right:8px;
  top:8px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:rgba(20,25,35,.75);
  color:#fff;
  font-size:20px;
  line-height:30px;
}

.primary {
  width:100%;
  min-height:50px;
  border:0;
  border-radius:14px;
  background:#4f6fe8;
  color:#fff;
  font-size:15px;
  font-weight:900;
  margin-top:12px;
  padding:12px;
}

.primary:disabled {
  background:#c5cbd8;
  color:#f7f8fb;
}

.progress {
  margin-top:12px;
  background:#f4f6fb;
  border-radius:12px;
  padding:12px;
  font-size:12px;
  color:#68738a;
}

.bar {
  height:7px;
  background:#e1e6f0;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.bar > div {
  height:100%;
  width:0;
  background:#4f6fe8;
  transition:.2s;
}

.statusBox {
  margin-top:10px;
  display:grid;
  gap:7px;
}

.statusLine {
  background:#f7f9fc;
  border:1px solid #e8ecf3;
  border-radius:10px;
  padding:9px 11px;
  font-size:11px;
  color:#69758a;
  font-weight:800;
}

.result {
  display:grid;
  grid-template-columns:28px 1fr auto;
  gap:8px;
  align-items:center;
  min-height:56px;
  border-bottom:1px solid #eef1f5;
}

.check {
  width:23px;
  height:23px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#e7f8ef;
  color:#20a764;
  font-weight:900;
}

.main {
  font-size:13px;
  font-weight:900;
}

.result .sub {
  margin:3px 0 0;
  font-size:11px;
  color:#8993a5;
}

.badge {
  font-size:10px;
  font-weight:900;
  padding:5px 7px;
  border-radius:7px;
  background:#edf1ff;
  color:#4f6fe8;
}

.tg1Area {
  margin-top:10px;
  border-radius:11px;
  background:#f7f9fc;
  padding:11px 12px;
  font-size:12px;
  font-weight:900;
  color:#596579;
}

.fold {
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  background:#f0f2f6;
  color:#596274;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  margin-top:12px;
}

.excluded {
  background:#f8f9fb;
  border-radius:12px;
  margin-top:8px;
  overflow:hidden;
}

.excludedItem {
  padding:11px 13px;
  border-bottom:1px solid #e9edf3;
  font-size:12px;
  color:#737e92;
  line-height:1.5;
}

.excludedItem:last-child {
  border-bottom:0;
}

.excludedItem b {
  color:#3f495b;
}

.emptyResult {
  text-align:center;
  padding:25px 10px;
  color:#8c96a9;
  font-size:13px;
}

.warning {
  margin-top:12px;
  border:1px solid #f3d6a5;
  background:#fff8eb;
  color:#a86d0b;
  border-radius:11px;
  padding:11px 12px;
  font-size:12px;
  line-height:1.5;
  font-weight:800;
}

.report {
  width:100%;
  min-height:390px;
  border:1px solid #e1e6ef;
  background:#fbfcfe;
  border-radius:14px;
  padding:15px;
  font-size:13px;
  line-height:1.7;
  resize:vertical;
  outline:none;
}

.report:focus {
  border-color:#7189ef;
}

.note {
  font-size:11px;
  color:#9aa3b4;
  margin-top:9px;
  line-height:1.5;
}

.hidden {
  display:none !important;
}

</style>
</head>

<body>

<main class="app">

  <div class="brand">
    DACC
  </div>

  <div class="title">
    문자보고 작성 생산전용
  </div>

  <div class="sub">
    순찰일지와 교대 업무일지를 촬영해 장비 가동현황을 확인합니다.
  </div>


  <!-- ===============================================
       근무 정보
  ================================================ -->

  <section class="card">

    <div class="cardTitle">
      근무 정보
    </div>

    <div
      class="formGrid"
      style="margin-top:12px"
    >

      <div>

        <label
          class="fieldLabel"
          for="workType"
        >
          근무
        </label>

        <select
          class="select"
          id="workType"
        >
          <option value="weekday">
            주간
          </option>

          <option value="night">
            야간
          </option>

          <option value="holiday">
            휴일주간
          </option>
        </select>

      </div>


      <div>

        <label
          class="fieldLabel"
          for="rank"
        >
          직급
        </label>

        <select
          class="select"
          id="rank"
        >
          <option value="대리">
            대리
          </option>

          <option value="주임">
            주임
          </option>

          <option
            value="사원"
            selected
          >
            사원
          </option>
        </select>

      </div>

    </div>

  </section>


  <!-- ===============================================
       사진 1 : 순찰일지
  ================================================ -->

  <section class="card">

    <div class="headrow">

      <div class="cardTitle">
        사진 1 · 순찰일지
      </div>


    </div>


    <div class="uploadBox">

      <label
        class="upload"
        for="patrolInput"
      >

        <div class="plus">
          +
        </div>

        <b>
          순찰일지 사진 추가
        </b>

        <small>
          장비명부터 비고까지 표 전체가 보이게 촬영
        </small>

      </label>


      <input
        class="file"
        id="patrolInput"
        type="file"
        accept="image/*"
      >


      <div
        id="patrolPreview"
        class="preview hidden"
      >

        <img
          id="patrolPreviewImage"
          alt=""
        >

        <span class="previewTag">
          사진 1
        </span>

        <button
          type="button"
          class="removePhoto"
          id="removePatrol"
        >
          ×
        </button>

      </div>

    </div>

  </section>


  <!-- ===============================================
       사진 2 : 교대 업무일지
  ================================================ -->

  <section class="card">

    <div class="headrow">

      <div class="cardTitle">
        사진 2 · 교대 업무일지
      </div>


    </div>


    <div class="uploadBox">

      <label
        class="upload"
        for="numberInput"
      >

        <div class="plus">
          +
        </div>

        <b>
          교대 업무일지 사진 추가
        </b>

        <small>
          장비명과 가동여부 열이 모두 보이게 촬영
        </small>

      </label>


      <input
        class="file"
        id="numberInput"
        type="file"
        accept="image/*"
      >


      <div
        id="numberPreview"
        class="preview hidden"
      >

        <img
          id="numberPreviewImage"
          alt=""
        >

        <span class="previewTag">
          사진 2
        </span>

        <button
          type="button"
          class="removePhoto"
          id="removeNumber"
        >
          ×
        </button>

      </div>

    </div>


    <button
      type="button"
      class="primary"
      id="analyze"
      disabled
    >
      두 사진 분석하기
    </button>


    <div
      class="progress hidden"
      id="progressBox"
    >

      <span id="statusText">
        DACC 준비중...
      </span>

      <div class="bar">
        <div id="progressBar"></div>
      </div>

    </div>

  </section>


  <!-- ===============================================
       분석 결과
  ================================================ -->

  <section
    class="card hidden"
    id="resultCard"
  >

    <div class="headrow">

      <div class="cardTitle">
        분석 결과
      </div>

      <div
        class="brand"
        id="count"
      >
      </div>

    </div>


    <div class="statusBox">

      <div
        class="statusLine hidden"
        id="patrolStatus"
      >
      </div>

      <div
        class="statusLine hidden"
        id="numberStatus"
      >
      </div>

    </div>


    <div
      class="warning hidden"
      id="fatalWarning"
    >
    </div>


    <div id="results">
    </div>


    <div
      class="tg1Area hidden"
      id="tg1Area"
    >
    </div>


    <button
      type="button"
      class="fold"
      id="excludedBtn"
    >

      <span id="excludedCount">
        제외항목 0개
      </span>

      <span id="arrow">
        ▼
      </span>

    </button>


    <div
      class="excluded hidden"
      id="excluded"
    >
    </div>


    <button
      type="button"
      class="primary"
      id="makeReport"
      disabled
    >
      문자보고 작성 생산전용
    </button>

  </section>


  <!-- ===============================================
       최종 문자보고
  ================================================ -->

  <section
    class="card hidden"
    id="reportCard"
  >

    <div
      class="cardTitle"
      style="margin-bottom:12px"
    >
      문자보고
    </div>


    <textarea
      class="report"
      id="report"
      spellcheck="false"
    ></textarea>


    <button
      type="button"
      class="primary"
      id="copy"
    >
      전체 복사
    </button>


    <div class="note">
      분석 결과를 확인한 뒤 전체 복사를 눌러 문자에 붙여넣으면 됩니다.
    </div>

  </section>

</main>


<script>


/* =========================================================
   사진 미리보기 UI
========================================================= */

let daccPatrolPreviewURL = "";
let daccNumberPreviewURL = "";


function daccPreviewFile(
  input,
  preview,
  image,
  type
) {

  const file =
    input.files?.[0] ||
    null;


  if (
    type === "patrol" &&
    daccPatrolPreviewURL
  ) {

    URL.revokeObjectURL(
      daccPatrolPreviewURL
    );

    daccPatrolPreviewURL = "";
  }


  if (
    type === "number" &&
    daccNumberPreviewURL
  ) {

    URL.revokeObjectURL(
      daccNumberPreviewURL
    );

    daccNumberPreviewURL = "";
  }


  if (!file) {

    preview.classList.add(
      "hidden"
    );

    image.removeAttribute(
      "src"
    );

    return;
  }


  const url =
    URL.createObjectURL(file);


  if (
    type === "patrol"
  ) {

    daccPatrolPreviewURL =
      url;

  } else {

    daccNumberPreviewURL =
      url;
  }


  image.src =
    url;


  preview.classList.remove(
    "hidden"
  );
}


const daccPreviewPatrolInput =
  document.getElementById(
    "patrolInput"
  );


const daccPreviewNumberInput =
  document.getElementById(
    "numberInput"
  );


daccPreviewPatrolInput
?.addEventListener(
  "change",
  () => {

    daccPatrolFile =
      daccPreviewPatrolInput.files?.[0] ||
      null;

    daccPreviewFile(

      daccPreviewPatrolInput,

      document.getElementById(
        "patrolPreview"
      ),

      document.getElementById(
        "patrolPreviewImage"
      ),

      "patrol"

    );

    if (
      typeof daccUpdateAnalyzeButton ===
      "function"
    ) {
      daccUpdateAnalyzeButton();
    }
  }
);


daccPreviewNumberInput
?.addEventListener(
  "change",
  () => {

    daccNumberFile =
      daccPreviewNumberInput.files?.[0] ||
      null;

    daccPreviewFile(

      daccPreviewNumberInput,

      document.getElementById(
        "numberPreview"
      ),

      document.getElementById(
        "numberPreviewImage"
      ),

      "number"

    );

    if (
      typeof daccUpdateAnalyzeButton ===
      "function"
    ) {
      daccUpdateAnalyzeButton();
    }
  }
);


document.getElementById(
  "removePatrol"
)
?.addEventListener(
  "click",
  () => {

    daccPreviewPatrolInput.value =
      "";

    daccPatrolFile =
      null;


    daccPreviewFile(

      daccPreviewPatrolInput,

      document.getElementById(
        "patrolPreview"
      ),

      document.getElementById(
        "patrolPreviewImage"
      ),

      "patrol"

    );


    if (
      typeof daccUpdateAnalyzeButton ===
      "function"
    ) {

      daccUpdateAnalyzeButton();
    }
  }
);


document.getElementById(
  "removeNumber"
)
?.addEventListener(
  "click",
  () => {

    daccPreviewNumberInput.value =
      "";

    daccNumberFile =
      null;


    daccPreviewFile(

      daccPreviewNumberInput,

      document.getElementById(
        "numberPreview"
      ),

      document.getElementById(
        "numberPreviewImage"
      ),

      "number"

    );


    if (
      typeof daccUpdateAnalyzeButton ===
      "function"
    ) {

      daccUpdateAnalyzeButton();
    }
  }
);


/* =========================================================
   DACC PART 1
   장비 고정 매핑 / 분류

   원칙
   1. 장비명 OCR 금지
   2. 사진1/사진2 같은 index 직접 연결 금지
   3. 실제 인쇄 행 순서 고정
   4. EQUIPMENT_MAP 기준으로 교차검증
========================================================= */


/* =========================================================
   사진1 : 순찰일지 35행
========================================================= */

const PATROL_ROW_ORDER = [

  "TG2",                  // 1
  "TG3",                  // 2
  "TG4",                  // 3
  "TG5",                  // 4
  "TG6",                  // 5
  "TG7",                  // 6

  "GF1",                  // 7
  "GF3",                  // 8
  "GF4",                  // 9
  "GF5",                  // 10

  "SMI",                  // 11

  "CF1",                  // 12
  "CF2",                  // 13
  "CF3",                  // 14
  "CF4",                  // 15
  "CF5",                  // 16
  "CF6",                  // 17

  "CF분위기로",           // 18
  "드라이챔버",           // 19

  "유해화학물질누액감지기", // 20
  "세정집진기",             // 21
  "탈형장폐필터",           // 22
  "생산동주냉각탑휀",       // 23
  "생산동주냉각수펌프",     // 24

  "신형드라이챔버",        // 25

  "소각기1동",             // 26
  "소각기3동",             // 27

  "HIP1",                  // 28
  "HIP2",                  // 29
  "HIP3",                  // 30

  "천장환풍기전원확인",     // 31
  "SIC-CVD",               // 32
  "SIC-LINE",              // 33
  "자동차다이나모",         // 34
  "항공기다이나모"          // 35

];


/* =========================================================
   사진2 : 교대 업무일지 24행
========================================================= */

const NUMBER_ROW_ORDER = [

  "TG1",                  // 1

  "TG2",                  // 2
  "TG3",                  // 3
  "TG4",                  // 4
  "TG5",                  // 5
  "TG6",                  // 6
  "TG7",                  // 7

  "CF1",                  // 8
  "CF2",                  // 9
  "CF3",                  // 10
  "CF4",                  // 11
  "CF5",                  // 12
  "CF6",                  // 13

  "GF1",                  // 14
  "GF3",                  // 15
  "GF4",                  // 16
  "GF5",                  // 17

  "HIP1",                 // 18
  "HIP2",                 // 19
  "HIP3",                 // 20

  "SMI",                  // 21

  "CF분위기로",           // 22
  "드라이챔버",           // 23
  "신형드라이챔버"        // 24

];


/* =========================================================
   사진1 ↔ 사진2 실제 장비 행 매핑
========================================================= */

const EQUIPMENT_MAP = {

  TG2:{
    patrolRow:1,
    numberRow:2
  },

  TG3:{
    patrolRow:2,
    numberRow:3
  },

  TG4:{
    patrolRow:3,
    numberRow:4
  },

  TG5:{
    patrolRow:4,
    numberRow:5
  },

  TG6:{
    patrolRow:5,
    numberRow:6
  },

  TG7:{
    patrolRow:6,
    numberRow:7
  },


  GF1:{
    patrolRow:7,
    numberRow:14
  },

  GF3:{
    patrolRow:8,
    numberRow:15
  },

  GF4:{
    patrolRow:9,
    numberRow:16
  },

  GF5:{
    patrolRow:10,
    numberRow:17
  },


  SMI:{
    patrolRow:11,
    numberRow:21
  },


  CF1:{
    patrolRow:12,
    numberRow:8
  },

  CF2:{
    patrolRow:13,
    numberRow:9
  },

  CF3:{
    patrolRow:14,
    numberRow:10
  },

  CF4:{
    patrolRow:15,
    numberRow:11
  },

  CF5:{
    patrolRow:16,
    numberRow:12
  },

  CF6:{
    patrolRow:17,
    numberRow:13
  },


  "CF분위기로":{
    patrolRow:18,
    numberRow:22
  },


  "드라이챔버":{
    patrolRow:19,
    numberRow:23
  },


  "신형드라이챔버":{
    patrolRow:25,
    numberRow:24
  },


  HIP1:{
    patrolRow:28,
    numberRow:18
  },

  HIP2:{
    patrolRow:29,
    numberRow:19
  },

  HIP3:{
    patrolRow:30,
    numberRow:20
  }

};


/* =========================================================
   일반 문자보고 순서

   TG1 별도
   드라이챔버류 별도
   CF분위기로 별도
========================================================= */

const REPORT_ORDER = [

  "TG2",
  "TG3",
  "TG4",

/* =========================================================
   OpenCV 로드
========================================================= */

function loadDACCOpenCV() {

  if (
    window.cv &&
    typeof window.cv.Mat === "function"
  ) {
    return Promise.resolve();
  }


  if (daccCvPromise) {
    return daccCvPromise;
  }


  daccCvPromise =
    new Promise(
      (resolve, reject) => {

        const existing =
          document.querySelector(
            'script[data-dacc-opencv="1"]'
          );


        if (!existing) {

          const script =
            document.createElement(
              "script"
            );


          script.async = true;

          script.src =
            "https://docs.opencv.org/4.x/opencv.js";

          script.dataset.daccOpencv =
            "1";


          document.head.appendChild(
            script
          );
        }


        const start =
          Date.now();


        const timer =
          setInterval(
            () => {

              if (
                window.cv &&
                typeof window.cv.Mat ===
                "function"
              ) {

                clearInterval(
                  timer
                );

                resolve();

                return;
              }


              if (
                Date.now() -
                start >
                30000
              ) {

                clearInterval(
                  timer
                );


                reject(
                  new Error(
                    "OpenCV 로딩 실패"
                  )
                );
              }

            },
            100
          );
      }
    );


  return daccCvPromise;
}

/* =========================================================
   이미지 → Canvas

   모바일 메모리 폭주 방지를 위해
   최대 변 길이 제한.
========================================================= */

async function daccFileToCanvas(
  file,
  maxSide = 2800
) {

  const bitmap =
    await createImageBitmap(
      file
    );


  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        bitmap.width,
        bitmap.height
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        bitmap.width *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        bitmap.height *
        scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );


  if (
    typeof bitmap.close ===
    "function"
  ) {

    bitmap.close();
  }


  return canvas;
}


/* =========================================================
   안전 Crop
========================================================= */

function daccCrop(
  source,
  x,
  y,
  width,
  height
) {

  const sx =
    Math.max(
      0,
      Math.min(
        source.width - 1,
        Math.round(x)
      )
    );


  const sy =
    Math.max(
      0,
      Math.min(
        source.height - 1,
        Math.round(y)
      )
    );


  const requestedWidth =
    Math.max(
      1,
      Math.round(width)
    );


  const requestedHeight =
    Math.max(
      1,
      Math.round(height)
    );


  const sw =
    Math.max(
      1,
      Math.min(
        source.width - sx,
        requestedWidth
      )
    );


  const sh =
    Math.max(
      1,
      Math.min(
        source.height - sy,
        requestedHeight
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    sw;

  canvas.height =
    sh;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    sw,
    sh
  );


  ctx.drawImage(
    source,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    sw,
    sh
  );


  return canvas;
}


/* =========================================================
   단순 확대
========================================================= */

function daccScaleCanvas(
  source,
  scale = 4
) {

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        source.width *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        source.height *
        scale
      )
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(
    source,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas;
}


/* =========================================================
   OpenCV Gray
========================================================= */

function daccGray(
  source,
  scale = 4
) {

  const src =
    cv.imread(
      source
    );


  const gray =
    new cv.Mat();


  const resized =
    new cv.Mat();


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.resize(
      gray,
      resized,

      new cv.Size(
        Math.max(
          1,
          Math.round(
            source.width *
            scale
          )
        ),

        Math.max(
          1,
          Math.round(
            source.height *
            scale
          )
        )
      ),

      0,
      0,
      cv.INTER_CUBIC
    );


    const output =
      document.createElement(
        "canvas"
      );


    output.width =
      resized.cols;

    output.height =
      resized.rows;


    cv.imshow(
      output,
      resized
    );


    return output;

  } finally {

    src.delete();

    gray.delete();

    resized.delete();
  }
}


/* =========================================================
   OpenCV OTSU
========================================================= */

function daccOtsu(
  source,
  scale = 4
) {

  const src =
    cv.imread(
      source
    );


  const gray =
    new cv.Mat();


  const resized =
    new cv.Mat();


  const binary =
    new cv.Mat();


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.resize(
      gray,
      resized,

      new cv.Size(
        Math.max(
          1,
          Math.round(
            source.width *
            scale
          )
        ),

        Math.max(
          1,
          Math.round(
            source.height *
            scale
          )
        )
      ),

      0,
      0,
      cv.INTER_CUBIC
    );


    cv.threshold(
      resized,
      binary,
      0,
      255,

      cv.THRESH_BINARY +
      cv.THRESH_OTSU
    );


    const output =
      document.createElement(
        "canvas"
      );


    output.width =
      binary.cols;

    output.height =
      binary.rows;


    cv.imshow(
      output,
      binary
    );


    return output;

  } finally {

    src.delete();

    gray.delete();

    resized.delete();

    binary.delete();
  }
}

/* =========================================================
   OCR 텍스트 정리
========================================================= */

function daccClean(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /\r/g,
    ""
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();
}


/* =========================================================
   번호 파싱

   목표:
   #26-14
   #26-118
========================================================= */

function daccParseNumber(
  value
) {

  let text =
    String(
      value || ""
    )
    .toUpperCase()
    .replace(
      /[Oo]/g,
      "0"
    )
    .replace(
      /[Il|!]/g,
      "1"
    )
    .replace(
      /[‐-‒–—―_~.·]/g,
      "-"
    )
    .replace(
      /\s+/g,
      ""
    )
    .replace(
      /[^0-9#-]/g,
      ""
    );


  let match =
    text.match(
      /#?26-(\d{1,3})/
    );


  if (match) {

    return (
      "#26-" +
      match[1]
    );
  }


  /*
    하이픈만 OCR에서 빠진 경우.

    2614 → #26-14
    26118 → #26-118
  */

  match =
    text.match(
      /#?26(\d{1,3})$/
    );


  if (match) {

    return (
      "#26-" +
      match[1]
    );
  }


  return "";
}


/* =========================================================
   가동 파싱

   중요:
   true  = 가동 확인
   false = 비가동 문구 확인
   null  = OCR이 판정하지 못함

   OCR 실패를 false로 만들지 않는다.
========================================================= */

function daccParseRunning(
  value
) {

  const text =
    String(
      value || ""
    )
    .replace(
      /\s+/g,
      ""
    );


  if (!text) {
    return null;
  }


  if (
    text.includes(
      "비가동"
    ) ||
    text.includes(
      "정지"
    )
  ) {

    return false;
  }


  if (
    text.includes(
      "가동"
    )
  ) {

    return true;
  }


  return null;
}


/* =========================================================
   온도 파싱
========================================================= */

function daccParseTemperature(
  value
) {

  const matches =
    String(
      value || ""
    )
    .match(
      /\d{1,4}/g
    );


  if (!matches) {
    return null;
  }


  for (
    const raw
    of matches
  ) {

    const number =
      Number(
        raw
      );


    if (
      Number.isFinite(
        number
      ) &&
      number >= 10 &&
      number <= 1800
    ) {

      return number;
    }
  }


  return null;
}


/* =========================================================
   상태 파싱
========================================================= */

function daccParseState(
  value
) {

  const text =
    String(
      value || ""
    )
    .replace(
      /\s+/g,
      ""
    );


  if (
    text.includes(
      "승온"
    )
  ) {

    return "승온중";
  }


  if (
    text.includes(
      "유지"
    )
  ) {

    return "유지중";
  }


  if (
    text.includes(
      "냉각"
    )
  ) {

    return "냉각중";
  }


  return "";
}


/* =========================================================
   비고 파싱
========================================================= */

function daccParseRemark(
  value
) {

  const text =
    String(
      value || ""
    )
    .replace(
      /\s+/g,
      ""
    );


  return {

    raw:
      text,


    cooling:
      text.includes(
        "냉각"
      ),


    unload:
      text.includes(
        "언로딩대기"
      )
      ||
      (
        text.includes(
          "언로딩"
        )
        &&
        text.includes(
          "대기"
        )
      )
  };
}


/* =========================================================
   OCR 실행
========================================================= */

async function daccOCR(
  canvas,
  options = {}
) {

  const worker =
    await getDACCWorker();


  const result =
    await worker.recognize(
      canvas,
      options
    );


  return {

    text:
      daccClean(
        result.data?.text ||
        ""
      ),


    confidence:
      Number(
        result.data?.confidence ||
        0
      )
  };
}


/* =========================================================
   번호 다중 OCR
========================================================= */

async function daccReadNumber(
  source
) {

  const variants = [

    daccScaleCanvas(
      source,
      5
    ),

    daccGray(
      source,
      5
    ),

    daccOtsu(
      source,
      5
    ),

    daccAdaptive(
      source,
      5
    )

  ];


  const attempts = [];


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE,

          tessedit_char_whitelist:
            "0123456789-#"
        }
      );


    attempts.push({

      text:
        result.text,

      number:
        daccParseNumber(
          result.text
        ),

      confidence:
        result.confidence
    });
  }


  const valid =
    attempts.filter(
      item =>
        Boolean(
          item.number
        )
    );


  if (
    !valid.length
  ) {

    return {

      number:"",

      ambiguous:false,

      attempts
    };
  }


  const votes = {};


  for (
    const item
    of valid
  ) {

    if (
      !votes[
        item.number
      ]
    ) {

      votes[
        item.number
      ] = {

        count:0,

        confidence:0
      };
    }


    votes[
      item.number
    ].count++;


    votes[
      item.number
    ].confidence =
      Math.max(

        votes[
          item.number
        ].confidence,

        item.confidence
      );
  }


  const sorted =
    Object.entries(
      votes
    )
    .sort(
      (a,b) => {

        if (
          b[1].count !==
          a[1].count
        ) {

          return (
            b[1].count -
            a[1].count
          );
        }


        return (
          b[1].confidence -
          a[1].confidence
        );
      }
    );


  const winner =
    sorted[0];


  const second =
    sorted[1];


  /*
    서로 다른 번호가
    동일 득표라면 확인필요.
  */

  const ambiguous =
    Boolean(
      second &&
      second[1].count ===
      winner[1].count
    );


  return {

    number:
      winner[0],

    ambiguous,

    attempts
  };
}


/* =========================================================
   가동 다중 OCR
========================================================= */

async function daccReadRunning(

  const variants = [

  const attempts = [];


  let trueVotes = 0;
  let falseVotes = 0;


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE
        }
      );


    const running =
      daccParseRunning(
        result.text
      );


    attempts.push({

      text:
        result.text,

      running,

      confidence:
        result.confidence
    });


    if (
      running === true
    ) {

      trueVotes++;
    }


    if (
      running === false
    ) {

      falseVotes++;
    }
  }


  if (
    trueVotes >
    falseVotes &&
    trueVotes > 0
  ) {

    return {

      running:true,

      ambiguous:false,

      attempts
    };
  }


  if (
    falseVotes >
    trueVotes &&
    falseVotes > 0
  ) {

    return {

      running:false,

      ambiguous:false,

      attempts
    };
  }


  return {

    running:null,

    ambiguous:
      trueVotes > 0 ||
      falseVotes > 0,

    attempts
  };
}


/* =========================================================
   온도 다중 OCR
========================================================= */

async function daccReadTemperature(
  source
) {

  const variants = [

    daccScaleCanvas(
      source,
      5
    ),

    daccGray(
      source,
      5
    ),

    daccOtsu(
      source,
      5
    ),

    daccAdaptive(
      source,
      5
    )

  ];


  const attempts = [];


  const votes = {};


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE,

          tessedit_char_whitelist:
            "0123456789"
        }
      );


    const temperature =
      daccParseTemperature(
        result.text
      );


    attempts.push({

      text:
        result.text,

      temperature,

      confidence:
        result.confidence
    });


    if (
      temperature !==
      null
    ) {

      const key =
        String(
          temperature
        );


      if (!votes[key]) {

        votes[key] = {

          count:0,

          confidence:0
        };
      }


      votes[key].count++;


      votes[key].confidence =
        Math.max(

          votes[key].confidence,

          result.confidence
        );
    }
  }


  const sorted =
    Object.entries(
      votes
    )
    .sort(
      (a,b) => {

        if (
          b[1].count !==
          a[1].count
        ) {

          return (
            b[1].count -
            a[1].count
          );
        }


        return (
          b[1].confidence -
          a[1].confidence
        );
      }
    );


  if (
    !sorted.length
  ) {

    return {

      temperature:null,

      ambiguous:false,

      attempts
    };
  }


  const winner =
    sorted[0];


  const second =
    sorted[1];


  const ambiguous =
    Boolean(
      second &&
      second[1].count ===
      winner[1].count
    );


  return {

    temperature:
      Number(
        winner[0]
      ),

    ambiguous,

    attempts
  };
}


/* =========================================================
   상태 OCR
========================================================= */

async function daccReadState(
  source
) {

  const variants = [

    daccScaleCanvas(
      source,
      4
    ),

    daccGray(
      source,
      4
    ),

    daccOtsu(
      source,
      4
    ),

    daccAdaptive(
      source,
      4
    )

  ];


  const attempts = [];


  const votes = {};


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE
        }
      );


    const state =
      daccParseState(
        result.text
      );


    attempts.push({

      text:
        result.text,

      state,

      confidence:
        result.confidence
    });


    if (state) {

      votes[state] =
        (
          votes[state] ||
          0
        ) +
        1;
    }
  }


  const sorted =
    Object.entries(
      votes
    )
    .sort(
      (a,b) =>
        b[1] -
        a[1]
    );


  if (
    !sorted.length
  ) {

    return {

      state:"",

      ambiguous:false,

      attempts
    };
  }


  const ambiguous =
    Boolean(
      sorted[1] &&
      sorted[1][1] ===
      sorted[0][1]
    );


  return {

    state:
      sorted[0][0],

    ambiguous,

    attempts
  };
}


/* =========================================================
   비고 OCR
========================================================= */

async function daccReadRemark(
  source
) {

  const variants = [

    daccScaleCanvas(
      source,
      3
    ),

    daccGray(
      source,
      3
    ),

    daccOtsu(
      source,
      3
    ),

    daccAdaptive(
      source,
      3
    )

  ];


  const attempts = [];


  let coolingVotes = 0;
  let unloadVotes = 0;


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE
        }
      );


    const parsed =
      daccParseRemark(
        result.text
      );


    attempts.push({

      text:
        result.text,

      ...parsed
    });


    if (
      parsed.cooling
    ) {

      coolingVotes++;
    }


    if (
      parsed.unload
    ) {

      unloadVotes++;
    }
  }


  return {

    raw:
      attempts
      .map(
        item =>
          item.text
      )
      .filter(
        Boolean
      )
      .join(
        " / "
      ),

    cooling:
      coolingVotes > 0,

    unload:
      unloadVotes > 0,

    attempts
  };
}


/* =========================================================
   가로선 검출
========================================================= */

function daccHorizontalLines(
  canvas
) {

  const src =
    cv.imread(
      canvas
    );


  const gray =
    new cv.Mat();


  const binary =
    new cv.Mat();


  const horizontal =
    new cv.Mat();


  const contours =
    new cv.MatVector();


  const hierarchy =
    new cv.Mat();


  const kernel =
    cv.getStructuringElement(

      cv.MORPH_RECT,

      new cv.Size(

        Math.max(
          20,
          Math.round(
            canvas.width *
            0.12
          )
        ),

        1
      )
    );


  const result = [];


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.adaptiveThreshold(
      gray,
      binary,
      255,

      cv.ADAPTIVE_THRESH_GAUSSIAN_C,

      cv.THRESH_BINARY_INV,

      31,
      11
    );


    cv.morphologyEx(
      binary,
      horizontal,
      cv.MORPH_OPEN,
      kernel
    );


    cv.findContours(
      horizontal,
      contours,
      hierarchy,

      cv.RETR_EXTERNAL,

      cv.CHAIN_APPROX_SIMPLE
    );


    for (
      let i = 0;
      i <
      contours.size();
      i++
    ) {

      const contour =
        contours.get(i);


      try {

        const rect =
          cv.boundingRect(
            contour
          );


        /*
          짧은 글자 획 제거.
        */

        if (
          rect.width <
          canvas.width *
          0.18
        ) {

          continue;
        }


        /*
          너무 두꺼운 사각형 제거.
        */

        if (
          rect.height >
          canvas.height *
          0.025
        ) {

          continue;
        }


        result.push(
          rect.y +
          rect.height / 2
        );

      } finally {

        contour.delete();
      }
    }

  } finally {

    src.delete();

    gray.delete();

    binary.delete();

    horizontal.delete();

    contours.delete();

    hierarchy.delete();

    kernel.delete();
  }


  result.sort(
    (a,b) =>
      a - b
  );


  /*
    같은 가로선 중복 병합.
  */

  const merged = [];


  for (
    const y
    of result
  ) {

    const last =
      merged[
        merged.length - 1
      ];


    if (
      last ===
      undefined ||
      y - last >
      5
    ) {

      merged.push(
        Math.round(
          y
        )
      );

    } else {

      merged[
        merged.length - 1
      ] =
        Math.round(
          (
            last +
            y
          ) /
          2
        );
    }
  }


  return merged;
}


/* =========================================================
   중앙값
========================================================= */

function daccMedian(
  values
) {

  if (
    !values.length
  ) {

    return 0;
  }


  const sorted =
    [...values]
    .sort(
      (a,b) =>
        a - b
    );


  const mid =
    Math.floor(
      sorted.length /
      2
    );


  if (
    sorted.length %
    2
  ) {

    return sorted[mid];
  }


  return (
    sorted[
      mid - 1
    ]
    +
    sorted[mid]
  ) /
  2;
}


/* =========================================================
   고정행 표 검색

   핵심:
   사진1 = 연속 35행
   사진2 = 연속 24행

   장비명 OCR로 표 위치를 찾지 않는다.
========================================================= */

function daccFindFixedGrid(
  lines,
  rowCount,
  imageHeight
) {

  if (
    !Array.isArray(
      lines
    ) ||
    lines.length < 8
  ) {

    return null;
  }


  const gaps = [];


  for (
    let i = 1;
    i <
    lines.length;
    i++
  ) {

    const gap =
      lines[i] -
      lines[i - 1];


    if (
      gap >= 8 &&
      gap <
      imageHeight *
      0.08
    ) {

      gaps.push(
        gap
      );
    }
  }


  if (
    gaps.length < 6
  ) {

    return null;
  }


  const sortedGaps =
    [...gaps]
    .sort(
      (a,b) =>
        a - b
    );


  /*
    큰 헤더 간격을 제외하고
    작은 쪽 70%로 행높이 추정.
  */

  const usable =
    sortedGaps.slice(

      0,

      Math.max(
        6,
        Math.ceil(
          sortedGaps.length *
          0.70
        )
      )
    );


  const rowHeight =
    daccMedian(
      usable
    );


  if (
    !Number.isFinite(
      rowHeight
    ) ||
    rowHeight < 8
  ) {

    return null;
  }


  let best = null;


  for (
    const start
    of lines
  ) {

    const estimatedEnd =
      start +
      rowHeight *
      rowCount;


    /*
      표가 이미지 바깥으로
      너무 크게 넘어가면 제외.
    */

    if (
      estimatedEnd >
      imageHeight +
      rowHeight *
      1.5
    ) {

      continue;
    }


    const boundaries = [];

    let matches = 0;
    let error = 0;


    for (
      let row = 0;
      row <= rowCount;
      row++
    ) {

      const expected =
        start +
        rowHeight *
        row;


      let nearest =
        null;


      let distance =
        Infinity;


      for (
        const line
        of lines
      ) {

        const currentDistance =
          Math.abs(
            line -
            expected
          );


        if (
          currentDistance <
          distance
        ) {

          distance =
            currentDistance;

          nearest =
            line;
        }
      }


      const tolerance =
        rowHeight *
        0.42;


      if (
        nearest !==
        null &&
        distance <=
        tolerance
      ) {

        boundaries.push(
          nearest
        );


        matches++;


        error +=
          distance;

      } else {

        /*
          실제 선이 한두 개 누락된 경우
          예상 위치로 보간.
        */

        boundaries.push(
          expected
        );
      }
    }


    /*
      경계가 역전되거나
      같은 값이 반복되는 문제 방지.
    */

    for (
      let i = 1;
      i <
      boundaries.length;
      i++
    ) {

      if (
        boundaries[i] <=
        boundaries[i - 1]
      ) {

        boundaries[i] =
          boundaries[
            i - 1
          ] +
          rowHeight;
      }
    }


    const matchRatio =
      matches /
      (
        rowCount +
        1
      );


    /*
      매칭 수 우선,
      오차는 감점.
    */

    const score =
      matches *
      1000 -
      error;


    if (
      !best ||
      score >
      best.score
    ) {

      best = {

        boundaries,

        rowHeight,

        matches,

        matchRatio,

        score,

        start:
          boundaries[0],

        end:
          boundaries[
            boundaries.length -
            1
          ]
      };
    }
  }


  return best;
}


/* =========================================================
   사진2 열 위치

   원본:
   장비명 | 가동여부 | 제품명/사업코드 | 주간 | 야간

   번호와 '가동'이 들어가는
   가동여부 열만 Crop.
========================================================= */

const NUMBER_COLUMN = {

  left:
    0.115,

  right:
    0.245

};


/* =========================================================
   사진2 한 행 Crop
========================================================= */

function daccCropNumberRow(
  canvas,
  grid,
  rowNumber
) {

  const index =
    rowNumber -
    1;


  const top =
    grid.boundaries[
      index
    ];


  const bottom =
    grid.boundaries[
      index + 1
    ];


  const rowHeight =
    bottom -
    top;


  const left =
    canvas.width *
    NUMBER_COLUMN.left;


  const right =
    canvas.width *
    NUMBER_COLUMN.right;


  return daccCrop(

    canvas,

    left,

    top +
    rowHeight *
    0.04,

    right -
    left,

    rowHeight *
    0.92
  );
}


/* =========================================================
   사진2 가동여부 셀 분할

   실제 셀 내부에서
   번호는 위쪽,
   가동은 아래쪽.

   일부 겹침을 둬서
   촬영 기울기에 대응.
========================================================= */

function daccSplitNumberCell(
  source
) {

  const number =
    daccCrop(

      source,

      0,

      0,

      source.width,

      source.height *
      0.67
    );


  const running =
    daccCrop(

      source,

      0,

      source.height *
      0.32,

      source.width,

      source.height *
      0.68
    );


  return {

    number,

    running
  };
}


/* =========================================================
   사진2 24행 분석
========================================================= */

async function daccAnalyzeNumberPhoto(
  file,
  onProgress = null
) {

  const canvas =
    await daccFileToCanvas(
      file,
      2800
    );


  const lines =
    daccHorizontalLines(
      canvas
    );


  const grid =
    daccFindFixedGrid(
      lines,
      24,
      canvas.height
    );


  if (!grid) {

    throw new Error(
      "교대 업무일지 24행 표 인식 실패"
    );
  }


  const rows = [];


  for (
    let rowNumber = 1;
    rowNumber <= 24;
    rowNumber++
  ) {

    const equipment =
      getNumberEquipmentByRow(
        rowNumber
      );


    if (
      onProgress
    ) {

      onProgress(
        equipment,
        rowNumber,
        24
      );
    }


    const cell =
      daccCropNumberRow(
        canvas,
        grid,
        rowNumber
      );


    const split =
      daccSplitNumberCell(
        cell
      );


    let numberResult = {

      number:"",

      ambiguous:false,

      attempts:[]
    };


    /*
      드라이챔버 2종은
      최종 문자보고에서 번호를 사용하지 않는다.

      불필요한 번호 OCR 생략.
    */

    if (
      equipment !==
      "드라이챔버" &&
      equipment !==
      "신형드라이챔버"
    ) {

      numberResult =
        await daccReadNumber(
          split.number
        );
    }


    const runningResult =
      await daccReadRunning(
        split.running
      );


    rows.push({

      equipment,

      rowNumber,


      number:
        numberResult.number,


      numberAmbiguous:
        numberResult.ambiguous,


      running:
        runningResult.running,


      runningAmbiguous:
        runningResult.ambiguous,


      numberAttempts:
        numberResult.attempts,


      runningAttempts:
        runningResult.attempts
    });
  }


  return {

    rows,


    items:
      buildNumberItemMap(
        rows
      ),


    lineCount:
      lines.length,


    matchedLines:
      grid.matches,


    matchRatio:
      grid.matchRatio,


    rowHeight:
      grid.rowHeight
  };
}


/* =========================================================
   사진1 열 위치

   필요한 열만 사용.

   temperature = 온도체크
   state       = 승온/냉각
   remark      = 비고
========================================================= */

const PATROL_COLUMNS = {

  temperature:{

    left:
      0.375,

    right:
      0.475
  },


  state:{

    left:
      0.755,

    right:
      0.865
  },


  remark:{

    left:
      0.865,

    right:
      0.995
  }
};


/* =========================================================
   사진1 셀 Crop
========================================================= */

function daccCropPatrolCell(
  canvas,
  grid,
  rowNumber,
  column
) {

  const index =
    rowNumber -
    1;


  const top =
    grid.boundaries[
      index
    ];


  const bottom =
    grid.boundaries[
      index + 1
    ];


  const rowHeight =
    bottom -
    top;


  const left =
    canvas.width *
    column.left;


  const right =
    canvas.width *
    column.right;


  return daccCrop(

    canvas,

    left,

    top +
    rowHeight *
    0.04,

    right -
    left,

    rowHeight *
    0.92
  );
}


/* =========================================================
   사진1 한 행 분석
========================================================= */

async function daccReadPatrolRow(
  canvas,
  grid,
  rowNumber,
  equipment
) {

  const temperatureCell =
    daccCropPatrolCell(

      canvas,

      grid,

      rowNumber,

      PATROL_COLUMNS.temperature
    );


  const temperatureResult =
    await daccReadTemperature(
      temperatureCell
    );


  /*
    소각기:
    온도만 필요.
  */

  if (
    INCINERATOR_EQUIPMENT
      .includes(
        equipment
      )
  ) {

    return {

      equipment,

      rowNumber,


      temperature:
        temperatureResult.temperature,


      temperatureAmbiguous:
        temperatureResult.ambiguous,


      state:"",

      stateAmbiguous:false,

      remarkCooling:false,

      unload:false,


      temperatureAttempts:
        temperatureResult.attempts
    };
  }


  /*
    드라이챔버 2종:
    최종 보고는 온도만 필요.

    CF분위기로는 일반 장비와 동일하게
    상태/비고까지 판독하므로 여기 제외.
  */

  if (
    equipment ===
    "드라이챔버" ||
    equipment ===
    "신형드라이챔버"
  ) {

    return {

      equipment,

      rowNumber,


      temperature:
        temperatureResult.temperature,


      temperatureAmbiguous:
        temperatureResult.ambiguous,


      state:"",

      stateAmbiguous:false,

      remarkCooling:false,

      unload:false,


      temperatureAttempts:
        temperatureResult.attempts
    };
  }


  const stateCell =
    daccCropPatrolCell(

      canvas,

      grid,

      rowNumber,

      PATROL_COLUMNS.state
    );


  const remarkCell =
    daccCropPatrolCell(

      canvas,

      grid,

      rowNumber,

      PATROL_COLUMNS.remark
    );


  const stateResult =
    await daccReadState(
      stateCell
    );


  const remarkResult =
    await daccReadRemark(
      remarkCell
    );


  return {

    equipment,

    rowNumber,


    temperature:
      temperatureResult.temperature,


    temperatureAmbiguous:
      temperatureResult.ambiguous,


    state:
      stateResult.state,


    stateAmbiguous:
      stateResult.ambiguous,


    remarkCooling:
      remarkResult.cooling,


    unload:
      remarkResult.unload,


    temperatureAttempts:
      temperatureResult.attempts,


    stateAttempts:
      stateResult.attempts,


    remarkAttempts:
      remarkResult.attempts
  };
}


/* =========================================================
   사진1 35행 분석
========================================================= */

async function daccAnalyzePatrolPhoto(
  file,
  onProgress = null
) {

  const canvas =
    await daccFileToCanvas(
      file,
      2800
    );


  const lines =
    daccHorizontalLines(
      canvas
    );


  const grid =
    daccFindFixedGrid(
      lines,
      35,
      canvas.height
    );


  if (!grid) {

    throw new Error(
      "순찰일지 35행 표 인식 실패"
    );
  }


  const rows = [];


  for (
    let rowNumber = 1;
    rowNumber <= 35;
    rowNumber++
  ) {

    const equipment =
      getPatrolEquipmentByRow(
        rowNumber
      );


    /*
      사용자 지정 완전 제외 장비.

      OCR 자체를 하지 않는다.
    */

    if (
      PATROL_EXCLUDED_EQUIPMENT
        .includes(
          equipment
        )
    ) {

      rows.push({

        equipment,

        rowNumber,

        skipped:true,


        temperature:null,

        temperatureAmbiguous:false,

        state:"",

        stateAmbiguous:false,

        remarkCooling:false,

        unload:false
      });


      continue;
    }


    /*
      안전장치:
      지정 OCR 대상이 아니면 역시 생략.
    */

    if (
      !PATROL_OCR_EQUIPMENT
        .includes(
          equipment
        )
    ) {

      rows.push({

        equipment,

        rowNumber,

        skipped:true,


        temperature:null,

        temperatureAmbiguous:false,

        state:"",

        stateAmbiguous:false,

        remarkCooling:false,

        unload:false
      });


      continue;
    }


    if (
      onProgress
    ) {

      onProgress(
        equipment,
        rowNumber,
        35
      );
    }


    const result =
      await daccReadPatrolRow(

        canvas,

        grid,

        rowNumber,

        equipment
      );


    rows.push(
      result
    );
  }


  return {

    rows,


    items:
      buildPatrolItemMap(
        rows
      ),


    lineCount:
      lines.length,


    matchedLines:
      grid.matches,


    matchRatio:
      grid.matchRatio,


    rowHeight:
      grid.rowHeight
  };
}


/* =========================================================
   최종 판정 상태

   OCR 실패와 실제 제외를 분리.
========================================================= */

const DACC_STATUS = {

  CONFIRMED:
    "confirmed",

  REVIEW:
    "review",

  EXCLUDED:
    "excluded"
};


/* =========================================================
   판정 객체 생성
========================================================= */

function daccDecision(
  status,
  equipment,
  reason = "",
  extra = {}
) {

  return {

    status,

    equipment,

    reason,

    ...extra
  };
}


/* =========================================================
   일반 장비 판정

   실제 제외:
   - 비가동
   - 언로딩대기
   - 비고 냉각
   - 냉각중 + 100도 이하

   확인필요:
   - OCR이 번호 못 읽음
   - OCR이 가동여부 못 읽음
   - OCR이 온도 못 읽음
   - OCR이 상태 못 읽음
   - OCR 결과 충돌
========================================================= */

function daccJudgeGeneral(
  equipment,
  patrol,
  number
) {

  if (!number) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "교대 업무일지 확인 필요"
    );
  }


  if (
    requiresNumber(
      equipment
    ) &&
    (
      !number.number ||
      number.numberAmbiguous
    )
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "번호 확인 필요",

      {
        number:
          number.number || "",

        patrol,

        rawNumber:
          number
      }
    );
  }


  if (
    number.runningAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 판독 충돌",

      {
        number:
          number.number,

        patrol,

        rawNumber:
          number
      }
    );
  }


  if (
    number.running ===
    null ||
    number.running ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 확인 필요",

      {
        number:
          number.number,

        patrol,

        rawNumber:
          number
      }
    );
  }


  /*
    OCR이 명확히 비가동을 읽은 경우만
    실제 제외.
  */

  if (
    number.running ===
    false
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비가동",

      {
        number:
          number.number
      }
    );
  }


  if (!patrol) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "순찰일지 확인 필요",

      {
        number:
          number.number
      }
    );
  }


  /*
    명확한 실제 제외 문구.
  */

  if (
    patrol.unload
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "언로딩대기",

      {
        number:
          number.number
      }
    );
  }


  if (
    patrol.remarkCooling
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비고 냉각",

      {
        number:
          number.number
      }
    );
  }


  if (
    patrol.temperatureAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 판독 충돌",

      {
        number:
          number.number
      }
    );
  }


  if (
    patrol.temperature ===
    null ||
    patrol.temperature ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 확인 필요",

      {
        number:
          number.number
      }
    );
  }


  if (
    patrol.stateAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "상태 판독 충돌",

      {
        number:
          number.number,

        temperature:
          patrol.temperature
      }
    );
  }


  if (
    !patrol.state
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "상태 확인 필요",

      {
        number:
          number.number,

        temperature:
          patrol.temperature
      }
    );
  }


  if (
    patrol.temperature <=
    100 &&
    patrol.state ===
    "냉각중"
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "100도 이하 냉각",

      {
        number:
          number.number,

        temperature:
          patrol.temperature,

        state:
          patrol.state
      }
    );
  }


  return daccDecision(

    DACC_STATUS.CONFIRMED,

    equipment,

    "",

    {
      number:
        number.number,

      temperature:
        patrol.temperature,

      state:
        patrol.state
    }
  );
}

/* =========================================================
   TG1 판정

   사진1에는 TG1 없음.

   OCR 실패 = 확인필요
   명확한 비가동 = 제외
========================================================= */

function daccProcessTG1(
  numberResult
) {

  const item =
    numberResult
      .items?.TG1;


  if (!item) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "교대 업무일지 확인 필요"
    );
  }


  if (
    !item.number ||
    item.numberAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "번호 확인 필요",

      {
        number:
          item.number || "",

        rawNumber:
          item
      }
    );
  }


  if (
    item.runningAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "가동 여부 판독 충돌",

      {
        number:
          item.number,

        rawNumber:
          item
      }
    );
  }


  if (
    item.running ===
    null ||
    item.running ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "TG1",

      "가동 여부 확인 필요",

      {
        number:
          item.number,

        rawNumber:
          item
      }
    );
  }


  if (
    item.running ===
    false
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      "TG1",

      "비가동",

      {
        number:
          item.number
      }
    );
  }


  return daccDecision(

    DACC_STATUS.CONFIRMED,

    "TG1",

    "",

    {
      number:
        item.number
    }
  );
}


/* =========================================================
   CF분위기로

   사진1 18행
   사진2 22행

   번호 + 가동 + 온도 + 상태

   OCR 실패는 확인필요.
========================================================= */

function daccProcessCFFurnace(
  patrolResult,
  numberResult
) {

  const patrol =
    patrolResult
      .items?.[
        "CF분위기로"
      ];


  const number =
    numberResult
      .items?.[
        "CF분위기로"
      ];


  return daccJudgeGeneral(

    "CF분위기로",

    patrol,

    number
  );
}


/* =========================================================
   드라이챔버 판정

   드라이챔버 / 신형드라이챔버

   사진2:
   가동 여부

   사진1:
   온도

   번호 사용하지 않음.
========================================================= */

function daccProcessDry(
  equipment,
  patrolResult,
  numberResult
) {

  const patrol =
    patrolResult
      .items?.[
        equipment
      ];


  const number =
    numberResult
      .items?.[
        equipment
      ];


  if (!number) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "교대 업무일지 확인 필요"
    );
  }


  if (
    number.runningAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 판독 충돌"
    );
  }


  if (
    number.running ===
    null ||
    number.running ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 확인 필요"
    );
  }


  if (
    number.running ===
    false
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비가동"
    );
  }


  if (!patrol) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "순찰일지 확인 필요"
    );
  }


  if (
    patrol.temperatureAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      "온도 판독 충돌"
    );
  }


  if (
    patrol.temperature ===
    null ||

    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 확인 필요"
    );
  }


  return daccDecision(

    DACC_STATUS.CONFIRMED,

    equipment,

    "",

    {
      temperature:
        patrol.temperature
    }
  );
}

/* =========================================================
   전체 결과 병합

   confirmed = 자동 확정
   review    = 확인 필요
   excluded  = 실제 제외
========================================================= */

function daccMergeAll(
  patrolResult,
  numberResult
) {

  const confirmed = [];
  const review = [];
  const excluded = [];


  /*
    일반 장비

    CF분위기로는 별도 처리.
  */

  for (
    const equipment
    of REPORT_ORDER
  ) {

    const pair =
      daccGetMappedPair(

        equipment,

        patrolResult,

        numberResult
      );


    const decision =
      daccJudgeGeneral(

        equipment,

        pair.patrol,

        pair.number
      );


    decision.patrolRow =
      pair.patrolRow;


    decision.numberRow =
      pair.numberRow;


    if (
      decision.status ===
      DACC_STATUS.CONFIRMED
    ) {

      confirmed.push(
        decision
      );

    } else if (
      decision.status ===
      DACC_STATUS.REVIEW
    ) {

      review.push(
        decision
      );

    } else {

      excluded.push(
        decision
      );
    }
  }


  /*
    CF분위기로
  */

  const cfFurnace =
    daccProcessCFFurnace(

      patrolResult,

      numberResult
    );


  if (
    cfFurnace.status ===
    DACC_STATUS.CONFIRMED
  ) {

    confirmed.push(
      cfFurnace
    );

  } else if (
    cfFurnace.status ===
    DACC_STATUS.REVIEW
  ) {

    review.push(
      cfFurnace
    );

  } else {

    excluded.push(
      cfFurnace
    );
  }


  /*
    TG1
  */

  const tg1 =
    daccProcessTG1(
      numberResult
    );


  /*
    드라이챔버
  */

  const dry = {

    confirmed:[],

    review:[],

    excluded:[]
  };


  for (
    const equipment
    of [
      "드라이챔버",
      "신형드라이챔버"
    ]
  ) {

    const decision =
      daccProcessDry(

        equipment,

        patrolResult,

        numberResult
      );


    if (
      decision.status ===
      DACC_STATUS.CONFIRMED
    ) {

      dry.confirmed.push(
        decision
      );

    } else if (
      decision.status ===
      DACC_STATUS.REVIEW
    ) {

      dry.review.push(
        decision
      );

    } else {

      dry.excluded.push(
        decision
      );
    }
  }


  /*
    소각기
  */

  const incinerators = {

    confirmed:[],

    review:[],

    excluded:[]
  };


  for (
    const equipment
    of INCINERATOR_EQUIPMENT
  ) {

    const decision =
      daccProcessIncinerator(

        equipment,

        patrolResult
      );


    if (
      decision.status ===
      DACC_STATUS.CONFIRMED
    ) {

      incinerators
        .confirmed
        .push(
          decision
        );

    } else if (
      decision.status ===
      DACC_STATUS.REVIEW
    ) {

      incinerators
        .review
        .push(
          decision
        );

    } else {

      incinerators
        .excluded
        .push(
          decision
        );
    }
  }


  return {

    confirmed,

    review,

    excluded,

    tg1,

    dry,

    incinerators
  };
}

========================================================= */

function daccCreateConfirmedRow(
  item
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "result";


  const check =
    document.createElement(
      "div"
    );


  check.className =
    "check";


  check.textContent =
    "✓";


  const content =
    document.createElement(
      "div"
    );


  const main =
    document.createElement(
      "div"
    );


  main.className =
    "main";


  const number =
    item.number
    ?
    daccDisplayNumber(
      item.number
    ) + " "
    :
    "";


  main.textContent =
    number +
    item.equipment;


  const sub =
    document.createElement(
      "div"
    );


  sub.className =
    "sub";


  const details = [];


  if (
    item.temperature !==
    undefined &&
    item.temperature !==
    null
  ) {

    details.push(
      item.temperature +
      "도"
    );
  }


  if (item.state) {

    details.push(
      item.state
    );
  }


  if (
    !details.length
  ) {

    details.push(
      "가동 확인"
    );
  }


  sub.textContent =
    details.join(
      " · "
    );


  content.appendChild(
    main
  );


  content.appendChild(
    sub
  );


  const badge =
    document.createElement(
      "div"
    );


  badge.className =
    "badge";


  badge.textContent =
    "확정";


  div.appendChild(
    check
  );


  div.appendChild(
    content
  );


  div.appendChild(
    badge
  );


  return div;

/* =========================================================
   사진2 판독 개수
========================================================= */

function daccCountNumberResult(
  numberResult
) {

  let numberCount = 0;

  let runningCount = 0;

  let runningUnknown = 0;


  for (
    const item
    of Object.values(
      numberResult.items ||
      {}
    )
  ) {

    if (
      item.number
    ) {

      numberCount++;
    }


    if (
      item.running ===
      true
    ) {

      runningCount++;
    }


    if (
      item.running ===
      null ||
      item.running ===
      undefined
    ) {

      runningUnknown++;
    }
  }


  return {

    numberCount,

    runningCount,

    runningUnknown
  };
}


/* =========================================================
   사진1 판독 개수
========================================================= */

function daccCountPatrolResult(
  patrolResult
) {

  let temperatureCount = 0;

  let stateCount = 0;


  for (
    const item
    of Object.values(
      patrolResult.items ||
      {}
    )
  ) {

    if (
      item.temperature !==
      null &&
      item.temperature !==
      undefined
    ) {

      temperatureCount++;
    }


    if (
      item.state
    ) {

      stateCount++;
    }
  }


  return {

    temperatureCount,

    stateCount
  };
}


/* =========================================================
   전체 사진 구조 검증

   여기서는 OCR 개별 실패로
   전체 분석을 막지 않는다.

   표 구조 자체가 무너진 경우만 fatal.
========================================================= */

function daccValidate(
  patrolResult,
  numberResult
) {

  const problems = [];


  const patrolCount =
    daccCountPatrolResult(
      patrolResult
    );


  const numberCount =
    daccCountNumberResult(
      numberResult
    );


  /*
    표 매칭률 검사.
  */

  if (
    patrolResult.matchRatio <
    0.45
  ) {

    problems.push(
      "순찰일지 표 위치 확인 필요"
    );
  }


  if (
    numberResult.matchRatio <
    0.45
  ) {

    problems.push(
      "교대 업무일지 표 위치 확인 필요"
    );
  }


  /*
    사진1에서 필요한 값이
    전부 0이면 Crop 자체가 틀린 것.
  */

  if (
    patrolCount.temperatureCount ===
    0 &&
    patrolCount.stateCount ===
    0
  ) {

    problems.push(
      "순찰일지 셀 위치 인식 실패"
    );
  }


  /*
    사진2 번호와 가동이
    둘 다 하나도 안 잡힌 경우.
  */

  if (
    numberCount.numberCount ===
    0 &&
    numberCount.runningCount ===
    0
  ) {

    problems.push(
      "교대 업무일지 가동여부 열 인식 실패"
    );
  }


  return {

    valid:
      problems.length ===
      0,

    problems,

    patrolCount,

    numberCount
  };
}


/* =========================================================
   결과 화면
========================================================= */

function daccRenderResult(
  patrolResult,
  numberResult,
  merged,
  validation
) {

  const resultCard =
    daccEl(
      "resultCard"
    );


  const results =
    daccEl(
      "results"
    );


  const excluded =
    daccEl(
      "excluded"
    );


  if (results) {

    results.innerHTML =
      "";
  }


  if (excluded) {

    excluded.innerHTML =
      "";
  }


  /*
    사진1 상태
  */

  const patrolStatus =
    daccEl(
      "patrolStatus"
    );


  if (patrolStatus) {

    patrolStatus
      .classList
      .remove(
        "hidden"
      );


    patrolStatus.textContent =
      `사진 1 · 고정행 35 · ` +
      `온도 ${validation.patrolCount.temperatureCount} · ` +
      `상태 ${validation.patrolCount.stateCount}`;
  }


  /*
    사진2 상태
  */

  const numberStatus =
    daccEl(
      "numberStatus"
    );


  if (numberStatus) {

    numberStatus
      .classList
      .remove(
        "hidden"
      );


    numberStatus.textContent =
      `사진 2 · 고정행 24 · ` +
      `번호 ${validation.numberCount.numberCount} · ` +
      `가동 ${validation.numberCount.runningCount}`;
  }


  /*
    확정 일반장비
  */

  if (results) {

    for (
      const item
      of merged.confirmed
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          item
        )
      );
    }


    /*
      TG1 확정
    */

    if (
      merged.tg1.status ===
      DACC_STATUS.CONFIRMED
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          merged.tg1
        )
      );
    }


    /*
      드라이챔버 확정
    */

    for (
      const item
      of merged.dry.confirmed
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          item
        )
      );
    }


    /*
      소각기 확정
    */

    for (
      const item
      of merged
        .incinerators
        .confirmed
    ) {

      results.appendChild(
        daccCreateConfirmedRow(
          item
        )
      );
    }


    const totalConfirmed =
      merged.confirmed.length
      +
      (
        merged.tg1.status ===
        DACC_STATUS.CONFIRMED
        ?
        1
        :
        0
      )
      +
      merged.dry
        .confirmed
        .length
      +
      merged.incinerators
        .confirmed
        .length;


    if (
      totalConfirmed ===
      0
    ) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "emptyResult";


      empty.textContent =
        "자동 확정된 장비가 없습니다.";


      results.appendChild(
        empty
      );
    }
  }


  /*
    확인필요 전체
  */

  const allReview = [

    ...merged.review,

    ...merged.dry.review,

    ...merged.incinerators.review

  ];


  if (
    merged.tg1.status ===
    DACC_STATUS.REVIEW
  ) {

    allReview.push(
      merged.tg1
    );
  }


  /*
    실제 제외 전체
  */

  const allExcluded = [

    ...merged.excluded,

    ...merged.dry.excluded,

    ...merged.incinerators.excluded

  ];


  if (
    merged.tg1.status ===
    DACC_STATUS.EXCLUDED
  ) {

    allExcluded.push(
      merged.tg1
    );
  }


  /*
    기존 제외 영역 하나에
    확인필요 + 실제 제외 표시.
  */

  if (excluded) {

    for (
      const item
      of allReview
    ) {

      excluded.appendChild(
        daccCreateIssueRow(
          item,
          "review"
        )
      );
    }


    for (
      const item
      of allExcluded
    ) {

      excluded.appendChild(
        daccCreateIssueRow(
          item,
          "excluded"
        )
      );
    }
  }


  /*
    제외/확인필요 개수
  */

  const excludedCount =
    daccEl(
      "excludedCount"
    );


  if (excludedCount) {

    excludedCount.textContent =
      `확인필요 ${allReview.length} · 제외 ${allExcluded.length}`;
  }


  /*
    표시 개수

    여기서는 일반 문자보고에 들어갈
    확정 장비 수 기준.
  */

  const count =
    daccEl(
      "count"
    );


  if (count) {

    const total =
      merged.confirmed.length
      +
      (
        merged.tg1.status ===
        DACC_STATUS.CONFIRMED
        ?
        1
        :
        0
      );


    count.textContent =
      `${total}개 표시`;
  }


  /*
    Fatal 경고
  */

  const warning =
    daccEl(
      "fatalWarning"
    );


  const makeReport =
    daccEl(
      "makeReport"
    );


  if (
    validation.valid
  ) {

    if (warning) {

      warning
        .classList
        .add(
          "hidden"
        );
    }


    if (makeReport) {

      makeReport.disabled =
        false;
    }

  } else {

    if (warning) {

      warning
        .classList
        .remove(
          "hidden"
        );


      warning.textContent =
        "사진 인식 구조 확인 필요 · " +
        validation.problems.join(
          " / "
        );
    }


    if (makeReport) {

      makeReport.disabled =
        true;
    }
  }


  if (resultCard) {

    resultCard
      .classList
      .remove(
        "hidden"
      );


    resultCard.scrollIntoView({
      behavior:
        "smooth",

      block:
        "start"
    });
  }
}


/* =========================================================
   확인필요 / 제외 펼치기
========================================================= */

const daccExcludedBtn =
  daccEl(
    "excludedBtn"
  );


if (daccExcludedBtn) {

  daccExcludedBtn.onclick =
  () => {

    const box =
      daccEl(
        "excluded"
      );


    const arrow =
      daccEl(
        "arrow"
      );


    if (!box) {
      return;
    }


    box.classList.toggle(
      "hidden"
    );


    if (arrow) {

      arrow.textContent =
        box.classList.contains(
