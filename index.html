<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

  name="viewport"

>

  name="theme-color"
  content="#f5f7fb"

<title>DACC</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#182033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:
    24px
    16px
    calc(60px + env(safe-area-inset-bottom));
}

.logo{
  color:#5270e8;
  font-size:13px;
  font-weight:900;
  letter-spacing:2px;
}

h1{
  margin:5px 0 20px;
  font-size:25px;
  line-height:1.25;
}

.card{
  margin-bottom:15px;
  padding:17px;
  background:#fff;
  border:1px solid #e1e6ef;
  border-radius:20px;
  box-shadow:
    0 5px 22px
    rgba(25,35,60,.04);
}

.title{
  font-size:16px;
  font-weight:900;
}

.flex{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.rank{
  display:flex;
  gap:5px;
}

.rank button,
.work button{
  border:1px solid #dde3ed;
  background:#fff;
  color:#7b8495;
  border-radius:10px;
  font-weight:900;
}

.rank button{
  padding:7px 10px;
  font-size:12px;
}

.work{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:14px;
}

.work button{
  height:45px;
  font-size:12px;
}

button.active{
  background:#edf1ff!important;
  border-color:#6f88ef!important;
  color:#4966df!important;
}

.upload{
  display:block;
  margin-top:11px;
  padding:22px 12px;
  text-align:center;
  border:1px dashed #d4dbe8;
  border-radius:15px;
  background:#f9faff;
  cursor:pointer;
}

.plus{
  width:42px;
  height:42px;
  margin:0 auto 8px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#edf1ff;
  color:#5270e8;
  font-size:26px;
}

.upload b{
  font-size:14px;
}

.upload small{
  display:block;
  margin-top:5px;
  color:#9ba4b4;
  font-size:11px;
}

input[type=file]{
  display:none;
}

.preview{
  height:165px;
  position:relative;
  overflow:hidden;
  margin-top:10px;
  border-radius:14px;
  background:#eee;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview span{
  position:absolute;
  left:9px;
  bottom:9px;
  padding:5px 8px;
  border-radius:7px;
  background:rgba(20,25,35,.8);
  color:#fff;
  font-size:11px;
}

.primary{
  width:100%;
  height:53px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:#5270e8;
  color:#fff;
  font-weight:900;
}

.primary:disabled{
  background:#c7cedd;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f5f7fb;
  color:#68748a;
  font-size:12px;
  line-height:1.5;
}

.track{
  height:7px;
  margin-top:8px;
  overflow:hidden;
  border-radius:10px;
  background:#e2e6ee;
}

.bar{
  width:0;
  height:100%;
  background:#5270e8;
  transition:.2s;
}

.hidden{
  display:none!important;
}

.result{
  display:grid;
  grid-template-columns:25px 1fr auto;
  gap:8px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #edf0f4;
}

.check{
  width:23px;
  height:23px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#e7f8ef;
  color:#1ea465;
  font-size:12px;
  font-weight:900;
}

.main{
  font-size:13px;
  font-weight:900;
}

.sub{
  margin-top:3px;
  color:#8d96a8;
  font-size:11px;
}

.badge{
  padding:5px 7px;
  border-radius:7px;
  background:#f0f3f8;
  color:#6b7588;
  font-size:10px;
  font-weight:900;
}

.warning,
.success{
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  font-size:12px;
  line-height:1.6;
}

.warning{
  background:#fff7e8;
  color:#9a6813;
}

.success{
  background:#eefaf3;
  color:#238454;
}

.excludedBtn{
  width:100%;
  height:47px;
  margin-top:12px;
  padding:0 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:0;
  border-radius:12px;
  background:#f1f3f7;
  color:#606a7d;
  font-weight:900;
}

.excluded{
  margin-top:7px;
  overflow:hidden;
  border-radius:12px;
  background:#f8f9fb;
}

.excluded div{
  padding:11px 12px;
  border-bottom:1px solid #e6eaf0;
  color:#727d90;
  font-size:12px;
}

textarea{
  width:100%;
  min-height:500px;
  padding:15px;
  resize:vertical;
  border:1px solid #dfe4ed;
  border-radius:14px;
  background:#fbfcfe;
  font-size:13px;
  line-height:1.7;
}

</style>

/* =========================================================
   사진 미리보기
========================================================= */

function showPreview(
  id,
  file,
  label
){

  const area =
    $(id);


  area.innerHTML =
    "";


  if(!file){

    return;

  }


  const url =
    URL.createObjectURL(
      file
    );


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "preview";


  const image =
    document.createElement(
      "img"
    );


  image.src =
    url;


  image.onload =
    () => {

      URL.revokeObjectURL(
        url
      );

    };


  const tag =
    document.createElement(
      "span"
    );


  tag.textContent =
    label;


  box.appendChild(
    image
  );


  box.appendChild(
    tag
  );


  area.appendChild(
    box
  );

}

/* =========================================================

function setStatus(
  text,
  percent
){

  $("status")
  .classList
  .remove(
    "hidden"
  );


  $("statusText")
  .textContent =
    text;


  if(
    Number.isFinite(
      percent
    )
  ){

    $("bar")
    .style
    .width =

      Math.max(
        0,
        Math.min(
          100,
          percent
        )
      )

      + "%";

  }

}


/* =========================================================
   문자열 정리
========================================================= */

function clean(
  value
){

  return String(
    value ||
    ""
  )
  .replace(
    /[‐-‒–—―]/g,
    "-"
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


function compact(
  value
){

  return clean(
    value
  )
  .replace(
    /\s/g,
    ""
  )
  .toUpperCase();

}


/* =========================================================
   이미지 → Canvas
========================================================= */

async function fileToCanvas(
  file,
  maxSide = 2400
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      const url =
        URL.createObjectURL(
          file
        );


      image.onload =
        () => {

          const scale =

            Math.min(

              1,

              maxSide /
              Math.max(
                image.naturalWidth,
                image.naturalHeight
              )

            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            Math.round(
              image.naturalWidth *
              scale
            );


          canvas.height =
            Math.round(
              image.naturalHeight *
              scale
            );


          const ctx =
            canvas.getContext(
              "2d",
              {
                willReadFrequently:true
              }
            );


          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );


          URL.revokeObjectURL(
            url
          );


          resolve(
            canvas
          );

        };


      image.onerror =
        error => {

          URL.revokeObjectURL(
            url
          );

          reject(
            error
          );

        };


      image.src =
        url;

    }
  );

}


/* =========================================================
   Canvas 자르기
========================================================= */

function cropCanvas(
  source,
  x,
  y,
  width,
  height
){

  x =
    Math.max(
      0,
      Math.round(
        x
      )
    );


  y =
    Math.max(
      0,
      Math.round(
        y
      )
    );


  width =
    Math.max(

      1,

      Math.min(
        source.width - x,
        Math.round(
          width
        )
      )

    );


  height =
    Math.max(

      1,

      Math.min(
        source.height - y,
        Math.round(
          height
        )
      )

    );


  const output =
    document.createElement(
      "canvas"
    );


  output.width =
    width;


  output.height =
    height;


  output
  .getContext(
    "2d",
    {
      willReadFrequently:true
    }
  )
  .drawImage(

    source,

    x,
    y,
    width,
    height,

    0,
    0,
    width,
    height

  );


  return output;

}

    typeof window.cv.Mat === "function"
  ){
    cvReady = true;
    return Promise.resolve();
  }

  if(cvPromise){
    return cvPromise;
  }

  cvPromise =
    new Promise(
      (resolve,reject) => {

        const script =
          document.createElement("script");

        script.async = true;

        script.src =
          "https://docs.opencv.org/4.x/opencv.js";

        const timeout =
          setTimeout(
            () => {
              reject(
                new Error(
                  "OpenCV 로딩 시간 초과"
                )
              );
            },
            25000
          );

        script.onload =
          () => {

            const wait =
              setInterval(
                () => {

                  if(
                    window.cv &&
                    typeof window.cv.Mat ===
                    "function"
                  ){

                    clearInterval(wait);
                    clearTimeout(timeout);

                    cvReady = true;

                    resolve();
                  }

                },
                100
              );
          };

        script.onerror =
          () => {

            clearTimeout(timeout);

            reject(
              new Error(
                "OpenCV를 불러오지 못했습니다."
              )
            );
          };

        document.head.appendChild(
          script
        );
      }
    );

  return cvPromise;
}


/* =========================================================
   네 점 정렬
   TL / TR / BR / BL
========================================================= */

function orderQuad(
  points
){

  const sum =
    points.map(
      p => p.x + p.y
    );

  const diff =
    points.map(
      p => p.x - p.y
    );

  return {

    tl:
      points[
        sum.indexOf(
          Math.min(...sum)
        )
      ],

    br:
      points[
        sum.indexOf(
          Math.max(...sum)
        )
      ],

    tr:
      points[
        diff.indexOf(
          Math.max(...diff)
        )
      ],

    bl:
      points[
        diff.indexOf(
          Math.min(...diff)
        )
      ]

  };
}


function distance(
  a,
  b
){

  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );
}


/* =========================================================
   큰 사각형 검출

   종이 전체 또는 큰 표 영역 후보.
========================================================= */

function detectLargeQuad(
  canvas
){

  const src =
    cv.imread(
      canvas
    );

  const gray =
    new cv.Mat();

  const blur =
    new cv.Mat();

  const edge =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();

  let best =
    null;

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
      gray,
      blur,
      new cv.Size(5,5),
      0
    );

    cv.Canny(
      blur,
      edge,
      40,
      130
    );

    const kernel =
      cv.getStructuringElement(
        cv.MORPH_RECT,
        new cv.Size(7,7)
      );

    cv.morphologyEx(
      edge,
      edge,
      cv.MORPH_CLOSE,
      kernel
    );

    kernel.delete();

    cv.findContours(
      edge,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );

    const fullArea =
      canvas.width *
      canvas.height;

    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);

      const peri =
        cv.arcLength(
          contour,
          true
        );

      const approx =
        new cv.Mat();

      cv.approxPolyDP(
        contour,
        approx,
        peri * .018,
        true
      );

      const area =
        Math.abs(
          cv.contourArea(
            approx
          )
        );

      if(
        approx.rows === 4 &&
        area > fullArea * .12
      ){

        if(
          !best ||
          area > best.area
        ){

          if(best){
            best.approx.delete();
          }

          best = {
            area,
            approx
          };

        }else{
          approx.delete();
        }

      }else{
        approx.delete();
      }

      contour.delete();
    }

    if(!best){
      return null;
    }

    const points = [];

    for(
      let i = 0;
      i < 4;
      i++
    ){

      const ptr =
        best.approx.intPtr(
          i,
          0
        );

      points.push({
        x:ptr[0],
        y:ptr[1]
      });
    }

    best.approx.delete();

    return orderQuad(
      points
    );

  }finally{

    src.delete();
    gray.delete();
    blur.delete();
    edge.delete();
    contours.delete();
    hierarchy.delete();

  }
}


/* =========================================================
   원근 보정
========================================================= */

function warpQuad(
  canvas,
  quad
){

  const width =
    Math.max(
      distance(
        quad.tl,
        quad.tr
      ),
      distance(
        quad.bl,
        quad.br
      )
    );

  const height =
    Math.max(
      distance(
        quad.tl,
        quad.bl
      ),
      distance(
        quad.tr,
        quad.br
      )
    );

  let outW =
    Math.round(width);

  let outH =
    Math.round(height);

  const maxSide =
    2300;

  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        outW,
        outH
      )
    );

  outW =
    Math.max(
      100,
      Math.round(
        outW * scale
      )
    );

  outH =
    Math.max(
      100,
      Math.round(
        outH * scale
      )
    );

  const src =
    cv.imread(
      canvas
    );

  const dst =
    new cv.Mat();

  const from =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        quad.tl.x,
        quad.tl.y,

        quad.tr.x,
        quad.tr.y,

        quad.br.x,
        quad.br.y,

        quad.bl.x,
        quad.bl.y
      ]
    );

  const to =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        0,
        0,

        outW - 1,
        0,

        outW - 1,
        outH - 1,

        0,
        outH - 1
      ]
    );

  const matrix =
    cv.getPerspectiveTransform(
      from,
      to
    );

  cv.warpPerspective(
    src,
    dst,
    matrix,
    new cv.Size(
      outW,
      outH
    ),
    cv.INTER_LINEAR,
    cv.BORDER_CONSTANT,
    new cv.Scalar(
      255,
      255,
      255,
      255
    )
  );

  const output =
    document.createElement(
      "canvas"
    );

  output.width =
    outW;

  output.height =
    outH;

  cv.imshow(
    output,
    dst
  );

  src.delete();
  dst.delete();
  from.delete();
  to.delete();
  matrix.delete();

  return output;
}


/* =========================================================
   사진 자동 보정

   큰 사각형을 못 찾았다고 분석 중단하지 않음.
========================================================= */

async function correctImage(
  source
){

  await loadOpenCV();

  const quad =
    detectLargeQuad(
      source
    );

  if(!quad){

    return {
      canvas:source,
      corrected:false
    };
  }

  return {
    canvas:
      warpQuad(
        source,
        quad
      ),
    corrected:true
  };
}


/* =========================================================
   실제 수평선 검출

   ★ 이미지 전체의 검은 픽셀 비율로 찾던
     이전 방식 대신 OpenCV morphology 사용.

   글자 획은 제거하고 긴 가로선만 남긴다.
========================================================= */

function detectHorizontalTableLines(
  canvas
){

  const src =
    cv.imread(
      canvas
    );

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const horizontal =
    new cv.Mat();

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,
      13
    );

    const kernelWidth =
      Math.max(
        25,
        Math.round(
          canvas.width *
          .12
        )
      );

    const kernel =
      cv.getStructuringElement(
        cv.MORPH_RECT,
        new cv.Size(
          kernelWidth,
          1
        )
      );

    cv.morphologyEx(
      binary,
      horizontal,
      cv.MORPH_OPEN,
      kernel
    );

    kernel.delete();

    /*
      끊어진 가로선 약간 연결
    */

    const joinKernel =
      cv.getStructuringElement(
        cv.MORPH_RECT,
        new cv.Size(9,3)
      );

    cv.dilate(
      horizontal,
      horizontal,
      joinKernel
    );

    joinKernel.delete();

    const rows = [];

    for(
      let y = 0;
      y < horizontal.rows;
      y++
    ){

      let count =
        0;

      for(
        let x = 0;
        x < horizontal.cols;
        x += 2
      ){

        if(
          horizontal.ucharPtr(
            y,
            x
          )[0] > 0
        ){
          count++;
        }
      }

      const ratio =
        count /
        Math.ceil(
          horizontal.cols /
          2
        );

      if(
        ratio >= .20
      ){
        rows.push(y);
      }
    }

    /*
      같은 선이 2~5px 두께로 잡히므로 묶음.
    */

    const groups = [];

    for(
      const y
      of rows
    ){

      const last =
        groups[
          groups.length - 1
        ];

      if(
        !last ||
        y - last.end > 5
      ){

        groups.push({
          start:y,
          end:y
        });

      }else{

        last.end = y;

      }
    }

    return groups
      .map(
        group =>
          Math.round(
            (
              group.start +
              group.end
            ) / 2
          )
      );

  }finally{

    src.delete();
    gray.delete();
    binary.delete();
    horizontal.delete();

  }
}

/* =========================================================
   숫자 배열 중앙값
========================================================= */

function median(
  values
){

  if(
    !values.length
  ){
    return 0;
  }

  const sorted =
    [...values]
    .sort(
      (a,b) =>
        a - b
    );

  const middle =
    Math.floor(
      sorted.length /
      2
    );

  if(
    sorted.length % 2
  ){
    return sorted[middle];
  }

  return (
    sorted[middle - 1] +
    sorted[middle]
  ) / 2;
}


/* =========================================================
   ★ 순찰일지 35행 경계 확정

   핵심:
   - 실제 검출된 가로선 사용
   - 일정 간격의 연속 표 구간 검색
   - 누락된 선은 보간
   - 단순 이미지 35등분 X
========================================================= */

function build35RowGrid(
  lines,
  imageHeight
){

  if(
    lines.length < 15
  ){
    return null;
  }

  /*
    너무 가까운 선 제거
  */

  const filtered = [];

  for(
    const line
    of lines
  ){

    if(
      !filtered.length ||
      line -
      filtered[
        filtered.length - 1
      ] >= 6
    ){
      filtered.push(line);
    }
  }

  /*
    인접 간격 수집
  */

  const gaps = [];

  for(
    let i = 1;
    i < filtered.length;
    i++
  ){

    const gap =
      filtered[i] -
      filtered[i - 1];

    if(
      gap >= 8 &&
      gap <= imageHeight * .06
    ){
      gaps.push(gap);
    }
  }

  if(
    gaps.length < 8
  ){
    return null;
  }

  /*
    큰 간격(헤더 등)의 영향을 줄이기 위해
    하위 70% 정도의 간격으로 행높이 추정.
  */

  const sortedGaps =
    [...gaps]
    .sort(
      (a,b) =>
        a - b
    );

  const usable =
    sortedGaps.slice(
      0,
      Math.max(
        5,
        Math.ceil(
          sortedGaps.length *
          .70
        )
      )
    );

  const rowHeight =
    median(
      usable
    );

  if(
    rowHeight < 8
  ){
    return null;
  }

  const tolerance =
    Math.max(
      4,
      rowHeight * .35
    );

  let best =
    null;

  /*
    검출된 각 선을 표 첫 경계 후보로 검사.
  */

  for(
    const start
    of filtered
  ){

    if(
      start +
      rowHeight * 35 >
      imageHeight +
      rowHeight
    ){
      continue;
    }

    let matched =
      0;

    let error =
      0;

    const boundaries = [];

    for(
      let i = 0;
      i <= 35;
      i++
    ){

      const expected =
        start +
        rowHeight *
        i;

      let nearest =
        null;

      let nearestDistance =
        Infinity;

      for(
        const line
        of filtered
      ){

        const d =
          Math.abs(
            line -
            expected
          );

        if(
          d <
          nearestDistance
        ){

          nearest =
            line;

          nearestDistance =
            d;
        }
      }

      if(
        nearestDistance <=
        tolerance
      ){

        boundaries.push(
          nearest
        );

        matched++;

        error +=
          nearestDistance;

      }else{

        /*
          선이 손글씨/사진 때문에 누락된 경우
          예상 위치로 보간.
        */

        boundaries.push(
          expected
        );
      }
    }

    const score =
      matched * 100 -
      error;

    if(
      !best ||
      score >
      best.score
    ){

      best = {
        start,
        score,
        matched,
        boundaries
      };
    }
  }

  if(
    !best ||
    best.matched < 18
  ){
    return null;
  }

  /*
    중복되거나 역전된 경계 방지
  */

  const finalBoundaries =
    [];

  for(
    let i = 0;
    i < best.boundaries.length;
    i++
  ){

    let value =
      best.boundaries[i];

    if(
      i > 0 &&
      value <=
      finalBoundaries[i - 1] + 3
    ){

      value =
        finalBoundaries[i - 1] +
        rowHeight;
    }

    finalBoundaries.push(
      value
    );
  }

  return {

    boundaries:
      finalBoundaries,

    rowHeight,

    matched:
      best.matched,

    detected:
      filtered.length

  };
}


/* =========================================================
   행 좌표
========================================================= */

function getGridRow(
  grid,
  rowNumber
){

  const top =
    grid.boundaries[
      rowNumber - 1
    ];

  const bottom =
    grid.boundaries[
      rowNumber
    ];

  return {

    top,

    bottom,

    height:
      bottom - top

  };
}


/* =========================================================
   ★ 수직선에서 표 열 구조 정리
========================================================= */

function normalizeVerticalLines(
  lines,
  width
){

  const filtered =
    lines
    .filter(
      x =>
        x >
        width * .015 &&
        x <
        width * .995
    )
    .sort(
      (a,b) =>
        a - b
    );

  const result = [];

  for(
    const x
    of filtered
  ){

    if(
      !result.length ||
      x -
      result[
        result.length - 1
      ] >=
      Math.max(
        6,
        width * .008
      )
    ){

      result.push(x);
    }
  }

  return result;
}


/* =========================================================
   가장 가까운 수직선
========================================================= */

function nearestVerticalLine(
  lines,
  target,
  maxDistance
){

  let best =
    null;

  let distance =
    Infinity;

  for(
    const line
    of lines
  ){

    const d =
      Math.abs(
        line -
        target
      );

    if(
      d < distance
    ){

      distance =
        d;

      best =
        line;
    }
  }

  if(
    distance >
    maxDistance
  ){
    return null;
  }

  return best;
}


/* =========================================================
   ★ 순찰일지 열 구조

   사진마다 폭이 달라도
   검출된 실제 세로선에 스냅한다.

   아래 비율은 '대략 어느 열인지' 찾기 위한
   초기 힌트일 뿐이며,
   실제 Crop 경계는 검출된 세로선 사용.
========================================================= */

function buildPatrolColumns(
  canvas,
  verticalLines
){

  const width =
    canvas.width;

  const lines =
    normalizeVerticalLines(
      verticalLines,
      width
    );

  /*
    현재 실제 양식 기준 힌트.
    정확한 위치는 가까운 실제 세로선으로 이동.
  */

  const hints = {

    temperatureLeft:
      .39,

    temperatureRight:
      .51,

    stateLeft:
      .73,

    stateRight:
      .87,

    remarkLeft:
      .87,

    remarkRight:
      .985

  };

  const snapDistance =
    width * .09;

  function snap(
    ratio
  ){

    return (
      nearestVerticalLine(
        lines,
        width * ratio,
        snapDistance
      )
      ??
      width * ratio
    );
  }

  const columns = {

    temperature:{
      left:
        snap(
          hints.temperatureLeft
        ),

      right:
        snap(
          hints.temperatureRight
        )
    },

    state:{
      left:
        snap(
          hints.stateLeft
        ),

      right:
        snap(
          hints.stateRight
        )
    },

    remark:{
      left:
        snap(
          hints.remarkLeft
        ),

      right:
        snap(
          hints.remarkRight
        )
    }

  };

  /*
    잘못 같은 선에 스냅된 경우 fallback.
  */

  for(
    const key
    of Object.keys(
      columns
    )
  ){

    const column =
      columns[key];

    if(
      column.right -
      column.left <
      width * .025
    ){

      if(
        key ===
        "temperature"
      ){
        column.left =
          width * hints.temperatureLeft;

        column.right =
          width * hints.temperatureRight;
      }

      if(
        key ===
        "state"
      ){
        column.left =
          width * hints.stateLeft;

        column.right =
          width * hints.stateRight;
      }

      if(
        key ===
        "remark"
      ){
        column.left =
          width * hints.remarkLeft;

        column.right =
          width * hints.remarkRight;
      }
    }
  }

  return {
    lines,
    ...columns
  };
}


/* =========================================================
   실제 셀 Crop

   ★ 표선을 포함시키지 않도록
     좌우/상하 안쪽으로 들어간다.
========================================================= */

function cropGridCell(
  canvas,
  grid,
  rowNumber,
  column
){

  const row =
    getGridRow(
      grid,
      rowNumber
    );

  const width =
    column.right -
    column.left;

  const padX =
    Math.max(
      2,
      width * .07
    );

  const padY =
    Math.max(
      2,
      row.height * .15
    );

  return cropCanvas(

    canvas,

    column.left +
    padX,

    row.top +
    padY,

    width -
    padX * 2,

    row.height -
    padY * 2

  );
}


/* =========================================================
   ★ 표선 제거

   OCR 전에 셀 내부에 남아있는
   얇은 수평/수직선을 흰색으로 제거.
========================================================= */

function removeCellLines(
  source
){

  const src =
    cv.imread(
      source
    );

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const lines =
    new cv.Mat();

  const cleanMat =
    new cv.Mat();

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      21,
      11
    );

    lines =
      cv.Mat.zeros(
        binary.rows,
        binary.cols,
        cv.CV_8UC1
      );

    /*
      긴 가로선
    */

    if(
      binary.cols >= 20
    ){

      const h =
        new cv.Mat();

      const hk =
        cv.getStructuringElement(
          cv.MORPH_RECT,
          new cv.Size(
            Math.max(
              10,
              Math.round(
                binary.cols * .55
              )
            ),
            1
          )
        );

      cv.morphologyEx(
        binary,
        h,
        cv.MORPH_OPEN,
        hk
      );

      cv.bitwise_or(
        lines,
        h,
        lines
      );

      hk.delete();
      h.delete();
    }

    /*
      긴 세로선
    */

    if(
      binary.rows >= 20
    ){

      const v =
        new cv.Mat();

      const vk =
        cv.getStructuringElement(
          cv.MORPH_RECT,
          new cv.Size(
            1,
            Math.max(
              10,
              Math.round(
                binary.rows * .65
              )
            )
          )
        );

      cv.morphologyEx(
        binary,
        v,
        cv.MORPH_OPEN,
        vk
      );

      cv.bitwise_or(
        lines,
        v,
        lines
      );

      vk.delete();
      v.delete();
    }

    cv.subtract(
      binary,
      lines,
      cleanMat
    );

    /*
      다시 흰 배경/검은 글씨로.
    */

    cv.bitwise_not(
      cleanMat,
      cleanMat
    );

    const output =
      document.createElement(
        "canvas"
      );

    output.width =
      source.width;

    output.height =
      source.height;

    cv.imshow(
      output,
      cleanMat
    );

    return output;

  }finally{

    src.delete();
    gray.delete();
    binary.delete();

    if(lines){
      lines.delete();
    }

    cleanMat.delete();

  }
}


/* =========================================================
   ★ 셀 필기 존재 여부

   표선 제거된 이미지에서 검사한다.

   이전처럼 단순 '검은 픽셀 몇 개'가 아니라
   연결된 검은 영역 크기도 확인.
========================================================= */

function inspectCellInk(
  source
){

  const src =
    cv.imread(
      source
    );

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();

  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.threshold(
      gray,
      binary,
      190,
      255,
      cv.THRESH_BINARY_INV
    );

    const nonZero =
      cv.countNonZero(
        binary
      );

    const total =
      binary.rows *
      binary.cols;

    const ratio =
      total
      ?
      nonZero /
      total
      :
      0;

    cv.findContours(
      binary,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );

    let usefulContours =
      0;

    let largestArea =
      0;

    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);

      const area =
        Math.abs(
          cv.contourArea(
            contour
          )
        );

      largestArea =
        Math.max(
          largestArea,
          area
        );

      if(
        area >=
        Math.max(
          5,
          total * .0012
        )
      ){
        usefulContours++;
      }

      contour.delete();
    }

    return {

      ratio,

      usefulContours,

      largestArea,

      total

    };

  }finally{

    src.delete();
    gray.delete();
    binary.delete();
    contours.delete();
    hierarchy.delete();

  }
}


/* =========================================================
   빈 셀 판정
========================================================= */

function isCellBlank(
  source,
  type
){

  const info =
    inspectCellInk(
      source
    );

  if(
    type ===
    "temperature"
  ){

    return (

      info.ratio <
      .007

      ||

      (
        info.usefulContours === 0 &&
        info.largestArea <
        info.total * .001
      )

    );
  }

  return (

    info.ratio <
    .010

    ||

    (
      info.usefulContours === 0 &&
      info.largestArea <
      info.total * .0015
    )

  );
}


/* =========================================================
   OCR 확대
========================================================= */

function enlargeForOCR(
  source,
  scale = 3
){

  const output =
    document.createElement(
      "canvas"
    );

  output.width =
    Math.round(
      source.width *
      scale
    );

  output.height =
    Math.round(
      source.height *
      scale
    );

  const ctx =
    output.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );

  ctx.imageSmoothingEnabled =
    true;

  ctx.drawImage(
    source,
    0,
    0,
    output.width,
    output.height
  );

  return output;
}


/* =========================================================
   OCR Worker
========================================================= */

async function getWorker(){

  if(worker){
    return worker;
  }

  setStatus(
    "문자 인식 엔진 준비중...",
    4
  );

  worker =
    await Tesseract.createWorker(
      "kor+eng",
      1
    );

  return worker;
}


/* =========================================================
   셀 OCR
========================================================= */

async function recognizeCell(
  source,
  type
){

  const cleaned =
    removeCellLines(
      source
    );

  if(
    isCellBlank(
      cleaned,
      type
    )
  ){

    return {
      blank:true,
      text:""
    };
  }

  const enlarged =
    enlargeForOCR(
      cleaned,
      3
    );

  const ocrWorker =
    await getWorker();

  const options = {
    tessedit_pageseg_mode:
      Tesseract.PSM.SINGLE_LINE
  };

  if(
    type ===
    "temperature"
  ){

    options.tessedit_char_whitelist =
      "0123456789";
  }

  const result =
    await ocrWorker.recognize(
      enlarged,
      options
    );

  return {

    blank:false,

    text:
      clean(
        result.data.text
      )

  };
}


/* =========================================================
   온도 숫자

   ★ 빈칸은 절대 0도로 변환하지 않는다.
========================================================= */

function parseTemperature(
  text
){

  if(
    !text
  ){
    return null;
  }

  const matches =
    String(text)
    .match(
      /\d{1,4}/g
    );

  if(
    !matches
  ){
    return null;
  }

  for(
    const value
    of matches
  ){

    const number =
      Number(value);

    if(
      Number.isFinite(
        number
      ) &&
      number >= 10 &&
      number <= 1800
    ){

      return number;
    }
  }

  return null;
}


/* =========================================================
   상태 판독
========================================================= */

function parseState(
  text
){

  const value =
    compact(
      text
    );

  if(
    value.includes(
      "승온"
    )
  ){
    return "승온중";
  }

  if(
    value.includes(
      "유지"
    )
  ){
    return "유지중";
  }

  if(
    value.includes(
      "냉각"
    )
  ){
    return "냉각중";
  }

  if(
    value.includes(
      "가압"
    )
  ){
    return "가압중";
  }

  return "";
}


/* =========================================================
   비고 판독
========================================================= */

function parseRemark(
  text
){

  const value =
    compact(
      text
    );

  return {

    unload:

      value.includes(
        "언로딩대기"
      )

      ||

      (
        value.includes(
          "언로딩"
        )
        &&
        value.includes(
          "대기"
        )
      ),

    cooling:

      value.includes(
        "냉각"
      )

  };
}


/* =========================================================
   ★ 순찰일지 표 준비

   여기까지 성공해야 OCR 시작.
========================================================= */

async function preparePatrolTable(
  file
){

  setStatus(
    "순찰일지 사진 준비중...",
    6
  );

  const original =
    await fileToCanvas(
      file,
      2400
    );

  setStatus(
    "순찰일지 자동 보정중...",
    10
  );

  const correction =
    await correctImage(
      original
    );

  const canvas =
    correction.canvas;

  setStatus(
    "실제 표선 찾는 중...",
    14
  );

  const horizontal =
    detectHorizontalTableLines(
      canvas
    );

  const vertical =
    detectVerticalTableLines(
      canvas
    );

  const grid =
    build35RowGrid(
      horizontal,
      canvas.height
    );

  if(!grid){

    throw new Error(

      "순찰일지의 35행 표를 정확히 찾지 못했습니다. " +

      `가로선 ${horizontal.length}개 감지.`

    );
  }

  const columns =
    buildPatrolColumns(
      canvas,
      vertical
    );

  /*
    세로선 자체가 거의 없다면
    잘못된 영역을 보정한 가능성이 높음.
  */

  if(
    columns.lines.length <
    4
  ){

    throw new Error(

      "순찰일지의 세로 표선을 정확히 찾지 못했습니다. " +

      `세로선 ${columns.lines.length}개 감지.`

    );
  }

  return {

    canvas,

    corrected:
      correction.corrected,

    horizontalCount:
      horizontal.length,

    verticalCount:
      columns.lines.length,

    grid,

    columns

  };
}


/* =========================================================
   일반 장비 한 행 읽기
========================================================= */

async function readPatrolEquipmentRow(
  table,
  rowNumber,
  equipment
){

  const temperatureSource =
    cropGridCell(
      table.canvas,
      table.grid,
      rowNumber,
      table.columns.temperature
    );

  const stateSource =
    cropGridCell(
      table.canvas,
      table.grid,
      rowNumber,
      table.columns.state
    );

  const remarkSource =
    cropGridCell(
      table.canvas,
      table.grid,
      rowNumber,
      table.columns.remark
    );


  const temperatureOCR =
    await recognizeCell(
      temperatureSource,
      "temperature"
    );


  const stateOCR =
    await recognizeCell(
      stateSource,
      "state"
    );


  const remarkOCR =
    await recognizeCell(
      remarkSource,
      "remark"
    );


  const temperature =
    temperatureOCR.blank
    ?
    null
    :
    parseTemperature(
      temperatureOCR.text
    );


  const state =
    stateOCR.blank
    ?
    ""
    :
    parseState(
      stateOCR.text
    );


  const remark =
    remarkOCR.blank
    ?
    {
      unload:false,
      cooling:false
    }
    :
    parseRemark(
      remarkOCR.text
    );


  return {

    row:
      rowNumber,

    equipment,

    temperature,

    state,

    unload:
      remark.unload,

    remarkCooling:
      remark.cooling,

    blank:{

      temperature:
        temperatureOCR.blank,

      state:
        stateOCR.blank,

      remark:
        remarkOCR.blank

    },

    raw:{

      temperature:
        temperatureOCR.text,

      state:
        stateOCR.text,

      remark:
        remarkOCR.text

    }

  };
}


/* =========================================================
   온도만 읽는 행

   드라이챔버 / 소각기
========================================================= */

async function readTemperatureOnlyRow(
  table,
  rowNumber,
  equipment
){

  const source =
    cropGridCell(
      table.canvas,
      table.grid,
      rowNumber,
      table.columns.temperature
    );

  const ocr =
    await recognizeCell(
      source,
      "temperature"
    );

  const temperature =
    ocr.blank
    ?
    null
    :
    parseTemperature(
      ocr.text
    );

  return {

    row:
      rowNumber,

    equipment,

    temperature,

    blank:
      ocr.blank,

    raw:
      ocr.text

  };
}


/* =========================================================
   ★ 순찰일지 전체 분석

   null 행은 실제 표 좌표는 유지하지만
   OCR 자체를 하지 않는다.
========================================================= */

async function analyzePatrol(
  file
){

  const table =
    await preparePatrolTable(
      file
    );

  const rowMap =
    getPatrolRows();

  const entries =
    Object.entries(
      rowMap
    );

  const items = {};

  const dry = [];

  const incinerators = [];

  let temperatureCount =
    0;

  let stateCount =
    0;

  let processed =
    0;

  const readable =
    entries.filter(
      ([,equipment]) =>
        equipment !== null
    );

  for(
    const [
      rowText,
      equipment
    ]
    of readable
  ){

    const rowNumber =
      Number(
        rowText
      );

    processed++;

    setStatus(

      `순찰일지 ${rowNumber}행 확인중...`,

      18 +
      Math.round(
        (
          processed /
          readable.length
        ) *
        37
      )

    );


    if(
      DRY_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await readTemperatureOnlyRow(
          table,
          rowNumber,
          equipment
        );

      if(
        item.temperature !==
        null
      ){
        temperatureCount++;
      }

      dry.push(
        item
      );

      continue;
    }


    if(
      INCINERATOR_EQUIPMENT.includes(
        equipment
      )
    ){

      const item =
        await readTemperatureOnlyRow(
          table,
          rowNumber,
          equipment
        );

      if(
        item.temperature !==
        null
      ){
        temperatureCount++;
      }

      incinerators.push(
        item
      );

      continue;
    }


    const item =
      await readPatrolEquipmentRow(
        table,
        rowNumber,
        equipment
      );


    if(
      item.temperature !==
      null
    ){
      temperatureCount++;
    }


    if(
      item.state
    ){
      stateCount++;
    }


    items[
      equipment
    ] =
      item;
  }


  return {

    corrected:
      table.corrected,

    horizontalCount:
      table.horizontalCount,

    verticalCount:
      table.verticalCount,

    matchedRows:
      table.grid.matched,

    temperatureCount,

    stateCount,

    items,

    dry,

    incinerators

  };
}


/* =========================================================
   PART 2 완료

   PART 3:
   - 사진2 표 행 분석
   - 장비명 검증
   - 번호 + 가동
   - 두 사진 교차검증
   - 제외조건
   - TG1
   - 드라이챔버 / 소각기
   - 최종 문자보고
========================================================= */
/* =========================================================
   DACC PART 3
   사진2 + 교차검증 + 최종 문자보고
========================================================= */


/* =========================================================
   사진2 장비명 정규화
========================================================= */

function normalizeEquipment(
  value
){

  const text =
    compact(
      value
    );


  let match;


  match =
    text.match(
      /TG[-]?([1-7])/
    );

  if(match){
    return "TG" + match[1];
  }


  match =
    text.match(
      /GF[-]?(1|3|4|5)/
    );

  if(match){
    return "GF" + match[1];
  }


  match =
    text.match(
      /CF[-]?([1-6])/
    );

  if(match){
    return "CF" + match[1];
  }


  match =
    text.match(
      /HIP[-]?([123])/
    );

  if(match){
    return "HIP" + match[1];
  }


  if(
    text.includes(
      "SMI"
    )
  ){
    return "SMI";
  }


  if(
    text.includes("CF") &&
    (
      text.includes("분위기") ||
      text.includes("분위기로")
    )
  ){
    return "CF분위기로";
  }


  return "";
}


/* =========================================================
   장비번호 정규화

   예:
   26-118
   #26-118
   26 118
   26118

   → #26-118
========================================================= */

function parseEquipmentNumber(
  value
){

  let text =
    clean(
      value
    )
    .replace(
      /[Oo]/g,
      "0"
    )
    .replace(
      /[Il|]/g,
      "1"
    )
    .replace(
      /[‐-‒–—―_.~]/g,
      "-"
    );


  let match =
    text.match(
      /#?\s*26\s*[-\s]\s*(\d{1,3})/
    );


  if(match){

    return (
      "#26-" +
      match[1]
    );

  }


  match =
    text.match(
      /(?:^|\D)26(\d{1,3})(?:\D|$)/
    );


  if(match){

    return (
      "#26-" +
      match[1]
    );

  }


  return "";
}


/* =========================================================
   가동 판독

   ★ 번호가 존재하는 행에서만 최종 사용.
========================================================= */

function parseRunning(
  value
){

  const text =
    compact(
      value
    );


  if(
    text.includes(
      "가동"
    )
  ){
    return true;
  }


  /*
    한글 OCR에서 '가'가 깨지고
    '동'만 남는 경우 보조판정.

    단, 호출부에서 번호가 있을 때만 인정.
  */

  if(
    text.includes(
      "동"
    )
  ){
    return true;
  }


  return false;
}


/* =========================================================
   사진2 전체 OCR
========================================================= */

async function recognizeNumberSheet(
  canvas
){

  const ocrWorker =
    await getWorker();


  const enlarged =
    enlargeForOCR(
      canvas,
      1.7
    );


  const result =
    await ocrWorker.recognize(

      enlarged,

      {
        tessedit_pageseg_mode:
          Tesseract.PSM.AUTO
      }

    );


  const scale =
    1.7;


  const words =
    (
      result.data.words ||
      []
    )
    .map(
      word => {

        const box =
          word.bbox;


        return {

          text:
            clean(
              word.text
            ),

          confidence:
            Number(
              word.confidence ||
              0
            ),

          x0:
            box.x0 /
            scale,

          y0:
            box.y0 /
            scale,

          x1:
            box.x1 /
            scale,

          y1:
            box.y1 /
            scale,

          cx:
            (
              box.x0 +
              box.x1
            ) /
            2 /
            scale,

          cy:
            (
              box.y0 +
              box.y1
            ) /
            2 /
            scale

        };

      }
    )
    .filter(
      word =>
        word.text
    );


  return {

    text:
      clean(
        result.data.text
      ),

    words

  };
}


/* =========================================================
   사진2 장비명 앵커 찾기

   ★ 장비명 OCR은 장비를 "결정"하기보다
     실제 행 위치 확인용으로 사용.
========================================================= */

function findNumberAnchors(
  words
){

  const anchors = {};


  for(
    const word
    of words
  ){

    const equipment =
      normalizeEquipment(
        word.text
      );


    if(
      !equipment ||
      !NUMBER_EQUIPMENT.includes(
        equipment
      )
    ){
      continue;
    }


    const current =
      anchors[
        equipment
      ];


    if(
      !current ||
      word.confidence >
      current.confidence
    ){

      anchors[
        equipment
      ] = {

        equipment,

        ...word

      };

    }

  }


  return anchors;
}


/* =========================================================
   사진2 가로선으로 행 영역 찾기
========================================================= */

function makeNumberRowBands(
  horizontalLines,
  canvasHeight
){

  const lines =
    [...horizontalLines]
    .sort(
      (a,b) =>
        a - b
    );


  const bands = [];


  for(
    let i = 0;
    i <
    lines.length - 1;
    i++
  ){

    const top =
      lines[i];


    const bottom =
      lines[i + 1];


    const height =
      bottom -
      top;


    if(
      height < 10 ||
      height >
      canvasHeight *
      .15
    ){
      continue;
    }


    bands.push({

      top,

      bottom,

      height,

      cy:
        (
          top +
          bottom
        ) / 2

    });

  }


  return bands;
}


/* =========================================================
   장비 앵커가 들어있는 실제 표 행
========================================================= */

function findBandForAnchor(
  bands,
  anchor
){

  let best =
    null;


  for(
    const band
    of bands
  ){

    if(
      anchor.cy >=
      band.top
      &&
      anchor.cy <=
      band.bottom
    ){

      return band;
    }


    const distance =
      Math.abs(
        anchor.cy -
        band.cy
      );


    if(
      !best ||
      distance <
      best.distance
    ){

      best = {
        band,
        distance
      };
    }

  }


  if(
    best &&
    best.distance <
    canvasHeightSafe(
      bands
    ) *
    .04
  ){

    return best.band;

  }


  return null;
}


function canvasHeightSafe(
  bands
){

  if(
    !bands.length
  ){
    return 1;
  }


  return Math.max(
    ...bands.map(
      band =>
        band.bottom
    )
  );
}


/* =========================================================
   사진2 한 행 Crop
========================================================= */

function cropNumberBand(
  canvas,
  band
){

  const padY =
    Math.max(
      2,
      band.height *
      .10
    );


  return cropCanvas(

    canvas,

    0,

    band.top +
    padY,

    canvas.width,

    band.height -
    padY * 2

  );
}


/* =========================================================
   사진2 행 OCR

   전체 행을 한 번 더 확대해서
   장비명 + 번호 + 가동을 같이 확인.
========================================================= */

async function recognizeNumberBand(
  canvas
){

  const enlarged =
    enlargeForOCR(
      canvas,
      2.5
    );


  const ocrWorker =
    await getWorker();


  const result =
    await ocrWorker.recognize(

      enlarged,

      {
        tessedit_pageseg_mode:
          Tesseract.PSM.SINGLE_LINE
      }

    );


  return clean(
    result.data.text
  );
}


/* =========================================================
   사진2 장비 하나 판독
========================================================= */

async function readNumberEquipment(
  canvas,
  words,
  band,
  expectedEquipment
){

  const bandCanvas =
    cropNumberBand(
      canvas,
      band
    );


  const directText =
    await recognizeNumberBand(
      bandCanvas
    );


  /*
    전체 OCR에서 같은 행에 있는 단어도 결합.
  */

  const rowText =
    words
    .filter(
      word =>
        word.cy >=
        band.top
        &&
        word.cy <=
        band.bottom
    )
    .sort(
      (a,b) =>
        a.x0 -
        b.x0
    )
    .map(
      word =>
        word.text
    )
    .join(
      " "
    );


  const combined =
    clean(
      rowText +
      " " +
      directText
    );


  const recognizedEquipment =
    normalizeEquipment(
      combined
    );


  const number =
    parseEquipmentNumber(
      combined
    );


  /*
    번호가 있을 때만
    가동 판정을 허용.
  */

  const running =
    !!number &&
    parseRunning(
      combined
    );


  return {

    equipment:
      expectedEquipment,

    recognizedEquipment,

    number,

    running,

    raw:
      combined

  };
}


/* =========================================================
   사진2 전체 분석

   1. 자동보정
   2. 실제 가로선 검출
   3. 전체 OCR로 장비명 위치 확보
   4. 해당 실제 행을 다시 OCR
========================================================= */

async function analyzeNumberPhoto(
  file
){

  setStatus(
    "장비번호 사진 준비중...",
    58
  );


  const original =
    await fileToCanvas(
      file,
      2400
    );


  setStatus(
    "장비번호 사진 자동 보정중...",
    61
  );


  const correction =
    await correctImage(
      original
    );


  const canvas =
    correction.canvas;


  setStatus(
    "장비번호 표선 찾는 중...",
    64
  );


  const horizontal =
    detectHorizontalTableLines(
      canvas
    );


  const vertical =
    detectVerticalTableLines(
      canvas
    );


  if(
    horizontal.length < 8
  ){

    throw new Error(

      "장비번호표의 가로선을 충분히 찾지 못했습니다. " +

      `가로선 ${horizontal.length}개 감지.`

    );

  }


  setStatus(
    "장비명 위치 확인중...",
    67
  );


  const ocr =
    await recognizeNumberSheet(
      canvas
    );


  const anchors =
    findNumberAnchors(
      ocr.words
    );


  const bands =
    makeNumberRowBands(
      horizontal,
      canvas.height
    );


  const items = {};


  let processed =
    0;


  const anchorList =
    Object.values(
      anchors
    );


  for(
    const anchor
    of anchorList
  ){

    processed++;


    setStatus(

      `장비번호 ${anchor.equipment} 확인중...`,

      70 +
      Math.round(
        (
          processed /
          Math.max(
            1,
            anchorList.length
          )
        ) *
        17
      )

    );


    const band =
      findBandForAnchor(
        bands,
        anchor
      );


    if(!band){

      items[
        anchor.equipment
      ] = {

        equipment:
          anchor.equipment,

        found:true,

        number:"",

        running:false,

        raw:
          anchor.text,

        reason:
          "행 위치 미확정"

      };


      continue;
    }


    const item =
      await readNumberEquipment(

        canvas,

        ocr.words,

        band,

        anchor.equipment

      );


    items[
      anchor.equipment
    ] = {

      ...item,

      found:true

    };

  }


  /*
    인식되지 않은 장비도
    명시적으로 생성.
  */

  for(
    const equipment
    of NUMBER_EQUIPMENT
  ){

    if(
      !items[
        equipment
      ]
    ){

      items[
        equipment
      ] = {

        equipment,

        found:false,

        recognizedEquipment:"",

        number:"",

        running:false,

        raw:"",

        reason:
          "장비명 미인식"

      };

    }

  }


  const foundCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        item.found
    )
    .length;


  const numberCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        item.number
    )
    .length;


  const runningCount =
    Object
    .values(
      items
    )
    .filter(
      item =>
        item.number &&
        item.running
    )
    .length;


  return {

    corrected:
      correction.corrected,

    horizontalCount:
      horizontal.length,

    verticalCount:
      vertical.length,

    foundCount,

    numberCount,

    runningCount,

    items

  };
}


/* =========================================================
   일반 장비 제외 판정
========================================================= */

function getExcludeReason(
  equipment,
  patrol,
  number
){

  if(
    !number ||
    !number.found
  ){
    return "장비번호표 장비명 미인식";
  }


  if(
    !number.number
  ){
    return "장비번호 없음";
  }


  if(
    !number.running
  ){
    return "가동 확인 안 됨";
  }


  if(!patrol){
    return "순찰일지 데이터 없음";
  }


  if(
    patrol.temperature ===
    null
  ){

    return (
      patrol.blank?.temperature
      ?
      "온도 미작성"
      :
      "온도 인식 실패"
    );

  }


  if(
    !patrol.state
  ){

    return (
      patrol.blank?.state
      ?
      "상태 미작성"
      :
      "상태 인식 실패"
    );

  }


  /*
    비고에 냉각 / 언로딩대기면
    번호와 가동이 있어도 제외.
  */

  if(
    patrol.unload
  ){
    return "언로딩대기";
  }


  if(
    patrol.remarkCooling
  ){
    return "비고 냉각";
  }


  /*
    100도 이하 + 냉각중
  */

  if(
    patrol.temperature <= 100 &&
    patrol.state === "냉각중"
  ){
    return "100도 이하 냉각";
  }


  return "";
}


/* =========================================================
   사진1 + 사진2 합치기
========================================================= */

function mergeAnalysis(
  patrol,
  number
){

  const included = [];

  const excluded = [];


  for(
    const equipment
    of REPORT_ORDER
  ){

    const patrolItem =
      patrol.items[
        equipment
      ];


    const numberItem =
      number.items[
        equipment
      ];


    const reason =
      getExcludeReason(

        equipment,

        patrolItem,

        numberItem

      );


    if(reason){

      excluded.push({

        equipment,

        reason,

        patrol:
          patrolItem,

        number:
          numberItem

      });


      continue;
    }


    included.push({

      equipment,

      number:
        numberItem.number,

      temperature:
        patrolItem.temperature,

      state:
        patrolItem.state

    });

  }


  /*
    TG1

    순찰일지에는 존재하지 않음.

    사진2:
    번호 있음 + 가동

    이 두 조건이면 출력.
  */

  let tg1 =
    null;


  const tg1Number =
    number.items[
      "TG1"
    ];


  if(
    tg1Number &&
    tg1Number.number &&
    tg1Number.running
  ){

    tg1 = {

      equipment:
        "TG1",

      number:
        tg1Number.number

    };

  }


  /*
    드라이챔버

    번호 없음.
    온도가 정상 인식된 것만.
  */

  const dry =
    patrol.dry
    .filter(
      item =>
        item.temperature !==
        null
    );


  /*
    소각기

    번호 없음.
    온도가 실제로 작성된 것만.

    빈칸 → null → 출력 X
  */

  const incinerators =
    patrol.incinerators
    .filter(
      item =>
        item.temperature !==
        null
    );


  return {

    included,

    excluded,

    tg1,

    dry,

    incinerators

  };
}


/* =========================================================
   분석 신뢰성 검사

   이전처럼 이상한 값으로 보고서를
   억지 생성하지 않도록 차단.
========================================================= */

function validateAnalysis(
  patrol,
  number
){

  const problems = [];


  if(
    patrol.matchedRows < 18
  ){

    problems.push(

      `순찰일지 35행 표 일치가 부족합니다 (${patrol.matchedRows}/36).`

    );

  }


  if(
    patrol.verticalCount < 4
  ){

    problems.push(

      `순찰일지 세로선이 부족합니다 (${patrol.verticalCount}개).`

    );

  }


  if(
    number.foundCount < 5
  ){

    problems.push(

      `장비번호표에서 장비명을 ${number.foundCount}개만 확인했습니다.`

    );

  }


  if(
    number.numberCount > 0 &&
    number.runningCount === 0
  ){

    problems.push(

      `번호 ${number.numberCount}개를 읽었지만 가동 장비를 확인하지 못했습니다.`

    );

  }


  return {

    valid:
      problems.length === 0,

    problems

  };
}


/* =========================================================
   결과 한 줄
========================================================= */

function makeResultElement(
  item
){

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "result";


  div.innerHTML = `

    <div class="check">

    </div>

    <div>

        ${displayNumber(item.number)} ${item.equipment}
      </div>

      <div class="sub">
        ${item.temperature}도 · ${item.state}
      </div>

    </div>

    <div class="badge">
      표시
    </div>

  `;


  return div;
}


/* =========================================================
   분석결과 화면
========================================================= */

function renderAnalysis(
  patrol,
  number,
  merged,
  validation
){

  $("results")
  .innerHTML =
    "";


  $("patrolStatus")
  .classList
  .remove(
    "hidden"
  );


  $("patrolStatus")
  .innerHTML =

    `<b>사진 1 · 순찰일지</b><br>` +

    `${patrol.corrected ? "자동보정 ✓" : "원본 사용"} · ` +

    `가로선 ${patrol.horizontalCount} · ` +

    `세로선 ${patrol.verticalCount} · ` +

    `표 일치 ${patrol.matchedRows}/36 · ` +

    `온도 ${patrol.temperatureCount} · ` +

    `상태 ${patrol.stateCount}`;


  $("numberStatus")
  .classList
  .remove(
    "hidden"
  );


  $("numberStatus")
  .innerHTML =

    `<b>사진 2 · 장비번호</b><br>` +

    `${number.corrected ? "자동보정 ✓" : "원본 사용"} · ` +

    `장비명 ${number.foundCount} · ` +

    `번호 ${number.numberCount} · ` +

    `가동 ${number.runningCount}`;


  if(
    validation.valid
  ){

    $("fatalWarning")
    .classList
    .add(
      "hidden"
    );


    $("makeReport")
    .disabled =
      false;

  }else{

    $("fatalWarning")
    .classList
    .remove(
      "hidden"
    );


    $("fatalWarning")
    .innerHTML =

      "<b>인식 결과 확인 필요</b><br>" +

      validation.problems
      .join(
        "<br>"
      );


    $("makeReport")
    .disabled =
      true;

  }


  for(
    const item
    of merged.included
  ){

    $("results")
    .appendChild(
      makeResultElement(
        item
      )
    );

  }


  if(
    merged.included.length === 0
  ){

    $("results")
    .innerHTML = `

      <div style="
        padding:22px 4px;
        text-align:center;
        color:#8d96a8;
        font-size:13px;
      ">
        자동 확정된 일반 장비가 없습니다.
      </div>

    `;

  }


  /*
    TG1
  */

  if(
    merged.tg1
  ){

    $("tg1Area")
    .classList
    .remove(
      "hidden"
    );


    $("tg1Area")
    .innerHTML =

      `<b>${displayNumber(
        merged.tg1.number
      )} TG1</b><br>` +

      `순찰일지 미등록 · 장비번호/가동 확인`;

  }else{

    $("tg1Area")
    .classList
    .add(
      "hidden"
    );

  }


  /*
    제외 항목
  */

  $("excludedCount")
  .textContent =

    `제외항목 ${merged.excluded.length}개`;


  $("excluded")
  .innerHTML =
    "";


  for(
    const item
    of merged.excluded
  ){

    const div =
      document.createElement(
        "div"
      );


    const numberText =
      item.number?.number
      ?
      displayNumber(
        item.number.number
      )
      :
      "번호 없음";


    let patrolText =
      "";


    if(
      item.patrol?.temperature !==
      null &&
      item.patrol?.temperature !==
      undefined
    ){

      patrolText +=
        `${item.patrol.temperature}도 `;

    }


    if(
      item.patrol?.state
    ){

      patrolText +=
        item.patrol.state;

    }


    div.innerHTML =

      `<b>${numberText} ${item.equipment}</b>`

      +

      (
        patrolText
        ?
        `<br>${patrolText}`
        :
        ""
      )

      +

      `<br>→ ${item.reason}`;


    $("excluded")
    .appendChild(
      div
    );

  }


  $("count")
  .textContent =

    `${merged.included.length}개 표시`;


  $("resultCard")
  .classList
  .remove(
    "hidden"
  );


  $("resultCard")
  .scrollIntoView({

    behavior:
      "smooth",

    block:
      "start"

  });

}

/* =========================================================
   날짜
========================================================= */

function getToday(){

  const now =
    new Date();


  const weekdays = [
    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"
  ];


  return {

    month:
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      ),

    day:
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      ),

    weekday:
      weekdays[
        now.getDay()
      ]

  };
}


/* =========================================================
   근무명
========================================================= */

function getWorkName(){

  if(
    workType ===
    "weekday"
  ){
    return "주간";
  }


  if(
    workType ===
    "holiday"
  ){
    return "휴일주간";
  }


  return "야간";
}


/* =========================================================
   장비번호 출력
========================================================= */

function displayNumber(
  number
){

  return String(
    number ||
    ""
  )
  .replace(
    /^#/,
    ""
  );
}


/* =========================================================
   일반 장비 한 줄
========================================================= */

function makeEquipmentLine(
  item
){

  return (

    displayNumber(
      item.number
    )

    + " " +

    item.equipment

    + " " +

    item.temperature

    + "도 " +

    item.state

  );
}


/* =========================================================
   최종 문자보고
========================================================= */

function buildReport(){

  if(
    !analysisResult ||
    !analysisResult.validation.valid
  ){
    return "";
  }


  const merged =
    analysisResult.merged;


  const today =
    getToday();


  const lines = [];


  lines.push(

    `${today.month}월 ${today.day}일 (${today.weekday}) ${getWorkName()}근무자`

  );


  lines.push(

    `${rank}입니다.`

  );


  lines.push("");


  lines.push(
    '"장비가동현황"'
  );


  /*
    일반 장비:
    REPORT_ORDER 순서 그대로.
  */

  for(
    const equipment
    of REPORT_ORDER
  ){

    const item =
      merged.included.find(
        value =>
          value.equipment ===
          equipment
      );


    if(!item){
      continue;
    }


    lines.push(
      makeEquipmentLine(
        item
      )
    );

  }


  /*
    TG1은 사용자가 요청한 대로
    일반 장비의 맨 아래.
  */

  if(
    merged.tg1
  ){

    lines.push(

      `${displayNumber(
        merged.tg1.number
      )} TG1`

    );

  }


  /*
    드라이챔버

    번호 없음.
    온도만.
  */

  if(
    merged.dry.length
  ){

    lines.push("");


    for(
      const item
      of merged.dry
    ){

      lines.push(

        `${item.equipment} ${item.temperature}도`

      );

    }

  }


  /*
    소각기 별도 출력

    번호 없음.
    온도만.

    빈칸이면 merged에 들어오지 않으므로
    0도/1도 같은 빈칸 출력 방지.
  */

  if(
    merged.incinerators.length
  ){

    lines.push("");

    lines.push(
      "-TG소각기-"
    );


    const order = [
      "1동소각기",
      "3동소각기"
    ];


    const sorted =
      [...merged.incinerators]
      .sort(
        (a,b) =>
          order.indexOf(
            a.equipment
          )
          -
          order.indexOf(
            b.equipment
          )
      );


    for(
      const item
      of sorted
    ){

      const name =
        item.equipment ===
        "1동소각기"
        ?
        "1동"
        :
        "3동";


      lines.push(

        `${name} ${item.temperature}도`

      );

    }

  }


  return lines.join(
    "\n"
  );
}

/* =========================================================
   iPhone 복사 fallback
========================================================= */

function fallbackCopy(){

  const textarea =
    $("report");


  textarea.focus();

  textarea.select();

  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  return document.execCommand(
    "copy"
  );
}


/* =========================================================
   복사 완료 표시
========================================================= */

function showCopied(){

  const button =
    $("copy");


  button.textContent =
    "복사 완료 ✓";


  setTimeout(
    () => {

      button.textContent =
        "전체 복사";

    },
    1300
  );

}


/* =========================================================
   전체 복사
========================================================= */

$("copy")
.onclick =
async () => {

  const text =
    $("report").value;


  if(!text){
    return;
  }


  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator
      .clipboard
      .writeText(
        text
      );


      showCopied();

      return;
    }


    if(
      fallbackCopy()
    ){

      showCopied();

      return;
    }


    throw new Error(
      "복사 기능 사용 불가"
    );


  }catch(error){

    try{

      if(
        fallbackCopy()
      ){

        showCopied();

        return;
      }

    }catch(copyError){

      console.warn(
        copyError
      );

    }


    alert(
      "자동 복사가 차단됐습니다. 문자보고 내용을 길게 눌러 복사해주세요."
    );

  }

};
