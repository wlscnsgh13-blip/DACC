<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">

<title>DACC 장비 가동현황</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f4f6fa;
  color:#172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:20px 16px 50px;
}

.brand{
  font-size:12px;
  font-weight:900;
  color:#4f6fe8;
  letter-spacing:1.5px;
}

.title{
  font-size:24px;
  font-weight:900;
  margin:4px 0;
}

.sub{
  font-size:13px;
  color:#8c96a9;
  margin-bottom:18px;
}

.card{
  background:#fff;
  border:1px solid #e5e9f2;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 20px rgba(26,39,70,.04);
}

.headrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.cardTitle{
  font-size:15px;
  font-weight:900;
}

.rank{
  display:flex;
  gap:5px;
}

.pill,
.shift{
  border:1px solid #dfe4ee;
  background:#fff;
  color:#7b8496;
  border-radius:10px;
  font-weight:800;
}

.pill{
  padding:6px 9px;
  font-size:12px;
}

.pill.active,
.shift.active{
  background:#edf1ff;
  border-color:#7189ef;
  color:#4562dc;
}

.shifts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.shift{
  height:44px;
}

.upload{
  margin-top:12px;
  border:0;
  background:#f8faff;
  border-radius:16px;
  padding:22px 12px;
  text-align:center;
  display:block;
}

.plus{
  width:42px;
  height:42px;
  margin:0 auto 8px;
  border-radius:50%;
  background:#edf1ff;
  color:#4f6fe8;
  display:grid;
  place-items:center;
  font-size:27px;
}

.upload b{
  font-size:15px;
}

.upload small{
  display:block;
  color:#9aa3b4;
  margin-top:4px;
}

.file{
  display:none;
}

.previews{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.preview{
  height:125px;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:#eef1f6;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.x{
  position:absolute;
  right:7px;
  top:7px;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:rgba(34,34,34,.8);
  color:white;
}

.tag{
  position:absolute;
  left:7px;
  bottom:7px;
  background:rgba(34,34,34,.8);
  color:#fff;
  border-radius:7px;
  padding:4px 7px;
  font-size:11px;
}

.primary{
  width:100%;
  height:50px;
  border:0;
  border-radius:14px;
  background:#4f6fe8;
  color:#fff;
  font-size:16px;
  font-weight:900;
  margin-top:12px;
}

.primary:disabled{
  background:#c5cbd8;
}

.progress{
  margin-top:12px;
  background:#f4f6fb;
  border-radius:12px;
  padding:12px;
  font-size:12px;
  color:#68738a;
}

.bar{
  height:7px;
  background:#e1e6f0;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.bar > div{
  height:100%;
  width:0;
  background:#4f6fe8;
  transition:.2s;
}

.row{
  display:grid;
  grid-template-columns:28px 1fr auto auto;
  gap:7px;
  align-items:center;
  min-height:48px;
  border-bottom:1px solid #eef1f5;
}

.ok{
  width:23px;
  height:23px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#e7f8ef;
  color:#20a764;
  font-weight:900;
}

.warn{
  background:#fff4df;
  color:#d38a11;
}

.eq{
  font-size:13px;
  font-weight:900;
}

.temp{
  font-size:13px;
  font-weight:800;
}

.state{
  font-size:11px;
  font-weight:900;
  padding:5px 7px;
  border-radius:7px;
  background:#f0f3f8;
  color:#68738a;
}

.state.warn{
  background:#fff4df;
  color:#c77e08;
}

.fold{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  background:#f0f2f6;
  color:#596274;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  margin-top:12px;
}

.excluded{
  background:#f8f9fb;
  border-radius:12px;
  margin-top:8px;
  overflow:hidden;
}

.exrow{
  padding:11px 13px;
  border-bottom:1px solid #e9edf3;
  font-size:12px;
  color:#737e92;
}

.hidden{
  display:none !important;
}

.empty{
  text-align:center;
  padding:25px 10px;
  color:#8c96a9;
  font-size:13px;
}

.report{
  width:100%;
  min-height:430px;
  border:1px solid #e1e6ef;
  background:#fbfcfe;
  border-radius:14px;
  padding:15px;
  font-size:13px;
  line-height:1.7;
  resize:vertical;
}
</style>
</head>

<body>

<main class="app">

<div class="brand">DACC</div>
<div class="title">장비 가동현황 작성</div>
<div class="sub">
사진 최대 2장을 추가하고 실제 사진을 분석합니다.
</div>


<section class="card">

<div class="headrow">

<div class="cardTitle">
근무 구분
</div>

<div class="rank">

<button class="pill" data-rank="대리">
대리
</button>

<button class="pill" data-rank="주임">
주임
</button>

<button class="pill active" data-rank="사원">
사원
</button>

</div>
</div>


<div class="shifts">

<button class="shift active" data-shift="주간">
주간근무
</button>

<button class="shift" data-shift="야간">
야간근무
</button>

</div>

</section>


<section class="card">

<div class="cardTitle">
사진 추가
</div>

<label class="upload" for="photos">

<div class="plus">+</div>

<b>사진 추가</b>

<small>
최대 2장까지 선택할 수 있습니다.
</small>

</label>


<input
class="file"
id="photos"
type="file"
accept="image/*"
multiple
>


<div
class="previews"
id="previews">
</div>


<button
class="primary"
id="analyze"
disabled>
분석하기
</button>


<div
class="progress hidden"
id="progress">

<span id="progressText">
OCR 준비중...
</span>

<div class="bar">
<div id="bar"></div>
</div>

</div>

</section>


<section
class="card hidden"
id="results">

<div class="headrow">

<div class="cardTitle">
분석 결과
</div>

<div
class="brand"
id="count">
</div>

</div>


<div id="rows"></div>


<button
class="fold"
id="fold">

<span id="foldText">
제외항목 0개
</span>

<span id="arrow">
▼
</span>

</button>


<div
class="excluded hidden"
id="excluded">
</div>


<button
class="primary"
id="makeReport">
보고서 생성
</button>

</section>


<section
class="card hidden"
id="reportCard">

<div
class="cardTitle"
style="margin-bottom:12px">

최종 보고서

</div>


<textarea
class="report"
id="report">
</textarea>


<button
class="primary"
id="copy">
전체 복사
</button>

</section>

</main>


<script>

let files = [];
let shift = "주간";
let rank = "사원";

let parsed = [];
let excluded = [];


const $ = id =>
document.getElementById(id);


/* =========================
   근무 선택
========================= */

document
.querySelectorAll("[data-shift]")
.forEach(button => {

button.onclick = () => {

shift = button.dataset.shift;

document
.querySelectorAll("[data-shift]")
.forEach(item => {

item.classList.toggle(
"active",
item === button
);

});

};

});


/* =========================
   직급 선택
========================= */

document
.querySelectorAll("[data-rank]")
.forEach(button => {

button.onclick = () => {

rank = button.dataset.rank;

document
.querySelectorAll("[data-rank]")
.forEach(item => {

item.classList.toggle(
"active",
item === button
);

});

if(
!$("reportCard")
.classList
.contains("hidden")
){
makeReport();
}

};

});


/* =========================
   사진 추가
========================= */

$("photos").onchange = event => {

for(
const file
of [...event.target.files]
){

if(files.length >= 2){
break;
}

const duplicate =
files.some(item =>
item.name === file.name &&
item.size === file.size
);

if(!duplicate){
files.push(file);
}

}

event.target.value = "";

renderPreviews();

};


function renderPreviews(){

$("previews").innerHTML = "";

files.forEach(
(file,index) => {

const url =
URL.createObjectURL(file);

const box =
document.createElement("div");

box.className =
"preview";


const image =
document.createElement("img");

image.src = url;


const tag =
document.createElement("span");

tag.className =
"tag";

tag.textContent =
`사진 ${index + 1}`;


const remove =
document.createElement("button");

remove.className =
"x";

remove.textContent =
"×";


remove.onclick = () => {

files.splice(
index,
1
);

renderPreviews();

};


box.appendChild(image);
box.appendChild(tag);
box.appendChild(remove);

$("previews")
.appendChild(box);

});


$("analyze").disabled =
files.length === 0;

}


/* =========================
   OCR 문자열 정리
========================= */

function normalize(text){

return text

.replace(/[|]/g,"I")

.replace(
/[‐-–—]/g,
"-"
)

.replace(
/\s+/g,
" "
)

.trim();

}


/* =========================
   장비명 판독
========================= */

function canonicalName(line){

const compact =
line
.toUpperCase()
.replace(/\s/g,"");


let match =
compact.match(
/(TG|GF|CF)([1-9])/
);

if(match){

return (
match[1] +
match[2]
);

}


match =
compact.match(
/HIP([123])/
);

if(match){

return (
"HIP" +
match[1]
);

}


if(
compact.includes("SMI")
){

return "SMI";

}


const koreanCompact =
line.replace(/\s/g,"");


if(
koreanCompact.includes(
"CF분위기로"
) ||
koreanCompact.includes(
"CF분위기"
)
){

return "CF분위기로";

}


return "";

}


/* =========================
   상태 판독
========================= */

function stateOf(
text,
name
){

const compact =
text.replace(/\s/g,"");


if(
compact.includes("승온")
){

return "승온중";

}


if(
compact.includes("유지")
){

return "유지중";

}


/*
가압은 HIP1~3만 허용
*/

if(
/^HIP[123]$/.test(name) &&
compact.includes("가압")
){

return "가압중";

}


if(
compact.includes("냉각")
){

return "냉각중";

}


return "";

}


/* =========================
   장비 번호 판독
========================= */

function numberOf(text){

const match =
text.match(
/#?\s*(\d{2})\s*-\s*(\d{1,3})/
);


if(!match){

return "";

}


return (
"#" +
match[1] +
"-" +
match[2]
);

}


/* =========================
   온도 판독
========================= */

function temperatureOf(
text,
name
){

let clean =
text.replace(
name,
" "
);


clean =
clean.replace(
/#?\s*\d{2}\s*-\s*\d{1,3}/g,
" "
);


const matches =
[
...clean.matchAll(
/(?<![\d-])(\d{1,4})(?:\s*(?:도|℃|°C|C))?/g
)
];


const numbers =
matches

.map(item =>
Number(item[1])
)

.filter(value =>
value >= 0 &&
value <= 2000
);


if(
numbers.length === 0
){

return null;

}


return numbers[0];

}


/* =========================
   OCR 결과 파싱
========================= */

function parseText(text){

const lines =
text

.split(/\n+/)

.map(normalize)

.filter(Boolean);


const result = [];


for(
let i = 0;
i < lines.length;
i++
){

const previous =
lines[i - 1] || "";

const current =
lines[i];

const next =
lines[i + 1] || "";


const around =
[
previous,
current,
next
].join(" ");


const name =
canonicalName(current) ||
canonicalName(around);


if(!name){
continue;
}


const temp =
temperatureOf(
current,
name
) ??
temperatureOf(
around,
name
);


const state =
stateOf(
around,
name
);


const number =
numberOf(
around
);


const unloading =
/언로딩\s*대기/.test(
around
);


let check = false;


/*
온도 또는 상태를
못 읽으면 확인 필요
*/

if(
temp === null ||
!state
){

check = true;

}


/*
CF / TG / GF는
승온 / 유지 / 냉각만 가능
*/

if(
/^(CF|TG|GF)\d$/.test(name)
){

if(
state &&
![
"승온중",
"유지중",
"냉각중"
].includes(state)
){

check = true;

}

}


/*
HIP는
승온 / 유지 / 가압 / 냉각
*/

if(
/^HIP[123]$/.test(name)
){

if(
state &&
![
"승온중",
"유지중",
"가압중",
"냉각중"
].includes(state)
){

check = true;

}

}


result.push({

name,
temp,
state,
number,

note:
unloading
?
"언로딩대기"
:
"",

check

});

}


/* =========================
   구형 / 신형 드라이챔버
========================= */

for(
let i = 0;
i < lines.length;
i++
){

const around =
[
lines[i - 1] || "",
lines[i],
lines[i + 1] || ""
].join(" ");


/*
구형
*/

if(
/구형\s*드라이\s*챔버/.test(
around
)
){

const numbers =
[
...around.matchAll(
/(\d{2,3})\s*(?:도|℃)?/g
)
]

.map(item =>
Number(item[1])
)

.filter(value =>
value <= 300
);


if(
numbers.length
){

result.push({

name:
"구형 드라이챔버",

temp:
numbers[0],

state:"",
number:"",
note:"",
check:false,
dry:true

});

}

}


/*
신형
*/

if(
/신형\s*드라이\s*챔버/.test(
around
)
){

const numbers =
[
...around.matchAll(
/(\d{2,3})\s*(?:도|℃)?/g
)
]

.map(item =>
Number(item[1])
)

.filter(value =>
value <= 300
);


if(
numbers.length
){

result.push({

name:
"신형 드라이챔버",

temp:
numbers[0],

state:"",
number:"",
note:"",
check:false,
dry:true

});

}

}

}


return result;

}


/* =========================
   중복 장비 제거
========================= */

function dedupe(items){

const map =
new Map();


for(
const item
of items
){

const old =
map.get(
item.name
);


if(!old){

map.set(
item.name,
item
);

continue;

}


/*
확실한 판독값 우선
*/

if(
old.check &&
!item.check
){

map.set(
item.name,
item
);

continue;

}


/*
장비번호/상태가 더 많이
읽힌 결과 우선
*/

const oldScore =
(old.number ? 1 : 0) +
(old.state ? 1 : 0);


const newScore =
(item.number ? 1 : 0) +
(item.state ? 1 : 0);


if(
newScore >
oldScore
){

map.set(
item.name,
item
);

}

}


return [
...map.values()
];

}


/* =========================
   제외 규칙
========================= */

function exclusion(item){

/*
드라이챔버는
이 규칙 적용 안 함
*/

if(item.dry){

return "";

}


/*
언로딩대기
*/

if(
item.note ===
"언로딩대기"
){

return "언로딩대기";

}


/*
HIP 냉각은
온도 관계없이 제외
*/

if(
/^HIP[123]$/.test(
item.name
) &&
item.state ===
"냉각중"
){

return "HIP 냉각";

}


/*
100도 이하 냉각 제외

100도 이하 승온/유지는
그대로 표시
*/

if(
item.temp !== null &&
item.temp <= 100 &&
item.state ===
"냉각중"
){

return "100도 이하 냉각";

}


return "";

}


/* =========================
   실제 사진 OCR
========================= */

$("analyze").onclick =
async () => {

$("progress")
.classList
.remove("hidden");


$("results")
.classList
.add("hidden");


$("reportCard")
.classList
.add("hidden");


$("analyze").disabled =
true;


$("bar").style.width =
"0%";


let all = [];


try{


const worker =
await Tesseract.createWorker(

"kor+eng",

1,

{

logger: message => {

if(
message.progress != null
){

const percent =
Math.round(
message.progress * 100
);


$("bar").style.width =
percent + "%";


$("progressText")
.textContent =
`${message.status || "분석중"} ${percent}%`;

}

}

});


for(
let i = 0;
i < files.length;
i++
){

$("progressText")
.textContent =
`사진 ${i + 1}/${files.length} 분석중`;


const result =
await worker.recognize(
files[i]
);


const found =
parseText(
result.data.text
);


all.push(
...found
);

}


await worker.terminate();


parsed =
dedupe(all);


excluded = [];


const shown = [];


for(
const item
of parsed
){

const reason =
exclusion(item);


if(reason){

excluded.push({

...item,
reason

});

}else{

shown.push(item);

}

}


renderResults(
shown
);


}catch(error){

console.error(error);


$("rows").innerHTML =

'<div class="empty">' +

'사진 분석에 실패했습니다.<br>' +

'인터넷 연결 후 다시 시도해주세요.' +

'</div>';


$("results")
.classList
.remove("hidden");


}finally{


$("progress")
.classList
.add("hidden");


$("analyze").disabled =
false;


}

};


/* =========================
   분석 결과 표시
========================= */

function renderResults(
shown
){

$("rows").innerHTML =
"";


if(
shown.length === 0
){

$("rows").innerHTML =

'<div class="empty">' +

'인식된 장비가 없습니다.' +

'</div>';

}


for(
const item
of shown
){

const row =
document.createElement(
"div"
);


row.className =
"row";


const status =
item.check
?
"확인 필요"
:
(item.state || "");


row.innerHTML =

`
<span class="ok ${item.check ? "warn" : ""}">
${item.check ? "!" : "✓"}
</span>

<span class="eq">
${item.number ? item.number + " " : ""}
${item.name}
</span>

<span class="temp">
${item.temp === null ? "-" : item.temp + "℃"}
</span>

<span class="state ${item.check ? "warn" : ""}">
${status}
</span>
`;


$("rows")
.appendChild(
row
);

}


$("count")
.textContent =
`${shown.length}개 표시`;


$("foldText")
.textContent =
`제외항목 ${excluded.length}개`;


if(
excluded.length === 0
){

$("excluded")
.innerHTML =

/* =========================
   날짜
========================= */

function dateText(){

const date =
new Date();


const weekdays = [

"일",
"월",
"화",
"수",
"목",
"금",
"토"

];


const month =
String(
date.getMonth() + 1
)
.padStart(
2,
"0"
);


const day =
String(
date.getDate()
)
.padStart(
2,
"0"
);


return (

`${month}월 ` +
`${day}일 ` +
`(${weekdays[date.getDay()]})`

);

}


/* =========================
   최종 보고서
========================= */

function makeReport(){

/*
확인 필요는
자동 보고서에서 제외.

사용자가 확인되지 않은
잘못된 숫자를 보고하는 것을
방지하기 위함.
*/

const usable =

parsed.filter(item =>

!exclusion(item) &&
!item.check

);


const dry =
usable.filter(
item => item.dry
);


const normal =
usable.filter(
item => !item.dry
);


const lines = [];


lines.push(

`${dateText()} ${shift}근무자`

);


lines.push(

`진춘호 ${rank}입니다.`

);


lines.push("");

lines.push(
'"장비가동현황"'
);


/*
일반 장비
*/

for(
const item
of normal
){

lines.push(

`${item.number ? item.number + " " : ""}` +

`${item.name} ` +

`${item.temp}도 ` +

`${item.state}`

);

}


/*
드라이챔버

사진에서 실제 온도가
읽힌 것만 출력
*/

if(
dry.length
){

lines.push("");


for(
const item
of dry
){

lines.push(

`${item.name} ` +
`${item.temp}도`

);

}

}


/*
이 아래 항목들은
사용자가 직접 수정할 수 있도록
최종 보고서 textarea에 생성
*/

lines.push("");

lines.push(
"-TG소각기-"
);

lines.push("");

lines.push(
'"장비 특이사항"'
);

lines.push("");

lines.push(
"-세정집진기 ON"
);

lines.push("");

lines.push(
'"순찰중 특이사항"'
);

lines.push(
"없음"
);

lines.push("");

lines.push(
"LPG기화기"
);

lines.push(
"이상없음"
);

lines.push("");


if(
shift === "주간"
){

lines.push(
'"금일 야간근무자"'
);

}else{

lines.push(
'"금일 주간근무자"'
);

}


lines.push("");

lines.push(
"이상입니다."
);


$("report").value =
lines.join("\n");


$("reportCard")
.classList
.remove("hidden");


$("reportCard")
.scrollIntoView({

behavior:"smooth",
block:"start"

});

}


$("makeReport")
.onclick =
makeReport;


/* =========================
   전체 복사
========================= */

$("copy").onclick =
async () => {

try{

await navigator
.clipboard
.writeText(
$("report").value
);


$("copy")
.textContent =
"복사 완료 ✓";


setTimeout(
() => {

$("copy")
.textContent =
"전체 복사";

},
1400
);


}catch(error){

$("report")
.select();


document
.execCommand(
"copy"
);

}

};

</script>

</body>
</html>
