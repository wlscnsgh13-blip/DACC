/* =========================================================

========================================================= */

const DACC_STATUS = {

  CONFIRMED:"confirmed",

  REVIEW:"review",

  EXCLUDED:"excluded"
};


/* =========================================================
   사진1 행번호 → 장비
========================================================= */

function getPatrolEquipmentByRow(
  rowNumber
) {

  if (
    rowNumber < 1 ||
    rowNumber >
    PATROL_ROW_ORDER.length
  ) {

    return null;
  }

  return (
    PATROL_ROW_ORDER[
      rowNumber - 1

  );
}


/* =========================================================
   사진2 행번호 → 장비
========================================================= */

function getNumberEquipmentByRow(

) {

  ) {

  }

  return (
    NUMBER_ROW_ORDER[
      rowNumber - 1
    ]
  );
}


/* =========================================================
   장비 → 사진1 행
========================================================= */

function getPatrolRow(
  equipment
) {

    EQUIPMENT_MAP[
      equipment
    ]?.patrolRow ??
    null
  );
}


/* =========================================================
   장비 → 사진2 행
========================================================= */

function getNumberRow(

  );

/* =========================================================
   번호 필수 여부
========================================================= */

function requiresNumber(
  equipment
) {

  return (
    REPORT_ORDER.includes(
      equipment
    )
    ||
    equipment ===
    "CF분위기로"
  );
}


/* =========================================================
   일반 교차검증 장비 여부
========================================================= */

function isMappedEquipment(
  equipment
) {

  return Boolean(
    EQUIPMENT_MAP[
      equipment
    ]
  );
}


/* =========================================================
   rows → 장비 객체
========================================================= */

function buildPatrolItemMap(
  rows
) {

  const items = {};

  for (
    let i = 0;
    i <
    PATROL_ROW_ORDER.length;
    i++
  ) {

    const equipment =
      PATROL_ROW_ORDER[i];

    const row =
      rows[i] || {};

    items[equipment] = {

      ...row,

      equipment,

      rowNumber:
        i + 1
    };
  }

  return items;
}


function buildNumberItemMap(
  rows
) {

  const items = {};

  for (
    let i = 0;
    i <
    NUMBER_ROW_ORDER.length;
    i++
  ) {

    const equipment =
      NUMBER_ROW_ORDER[i];

    const row =
      rows[i] || {};

    items[equipment] = {

      ...row,

      equipment,

      rowNumber:
        i + 1
    };
  }

  return items;
}


/* =========================================================
   교차검증 장비 Pair
========================================================= */

function daccGetMappedPair(
  equipment,
  patrolResult,
  numberResult
) {

  const map =
    EQUIPMENT_MAP[
      equipment
    ];


  if (!map) {

    return {

      equipment,

      patrol:null,

      number:null,

      patrolRow:null,

      numberRow:null
    };
  }


  return {

    equipment,

    patrol:
      patrolResult?.items?.[
        equipment
      ] || null,

    number:
      numberResult?.items?.[
        equipment
      ] || null,

    patrolRow:
      map.patrolRow,

    numberRow:
      map.numberRow
  };
}


/* =========================================================
   ★ 판정 결과 생성
========================================================= */

function daccDecision(
  status,
  equipment,
  reason,
  extra = {}
) {

  return {

    status,

    equipment,

    reason:
      reason || "",

    ...extra
  };
}


/* =========================================================
   ★ 일반장비 판정

   중요:
   OCR 실패는 excluded가 아니다.
   review로 보낸다.
========================================================= */

function daccJudgeGeneral(
  equipment,
  patrol,
  number
) {

  /*
    데이터 자체가 없음
    → 인식/분석 문제
  */

  if (!number) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "교대 업무일지 확인 필요"
    );
  }


  /*
    번호 OCR 실패
    → 실제 제외 금지
  */

  if (
    requiresNumber(equipment) &&
    !number.number
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "번호 확인 필요"
    );
  }


  /*
    가동 OCR 결과 자체가 불확실
  */

  if (
    number.running === null ||
    number.running === undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 확인 필요"
    );
  }


  /*
    명확하게 비가동으로 판정된 경우

    현재 PART 2에서는
    false를 함부로 만들지 않도록 변경 예정.
  */

  if (
    number.running === false
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비가동"
    );
  }


  if (!patrol) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "순찰일지 확인 필요"
    );
  }


  /*
    업무상 실제 제외조건 1
  */

  if (
    patrol.unload === true
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "언로딩대기"
    );
  }


  /*
    업무상 실제 제외조건 2
  */

  if (
    patrol.remarkCooling === true
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비고 냉각"
    );
  }


  /*
    온도 OCR 실패
  */

  if (
    patrol.temperature === null ||
    patrol.temperature === undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 확인 필요"
    );
  }


  /*
    상태 OCR 실패
  */

  if (!patrol.state) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "상태 확인 필요"
    );
  }


  /*
    업무상 실제 제외조건 3

    100도 이하 + 냉각중
  */

  if (
    patrol.temperature <= 100 &&
    patrol.state === "냉각중"
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "100도 이하 냉각"
    );
  }


  /*
    여기까지 통과 = 자동확정
  */

  return daccDecision(

    DACC_STATUS.CONFIRMED,

    equipment,

    "",

    {
      number:
        number.number,

      temperature:
        patrol.temperature,

      state:
        patrol.state
    }
  );
}


/* =========================================================
   ★ 일반장비 전체 병합

   결과를 3종류로 분리.
========================================================= */

function daccMergeGeneralEquipment(
  patrolResult,
  numberResult
) {

  const confirmed = [];

  const review = [];

  const excluded = [];


  for (
    const equipment
    of REPORT_ORDER
  ) {

    const pair =
      daccGetMappedPair(

        equipment,

        patrolResult,

        numberResult
      );


    const decision =
      daccJudgeGeneral(

        equipment,

        pair.patrol,

        pair.number
      );


    const item = {

      ...decision,

      patrolRow:
        pair.patrolRow,

      numberRow:
        pair.numberRow,

      patrol:
        pair.patrol,

      numberData:
        pair.number
    };


    if (
      decision.status ===
      DACC_STATUS.CONFIRMED
    ) {

      confirmed.push(item);

    } else if (
      decision.status ===
      DACC_STATUS.REVIEW
    ) {

      review.push(item);

    } else {

      excluded.push(item);
    }
  }


  return {

    confirmed,

    review,

    excluded
  };
}


/* =========================================================
   ★ 매핑 검증
========================================================= */

function verifyDACCMapping() {

  const errors = [];


  for (
    const [
      equipment,
      map
    ]
    of Object.entries(
      EQUIPMENT_MAP
    )
  ) {

    const patrolName =
      PATROL_ROW_ORDER[
        map.patrolRow - 1
      ];


    const numberName =
      NUMBER_ROW_ORDER[
        map.numberRow - 1
      ];


    if (
      patrolName !==
      equipment
    ) {

      errors.push(
        `${equipment}: 사진1 ${map.patrolRow}행=${patrolName}`
      );
    }


    if (
      numberName !==
      equipment
    ) {

      errors.push(
        `${equipment}: 사진2 ${map.numberRow}행=${numberName}`
      );
    }
  }


  /*
    중복 장비 확인
  */

  if (
    new Set(
      PATROL_ROW_ORDER
    ).size !==
    PATROL_ROW_ORDER.length
  ) {

    errors.push(
      "사진1 장비명 중복"
    );
  }


  if (
    new Set(
      NUMBER_ROW_ORDER
    ).size !==
    NUMBER_ROW_ORDER.length
  ) {

    errors.push(
      "사진2 장비명 중복"
    );
  }


  /*
    행 개수 확인
  */

  if (
    PATROL_ROW_ORDER.length !==
    35
  ) {

    errors.push(
      `사진1 행 개수 오류: ${PATROL_ROW_ORDER.length}`
    );
  }


  if (
    NUMBER_ROW_ORDER.length !==
    24
  ) {

    errors.push(
      `사진2 행 개수 오류: ${NUMBER_ROW_ORDER.length}`
    );
  }


  if (
    errors.length
  ) {

    console.error(
      "DACC 매핑 오류",
      errors
    );

    return false;
  }


  console.log(
    "DACC 장비 매핑 정상 ✓"
  );

  return true;
}

   시작 검증

/* =========================================================
   공통 상태
========================================================= */

let daccWorker = null;
let daccCvPromise = null;


/* =========================================================
   OpenCV 로드
========================================================= */

function loadDACCOpenCV() {

  if (
    window.cv &&
    typeof window.cv.Mat === "function"
  ) {
    return Promise.resolve();
  }

  if (daccCvPromise) {
    return daccCvPromise;
  }

  daccCvPromise =
    new Promise(
      (resolve, reject) => {

        const script =
          document.createElement(
            "script"
          );

        script.async = true;

        script.src =
          "https://docs.opencv.org/4.x/opencv.js";

        document.head.appendChild(
          script
        );


        const start =
          Date.now();


        const timer =
          setInterval(
            () => {

              if (
                window.cv &&
                typeof window.cv.Mat ===
                "function"
              ) {

                clearInterval(
                  timer
                );

                resolve();

                return;
              }


              if (
                Date.now() -
                start >
                30000
              ) {

                clearInterval(
                  timer
                );

                reject(
                  new Error(
                    "OpenCV 로딩 실패"
                  )
                );
              }

            },
            100
          );
      }
    );


  return daccCvPromise;
}


/* =========================================================
   Tesseract Worker
========================================================= */

async function getDACCWorker() {

  if (daccWorker) {
    return daccWorker;
  }


  daccWorker =
    await Tesseract.createWorker(
      "kor+eng",
      1
    );


  return daccWorker;
}


/* =========================================================
   이미지 → Canvas

   iPhone 메모리 폭주 방지.
========================================================= */

async function daccFileToCanvas(
  file,
  maxSide = 3000
) {

  const bitmap =
    await createImageBitmap(
      file
    );


  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        bitmap.width,
        bitmap.height
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        bitmap.width *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        bitmap.height *
        scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width = width;
  canvas.height = height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle = "#fff";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );


  if (
    typeof bitmap.close ===
    "function"
  ) {

    bitmap.close();
  }


  return canvas;
}


/* =========================================================
   안전 Crop
========================================================= */

function daccCrop(
  source,
  x,
  y,
  width,
  height
) {

  const sx =
    Math.max(
      0,
      Math.round(x)
    );


  const sy =
    Math.max(
      0,
      Math.round(y)
    );


  const sw =
    Math.max(
      1,
      Math.min(
        source.width - sx,
        Math.round(width)
      )
    );


  const sh =
    Math.max(
      1,
      Math.min(
        source.height - sy,
        Math.round(height)
      )
    );


  const output =
    document.createElement(
      "canvas"
    );

  output.width = sw;
  output.height = sh;


  const ctx =
    output.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle = "#fff";

  ctx.fillRect(
    0,
    0,
    sw,
    sh
  );


  ctx.drawImage(
    source,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    sw,
    sh
  );


  return output;
}


/* =========================================================
   Canvas 복사
========================================================= */

function daccCloneCanvas(
  source
) {

  const output =
    document.createElement(
      "canvas"
    );

  output.width =
    source.width;

  output.height =
    source.height;


  const ctx =
    output.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle = "#fff";

  );

/* =========================================================
   텍스트 정리
========================================================= */

function daccClean(
  value
) {

  return String(
    value || ""
  )
  .replace(/\r/g, "")
  .replace(/\s+/g, " ")
  .trim();
}


/* =========================================================
   OCR
========================================================= */

async function daccOCR(
  canvas,
  options = {}
) {

  const worker =
    await getDACCWorker();


  const result =
    await worker.recognize(
      canvas,
      options
    );


  return {

    text:
      daccClean(
        result.data?.text ||
        ""
      ),

    confidence:
      Number(
        result.data?.confidence ||
        0
      )
  };
}


/* =========================================================
   이미지 기본 보정
========================================================= */

function daccPrepareVariant(
  source,
  mode = "gray",
  scale = 4
) {

  const src =
    cv.imread(
      source
    );

  const gray =
    new cv.Mat();

  const resized =
    new cv.Mat();

  const outputMat =
    new cv.Mat();


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.resize(
      gray,
      resized,
      new cv.Size(
        Math.max(
          1,
          Math.round(
            source.width *
            scale
          )
        ),
        Math.max(
          1,
          Math.round(
            source.height *
            scale
          )
        )
      ),
      0,
      0,
      cv.INTER_CUBIC
    );


    if (
      mode === "otsu"
    ) {

      cv.threshold(
        resized,
        outputMat,
        0,
        255,
        cv.THRESH_BINARY +
        cv.THRESH_OTSU
      );

    } else if (
      mode === "adaptive"
    ) {

      cv.adaptiveThreshold(
        resized,
        outputMat,
        255,
        cv.ADAPTIVE_THRESH_GAUSSIAN_C,
        cv.THRESH_BINARY,
        31,
        9
      );

    } else {

      resized.copyTo(
        outputMat
      );
    }


    const output =
      document.createElement(
        "canvas"
      );

    output.width =
      outputMat.cols;

    output.height =
      outputMat.rows;


    cv.imshow(
      output,
      outputMat
    );


    return output;

  } finally {

    src.delete();
    gray.delete();
    resized.delete();
    outputMat.delete();
  }
}


/* =========================================================
   ★ 셀 표선 제거

   손글씨 숫자를 가로/세로 표선에서 분리.
========================================================= */

function daccRemoveCellLines(
  source
) {

  const src =
    cv.imread(
      source
    );

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const horizontal =
    new cv.Mat();

  const vertical =
    new cv.Mat();

  const lines =
    new cv.Mat();

  const cleaned =
    new cv.Mat();


  const horizontalKernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        Math.max(
          10,
          Math.round(
            source.width *
            .35
          )
        ),
        1
      )
    );


  const verticalKernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        1,
        Math.max(
          8,
          Math.round(
            source.height *
            .45
          )
        )
      )
    );


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,
      11
    );


    cv.morphologyEx(
      binary,
      horizontal,
      cv.MORPH_OPEN,
      horizontalKernel
    );


    cv.morphologyEx(
      binary,
      vertical,
      cv.MORPH_OPEN,
      verticalKernel
    );


    cv.bitwise_or(
      horizontal,
      vertical,
      lines
    );


    /*
      원본 gray에서
      검출된 표선 부분을 흰색으로 만든다.
    */

    gray.copyTo(
      cleaned
    );


    cleaned.setTo(
      new cv.Scalar(255),
      lines
    );


    const output =
      document.createElement(
        "canvas"
      );

    output.width =
      cleaned.cols;

    output.height =
      cleaned.rows;


    cv.imshow(
      output,
      cleaned
    );


    return output;

  } finally {

    src.delete();
    gray.delete();
    binary.delete();
    horizontal.delete();
    vertical.delete();
    lines.delete();
    cleaned.delete();

    horizontalKernel.delete();
    verticalKernel.delete();
  }
}


/* =========================================================
   가로선 검출
========================================================= */

function daccHorizontalLines(
  canvas
) {

  const src =
    cv.imread(
      canvas
    );

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const horizontal =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();


  const kernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        Math.max(
          30,
          Math.round(
            canvas.width *
            .15
          )
        ),
        1
      )
    );


  const result = [];


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,
      11
    );


    cv.morphologyEx(
      binary,
      horizontal,
      cv.MORPH_OPEN,
      kernel
    );


    cv.findContours(
      horizontal,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );


    for (
      let i = 0;
      i < contours.size();
      i++
    ) {

      const contour =
        contours.get(i);


      try {

        const rect =
          cv.boundingRect(
            contour
          );


        if (
          rect.width <
          canvas.width *
          .20
        ) {

          continue;
        }


        result.push(
          rect.y +
          rect.height / 2
        );

      } finally {

        contour.delete();
      }
    }

  } finally {

    src.delete();
    gray.delete();
    binary.delete();
    horizontal.delete();
    contours.delete();
    hierarchy.delete();
    kernel.delete();
  }


  result.sort(
    (a,b) =>
      a - b
  );


  /*
    같은 선 병합
  */

  const merged = [];


  for (
    const value
    of result
  ) {

    const y =
      Math.round(
        value
      );


    if (
      !merged.length
    ) {

      merged.push(y);

      continue;
    }


    const lastIndex =
      merged.length - 1;

    const last =
      merged[lastIndex];


    if (
      Math.abs(
        y - last
      ) <= 5
    ) {

      merged[lastIndex] =
        Math.round(
          (
            last +
            y
          ) / 2
        );

    } else {

      merged.push(y);
    }
  }


  return merged;
}


/* =========================================================
   세로선 검출
========================================================= */

function daccVerticalLines(
  canvas
) {

  const src =
    cv.imread(
      canvas
    );

  const gray =
    new cv.Mat();

  const binary =
    new cv.Mat();

  const vertical =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();


  const kernel =
    cv.getStructuringElement(
      cv.MORPH_RECT,
      new cv.Size(
        1,
        Math.max(
          30,
          Math.round(
            canvas.height *
            .08
          )
        )
      )
    );


  const result = [];


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.adaptiveThreshold(
      gray,
      binary,
      255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,
      11
    );


    cv.morphologyEx(

    );


    cv.findContours(

    );


    for (
      let i = 0;
      i < contours.size();
      i++
    ) {

      const contour =
        contours.get(i);


      try {

        const rect =
          cv.boundingRect(
            contour
          );


        if (
          rect.height <
          canvas.height *
          .06
        ) {

          continue;
        }


        result.push(
          rect.x +
          rect.width / 2
        );

      } finally {

        contour.delete();
      }
    }

  } finally {

    src.delete();
    gray.delete();
    binary.delete();
    vertical.delete();
    contours.delete();
    hierarchy.delete();
    kernel.delete();
  }


  result.sort(
    (a,b) =>
      a - b
  );


  const merged = [];


  for (
    const value
    of result
  ) {

    const x =
      Math.round(
        value
      );


    if (
      !merged.length
    ) {

      merged.push(x);

      continue;
    }


    const lastIndex =
      merged.length - 1;

    const last =
      merged[lastIndex];


    if (
      Math.abs(
        x - last
      ) <= 5
    ) {

      merged[lastIndex] =
        Math.round(
          (
            last +
            x
          ) / 2
        );

    } else {

      merged.push(x);
    }
  }


  return merged;
}


/* =========================================================
   중앙값
========================================================= */

function daccMedian(
  values
) {

  if (!values.length) {
    return 0;
  }


  const sorted =
    [...values].sort(
      (a,b) =>
        a - b
    );


  const middle =
    Math.floor(
      sorted.length / 2
    );


  if (
    sorted.length % 2
  ) {

    return sorted[
      middle
    ];
  }


  return (
    sorted[
      middle - 1
    ] +
    sorted[
      middle
    ]
  ) / 2;
}


/* =========================================================
   ★ 고정행 Grid 후보 찾기

   이전보다 엄격하게
   연속성 / 오차 / 실제선 비율을 함께 계산.
========================================================= */

function daccFindFixedGrid(
  lines,
  rowCount,
  imageHeight
) {

  if (
    !lines ||
    lines.length < 8
  ) {

    return null;
  }


  const gaps = [];


  for (
    let i = 1;
    i < lines.length;
    i++
  ) {

    const gap =
      lines[i] -
      lines[i - 1];


    if (
      gap >= 7 &&
      gap <=
      imageHeight *
      .06
    ) {

      gaps.push(
        gap
      );
    }
  }


  if (
    gaps.length < 6
  ) {

    return null;
  }


  /*
    큰 헤더 간격 제거.
  */

  const sortedGaps =
    [...gaps].sort(
      (a,b) =>
        a - b
    );


  const usefulGaps =
    sortedGaps.slice(
      0,
      Math.max(
        6,
        Math.ceil(
          sortedGaps.length *
          .75
        )
      )
    );


  const rowHeight =
    daccMedian(
      usefulGaps
    );


  if (
    !rowHeight ||
    rowHeight < 7
  ) {

    return null;
  }


  let best = null;


  for (
    const start
    of lines
  ) {

    const expectedEnd =
      start +
      rowHeight *
      rowCount;


    if (
      expectedEnd >
      imageHeight +
      rowHeight
    ) {

      continue;
    }


    const boundaries = [];

    let matches = 0;
    let error = 0;


    for (
      let row = 0;
      row <= rowCount;
      row++
    ) {

      const expected =
        start +
        rowHeight *
        row;


      let nearest = null;
      let nearestDistance =
        Infinity;


      for (
        const line
        of lines
      ) {

        const distance =
          Math.abs(
            line -
            expected
          );


        if (
          distance <
          nearestDistance
        ) {

          nearestDistance =
            distance;

          nearest = line;
        }
      }


      const tolerance =
        Math.max(
          4,
          rowHeight *
          .35
        );


      if (
        nearest !== null &&
        nearestDistance <=
        tolerance
      ) {

        boundaries.push(
          nearest
        );

        matches++;

        error +=
          nearestDistance;

      } else {

        boundaries.push(
          Math.round(
            expected
          )
        );

        error +=
          tolerance *
          1.5;
      }
    }


    /*
      경계가 뒤로 되돌아가는 상황 방지.
    */

    let valid = true;


    for (
      let i = 1;
      i < boundaries.length;
      i++
    ) {

      if (
        boundaries[i] <=
        boundaries[i - 1]
      ) {

        valid = false;

        break;
      }
    }


    if (!valid) {
      continue;
    }


    const matchRatio =
      matches /
      (
        rowCount + 1
      );


    const score =
      matchRatio *
      10000 -
      error;


    if (
      !best ||
      score >
      best.score
    ) {

      best = {

        boundaries,

        rowHeight,

        matches,

        matchRatio,

        score,

        top:
          boundaries[0],

        bottom:
          boundaries[
            boundaries.length -
            1
          ]
      };
    }
  }


  return best;
}


/* =========================================================
   ★ 표 좌우 경계 찾기

   기존처럼 사진 전체 폭을 바로 사용하지 않는다.

   Grid의 top~bottom 사이를 Crop한 뒤
   긴 세로선을 찾아 표 좌우를 잡는다.
========================================================= */

function daccFindTableXBounds(
  canvas,
  grid
) {

  const top =
    Math.max(
      0,
      Math.round(
        grid.top
      )
    );


  const bottom =
    Math.min(
      canvas.height,
      Math.round(
        grid.bottom
      )
    );


  const area =
    daccCrop(
      canvas,
      0,
      top,
      canvas.width,
      bottom - top
    );


  const verticalLines =
    daccVerticalLines(
      area
    );


  /*
    너무 가장자리의 카메라/종이 경계 제거.
  */

  const candidates =
    verticalLines.filter(
      x =>
        x >
        canvas.width *
        .02 &&
        x <
        canvas.width *
        .98
    );


  if (
    candidates.length >= 2
  ) {

    /*
      실제 표는 장비행 전체 높이를 관통하는
      가장 바깥쪽 세로선 사이에 존재한다고 본다.
    */

    const left =
      candidates[0];

    const right =
      candidates[
        candidates.length - 1
      ];


    if (
      right - left >
      canvas.width *
      .55
    ) {

      return {
        left,
        right,
        detected:true,
        verticalLines:candidates
      };
    }
  }


  /*
    검출 실패 fallback.

    전체 사진을 그대로 쓰는 것보다
    극단 가장자리만 제거.
  */

  return {

    left:
      canvas.width *
      .02,

    right:
      canvas.width *
      .98,

    detected:false,

    verticalLines:candidates
  };
}


/* =========================================================
   ★ Grid + 표 좌우를 기준으로 표 정규화

   행 영역만 새로운 Canvas로 만든다.

   이 순간부터 열 좌표는
   원본 사진이 아니라 "표" 기준이다.
========================================================= */

function daccNormalizeTable(
  canvas,
  grid,
  targetWidth = 1800
) {

  const bounds =
    daccFindTableXBounds(
      canvas,
      grid
    );


  const x =
    Math.max(
      0,
      Math.round(
        bounds.left
      )
    );


  const y =
    Math.max(
      0,
      Math.round(
        grid.top
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        bounds.right -
        bounds.left
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        grid.bottom -
        grid.top
      )
    );


  const cropped =
    daccCrop(
      canvas,
      x,
      y,
      width,
      height
    );


  /*
    가로 폭 정규화.
    세로 비율 유지.
  */

  const scale =
    targetWidth /
    cropped.width;


  const output =
    document.createElement(
      "canvas"
    );


  output.width =
    targetWidth;


  output.height =
    Math.max(
      1,
      Math.round(
        cropped.height *
        scale
      )
    );


  const ctx =
    output.getContext(
      "2d",
      {
        alpha:false
      }
    );


  ctx.fillStyle = "#fff";

  ctx.fillRect(
    0,
    0,
    output.width,
    output.height
  );


  ctx.imageSmoothingEnabled =
    true;


  ctx.drawImage(
    cropped,
    0,
    0,
    output.width,
    output.height
  );


  return {

    canvas:output,

    bounds,

    sourceWidth:
      width,

    sourceHeight:
      height
  };
}


/* =========================================================
   정규화된 표에서 행 Crop

   표 전체 높이를 rowCount로 나누는 fallback이 아니라
   원본 Grid 경계의 상대위치를 유지한다.
========================================================= */

function daccBuildNormalizedBoundaries(
  grid,
  normalizedHeight
) {

  const sourceHeight =
    grid.bottom -
    grid.top;


  return grid.boundaries.map(
    value => {

      const ratio =
        (
          value -
          grid.top
        ) /
        sourceHeight;


      return Math.round(
        ratio *
        normalizedHeight
      );
    }
  );
}


/* =========================================================
   정규화된 표의 셀 Crop
========================================================= */

function daccCropNormalizedCell(
  tableCanvas,
  boundaries,
  rowNumber,
  column
) {

  const index =
    rowNumber - 1;


  const top =
    boundaries[
      index
    ];


  const bottom =
    boundaries[
      index + 1
    ];


  if (
    top === undefined ||
    bottom === undefined
  ) {

    return null;
  }


  const rowHeight =
    bottom - top;


  const left =
    tableCanvas.width *
    column.left;


  const right =
    tableCanvas.width *
    column.right;


  /*
    셀 경계선 자체를 최대한 피한다.
  */

  const padX =
    Math.max(
      2,
      (
        right -
        left
      ) *
      .035
    );


  const padY =
    Math.max(
      1,
      rowHeight *
      .08
    );


  return daccCrop(

    tableCanvas,

    left + padX,

    top + padY,

    (
      right -
      left
    ) -
    padX * 2,

    rowHeight -
    padY * 2
  );
}


/* =========================================================
   번호 정리
========================================================= */

function daccParseNumber(
  value
) {

  let text =
    String(
      value || ""
    )
    .toUpperCase()
    .replace(/[Oo]/g, "0")
    .replace(/[Il|!]/g, "1")
    .replace(
      /[‐-‒–—―_~.·]/g,
      "-"
    )
    .replace(/\s+/g, "")
    .replace(
      /[^0-9#-]/g,
      ""
    );


  let match =
    text.match(
      /#?26-(\d{1,3})/
    );


  if (match) {

    return (
      "#26-" +
      match[1]
    );
  }


  match =
    text.match(
      /#?26(\d{1,3})$/
    );


  if (match) {

    return (
      "#26-" +
      match[1]
    );
  }


  /*
    OCR이 26-를 날리고
    뒤 번호만 읽은 경우.

    1~3자리만 허용.
  */

  match =
    text.match(
      /^#?(\d{1,3})$/
    );


  if (match) {

    const suffix =
      match[1];


    /*
      26 자체만 읽은 경우는
      suffix로 인정하지 않음.
    */

    if (
      suffix !== "26"
    ) {

      return (
        "#26-" +
        suffix
      );
    }
  }


  return "";
}


/* =========================================================
   번호 후보 투표
========================================================= */

function daccVoteNumber(
  attempts
) {

  const votes = {};


  for (
    const item
    of attempts
  ) {

    if (!item.number) {
      continue;
    }


    if (
      !votes[
        item.number
      ]
    ) {

      votes[
        item.number
      ] = {

        count:0,

        confidence:0
      };
    }


    votes[
      item.number
    ].count++;


    votes[
      item.number
    ].confidence =
      Math.max(

        votes[
          item.number
        ].confidence,

        Number(
          item.confidence ||
          0
        )
      );
  }


  const sorted =
    Object.entries(
      votes
    )
    .sort(
      (a,b) => {

        if (
          b[1].count !==
          a[1].count
        ) {

          return (
            b[1].count -
            a[1].count
          );
        }


        return (
          b[1].confidence -
          a[1].confidence
        );
      }
    );


  if (!sorted.length) {

    return {
      number:"",
      voteCount:0,
      confidence:0,
      ambiguous:true
    };
  }


  const winner =
    sorted[0];


  const second =
    sorted[1];


  const ambiguous =
    Boolean(
      second &&
      second[1].count ===
      winner[1].count &&
      second[1].confidence >
      winner[1].confidence -
      8
    );


  return {

    number:
      winner[0],

    voteCount:
      winner[1].count,

    confidence:
      winner[1].confidence,

    ambiguous
  };
}


/* =========================================================
   ★ 번호 OCR

   1. 셀 전체
   2. 표선 제거
   3. Gray
   4. OTSU
   5. Adaptive

   전부 모아서 투표.
========================================================= */

async function daccReadNumber(
  source
) {

  if (!source) {

    return {
      number:"",
      attempts:[],
      ambiguous:true
    };
  }


  const cleaned =
    daccRemoveCellLines(
      source
    );


  const variants = [

    {
      name:"gray",
      canvas:
        daccPrepareVariant(
          cleaned,
          "gray",
          5
        )
    },

    {
      name:"otsu",
      canvas:
        daccPrepareVariant(
          cleaned,
          "otsu",
          5
        )
    },

    {
      name:"adaptive",
      canvas:
        daccPrepareVariant(
          cleaned,
          "adaptive",
          5
        )
    }
  ];


  const attempts = [];


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant.canvas,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE,

          tessedit_char_whitelist:
            "0123456789-#"
        }
      );


    attempts.push({

      mode:
        variant.name,

      text:
        result.text,

      confidence:
        result.confidence,

      number:
        daccParseNumber(
          result.text
        )
    });
  }


  const vote =
    daccVoteNumber(
      attempts
    );


  return {

    ...vote,

    attempts
  };
}


/* =========================================================
   가동 텍스트 정리
========================================================= */

function daccParseRunningText(
  value
) {

  return String(
    value || ""
  )
  .replace(/\s+/g, "")
  .replace(/[|Il1]/g, "");
}


/* =========================================================
   ★ 가동 판독

   true = 가동 확인
   null = 판독 실패

   OCR이 못 읽었다고 false 만들지 않는다.
========================================================= */

async function daccReadRunning(
  source
) {

  if (!source) {

    return {
      running:null,
      attempts:[]
    };
  }


  const cleaned =
    daccRemoveCellLines(
      source
    );


  const variants = [

    {
      name:"gray",
      canvas:
        daccPrepareVariant(
          cleaned,
          "gray",
          4
        )
    },

    {
      name:"otsu",
      canvas:
        daccPrepareVariant(
          cleaned,
          "otsu",
          4
        )
    },

    {
      name:"adaptive",
      canvas:
        daccPrepareVariant(
          cleaned,
          "adaptive",
          4
        )
    }
  ];


  const attempts = [];


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant.canvas,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE
        }
      );


    const normalized =
      daccParseRunningText(
        result.text
      );


    const running =
      normalized.includes(
        "가동"
      );


    attempts.push({

      mode:
        variant.name,

      text:
        result.text,

      confidence:
        result.confidence,

      running
    });


    if (running) {

      return {

        running:true,

        attempts
      };
    }
  }


  /*
    중요한 변경.

    "가동"을 못 찾음
    ≠ 비가동.

    판독불가 null.
  */

  return {

    running:null,

    attempts
  };
}


/* =========================================================
   온도 파싱
========================================================= */

function daccParseTemperature(
  value
) {

  const text =
    String(
      value || ""
    )
    .replace(/[Oo]/g, "0")
    .replace(/[Il|!]/g, "1");


  const matches =
    text.match(
      /\d{2,4}/g
    );


  if (!matches) {

    return null;
  }


  for (
    const candidate
    of matches
  ) {

    const number =
      Number(
        candidate
      );


    /*
      너무 넓은 10~1800에서
      최소한의 노이즈를 줄인다.

      실제 장비별 세부 범위는
      업무값을 임의로 만들지 않고
      여기서는 보수적으로 유지.
    */

    if (
      Number.isFinite(
        number
      ) &&
      number >= 20 &&
      number <= 1800
    ) {

      return number;
    }
  }


  return null;
}


/* =========================================================
   온도 투표
========================================================= */

function daccVoteTemperature(
  attempts
) {

  const votes = {};


  for (
    const item
    of attempts
  ) {

    if (
      item.temperature ===
      null
    ) {

      continue;
    }


    const key =
      String(
        item.temperature
      );


    if (!votes[key]) {

      votes[key] = {

        count:0,

        confidence:0
      };
    }


    votes[key].count++;


    votes[key].confidence =
      Math.max(

        votes[key].confidence,

        Number(
          item.confidence ||
          0
        )
      );
  }


  const sorted =
    Object.entries(
      votes
    )
    .sort(
      (a,b) => {

        if (
          b[1].count !==
          a[1].count
        ) {

          return (
            b[1].count -
            a[1].count
          );
        }


        return (
          b[1].confidence -
          a[1].confidence
        );
      }
    );


  if (!sorted.length) {

    return {

      temperature:null,

      voteCount:0,

      confidence:0,

      ambiguous:true
    };
  }


  const winner =
    sorted[0];

  const second =
    sorted[1];


  /*
    서로 다른 값이 1표씩이고
    신뢰도도 비슷하면
    자동확정하지 않는다.
  */

  const ambiguous =
    Boolean(

      second &&

      winner[1].count ===
      second[1].count &&

      Math.abs(
        winner[1].confidence -
        second[1].confidence
      ) < 10
    );


  return {

    temperature:
      Number(
        winner[0]
      ),

    voteCount:
      winner[1].count,

    confidence:
      winner[1].confidence,

    ambiguous
  };
}


/* =========================================================
   ★ 온도 OCR

   기존처럼 첫 성공값을 바로 확정하지 않는다.
========================================================= */

async function daccReadTemperature(
  source
) {

  if (!source) {

    return {

      temperature:null,

      attempts:[],

      ambiguous:true
    };
  }


  const cleaned =
    daccRemoveCellLines(
      source
    );


  const variants = [

    {
      name:"gray",
      canvas:
        daccPrepareVariant(
          cleaned,
          "gray",
          5
        )
    },

    {
      name:"otsu",
      canvas:
        daccPrepareVariant(
          cleaned,
          "otsu",
          5
        )
    },

    {
      name:"adaptive",
      canvas:
        daccPrepareVariant(
          cleaned,
          "adaptive",
          5
        )
    }
  ];


  const attempts = [];


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant.canvas,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE,

          tessedit_char_whitelist:
            "0123456789"
        }
      );


    attempts.push({

      mode:
        variant.name,

      text:
        result.text,

      confidence:
        result.confidence,

      temperature:
        daccParseTemperature(
          result.text
        )
    });
  }


  const vote =
    daccVoteTemperature(
      attempts
    );


  /*
    한 번만 읽혔고 신뢰도도 낮으면
    자동값으로 사용하지 않는다.
  */

  if (
    vote.voteCount === 1 &&
    vote.confidence < 45
  ) {

    return {

      ...vote,

      temperature:null,

      ambiguous:true,

      attempts
    };
  }


  if (
    vote.ambiguous
  ) {

    return {

      ...vote,

      temperature:null,

      attempts
    };
  }


  return {

    ...vote,

    attempts
  };
}


/* =========================================================
   상태 파싱
========================================================= */

function daccParseState(
  value
) {

  const text =
    String(
      value || ""
    )
    .replace(/\s+/g, "");


  if (
    text.includes("승온")
  ) {

    return "승온중";
  }


  if (
    text.includes("유지")
  ) {

    return "유지중";
  }


  if (
    text.includes("냉각")
  ) {

    return "냉각중";
  }


  return "";
}


/* =========================================================
   상태 OCR
========================================================= */

async function daccReadState(
  source
) {

  if (!source) {

    return {
      state:"",
      attempts:[]
    };
  }


  const cleaned =
    daccRemoveCellLines(
      source
    );


  const variants = [

    {
      name:"gray",
      canvas:
        daccPrepareVariant(
          cleaned,
          "gray",
          4
        )
    },

    {
      name:"otsu",
      canvas:
        daccPrepareVariant(
          cleaned,
          "otsu",
          4
        )
    },

    {
      name:"adaptive",
      canvas:
        daccPrepareVariant(
          cleaned,
          "adaptive",
          4
        )
    }
  ];


  const attempts = [];


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant.canvas,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE
        }
      );


    const state =
      daccParseState(

      );


    attempts.push({

    });

  };
}


/* =========================================================
   비고 파싱
========================================================= */

function daccParseRemark(
  value
) {

  const text =
    String(
      value || ""
    )
    .replace(/\s+/g, "");


  return {

    raw:text,

    cooling:
      text.includes(
        "냉각"
      ),

    unload:
      text.includes(
        "언로딩대기"
      )
      ||
      (
        text.includes(
          "언로딩"
        )
        &&
        text.includes(
          "대기"
        )
      )
  };
}


/* =========================================================
   비고 OCR
========================================================= */

async function daccReadRemark(
  source
) {

  if (!source) {

    return {

      raw:"",

      cooling:false,

      unload:false,

      attempts:[]
    };
  }


  const cleaned =
    daccRemoveCellLines(
      source
    );


  const variants = [

    {
      name:"gray",
      canvas:
        daccPrepareVariant(
          cleaned,
          "gray",
          3
        )
    },

    {
      name:"otsu",
      canvas:
        daccPrepareVariant(
          cleaned,
          "otsu",
          3
        )
    }
  ];


  const attempts = [];


  let cooling = false;
  let unload = false;


  for (
    const variant
    of variants
  ) {

    const result =
      await daccOCR(
        variant.canvas,
        {
          tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE
        }
      );


    const parsed =
      daccParseRemark(
        result.text
      );


    attempts.push({

      mode:
        variant.name,

      text:
        result.text,

      confidence:
        result.confidence,

      ...parsed
    });


    if (
      parsed.cooling
    ) {

      cooling = true;
    }


    if (
      parsed.unload
    ) {

      unload = true;
    }
  }


  return {

    raw:
      attempts
      .map(
        item =>
          item.text
      )
      .join(" / "),

    cooling,

    unload,

    attempts
  };
}


/* =========================================================
   ★ 사진2 표 기준 열

   이제 사진 전체 폭이 아니라
   "검출된 표" 기준 비율.

   가동여부 열을 약간 넉넉하게 잡는다.
========================================================= */

const NUMBER_TABLE_COLUMN = {

  left:0.105,

  right:0.255
};


/* =========================================================
   사진2 셀 전체에서 먼저 OCR

   기존처럼 처음부터 위/아래를 잘라버리지 않는다.
========================================================= */

async function daccReadNumberRunningCell(
  cell,
  equipment
) {

  /*
    드라이챔버는 번호가 없음.
  */

  const numberRequired =
    equipment !==
    "드라이챔버"
    &&
    equipment !==
    "신형드라이챔버";


  let numberResult = {

    number:"",

    attempts:[],

    ambiguous:false
  };


  /*
    1차:
    셀 전체에서 번호 읽기.
  */

  if (
    numberRequired
  ) {

    numberResult =
      await daccReadNumber(
        cell
      );
  }


  /*
    1차:
    셀 전체에서 가동 읽기.
  */

  let runningResult =
    await daccReadRunning(
      cell
    );


  /*
    2차 fallback.

    번호가 실패하면 위쪽을 다시 읽는다.
  */

  if (
    numberRequired &&
    !numberResult.number
  ) {

    const upper =
      daccCrop(

        cell,

        0,

        0,

        cell.width,

        cell.height *
        .68
      );


    const retry =
      await daccReadNumber(
        upper
      );


    if (
      retry.number
    ) {

      numberResult =
        retry;
    }
  }


  /*
    가동 실패 시
    아래쪽만 다시 OCR.
  */

  if (
    runningResult.running !==
    true
  ) {

    const lower =
      daccCrop(

        cell,

        0,

        cell.height *
        .30,

        cell.width,

        cell.height *
        .70
      );


    const retry =
      await daccReadRunning(
        lower
      );


    if (
      retry.running ===
      true
    ) {

      runningResult =
        retry;
    }
  }


  return {

    number:
      numberResult.number,

    numberAmbiguous:
      Boolean(
        numberResult.ambiguous
      ),

    running:
      runningResult.running,

    numberAttempts:
      numberResult.attempts ||
      [],

    runningAttempts:
      runningResult.attempts ||
      []
  };
}


/* =========================================================
   ★ 사진2 분석
========================================================= */

async function daccAnalyzeNumberPhoto(
  file,
  onProgress = null
) {

  const original =
    await daccFileToCanvas(
      file,
      3000
    );


  /*
    1. 원본 가로선 검출
  */

  const lines =
    daccHorizontalLines(
      original
    );


  /*
    2. 24행 장비표 찾기
  */

  const grid =
    daccFindFixedGrid(
      lines,
      24,
      original.height
    );


  if (!grid) {

    throw new Error(
      "교대 업무일지 24행 표 인식 실패"
    );
  }


  /*
    3. 표 좌우 검출 + 정규화
  */

  const normalized =
    daccNormalizeTable(
      original,
      grid,
      1800
    );


  const table =
    normalized.canvas;


  /*
    4. 원래 행 경계를
       정규화된 표 높이로 변환.
  */

  const boundaries =
    daccBuildNormalizedBoundaries(
      grid,
      table.height
    );


  const rows = [];


  for (
    let rowNumber = 1;
    rowNumber <= 24;
    rowNumber++
  ) {

    const equipment =
      getNumberEquipmentByRow(
        rowNumber
      );


    if (onProgress) {

      onProgress(
        equipment,
        rowNumber,
        24
      );
    }


    const cell =
      daccCropNormalizedCell(

        table,

        boundaries,

        rowNumber,

        NUMBER_TABLE_COLUMN
      );


    const result =
      await daccReadNumberRunningCell(
        cell,
        equipment
      );


    rows.push({

      equipment,

      rowNumber,

      number:
        result.number,

      numberAmbiguous:
        result.numberAmbiguous,

      running:
        result.running,

      numberAttempts:
        result.numberAttempts,

      runningAttempts:
        result.runningAttempts
    });
  }


  return {

    rows,

    items:
      buildNumberItemMap(
        rows
      ),

    lineCount:
      lines.length,

    matchedLines:
      grid.matches,

    matchRatio:
      grid.matchRatio,

    rowHeight:
      grid.rowHeight,

    tableDetected:
      normalized.bounds.detected,

    tableBounds:
      normalized.bounds
  };
}


/* =========================================================
   ★ 사진1 표 기준 열

   기존과 비슷한 비율이지만
   이제 원본 사진 기준이 아니라
   검출된 "표" 기준이다.
========================================================= */

const PATROL_TABLE_COLUMNS = {

  temperature: {
    left:0.365,
    right:0.485
  },

  state: {
    left:0.735,
    right:0.875
  },

  remark: {
    left:0.855,
    right:0.995
  }
};


/* =========================================================
   사진1 한 행 분석
========================================================= */

async function daccReadPatrolRow(
  table,
  boundaries,
  rowNumber,
  equipment
) {

  /*
    온도
  */

  const temperatureCell =
    daccCropNormalizedCell(

      table,

      boundaries,

      rowNumber,

      PATROL_TABLE_COLUMNS
        .temperature
    );


  const temperatureResult =
    await daccReadTemperature(
      temperatureCell
    );


  /*
    소각기
    = 온도만 필요
  */

  if (
    INCINERATOR_EQUIPMENT
      .includes(
        equipment
      )
  ) {

    return {

      equipment,

      rowNumber,

      temperature:
        temperatureResult
          .temperature,

      temperatureAmbiguous:
        Boolean(
          temperatureResult
            .ambiguous
        ),

      state:"",

      remarkCooling:false,

      unload:false,

      temperatureAttempts:
        temperatureResult
          .attempts ||
        []
    };
  }


  /*
    일반 드라이챔버
    = 온도만 필요
  */

  if (
    DRY_EQUIPMENT.includes(
      equipment
    )
  ) {

    return {

      equipment,

      rowNumber,

      temperature:
        temperatureResult
          .temperature,

      temperatureAmbiguous:
        Boolean(
          temperatureResult
            .ambiguous
        ),

      state:"",

      remarkCooling:false,

      unload:false,

      temperatureAttempts:
        temperatureResult
          .attempts ||
        []
    };
  }


  /*
    상태
  */

  const stateCell =
    daccCropNormalizedCell(

      table,

      boundaries,

      rowNumber,

      PATROL_TABLE_COLUMNS
        .state
    );


  /*
    비고
  */

  const remarkCell =
    daccCropNormalizedCell(

      table,

      boundaries,

      rowNumber,

      PATROL_TABLE_COLUMNS
        .remark
    );


  const stateResult =
    await daccReadState(
      stateCell
    );


  const remarkResult =
    await daccReadRemark(
      remarkCell
    );


  return {

    equipment,

    rowNumber,

    temperature:
      temperatureResult
        .temperature,

    temperatureAmbiguous:
      Boolean(
        temperatureResult
          .ambiguous
      ),

    state:
      stateResult.state,

    remarkCooling:
      remarkResult.cooling,

    unload:
      remarkResult.unload,

    temperatureAttempts:
      temperatureResult
        .attempts ||
      [],

    stateAttempts:
      stateResult
        .attempts ||
      [],

    remarkAttempts:
      remarkResult
        .attempts ||
      []
  };
}


/* =========================================================

async function daccAnalyzePatrolPhoto(

    normalized.canvas;


  /*
    4. 행 경계 변환
  */

  const boundaries =
    daccBuildNormalizedBoundaries(
      grid,
      table.height
    );


  const rows = [];


  for (
    let rowNumber = 1;
    rowNumber <= 35;
    rowNumber++
  ) {

    const equipment =
      getPatrolEquipmentByRow(
        rowNumber
      );


    /*
      사용자가 제외한 장비는
      OCR 자체를 하지 않는다.
    */

    if (
      PATROL_ALWAYS_SKIP
        .includes(
          equipment
        )
    ) {

      rows.push({

        equipment,

        rowNumber,

        skipped:true,

        temperature:null,

        temperatureAmbiguous:false,

        state:"",

        remarkCooling:false,

        unload:false
      });


      continue;
    }


    /*
      안전장치.
    */

    if (
      !PATROL_OCR_EQUIPMENT
        .includes(
          equipment
        )
    ) {

      rows.push({

        equipment,

        rowNumber,

        skipped:true,

        temperature:null,

        temperatureAmbiguous:false,

        state:"",

        remarkCooling:false,

        unload:false
      });


      continue;
    }


    if (onProgress) {

      onProgress(
        equipment,
        rowNumber,
        35
      );
    }


    const result =
      await daccReadPatrolRow(

        table,

        boundaries,

        rowNumber,

        equipment
      );


    rows.push(
      result
    );
  }


  return {

    rows,

    items:
      buildPatrolItemMap(
        rows
      ),

    lineCount:
      lines.length,

    matchedLines:
      grid.matches,

    matchRatio:
      grid.matchRatio,

    rowHeight:
      grid.rowHeight,

    tableDetected:
      normalized.bounds.detected,

    tableBounds:
      normalized.bounds
  };
}


/* =========================================================
   ★ PART 1 판정 보강

   ambiguous 값도 자동확정 금지.
========================================================= */

function daccJudgeGeneral(
  equipment,
  patrol,
  number
) {

  if (!number) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "교대 업무일지 확인 필요"
    );
  }


  /*
    번호가 애매함
  */

  if (
    requiresNumber(
      equipment
    ) &&
    (
      !number.number ||
      number.numberAmbiguous
    )
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "번호 확인 필요"
    );
  }


  /*
    가동을 못 읽은 상태.

    false가 아니라 null.
  */

  if (
    number.running ===
    null ||
    number.running ===
    undefined
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "가동 여부 확인 필요"
    );
  }


  if (
    number.running ===
    false
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비가동"
    );
  }


  if (!patrol) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "순찰일지 확인 필요"
    );
  }


  /*
    실제 업무 제외조건
  */

  if (
    patrol.unload === true
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "언로딩대기"
    );
  }


  if (
    patrol.remarkCooling ===
    true
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "비고 냉각"
    );
  }


  /*
    온도 불확실
  */

  if (
    patrol.temperature ===
    null ||
    patrol.temperature ===
    undefined ||
    patrol.temperatureAmbiguous
  ) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "온도 확인 필요"
    );
  }


  /*
    상태 불확실
  */

  if (!patrol.state) {

    return daccDecision(

      DACC_STATUS.REVIEW,

      equipment,

      "상태 확인 필요"
    );
  }


  /*
    실제 제외
  */

  if (
    patrol.temperature <=
    100 &&
    patrol.state ===
    "냉각중"
  ) {

    return daccDecision(

      DACC_STATUS.EXCLUDED,

      equipment,

      "100도 이하 냉각"
    );
  }


  /*
    자동 확정
  */

  return daccDecision(

    DACC_STATUS.CONFIRMED,

    equipment,

    "",

    {
      number:
        number.number,

      temperature:
        patrol.temperature,

      state:
        patrol.state
    }
  );
}

/* =========================================================
   일반 장비 병합

   REPORT_ORDER에 있는 장비만.
========================================================= */

function daccMergeGeneral(
  patrolResult,
  numberResult
) {

  const decisions = [];


  for (
    const equipment
    of REPORT_ORDER
  ) {

    const patrol =
      patrolResult.items?.[
        equipment
      ];


    const number =
      numberResult.items?.[
        equipment
      ];


    decisions.push(

      daccJudgeGeneral(
        equipment,
        patrol,
        number
      )
    );
  }


  return decisions;
}


/* =========================================================
   전체 판정

   자동확정
   확인필요
   실제제외

   세 그룹으로 완전히 분리.
========================================================= */

function daccMergeAll(
  patrolResult,
  numberResult
) {

  const decisions = [];


  /*
    일반 장비
  */

  decisions.push(
    ...daccMergeGeneral(
      patrolResult,
      numberResult
    )
  );


  /*
    CF분위기로
  */

  decisions.push(

    daccJudgeCFFurnace(
      patrolResult,
      numberResult
    )
  );


  /*
    TG1
  */

  decisions.push(

    daccJudgeTG1(
      numberResult
    )
  );


  /*
    드라이챔버
  */

  decisions.push(

    daccJudgeDry(
      "드라이챔버",
      patrolResult,
      numberResult
    )
  );


  decisions.push(

    daccJudgeDry(
      "신형드라이챔버",
      patrolResult,
      numberResult
    )
  );


  /*
    소각기
  */

  for (
    const equipment
    of INCINERATOR_EQUIPMENT
  ) {

    decisions.push(

      daccJudgeIncinerator(
        equipment,
        patrolResult
      )
    );
  }


  const confirmed =
    decisions.filter(
      item =>
        item.status ===
        DACC_STATUS.CONFIRMED
    );


  const review =
    decisions.filter(
      item =>
        item.status ===
        DACC_STATUS.REVIEW
    );


  const excluded =
    decisions.filter(
      item =>
        item.status ===
        DACC_STATUS.EXCLUDED
    );


  return {

    decisions,

    confirmed,

    review,

    excluded
  };
}

/* =========================================================
   사진2 통계
========================================================= */

function daccCountNumberResult(
  numberResult
) {

  let numberCount = 0;
  let runningCount = 0;
  let runningUnknown = 0;


  for (
    const item
    of Object.values(
      numberResult.items ||
      {}
    )
  ) {

    if (
      item.number
    ) {

      numberCount++;
    }


    if (
      item.running ===
      true
    ) {

      runningCount++;
    }


    if (
      item.running ===
      null ||
      item.running ===
      undefined
    ) {

      runningUnknown++;
    }
  }


  return {

    numberCount,

    runningCount,

    runningUnknown
  };
}


/* =========================================================
   사진1 통계
========================================================= */

function daccCountPatrolResult(
  patrolResult
) {

  let temperatureCount = 0;
  let stateCount = 0;


  for (
    const item
    of Object.values(
      patrolResult.items ||
      {}
    )
  ) {

    if (
      item.temperature !==
      null &&
      item.temperature !==
      undefined
    ) {

      temperatureCount++;
    }


    if (
      item.state
    ) {

      stateCount++;
    }
  }


  return {

    temperatureCount,

    stateCount
  };
}


/* =========================================================
   ★ 전체 검증

   OCR 일부 실패는 치명적 실패 아님.

   표 자체를 못 잡았거나
   모든 핵심값이 0인 경우만 fatal.
========================================================= */

function daccValidate(
  patrolResult,
  numberResult
) {

  const problems = [];


  const patrolCount =
    daccCountPatrolResult(
      patrolResult
    );


  const numberCount =
    daccCountNumberResult(
      numberResult
    );


  /*
    사진1 표 자체 문제
  */

  if (
    !patrolResult.matchRatio ||
    patrolResult.matchRatio <
    0.45
  ) {

    problems.push(
      "순찰일지 표 위치 확인 필요"
    );
  }


  /*
    사진2 표 자체 문제
  */

  if (
    !numberResult.matchRatio ||
    numberResult.matchRatio <
    0.45
  ) {

    problems.push(
      "교대 업무일지 표 위치 확인 필요"
    );
  }


  /*
    사진1 핵심값 전멸
  */

  if (
    patrolCount.temperatureCount ===
    0 &&
    patrolCount.stateCount ===
    0
  ) {

    problems.push(
      "순찰일지 셀 인식 실패"
    );
  }


  /*
    사진2 핵심값 전멸
  */

  if (
    numberCount.numberCount ===
    0 &&
    numberCount.runningCount ===
    0
  ) {

    problems.push(
      "교대 업무일지 셀 인식 실패"
    );
  }


  return {

    valid:
      problems.length ===
      0,

    problems,

    patrolCount,

    numberCount
  };
}


/* =========================================================

function daccRenderResult(

  /* =======================================================

  ======================================================= */

  /* =======================================================

    }


    if (
      merged.confirmed.length ===
      0
    ) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "emptyResult";


      empty.textContent =
        "자동 확정된 장비가 없습니다.";


      results.appendChild(
        empty
      );
    }
  }


  /* =======================================================
     확인필요 + 실제제외

     기존 excluded 영역을 그대로 활용.
  ======================================================= */

  if (excluded) {

    /*
      확인 필요
    */

    for (
      const item
      of merged.review
    ) {

      excluded.appendChild(

        daccCreateReviewRow(
          item
        )
      );
    }


    /*
      실제 제외
    */

    for (
      const item
      of merged.excluded
    ) {

      excluded.appendChild(

        daccCreateExcludedRow(
          item
        )
      );
    }
  }


  /* =======================================================
     하단 개수

     기존 UI ID 유지.
  ======================================================= */

  const excludedCount =
    daccEl(
      "excludedCount"
    );


  if (excludedCount) {

    excludedCount.textContent =

      `확인필요 ${merged.review.length} · ` +

      `제외 ${merged.excluded.length}`;
  }


  const count =
    daccEl(
      "count"
    );


  if (count) {

    count.textContent =
      `${merged.confirmed.length}개 확정`;
  }


  /* =======================================================
     TG1 별도 영역

     기존 HTML이 있다면 표시.
     없으면 무시.
  ======================================================= */

  const tg1Area =
    daccEl(
      "tg1Area"
    );


  if (tg1Area) {

    const tg1 =
      merged.decisions.find(
        item =>
          item.equipment ===
          "TG1"
      );


    if (
      tg1 &&
      tg1.status ===
      DACC_STATUS.CONFIRMED
    ) {

      tg1Area.classList.remove(
        "hidden"
      );


      tg1Area.textContent =

        `${daccDisplayNumber(
          tg1.number
        )} TG1 · 가동`;

    } else {

      tg1Area.classList.add(
        "hidden"
      );
    }
  }


  /* =======================================================
     치명적 실패
  ======================================================= */

  const warning =
    daccEl(
      "fatalWarning"
    );


  const makeReport =
    daccEl(
      "makeReport"
    );


  if (
    validation.valid
  ) {

    if (warning) {

      warning.classList.add(
        "hidden"
      );
    }


    /*
      표 분석 자체가 성공했으면
      확인필요 장비가 있어도 보고서 생성 가능.

      단, 확인필요 장비는 자동보고에서 제외.
    */

    if (makeReport) {

      makeReport.disabled =
        false;
    }

  } else {

    if (warning) {

      warning.classList.remove(
        "hidden"
      );


      warning.textContent =

        "사진 인식 실패 · " +

        validation.problems.join(
          " / "
        );
    }


    if (makeReport) {

      makeReport.disabled =
        true;
    }
  }


  if (resultCard) {

    resultCard.classList.remove(
      "hidden"
    );


    resultCard.scrollIntoView({

      behavior:"smooth",

      block:"start"
    });
  }
}


/* =========================================================
   확인필요 / 제외 펼치기
========================================================= */

const daccExcludedBtn =
  daccEl(
    "excludedBtn"
  );


if (daccExcludedBtn) {

  daccExcludedBtn.onclick =
  () => {

    const box =
      daccEl(
        "excluded"
      );


    const arrow =
      daccEl(
        "arrow"
      );


    if (!box) {
      return;
    }


    box.classList.toggle(
      "hidden"
    );


    if (arrow) {

      arrow.textContent =

        box.classList.contains(
          "hidden"
        )

        ? "▼"

        : "▲";
    }
  };
}


/* =========================================================
   ★ 분석 실행
========================================================= */

const daccAnalyzeButton =
  daccEl(
    "analyze"
  );


if (daccAnalyzeButton) {

  daccAnalyzeButton.onclick =
  async () => {

    const patrolFile =

      daccPatrolFile ||

      daccPatrolInput
        ?.files?.[0];


    const numberFile =

      daccNumberFile ||

      daccNumberInput
        ?.files?.[0];


    if (
      !patrolFile ||
      !numberFile
    ) {

      alert(
        "사진 2장을 모두 추가해주세요."
      );

      return;
    }


    daccAnalyzeButton.disabled =
      true;


    daccFinalResult =
      null;


    try {

      /* ===================================================
         준비
      =================================================== */

      daccSetProgress(
        "DACC 준비중...",
        2
      );


      await loadDACCOpenCV();


      await getDACCWorker();


      /* ===================================================
         사진1
      =================================================== */

      daccSetProgress(
        "순찰일지 표 확인중...",
        6
      );


      const patrolResult =
        await daccAnalyzePatrolPhoto(

          patrolFile,

          (
            equipment,
            row,
            total
          ) => {

            const progress =

              8 +

              Math.round(
                (
                  row /
                  total
                ) *
                37
              );


            daccSetProgress(

              `사진1 ${equipment} 확인중...`,

              progress
            );
          }
        );


      /* ===================================================
         사진2
      =================================================== */

      daccSetProgress(
        "교대 업무일지 표 확인중...",
        48
      );


      const numberResult =
        await daccAnalyzeNumberPhoto(

          numberFile,

          (
            equipment,
            row,
            total
          ) => {

            const progress =

              50 +

              Math.round(
                (
                  row /
                  total
                ) *
                40
              );


            daccSetProgress(

              `사진2 ${equipment} 확인중...`,

              progress
            );
          }
        );


      /* ===================================================
         교차검증
      =================================================== */

      daccSetProgress(
        "장비별 교차검증중...",
        92
      );


      const merged =
        daccMergeAll(
          patrolResult,
          numberResult
        );


      /* ===================================================
         검증
      =================================================== */

      const validation =
        daccValidate(
          patrolResult,
          numberResult
        );


      /* ===================================================
         저장
      =================================================== */

      daccFinalResult = {

        patrol:
          patrolResult,

        number:
          numberResult,

        merged,

        validation
      };


      /* ===================================================
         완료
      =================================================== */

      daccSetProgress(

        validation.valid

        ? "분석 완료"

        : "사진 인식 확인 필요",

        100
      );


      daccRenderResult(

        patrolResult,

        numberResult,

        merged,

        validation
      );


    } catch(error) {

      console.error(
        "DACC ERROR",
        error
      );


      const resultCard =
        daccEl(
          "resultCard"
        );


      const warning =
        daccEl(
          "fatalWarning"
        );


      if (resultCard) {

        resultCard.classList.remove(
          "hidden"
        );
      }


      if (warning) {

        warning.classList.remove(
          "hidden"
        );


        warning.textContent =

          "사진 분석 실패 · " +

          (
            error?.message ||
            String(error)
          );
      }


      const makeReport =
        daccEl(
          "makeReport"
        );


      if (makeReport) {

        makeReport.disabled =
          true;
      }


      daccSetProgress(
        "분석 실패",
        0
      );

    } finally {

      daccUpdateAnalyzeButton();
    }
  };
}


/* =========================================================
   날짜
========================================================= */

function daccToday() {

  const now =
    new Date();


  const weekdays = [

    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"

  ];


  return {

    month:
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      ),

    day:
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      ),

    weekday:
      weekdays[
        now.getDay()
      ]
  };
}


/* =========================================================
   근무
========================================================= */

function daccWorkName() {

  const value =
    daccEl(
      "workType"
    )?.value;


  if (
    value ===
    "weekday"
  ) {

    return "주간";
  }


  if (
    value ===
    "holiday"
  ) {

    return "휴일주간";
  }


  return "야간";
}


/* =========================================================
   직급

   ★ 과장 추가 안 함.
   HTML select에 존재하는 값만 그대로 사용.
========================================================= */

function daccRank() {

  return (
    daccEl(
      "rank"
    )?.value ||
    "사원"
  );
}


/* =========================================================
   보고서 정렬
========================================================= */

function daccReportOrderIndex(
  equipment
) {

  const order = [

    "TG2",
    "TG3",
    "TG4",
    "TG5",
    "TG6",
    "TG7",

    "GF1",
    "GF3",
    "GF4",
    "GF5",

    "SMI",

    "CF1",
    "CF2",
    "CF3",
    "CF4",
    "CF5",
    "CF6",

    "HIP1",
    "HIP2",
    "HIP3",

    "CF분위기로"
  ];


  const index =
    order.indexOf(
      equipment
    );


  return (
    index === -1
    ?
    999
    :
    index
  );
}


/* =========================================================
   일반 보고 대상인지
========================================================= */

function daccIsNormalReportItem(
  item
) {

  if (
    !item ||
    item.status !==
    DACC_STATUS.CONFIRMED
  ) {

    return false;
  }


  if (
    item.equipment ===
    "TG1"
  ) {

    return false;
  }


  if (
    item.equipment ===
    "드라이챔버" ||
    item.equipment ===
    "신형드라이챔버"
  ) {

    return false;
  }


  if (
    INCINERATOR_EQUIPMENT
      .includes(
        item.equipment
      )
  ) {

    return false;
  }


  return true;
}


/* =========================================================
   ★ 최종 문자보고

   확인필요 장비는 자동 삽입하지 않는다.
   실제 확정된 값만 작성.
========================================================= */

function daccBuildReport() {

  if (
    !daccFinalResult ||
    !daccFinalResult.validation.valid
  ) {

    return "";
  }


  const merged =
    daccFinalResult.merged;


  const today =
    daccToday();


  const lines = [];


  /* =======================================================
     헤더
  ======================================================= */

  lines.push(

    `${today.month}월 ${today.day}일 (${today.weekday}) ${daccWorkName()}근무자`
  );


  lines.push(

    `${daccRank()}입니다.`
  );


  lines.push("");


  /* =======================================================
     일반 장비
  ======================================================= */

  const normal =
    merged.confirmed

    .filter(
      daccIsNormalReportItem
    )

    .sort(
      (a,b) =>

        daccReportOrderIndex(
          a.equipment
        )
        -
        daccReportOrderIndex(
          b.equipment
        )
    );


  for (
    const item
    of normal
  ) {

    lines.push(

      `${daccDisplayNumber(
        item.number
      )} ` +

      `${item.equipment} ` +

      `${item.temperature}도 ` +

      `${item.state}`
    );
  }


  /* =======================================================
     TG1

     사진2 번호 + 가동 확정값만.
  ======================================================= */

  const tg1 =
    merged.confirmed.find(

      item =>
        item.equipment ===
        "TG1"
    );


  if (tg1) {

    lines.push(

      `${daccDisplayNumber(
        tg1.number
      )} TG1`
    );
  }


  /* =======================================================
     드라이챔버
  ======================================================= */

  const dryItems =
    merged.confirmed.filter(

      item =>
        item.equipment ===
        "드라이챔버"
        ||
        item.equipment ===
        "신형드라이챔버"
    );


  if (
    dryItems.length
  ) {

    lines.push("");


    const dryOrder = [

      "드라이챔버",

      "신형드라이챔버"

    ];


    dryItems.sort(
      (a,b) =>

        dryOrder.indexOf(
          a.equipment
        )
        -
        dryOrder.indexOf(
          b.equipment
        )
    );


    for (
      const item
      of dryItems
    ) {

      lines.push(

        `${item.equipment} ${item.temperature}도`
      );
    }
  }


  /* =======================================================
     소각기
  ======================================================= */

  const incinerators =
    merged.confirmed.filter(

      item =>
        INCINERATOR_EQUIPMENT
          .includes(
            item.equipment
          )
    );


  if (
    incinerators.length
  ) {

    lines.push("");


    lines.push(
      "-TG소각기-"
    );


    const order = [

      "소각기1동",

      "소각기3동"

    ];


    incinerators.sort(
      (a,b) =>

        order.indexOf(
          a.equipment
        )
        -
        order.indexOf(
          b.equipment
        )
    );


    for (
      const item
      of incinerators
    ) {

      const name =

        item.equipment ===
        "소각기1동"

        ? "1동"

        : "3동";


      lines.push(

        `${name} ${item.temperature}도`
      );
    }
  }


  return lines.join(
    "\n"
  );
}


/* =========================================================
   문자보고 작성 생산전용
========================================================= */

const daccMakeReport =
  daccEl(
    "makeReport"
  );


if (daccMakeReport) {

  /*
    버튼 문구도 여기서 강제.
  */

  daccMakeReport.textContent =
    "문자보고 작성 생산전용";


  daccMakeReport.onclick =
  () => {

    if (
      !daccFinalResult
    ) {

      alert(
        "먼저 두 사진을 분석해주세요."
      );

      return;
    }


    if (
      !daccFinalResult
        .validation
        .valid
    ) {

      alert(
        "사진 인식 결과를 먼저 확인해주세요."
      );

      return;
    }


    const text =
      daccBuildReport();


    if (!text) {

      alert(
        "문자보고를 생성할 수 없습니다."
      );

      return;
    }


    const report =
      daccEl(
        "report"
      );


    if (report) {

      report.value =
        text;
    }


    const reportCard =
      daccEl(
        "reportCard"
      );


    if (reportCard) {

      reportCard.classList.remove(
        "hidden"
      );


      reportCard.scrollIntoView({

        behavior:"smooth",

        block:"start"
      });
    }
  };
}


/* =========================================================
   복사
========================================================= */

const daccCopy =
  daccEl(
    "copy"
  );


if (daccCopy) {

  daccCopy.onclick =
  async () => {

    const report =
      daccEl(
        "report"
      );


    const text =
      report?.value ||
      "";


    if (!text) {
      return;
    }


    let copied = false;


    /*
      최신 브라우저
    */

    try {

      if (
        navigator.clipboard &&
        typeof navigator.clipboard.writeText ===
        "function"
      ) {

        await navigator.clipboard
          .writeText(
            text
          );


        copied = true;
      }

    } catch(error) {

      console.warn(
        "Clipboard API 실패",
        error
      );
    }


    /*
      iPhone fallback
    */

    if (!copied) {

      try {

        report.focus();

        report.select();


        report.setSelectionRange(
          0,
          text.length
        );


        copied =
          document.execCommand(
            "copy"
          );

      } catch(error) {

        console.warn(
          "copy fallback 실패",
          error
        );
      }
    }


    if (copied) {

      daccCopy.textContent =
        "복사 완료 ✓";


      setTimeout(
        () => {

          daccCopy.textContent =
            "전체 복사";

        },
        1200
      );

    } else {

      alert(
        "자동 복사가 안 됩니다. 문자보고 내용을 길게 눌러 복사해주세요."
      );
    }
  };
}


/* =========================================================
   초기 상태
========================================================= */

daccUpdateAnalyzeButton();


/* =========================================================
   OpenCV 미리 로드
========================================================= */

setTimeout(
  () => {

    loadDACCOpenCV()

      .catch(
        error => {

          console.warn(
            "DACC OpenCV preload",
            error
          );
        }
      );

  },
  500
);


/* =========================================================
   페이지 종료
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if (
      daccWorker &&
      typeof daccWorker.terminate ===
      "function"
    ) {

      try {

        daccWorker.terminate();

      } catch(error) {

        console.warn(
          error
        );
      }
    }


    daccWorker =
      null;
  }
);


/* =========================================================
   최종 확인
========================================================= */

console.log(
  "DACC PART 3 ready ✓"
);


/* =========================================================
   DACC PART 3 END
========================================================= */

</script>
