        )
        ?
        "▼"
        :
        "▲";
    }
  };
}


/* =========================================================
   분석 실행
========================================================= */

const daccAnalyzeButton =
  daccEl(
    "analyze"
  );


if (daccAnalyzeButton) {

  daccAnalyzeButton.onclick =
  async () => {

    const patrolFile =
      daccPatrolFile ||
      daccPatrolInput
        ?.files?.[0];


    const numberFile =
      daccNumberFile ||
      daccNumberInput
        ?.files?.[0];


    if (
      !patrolFile ||
      !numberFile
    ) {

      alert(
        "사진 2장을 모두 추가해주세요."
      );

      return;
    }


    daccAnalyzeButton.disabled =
      true;


    daccFinalResult =
      null;


    try {

      daccSetProgress(
        "DACC 준비중...",
        2
      );


      await loadDACCOpenCV();


      await getDACCWorker();


      /*
        사진1
      */

      daccSetProgress(
        "순찰일지 분석 시작...",
        8
      );


      const patrolResult =
        await daccAnalyzePatrolPhoto(

          patrolFile,

          (
            equipment,
            row,
            total
          ) => {

            const progress =
              8 +
              Math.round(
                (
                  row /
                  total
                ) *
                37
              );


            daccSetProgress(

              `사진1 ${equipment} 확인중...`,

              progress
            );
          }
        );


      /*
        사진2
      */

      daccSetProgress(
        "교대 업무일지 분석 시작...",
        50
      );


      const numberResult =
        await daccAnalyzeNumberPhoto(

          numberFile,

          (
            equipment,
            row,
            total
          ) => {

            const progress =
              50 +
              Math.round(
                (
                  row /
                  total
                ) *
                40
              );


            daccSetProgress(

              `사진2 ${equipment} 확인중...`,

              progress
            );
          }
        );


      /*
        장비별 교차검증
      */

      daccSetProgress(
        "장비별 교차검증중...",
        93
      );


      const merged =
        daccMergeAll(

          patrolResult,

          numberResult
        );


      /*
        사진 구조 검증
      */

      const validation =
        daccValidate(

          patrolResult,

          numberResult
        );


      daccFinalResult = {

        patrol:
          patrolResult,

        number:
          numberResult,

        merged,

        validation
      };


      daccSetProgress(

        validation.valid
        ?
        "분석 완료"
        :
        "사진 구조 확인 필요",

        100
      );


      daccRenderResult(

        patrolResult,

        numberResult,

        merged,

        validation
      );


    } catch(error) {

      console.error(
        "DACC ERROR",
        error
      );


      const resultCard =
        daccEl(
          "resultCard"
        );


      const warning =
        daccEl(
          "fatalWarning"
        );


      if (resultCard) {

        resultCard
          .classList
          .remove(
            "hidden"
          );
      }


      if (warning) {

        warning
          .classList
          .remove(
            "hidden"
          );


        warning.textContent =
          "사진 분석 실패 · " +
          (
            error?.message ||
            String(
              error
            )
          );
      }


      const makeReport =
        daccEl(
          "makeReport"
        );


      if (makeReport) {

        makeReport.disabled =
          true;
      }


      daccSetProgress(
        "분석 실패",
        0
      );

    } finally {

      daccUpdateAnalyzeButton();
    }
  };
}


/* =========================================================
   날짜
========================================================= */

function daccToday() {

  const now =
    new Date();


  const weekdays = [

    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"

  ];


  return {

    month:
      String(
        now.getMonth() +
        1
      )
      .padStart(
        2,
        "0"
      ),


    day:
      String(
        now.getDate()
      )
      .padStart(
        2,
        "0"
      ),


    weekday:
      weekdays[
        now.getDay()
      ]
  };
}


/* =========================================================
   근무명
========================================================= */

function daccWorkName() {

  const value =
    daccEl(
      "workType"
    )?.value;


  if (
    value ===
    "weekday"
  ) {

    return "주간";
  }


  if (
    value ===
    "holiday"
  ) {

    return "휴일주간";
  }


  return "야간";
}


/* =========================================================
   직급

   HTML select에 있는 값 그대로 사용.

   ★ 과장 자동 추가 없음
========================================================= */

function daccRank() {

  const value =
    daccEl(
      "rank"
    )?.value;


  if (
    value
  ) {

    return value;
  }


  return "사원";
}


/* =========================================================
   일반장비 보고 순서
========================================================= */

function daccSortedConfirmed(
  items
) {

  const order = [

    ...REPORT_ORDER,

    "CF분위기로"

  ];


  return [...items]
    .sort(
      (a,b) => {

        const ai =
          order.indexOf(
            a.equipment
          );


        const bi =
          order.indexOf(
            b.equipment
          );


        return (
          ai -
          bi
        );
      }
    );
}


/* =========================================================
   문자보고 생성

   중요:
   확인필요 장비를 임의로 보고서에 넣지 않는다.
   확정된 값만 자동 작성한다.
========================================================= */

function daccBuildReport() {

  if (
    !daccFinalResult ||
    !daccFinalResult
      .validation
      .valid
  ) {

    return "";
  }


  const merged =
    daccFinalResult
      .merged;


  const today =
    daccToday();


  const lines = [];


  /*
    헤더
  */

  lines.push(
    `${today.month}월 ${today.day}일 (${today.weekday}) ${daccWorkName()}근무자`
  );


  lines.push(
    `${daccRank()}입니다.`
  );


  lines.push("");


  /*
    일반장비
  */

  const normal =
    daccSortedConfirmed(
      merged.confirmed
    );


  for (
    const item
    of normal
  ) {

    lines.push(

      `${daccDisplayNumber(
        item.number
      )} ` +

      `${item.equipment} ` +

      `${item.temperature}도 ` +

      `${item.state}`
    );
  }


  /*
    TG1

    사진2 번호 + 가동 확정일 때만.
  */

  if (
    merged.tg1.status ===
    DACC_STATUS.CONFIRMED
  ) {

    lines.push(

      `${daccDisplayNumber(
        merged.tg1.number
      )} TG1`
    );
  }


  /*
    드라이챔버
  */

  if (
    merged.dry
      .confirmed
      .length
  ) {

    lines.push("");


    const dryOrder = [

      "드라이챔버",

      "신형드라이챔버"

    ];


    const sortedDry =
      [
        ...merged.dry
          .confirmed
      ]
      .sort(
        (a,b) =>

          dryOrder.indexOf(
            a.equipment
          )
          -
          dryOrder.indexOf(
            b.equipment
          )
      );


    for (
      const item
      of sortedDry
    ) {

      lines.push(

        `${item.equipment} ` +
        `${item.temperature}도`
      );
    }
  }


  /*
    TG 소각기
  */

  if (
    merged
      .incinerators
      .confirmed
      .length
  ) {

    lines.push("");


    lines.push(
      "-TG소각기-"
    );


    const order = [

      "소각기1동",

      "소각기3동"

    ];


    const sorted =
      [
        ...merged
          .incinerators
          .confirmed
      ]
      .sort(
        (a,b) =>

          order.indexOf(
            a.equipment
          )
          -
          order.indexOf(
            b.equipment
          )
      );


    for (
      const item
      of sorted
    ) {

      const name =
        item.equipment ===
        "소각기1동"
        ?
        "1동"
        :
        "3동";


      lines.push(

        `${name} ` +
        `${item.temperature}도`
      );
    }
  }


  return lines.join(
    "\n"
  );
}


/* =========================================================
   문자보고 작성 버튼

   UI 명칭:
   문자보고 작성 생산전용
========================================================= */

const daccMakeReport =
  daccEl(
    "makeReport"
  );


if (daccMakeReport) {

  daccMakeReport.onclick =
  () => {

    if (
      !daccFinalResult
    ) {

      alert(
        "먼저 두 사진을 분석해주세요."
      );

      return;
    }


    if (
      !daccFinalResult
        .validation
        .valid
    ) {

      alert(
        "사진 인식 결과를 먼저 확인해주세요."
      );

      return;
    }


    const text =
      daccBuildReport();


    if (!text) {

      alert(
        "문자보고를 생성할 수 없습니다."
      );

      return;
    }


    const report =
      daccEl(
        "report"
      );


    if (report) {

      report.value =
        text;
    }


    const reportCard =
      daccEl(
        "reportCard"
      );


    if (reportCard) {

      reportCard
        .classList
        .remove(
          "hidden"
        );


      reportCard.scrollIntoView({
        behavior:
          "smooth",

        block:
          "start"
      });
    }
  };
}


/* =========================================================
   전체 복사
========================================================= */

const daccCopy =
  daccEl(
    "copy"
  );


if (daccCopy) {

  daccCopy.onclick =
  async () => {

    const report =
      daccEl(
        "report"
      );


    const text =
      report?.value ||
      "";


    if (!text) {
      return;
    }


    try {

      if (
        navigator.clipboard
          ?.writeText
      ) {

        await navigator
          .clipboard
          .writeText(
            text
          );

      } else {

        throw new Error(
          "clipboard fallback"
        );
      }


      daccCopy.textContent =
        "복사 완료 ✓";


      setTimeout(
        () => {

          daccCopy.textContent =
            "전체 복사";

        },
        1200
      );


    } catch(error) {

      try {

        report.focus();


        report.select();


        report.setSelectionRange(
          0,
          text.length
        );


        document.execCommand(
          "copy"
        );


        daccCopy.textContent =
          "복사 완료 ✓";


        setTimeout(
          () => {

            daccCopy.textContent =
              "전체 복사";

          },
          1200
        );

      } catch(copyError) {

        alert(
          "자동 복사가 안 됩니다. 문자보고 내용을 길게 눌러 복사해주세요."
        );
      }
    }
  };
}


/* =========================================================
   초기 상태
========================================================= */

daccUpdateAnalyzeButton();


/* =========================================================
   OpenCV 미리 로드
========================================================= */

setTimeout(
  () => {

    loadDACCOpenCV()
      .catch(
        error => {

          console.warn(
            "DACC OpenCV preload",
            error
          );
        }
      );

  },
  500
);


/* =========================================================
   페이지 종료시 OCR Worker 정리
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if (
      daccWorker &&
      typeof daccWorker
        .terminate ===
      "function"
    ) {

      try {

        daccWorker
          .terminate();

      } catch(error) {

        console.warn(
          error
        );
      }
    }


    daccWorker =
      null;
  }
);


/* =========================================================
   최종 매핑 자체검사
========================================================= */

try {

  verifyDACCMapping();

} catch(error) {

  console.error(
    "DACC mapping verification error",
    error
  );
}


/* =========================================================
   DACC READY
========================================================= */

console.log(
  "DACC ready ✓"
);

   DACC PART 3 / 3 END
========================================================= */

</script>
